<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnePlate · Status</title>
<style>body{margin:0;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;background:#F4F5F1;color:#17211C;padding:24px 16px;max-width:640px;margin-inline:auto}@media(prefers-color-scheme:dark){body{background:#0F1412;color:#E9EEEA}.card{background:#182019!important;border-color:#28332C!important}}h1{font:700 26px Outfit,system-ui;margin:0 0 12px}.card{background:#fff;border:1px solid #E3E7E0;border-radius:16px;padding:16px 18px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #E3E7E0}.row:last-child{border:0}.ok{color:#257553;font-weight:600}.bad{color:#B03A31;font-weight:600}.muted{color:#5E6B64;font-size:13px}code{font-family:"IBM Plex Mono",monospace;font-size:13px}</style></head>
<body><h1>OnePlate status</h1><div class="card" id="c"><p class="muted">Checking…</p></div><p class="muted">This page asks the API for <code>/status</code> every 30 seconds. No personal data is shown.</p>
<script>const API=window.ONEPLATE_API||"";async function go(){const c=document.getElementById("c");try{const t0=Date.now();const r=await fetch(API+"/status",{cache:"no-store"});const d=await r.json();const ms=Date.now()-t0;c.innerHTML=`<div class="row"><span>API</span><span class="${d.status==="ok"?"ok":"bad"}">${d.status}</span></div><div class="row"><span>Database</span><span class="${d.db?"ok":"bad"}">${d.db?"connected":"unavailable"}</span></div><div class="row"><span>Live updates</span><span class="${d.liveUpdates?"ok":"muted"}">${d.liveUpdates?"on":"polling"}</span></div><div class="row"><span>Response time</span><span>${ms} ms</span></div><div class="row"><span>Uptime</span><span>${Math.floor(d.uptimeSeconds/3600)} h ${Math.floor(d.uptimeSeconds%3600/60)} m</span></div><div class="row"><span>Version</span><span><code>${d.version}</code></span></div><div class="row"><span>Households · users · records</span><span>${d.households??"–"} · ${d.users??"–"} · ${d.documents??"–"}</span></div><div class="row"><span>Checked</span><span class="muted">${new Date(d.time).toLocaleString()}</span></div>`}catch(e){c.innerHTML=`<div class="row"><span>API</span><span class="bad">unreachable</span></div><p class="muted">${e.message}</p>`}}go();setInterval(go,30000);</script></body></html>
