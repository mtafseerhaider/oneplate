<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OnePlate · Sign in</title>
<style>body{margin:0;font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;background:#F4F5F1;color:#17211C;display:grid;place-items:center;min-height:100vh;padding:16px}@media(prefers-color-scheme:dark){html:not([data-theme=light]) body{background:#0F1412;color:#E9EEEA}html:not([data-theme=light]) .card{background:#182019!important;border-color:#28332C!important}html:not([data-theme=light]) input{background:#1F2922!important;color:#E9EEEA!important;border-color:#28332C!important}}html[data-theme=dark] body{background:#0F1412;color:#E9EEEA}html[data-theme=dark] .card{background:#182019!important;border-color:#28332C!important}html[data-theme=dark] input{background:#1F2922!important;color:#E9EEEA!important;border-color:#28332C!important}
.card{background:#fff;border:1px solid #E3E7E0;border-radius:18px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px}h1{font:700 24px Outfit,system-ui;margin:0}input{font:inherit;padding:10px 12px;border:1px solid #E3E7E0;border-radius:12px;width:100%;box-sizing:border-box}button{font:600 14px inherit;padding:11px 16px;border-radius:12px;border:0;background:#A35D0E;color:#fff;cursor:pointer}button.ghost{background:none;color:#9A560C}.muted{color:#5E6B64;font-size:13px}.err{color:#B03A31;font-size:13px}label{font-size:12px;color:#5E6B64;display:flex;flex-direction:column;gap:4px}[hidden]{display:none!important}</style></head>
<body><script>try{const t=localStorage.getItem("oneplate.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><form class="card" id="f"><h1>OnePlate</h1><p class="muted" id="hint">Sign in to your family's OnePlate, or create the first account.</p>
<label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="pw" type="password" required minlength="8" autocomplete="current-password"></label>
<div id="extra" hidden><label>Your name<input id="name" autocomplete="name"></label><label>Household name<input id="hh" value="Our family"></label><label>Invite code (if you were invited)<input id="code" placeholder="optional"></label><label>I am<select id="member"><option value="tafseer">Tafseer</option><option value="uzma">Uzma</option></select></label></div>
<div id="openBox" hidden><label>Your date of birth<input id="dob" type="date" autocomplete="bday"></label></div>
<div id="pkBox" hidden><p class="muted" id="pkHint">Signed in. Set up Face ID or fingerprint now and this link opens on its own next time.</p><button type="button" id="pkSetup" style="background:#2F8F63">Set up Face ID / fingerprint</button><button type="button" class="ghost" id="pkSkip">Not now, open OnePlate</button></div>
<div id="resetBox" hidden><label>New password<input id="npw" type="password" minlength="8" autocomplete="new-password"></label></div><p class="err" id="err"></p><button type="submit" id="go">Sign in</button><button type="button" class="ghost" id="toggle">Create an account</button><button type="button" class="ghost" id="forgot">Forgot password?</button><button type="button" id="pk" style="background:#2F8F63">Sign in with a passkey (Face ID / fingerprint)</button><p class="muted" style="text-align:center;margin:4px 0 0"><a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a> · <a href="./status.html">Status</a></p></form>
<script src="./webauthn.js"></script>
<script>
const API=window.ONEPLATE_API||"";let mode="login";const $=id=>document.getElementById(id);
$("toggle").onclick=()=>{mode=mode==="login"?"register":"login";$("extra").hidden=mode==="login";$("go").textContent=mode==="login"?"Sign in":"Create account";$("toggle").textContent=mode==="login"?"Create an account":"I already have an account";};
const j=async(m,u,b)=>{const r=await fetch(API+u,{method:m,credentials:"include",headers:b?{"content-type":"application/json"}:{},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error((d.error&&d.error.message)||r.statusText);return d};
const resetToken=new URLSearchParams(location.search).get("reset");if(resetToken){mode="reset";$("resetBox").hidden=false;for(const id of ["pw","email"]){$(id).parentElement.hidden=true;$(id).required=false}$("go").textContent="Set new password";$("toggle").hidden=true;$("forgot").hidden=true;$("hint").textContent="Choose a new password for your OnePlate account."}
$("forgot").onclick=async()=>{$("err").textContent="";const email=$("email").value;if(!email){$("err").textContent="Enter your email first.";return}try{await j("POST","/auth/forgot",{email});$("hint").textContent="If that email has an account, a reset link has been sent (or printed in the server log when running locally).";}catch(x){$("err").textContent=x.message}};
const PK=window.SimpleWebAuthnBrowser;if(!PK||!PK.browserSupportsWebAuthn()){$("pk").hidden=true}
/* Family link: ?open=<token>. Already signed in on this device: straight into the app. Otherwise ask the date of birth, sign the device in, offer a passkey. */
const openToken=new URLSearchParams(location.search).get("open");
const showPasskeySetup=(name)=>{for(const id of ["openBox","go","toggle","forgot","pk"])$(id).hidden=true;$("pkBox").hidden=false;$("hint").textContent=`Welcome${name?", "+name:""}. OnePlate is open on this device.`;if(!PK||!PK.browserSupportsWebAuthn()){$("pkSetup").hidden=true;$("pkHint").textContent="Signed in. This browser has no Face ID or fingerprint support; the link will ask for your date of birth again if you sign out."}};
if(openToken){mode="open";$("openBox").hidden=false;for(const id of ["pw","email"]){$(id).parentElement.hidden=true;$(id).required=false}$("go").textContent="Open OnePlate";$("toggle").hidden=true;$("forgot").hidden=true;$("hint").textContent="Your family's OnePlate. Enter your date of birth to open it on this device.";
  j("GET","/auth/me").then(me=>{if(me.households&&me.households.length)location.replace("./")}).catch(()=>{});}
$("pkSetup").onclick=async()=>{$("err").textContent="";try{const o=await j("POST","/auth/passkey/register/options");const resp=await PK.startRegistration({optionsJSON:o.options});await j("POST","/auth/passkey/register/verify",{challengeId:o.challengeId,response:resp,label:navigator.platform||"this device"});try{localStorage.setItem("oneplate.passkey","1")}catch(e){}location.href="./"}catch(x){$("err").textContent=x.name==="NotAllowedError"?"Face ID prompt was cancelled. You can set it up later from Progress → Account.":x.message}};
$("pkSkip").onclick=()=>{location.href="./"};
try{if(localStorage.getItem("oneplate.passkey")==="1"&&!openToken&&!resetToken){$("f").insertBefore($("pk"),$("f").children[2]);$("hint").textContent="Welcome back. Sign in with Face ID or fingerprint."}}catch(e){}
$("pk").onclick=async()=>{$("err").textContent="";try{const o=await j("POST","/auth/passkey/login/options");const resp=await PK.startAuthentication({optionsJSON:o.options});await j("POST","/auth/passkey/login/verify",{challengeId:o.challengeId,response:resp});location.href="./"}catch(x){$("err").textContent=x.name==="NotAllowedError"?"Passkey prompt was cancelled.":x.message}};
$("f").onsubmit=async e=>{e.preventDefault();$("err").textContent="";try{if(mode==="open"){const dob=$("dob").value;if(!dob){$("err").textContent="Enter your date of birth.";return}const r=await j("POST",`/open/${encodeURIComponent(openToken)}`,{dob});if(r.passkeys>0){location.href="./";return}showPasskeySetup(r.name);return}if(mode==="reset"){await j("POST","/auth/reset",{token:resetToken,password:$("npw").value});$("hint").textContent="Password changed. Sign in with it.";location.href="./account.html";return}if(mode==="register"){await j("POST","/auth/register",{email:$("email").value,password:$("pw").value,displayName:$("name").value||undefined});const code=$("code").value.trim();if(code){await j("POST",`/invites/${code}/accept`)}else{await j("POST","/households",{name:$("hh").value||"Our family",memberId:$("member").value})}}else{await j("POST","/auth/login",{email:$("email").value,password:$("pw").value})}const me=await j("GET","/auth/me");if(!me.households.length){$("err").textContent="Signed in, but you are not in a household yet. Ask Tafseer for an invite code and register with it.";return}location.href="./"}catch(x){$("err").textContent=x.message}};
</script></body></html>
