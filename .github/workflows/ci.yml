name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: oneplate, POSTGRES_PASSWORD: oneplate, POSTGRES_DB: oneplate_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oneplate" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: node scripts/build-tarbiyah.mjs --check
      - run: node scripts/build-app.mjs --check
      - run: pnpm -r --filter @oneplate/content --filter @oneplate/core --filter @oneplate/api build
      - run: pnpm typecheck
      - run: pnpm test
        env: { TEST_DATABASE_URL: "postgres://oneplate:oneplate@localhost:5432/oneplate_test" }
      - run: pnpm --filter @oneplate/web build
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter @oneplate/web test
        env: { TEST_DATABASE_URL: "postgres://oneplate:oneplate@localhost:5432/oneplate_test" }
      - run: pnpm audit --audit-level=high || true
