the Sufi tradition",i:"Muraqabah is the practice of knowing you are seen. Muhasabah is taking account of yourself before you are taken to account. Together they are the engine of character.",k:"Remember Allah sees you, and check your own actions like a kind teacher.",d:"Pause three times today and ask: what am I doing, and why?"},{t:"Division of responsibility",w:"Ellyn Satter; adopted by Thuluth",i:"Parents decide what, when and where food is served; children decide whether and how much. Pressure at the table backfires.",k:"Mama and Baba choose the food; you choose how much you eat. Nobody forces anybody.",d:"Tonight, serve the plate and say nothing about how much is eaten."},{t:"First principles",w:"Aristotle; Ibn Sina's method",i:"Break a problem to its basic truths and reason up from there, instead of reasoning by analogy. 'Why do we eat this way?' answered from physiology and revelation, not from fashion.",k:"Ask 'why' until you reach the real reason, then build from there.",d:"Take one rule you follow and trace it back to its reason."},{t:"The virtuous city",w:"Al-Farabi, Al-Madina al-Fadila",i:"Al-Farabi held that a good society is one where each member fulfils a role toward shared happiness, like organs in a body. The household is the first such city.",k:"A good family is like a good team: everyone has a job that helps the others.",d:"Give each family member one small role at dinner tonight."},{t:"Grief as a guest",w:"Rumi, Masnavi; 'The Guest House'",i:"Rumi treats every emotion as a visitor: welcome it, learn from it, let it leave. Emotions acknowledged pass through; emotions resisted move in.",k:"Feelings are like visitors. Say hello to sad feelings too, and they will leave sooner.",d:"Name today's strongest feeling in one word on the mood check-in."},{t:"Ask, do not assume",w:"The Quran's command to consult (3:159); Socratic method",i:"Consultation is a method for discovering what you do not know you do not know. Leaders who ask are corrected before they fail.",k:"Ask other people what they think before deciding. They might see something you missed.",d:"Ask your spouse one question whose answer you think you already know."},{t:"Know thyself",w:"The Delphic maxim; 'man 'arafa nafsahu' in the Islamic tradition",i:"Self-knowledge is the beginning of all knowledge. A saying widely circulated in Islamic spirituality holds that whoever knows himself knows his Lord; its chain is not established, but its use is ancient.",k:"Knowing yourself, what you like, what makes you angry, what you are good at, helps you know everything else.",d:"Write one true sentence about yourself you have never said out loud."},{t:"The pen is mightier",w:"Quran 96:4 and 68:1; the Bayan Library's founding verse 55:4",i:"Revelation began with reading and swore by the pen. Civilisation is what is written down and read again. A family that reads together compounds its knowledge across generations.",k:"Writing and reading are how smart ideas travel from one person to another, even hundreds of years later.",d:"Read aloud to the children for ten minutes tonight."},{t:"Sleep is a sign",w:"Quran 30:23; sleep science",i:"Your sleep by night and your seeking of His bounty are among His signs. Seven to eight hours is not laziness; it is when the body repairs, the mind files, and appetite hormones reset.",k:"Sleep is when your body fixes itself and your brain tidies up. It is important, not lazy.",d:"Lights out by 10:45 tonight."},{t:"Enough is a decision",w:"Qana'ah in the Islamic tradition; Epicurus on simple pleasures",i:"Sufficiency is not a quantity but a judgement. The stop point at 80 percent full is a decision made before the meal, not a feeling found during it.",k:"'Enough' is something you decide, not something your tummy tells you late.",d:"Decide your portion before you sit down."},{t:"Serve to lead",w:"The Prophet \uFDFA: the leader of a people is their servant (received); Imam 'Ali's letter to Malik",i:"Authority in the Islamic tradition is framed as service. The father who cooks, carries and consults leads more than the one who commands.",k:"A good leader helps the people he leads. Baba helping at home is leading.",d:"Do one chore today that is usually someone else's."},{t:"Memento mori, tadhkirat al-mawt",w:"Stoics; the Prophet \uFDFA: remember often the destroyer of pleasures (Tirmidhi 2307)",i:"Remembering death is not morbid; it is a lens that sorts the important from the urgent. Today's dinner together is important. Most notifications are not.",k:"Remembering that life does not last forever helps you spend time on what matters, like family.",d:"Do the one thing you would regret not doing."},{t:"Beauty is a duty",w:"The Prophet \uFDFA: Allah is beautiful and loves beauty (Muslim 91); ihsan",i:"Doing a thing beautifully, a plate arranged with care, a room kept tidy, a voice kept soft, is itself an act of worship in the tradition.",k:"Making things beautiful, like setting the table nicely, is a way of thanking Allah.",d:"Make tonight's plate look as good as it tastes."}];var ae=[{t:"The Muqaddimah",w:"Ibn Khaldun",y:"1377",why:"The founding text of sociology and the philosophy of history, written in a fortress in Algeria.",core:"Civilisations rise on group solidarity and decline when luxury erodes it; history has laws that can be studied.",take:"Strength is social before it is material.",next:"Read the chapters on 'asabiyyah and on the sciences."},{t:"The Canon of Medicine",w:"Ibn Sina (Avicenna)",y:"1025",core:"A complete system of medicine in five books, from theory to drugs, used in European universities for six hundred years.",why:"It made medicine systematic and gave diet and exercise a place in prevention.",take:"Ibn Sina put food, sleep, movement and emotion among the six necessities of health. OnePlate agrees.",next:"Read the first book's section on the regimen of health."},{t:"The Masnavi",w:"Jalal al-Din Rumi",y:"1258\u20131273",why:"Six books of stories and teaching in Persian couplets, called the Quran in the Persian tongue.",core:"Every story is a door to the inner life; the reed flute's lament is the soul's longing for its source.",take:"Read a story, then ask what it says about you.",next:"Start with the story of the reed and the parable of the elephant in the dark."},{t:"The Gulistan",w:"Saadi Shirazi",y:"1258",why:"The most read book of Persian prose for seven centuries; taught to children across the Persianate world.",core:"Moral anecdotes in rhymed prose: on kings, dervishes, contentment, silence, youth, old age, manners.",take:"Bani Adam: humanity is one body.",next:"Read chapter one, 'On the conduct of kings', at the dinner table, one story a night."},{t:"The Revival of the Religious Sciences",w:"Abu Hamid al-Ghazali",y:"c. 1100",why:"The most influential work of Islamic spirituality, reconnecting law to the inner life.",core:"Forty books covering worship, daily life, the vices that destroy and the virtues that save.",take:"The book on the discipline of the soul describes habit formation eight centuries before psychology did.",next:"Read 'On Disciplining the Soul' and 'On Breaking the Two Desires' (food and sex): the Islamic source of moderation in eating."},{t:"Nicomachean Ethics",w:"Aristotle",y:"c. 340 BCE",why:"The first systematic account of virtue, happiness and the good life, and a direct influence on Islamic ethics.",core:"Happiness is activity in accordance with virtue; virtue is a habit lying in a mean.",take:"You become brave by doing brave things.",next:"Read Book II on habit and the mean."},{t:"The Republic",w:"Plato",y:"c. 375 BCE",why:"The founding text of political philosophy, read by al-Farabi and Ibn Rushd.",core:"Justice in the city mirrors justice in the soul: reason ruling spirit and appetite.",take:"A just person is one whose appetite does not rule.",next:"Read the allegory of the cave in Book VII."},{t:"The Analects",w:"Confucius",y:"c. 475\u2013221 BCE",why:"The foundation of two thousand years of East Asian ethics and education.",core:"Benevolence, ritual, filial piety and self-cultivation; the gentleman is made, not born.",take:"'Is it not a joy to learn and practise what you have learned?' is its opening line.",next:"Read Book I."},{t:"Meditations",w:"Marcus Aurelius",y:"c. 170",why:"A Roman emperor's private notebook of Stoic practice.",core:"Control what you can, accept what you cannot, do your duty today.",take:"Begin each morning expecting difficult people, and be unsurprised.",next:"Read Book II, entry one."},{t:"Confessions",w:"Augustine of Hippo",y:"c. 400",why:"The first autobiography of the inner life, including a famous chapter on the pull of appetite.",core:"The restless heart; memory; time; the long turning toward God.",take:"'Our heart is restless until it rests in You.'",next:"Read Book X on memory."},{t:"Don Quixote",w:"Miguel de Cervantes",y:"1605\u20131615",why:"The first modern novel, and still the funniest.",core:"A man who reads too many romances sets out to be a knight; the world and his squire answer back.",take:"Idealism and realism need each other; Quixote and Sancho are one person.",next:"Read the windmills chapter with the children."},{t:"The Divan of Hafez",w:"Hafez",y:"c. 1368",why:"The most beloved book of Persian lyric poetry, opened for guidance in homes across Iran and South Asia.",core:"Love, wine as a symbol of ecstasy, the hypocrisy of the pious, the beloved's face.",take:"Hold your heart lightly and your tongue carefully.",next:"Read ten ghazals in Dick Davis's translation."},{t:"The Shahnameh",w:"Ferdowsi",y:"1010",why:"The Persian national epic: fifty thousand couplets of kings and heroes, written to save a language.",core:"Rostam and Sohrab, Zahhak and Kaveh, the tragedy of fathers and sons.",take:"Jealousy and haste destroy what love built.",next:"Tell the children the story of Zal and the Simurgh."},{t:"Kulliyat-e-Iqbal",w:"Muhammad Iqbal",y:"1915\u20131938",why:"The poet-philosopher of Pakistan, read in Urdu and Persian across the subcontinent.",core:"Khudi, the strengthened self; the Shikwa and its answer; the eagle, not the vulture.",take:"'Khudi ko kar buland itna\u2026': raise the self until destiny consults you.",next:"Read 'Bal-e-Jibril' slowly, one poem a week."},{t:"Al-Sahifa al-Sajjadiyya",w:"Imam 'Ali ibn al-Husayn (attributed)",y:"c. 700",why:"Fifty-four supplications called the Psalms of the Household of the Prophet, with their own chain in the preface.",core:"Prayers for parents, children, neighbours, the sick, the ending of a day, noble character.",take:"The prayer for one's children (Supplication 25) is a parenting manual in the form of a dua.",next:"Read Supplication 20, Makarim al-Akhlaq, and 25, for one's children."},{t:"Nahj al-Balagha",w:"Sermons, letters and sayings of Imam 'Ali, compiled by al-Sharif al-Radi",y:"c. 1010",why:"The most studied collection of Imam 'Ali's words; the letter to Malik al-Ashtar is read as a charter of governance.",core:"Sermons on creation and piety, letters of administration, and 480 short sayings.",take:"'The worth of a person is what he does well.'",next:"Read Letter 31, to his son, and Letter 53, to Malik."},{t:"The Prophet of Islam",w:"Sirah literature, from Ibn Ishaq and Ibn Hisham",y:"c. 770",why:"The earliest connected biography of the Prophet, the source for most later sirah.",core:"Makkah, Madinah, the treaties, the conquests, the character.",take:"The life is the commentary on the Book.",next:"Read Martin Lings's 'Muhammad: His Life Based on the Earliest Sources' as a modern retelling."},{t:"Elements",w:"Euclid",y:"c. 300 BCE",why:"The most successful textbook in history, in use for two thousand years; translated into Arabic in Baghdad.",core:"From five postulates, all of geometry, by proof alone.",take:"Certainty can be built from a few true things.",next:"Prove with the children that the angles of a triangle add to a straight line."},{t:"The Compendious Book on Calculation",w:"Muhammad ibn Musa al-Khwarizmi",y:"c. 820",why:"The book that gave the world 'algebra' (al-jabr) and whose author's name became 'algorithm'.",core:"Solving linear and quadratic problems by balancing and completion, for inheritance, trade and surveying.",take:"Mathematics was developed to settle inheritances fairly.",next:"Tell the children where the word algorithm comes from."},{t:"On the Origin of Species",w:"Charles Darwin",y:"1859",why:"The book that organised biology around a single mechanism.",core:"Variation, inheritance, and selection over long time produce the diversity of life.",take:"Small differences, accumulated, become large ones. True of species and of habits.",next:"Read the final paragraph, 'There is grandeur in this view of life'."},{t:"The Brothers Karamazov",w:"Fyodor Dostoevsky",y:"1880",why:"The novel of faith and doubt, fathers and sons, free will and suffering.",core:"Three brothers, a murdered father, and the Grand Inquisitor's challenge to freedom.",take:"'Everyone is responsible for everyone.'",next:"Read the chapter 'The Grand Inquisitor' and then Father Zosima's answer."},{t:"The Thousand and One Nights",w:"Anonymous storytellers",y:"c. 800\u20131400",why:"The frame story of Shahrazad saving her life, and her sisters', by telling stories.",core:"Sindbad, Ali Baba, Aladdin, and hundreds more, from Baghdad, Cairo and beyond.",take:"Stories can hold back the sword.",next:"Tell the children one Night each week, chosen for its moral."},{t:"Tao Te Ching",w:"Laozi (traditional attribution)",y:"c. 400 BCE",why:"Eighty-one short chapters on the Way: yielding, simplicity, non-striving.",core:"The soft overcomes the hard; the sage leads by stepping back.",take:"'A journey of a thousand miles begins beneath one's feet.'",next:"Read chapters 8 and 64."},{t:"Essays",w:"Michel de Montaigne",y:"1580",why:"The invention of the essay as a form of honest self-examination.",core:"On friendship, on cannibals, on experience; what do I know?",take:"Writing about yourself honestly is a way of learning about everyone.",next:"Read 'Of Experience', his last essay, on eating and living well."}];var te=[{t:"Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhab an-nar",m:"Our Lord, give us good in this world and good in the Hereafter, and protect us from the Fire.",r:"Quran 2:201",w:"After every prayer; the Prophet's most frequent dua"},{t:"Rabbi zidni 'ilma",m:"My Lord, increase me in knowledge.",r:"Quran 20:114",w:"Before studying or reading"},{t:"Rabbi ishrah li sadri wa yassir li amri wahlul 'uqdatan min lisani yafqahu qawli",m:"My Lord, expand my chest, ease my task, and untie the knot in my tongue so they understand my speech.",r:"Quran 20:25\u201328, the dua of Musa",w:"Before a difficult conversation or presentation"},{t:"La ilaha illa anta subhanaka inni kuntu min az-zalimin",m:"There is no god but You; glory be to You; I was among the wrongdoers.",r:"Quran 21:87, the dua of Yunus",w:"In distress; the Prophet said no Muslim calls with it but is answered (Tirmidhi 3505)"},{t:"Rabbana la tuzigh qulubana ba'da idh hadaytana wa hab lana min ladunka rahmah",m:"Our Lord, do not let our hearts deviate after You have guided us, and grant us mercy from Yourself.",r:"Quran 3:8",w:"For steadfastness"},{t:"Rabbi awzi'ni an ashkura ni'mataka allati an'amta 'alayya wa 'ala walidayya wa an a'mala salihan tardahu",m:"My Lord, enable me to be grateful for Your favour on me and on my parents, and to do good that pleases You.",r:"Quran 27:19 (Sulayman) and 46:15",w:"On gratitude; also a dua for one's parents"},{t:"Rabbi ij'alni muqim as-salati wa min dhurriyyati, Rabbana wa taqabbal du'a",m:"My Lord, make me one who establishes prayer, and my descendants too. Our Lord, accept my prayer.",r:"Quran 14:40, the dua of Ibrahim",w:"For the children's prayer habit"},{t:"Rabbana hab lana min azwajina wa dhurriyyatina qurrata a'yunin waj'alna lil-muttaqina imama",m:"Our Lord, grant us from our spouses and offspring comfort to our eyes, and make us an example for the God-conscious.",r:"Quran 25:74",w:"For the family; the dua of the servants of the Merciful"},{t:"Hasbunallahu wa ni'mal wakil",m:"Allah is sufficient for us, and the best disposer of affairs.",r:"Quran 3:173",w:"When afraid or outnumbered"},{t:"Allahumma inni as'aluka al-'afiyah",m:"O Allah, I ask You for well-being (in body, faith and family).",r:"Abu Dawud 5074 and Tirmidhi 3514, from the Prophet's morning and evening remembrance",w:"Morning and evening; the dua of health"},{t:"Dua Kumayl",m:"The supplication Imam 'Ali taught to Kumayl ibn Ziyad: invocation by the divine attributes, confession, and the plea for mercy.",r:"Misbah al-Mutahajjid of al-Tusi; Mafatih al-Jinan (received attribution, per the Bayan study)",w:"Thursday nights and the night of mid-Sha'ban"},{t:"Dua 'Arafa",m:"Imam al-Husayn's supplication on the plain of 'Arafa: gratitude for creation, confession of need, and love of God.",r:"Iqbal al-A'mal of Ibn Tawus; al-Balad al-Amin (received attribution)",w:"The Day of 'Arafa, 9 Dhu al-Hijjah"}];var ne=[{l:`Human beings are members of a whole,
in creation of one essence and soul.
If one member is afflicted with pain,
the other members uneasy will remain.`,w:"Saadi Shirazi",s:"Gulistan, chapter 1, story 10",k:"All people are like one body. If one hurts, everyone feels it."},{l:`Raise your self so high that before every decree
God Himself asks His servant: what is your wish?`,w:"Muhammad Iqbal",s:"Bal-e-Jibril (Khudi ko kar buland itna)",k:"Become so good and strong that Allah asks you what you want."},{l:`Listen to the reed and the tale it tells,
how it sings of separation:
ever since they cut me from the reed-bed,
my cry has made men and women weep.`,w:"Jalal al-Din Rumi",s:"Masnavi, Book I, opening",k:"The flute is sad because it was cut from its home. Our hearts miss Allah the same way."},{l:`Come, come, whoever you are,
wanderer, worshipper, lover of leaving,
ours is not a caravan of despair.
Come, even if you have broken your vow a thousand times.`,w:"Attributed to Rumi (also to Abu Sa'id Abi al-Khayr)",s:"Quatrain, attribution debated",k:"Everyone is welcome to come back to goodness, no matter how many times they slipped."},{l:`Every heart that holds a longing for the Beloved
will, in time, be drawn to the door.`,w:"Hafez",s:"Divan, paraphrased",k:"If you really want something good, you will find the way to it."},{l:`Not everything that is in the heart can be said;
not everything that is said is heard;
not everything heard is understood.`,w:"Ghalib",s:"Urdu divan, paraphrased",k:"Some feelings are too big for words. That is okay."},{l:"The world is a bridge; pass over it, but build no house upon it.",w:"Inscribed on the Buland Darwaza, Fatehpur Sikri; attributed to Jesus in Islamic sources",s:"Inscription, 1601",k:"The world is a bridge to cross, not a house to stay in forever."},{l:"Do not grieve. Anything you lose comes round in another form.",w:"Rumi",s:"Masnavi, paraphrased",k:"When you lose something, something else good will come."},{l:`O son of Adam, the day you see wealth as your own,
that is the day it becomes your master.`,w:"Nasir Khusraw",s:"Divan, paraphrased",k:"Do not let your things own you."},{l:"A single rose can be my garden; a single friend, my world.",w:"Leo Buscaglia",s:"Modern aphorism",k:"One good friend is enough to be happy."},{l:`The bird that has eaten from the hand
will not fear the hand again.`,w:"Persian proverb",s:"Folk wisdom",k:"When someone is kind to you, you stop being afraid of them."},{l:`I searched for God and found only myself.
I searched for myself and found only God.`,w:"Attributed to Rumi",s:"Widely quoted; attribution uncertain",k:"Looking for Allah and looking for your true self end up in the same place."}];var Q=[{s:1,f:1,t:7,n:"Al-Fatiha, the whole Book in seven verses",sum:"Praise belongs to Allah, Lord of all worlds; He is Merciful and Master of the Day of Judgement; we worship and seek help from Him alone; and we ask for the straight path of those He favoured, not of those under anger or astray.",mz:"Al-Mizan treats the basmala as a verse of every surah and reads 'al-hamd' with its definite article as all praise, whoever appears to receive it. Tabataba'i notes the shift from speaking about Allah to addressing Him at 'You alone we worship', the move from knowledge to presence. He reads the straight path through 4:69 as the path of the prophets, the truthful, the martyrs and the righteous, and explains 'sirat' as the single road that gathers all the smaller 'subul'.",q:"When I say 'You alone we worship', whom else do I quietly serve?",k:"Al-Fatiha is the prayer we say in every salah: Allah, show us the right road."},{s:2,f:1,t:5,n:"Al-Baqarah 1\u20135, the Book and the God-conscious",sum:"The Book without doubt is guidance for the muttaqin: those who believe in the unseen, keep prayer, spend from what they are given, believe in what was sent down before and after, and are certain of the Hereafter. They are the guided and the successful.",mz:"Tabataba'i distinguishes two guidances: showing the way, which the Quran offers to all, and bringing to the goal, which it gives to the muttaqin, so the verse is not circular. He reads 'the unseen' as including Allah, His signs and the Hereafter, and connects 'certainty' with the final verses of the surah on the believers' trust.",q:"Which of the five qualities is weakest in me this week?",k:"The Quran is a guide for people who are careful and trust Allah even when they cannot see Him."},{s:2,f:30,t:39,n:"Adam, the names, and the first repentance",sum:"Allah tells the angels He will place a vicegerent on earth; He teaches Adam the names; the angels bow and Iblis refuses in pride; Adam and his wife slip at the tree, receive words of repentance, and are forgiven; guidance will come, and whoever follows it has no fear.",mz:"Al-Mizan reads the 'names' as realities that Adam was made to know, not vocabulary, which is why the angels could not learn them by being told. Khilafah is explained as representing Allah's attributes on earth, a station belonging to humankind as such. The descent is not a punishment that cancels the station; Tabataba'i stresses that Adam's slip preceded the law and that repentance restored him.",q:"What have I been made to know that I have not yet lived?",k:"Adam made a mistake, said sorry at once and was forgiven. Iblis was proud and would not."},{s:2,f:124,t:129,n:"Ibrahim's imamate and the building of the House",sum:"Allah tested Ibrahim with words and he fulfilled them; He said: I am making you an imam for mankind. Ibrahim asked for his descendants; the answer: My covenant does not reach the wrongdoers. Then Ibrahim and Isma'il raise the foundations of the House and pray for a messenger from among them.",mz:"One of al-Mizan's best-known discussions: imamate is given to Ibrahim after prophethood and after trials, so it is a station above prophethood, a guiding by Allah's command that brings people to the goal. Because the covenant excludes wrongdoers, Tabataba'i argues the imam must be protected from wrongdoing, and he extends the reasoning to the Imams of the Household.",q:"What trial, completed, would make me trustworthy with more?",k:"Ibrahim passed every test, so Allah made him a leader, and he built the Ka'bah with his son."},{s:2,f:153,t:157,n:"Patience, prayer and the words of loss",sum:"Seek help in patience and prayer; Allah is with the patient. Those killed in His way are alive. You will be tested with fear, hunger and loss of wealth, lives and fruits; the patient say: we belong to Allah and to Him we return. On them are blessings and mercy, and they are the guided.",mz:"Tabataba'i reads 'Allah is with the patient' as a special companionship beyond His general presence. He explains 'inna lillah' as the statement of ownership that dissolves grief: what belongs to Him cannot truly be lost. Hunger is listed among the tests, a reminder that the fast is a rehearsal of this verse.",q:"What loss am I still treating as mine?",k:"When something is hard or lost, patient people say: we belong to Allah. Then they feel strong."},{s:2,f:183,t:187,n:"The verses of fasting",sum:"Fasting is prescribed as for those before you, so you may attain taqwa; counted days, with exemptions; Ramadan is the month the Quran was sent down; Allah wants ease; when My servants ask about Me, I am near and answer the caller; eating and drinking until dawn, then the fast to night.",mz:"Al-Mizan draws out the purpose clause: taqwa, not hardship, is the aim, and the exemptions prove that ease is intended. Tabataba'i pauses on 2:186, placed in the middle of the fasting laws, where Allah answers without a messenger between, 'I am near', and reads it as the inner meaning of the whole month.",q:"Is my fast producing taqwa, or only hunger?",k:"We fast in Ramadan so our hearts get careful and close to Allah, who says: I am near."},{s:2,f:255,t:257,n:"Ayat al-Kursi and the rope that does not break",sum:"Allah, there is no god but He, the Living, the Sustainer; no sleep touches Him; no intercession but by His leave; His Kursi encompasses the heavens and the earth. No compulsion in religion; whoever rejects false gods and believes in Allah has grasped the firmest handhold. Allah is the guardian of the believers, bringing them from darkness into light.",mz:"Tabataba'i reads al-Hayy al-Qayyum as the two names from which all others flow: life and self-subsistence that sustains everything else. He explains the Kursi as the domain of His knowledge and rule, not a seat. On 'no compulsion', he notes that faith is an inner conviction that force cannot produce, and reads 'darkness into light' as the plural many errors against the single truth.",q:"What false god did I reject today, and what did I hold instead?",k:"Ayat al-Kursi says Allah never sleeps and looks after everything. Say it before bed."},{s:2,f:284,t:286,n:"The closing prayer of al-Baqarah",sum:"To Allah belongs what is in the heavens and earth; the Messenger and the believers believe; we hear and obey. Allah burdens no soul beyond its capacity; each has what it earned. Our Lord, do not blame us for forgetting; do not lay on us what we cannot bear; pardon, forgive, have mercy; You are our Master.",mz:"Al-Mizan reads the ending as the believers' response to the whole surah, mirroring its opening description of the muttaqin. Tabataba'i discusses 'no soul is burdened beyond its capacity' as a statement about the law itself, which is built within human capacity, so the following prayer asks for mercy within the law, not exemption from it.",q:"Which of my burdens did I pick up myself?",k:"Allah never gives a test too big for you. This is a prayer to say at night."},{s:3,f:7,t:9,n:"Clear and ambiguous verses, and ta'wil",sum:"Some verses are decisive, the mother of the Book, and others are ambiguous; those with deviation chase the ambiguous seeking discord and its ta'wil, but none knows its ta'wil except Allah; those firmly rooted in knowledge say: we believe in it, all is from our Lord.",mz:"A central passage for al-Mizan's method. Tabataba'i argues that ta'wil is not a hidden meaning of words but the reality the verse refers back to, and that the ambiguous is returned to the decisive for understanding, Quran explaining Quran. He reads 'those firmly rooted in knowledge' as joined to Allah in knowing the ta'wil, while their 'we believe' expresses submission, and identifies them first with the Prophet and his Household.",q:"Where do I prefer an ambiguity because it lets me do what I want?",k:"Some verses are very clear and some are deep. We understand the deep ones by using the clear ones."},{s:3,f:102,t:105,n:"Hold the rope together",sum:"Fear Allah as He should be feared and do not die except as Muslims; hold fast to the rope of Allah all together and do not divide; remember His favour when you were enemies and He joined your hearts; let there be a community calling to good; do not be like those who divided after clear proofs.",mz:"Tabataba'i identifies the rope with the Quran and the covenant it carries, and treats the joining of hearts as a divine act, not a social achievement. He reads the command as addressed to the community as a body: unity is a duty of the whole, and division after proof is the specific failure of earlier nations the surah warns against.",q:"Which rope do I grip when the family argues?",k:"Muslims should hold on to Allah's rope together, like a team, and not split up."},{s:3,f:133,t:136,n:"The God-conscious: anger, pardon, and the return",sum:"Race to forgiveness and a garden as wide as the heavens, prepared for the God-conscious: who spend in ease and hardship, restrain anger, pardon people, and when they commit an indecency or wrong themselves remember Allah and seek forgiveness, and do not persist knowingly.",mz:"Al-Mizan reads the sequence as a ladder: spending, then restraining anger, then pardon, then ihsan, each harder than the last. Tabataba'i notes that the muttaqin are not described as sinless; their mark is that they do not persist, and that remembering Allah is placed as the hinge between the sin and the return.",q:"What am I persisting in because I have stopped remembering?",k:"Allah loves people who control their anger, forgive, and say sorry quickly when they slip."},{s:3,f:159,t:160,n:"Gentleness, consultation, trust",sum:"By Allah's mercy you were gentle with them; had you been harsh they would have dispersed; so pardon them, ask forgiveness for them, and consult them; when you have decided, rely on Allah. If Allah helps you none can overcome you.",mz:"Tabataba'i draws attention to the order: pardon, then prayer for them, then consultation, then decision, then trust. Consultation is commanded even for the Prophet, as a method of binding hearts, while the decision remains with the one who leads, and tawakkul follows resolve rather than replacing it.",q:"Whom did I decide for today without asking?",k:"The Prophet was gentle and asked people what they thought. Then he decided and trusted Allah."},{s:4,f:1,t:1,n:"One soul, and the womb",sum:"O mankind, fear your Lord who created you from one soul and from it its mate, and from the two spread many men and women; fear Allah by whom you ask one another, and the wombs. Allah watches over you.",mz:"Al-Mizan reads the verse as the foundation of the surah's laws on family: all humans share one origin, so rights follow from kinship rather than rank. Tabataba'i discusses 'one soul' as Adam, and treats 'the wombs' as a reminder that ties of kinship are placed beside taqwa itself.",q:"Which relative have I let the tie go slack with?",k:"All people come from one family, so we treat everyone like relatives."},{s:4,f:36,t:36,n:"The verse of rights",sum:"Worship Allah and associate nothing with Him; do good to parents, relatives, orphans, the needy, the near neighbour, the far neighbour, the companion at your side, the traveller, and those your right hands possess. Allah does not love the proud and boastful.",mz:"Tabataba'i reads the list as circles of ihsan widening from parents outward, with tawhid as the root from which the duties grow. He notes the closing clause on pride: the vice that denies others their due is named as the opposite of ihsan.",q:"Who is the 'companion at my side' today, and how did I treat them?",k:"Be kind to parents, family, neighbours, and anyone near you. Allah does not like show-offs."},{s:4,f:58,t:59,n:"Trusts, justice, and those in authority",sum:"Allah commands you to return trusts to their owners and to judge with justice; obey Allah, obey the Messenger, and those in authority among you; if you dispute, refer it to Allah and the Messenger.",mz:"Al-Mizan's discussion is well known: because obedience to 'those in authority' is joined to obedience to the Messenger without a condition, Tabataba'i argues they must be protected from error, and identifies them with the Imams of the Household; he notes that disputes are referred to Allah and the Messenger, not to them, since they themselves refer to the Book and Sunna. Other schools read the verse of rulers generally; the Quran's own words are what both must return to.",q:"Whom do I obey without checking, and is that trust placed well?",k:"Give back what you are trusted with, be fair, and follow good guides who follow Allah."},{s:4,f:135,t:135,n:"Justice even against yourself",sum:"O you who believe, be upholders of justice, witnesses for Allah, even against yourselves or parents or relatives, rich or poor; Allah is closer to both. Do not follow desire lest you swerve; if you distort or refuse, Allah is aware.",mz:"Tabataba'i reads 'witnesses for Allah' as the motive that keeps testimony straight when the self, the parents or wealth pull it. Justice is presented as a standing quality (qawwamin), not an occasional act, and desire is named as the specific force that bends it.",q:"When did I last tell the truth against my own interest?",k:"Be fair even when it is hard, even if it means saying something true about yourself."},{s:5,f:1,t:3,n:"Fulfil the contracts; the religion completed",sum:"Fulfil your contracts; the lawful and unlawful among animals; do not violate the rites; cooperate in righteousness and piety, not in sin and aggression; forbidden foods listed; this day I have perfected your religion for you and completed My favour and chosen Islam as your religion.",mz:"Al-Mizan reads 'this day' as a specific day on which the religion was completed by a specific act, and argues from the context and the narrations for the day of Ghadir and the announcement of 'Ali's wilayah; Tabataba'i discusses at length why the sentence sits inside a list of food laws. Readers of other schools place it at the farewell pilgrimage; the passage repays reading with both views open.",q:"What contract have I made with myself that I have not fulfilled?",k:"Keep your promises, eat only good food, and help each other do good."},{s:5,f:54,t:56,n:"The verse of wilayah",sum:"Allah will bring a people He loves and who love Him, humble to believers, firm against disbelievers. Your guardian is only Allah, His Messenger, and those who believe, who establish prayer and give zakat while bowing. Whoever takes Allah, His Messenger and the believers as guardians: the party of Allah will prevail.",mz:"Tabataba'i argues that 'wali' here means authority and guardianship, not mere friendship, because of the restrictive 'only' and the parallel with Allah and the Messenger, and reads 'who give zakat while bowing' as referring to 'Ali's giving of his ring in prayer, as narrated in both Shi'a and many Sunni sources. The verse is the Quranic anchor of the Shi'a understanding of imamate.",q:"Whose guardianship do I actually live under: Allah's, or my habits'?",k:"Allah, the Prophet and the believers who pray and give are the ones who look after us."},{s:6,f:74,t:83,n:"Ibrahim's argument from the stars",sum:"Ibrahim confronts his father's idols; he is shown the kingdom of the heavens; the star, the moon, the sun each set, and he says: I do not love what sets. He turns his face to the Originator of the heavens and earth, and argues with his people without fear.",mz:"Al-Mizan reads the sequence not as Ibrahim's own doubt but as a demonstration conducted for his people, moving from the lesser light to the greater and rejecting each by the same proof: what sets cannot be a lord. Tabataba'i treats 'I do not love what sets' as the spiritual centre: worship is love, and love cannot rest on what perishes.",q:"What do I love that sets?",k:"Ibrahim saw the stars and moon disappear and said: I only love the One who never goes away."},{s:6,f:151,t:153,n:"The ten commandments of the Quran",sum:"Come, I will recite what your Lord forbade: associate nothing with Him; be good to parents; do not kill children from poverty; do not approach indecency; do not kill a soul unjustly; do not touch the orphan's property; give full measure; be just in speech even about relatives; fulfil Allah's covenant. This is My straight path; follow it and not other paths.",mz:"Tabataba'i notes that the commands are grouped under 'this is My straight path', so the path of al-Fatiha is given concrete content here: tawhid, parents, life, chastity, property, honesty, justice, covenant. He reads 'other paths' as any way that does not gather these together.",q:"Which of the ten do I treat as optional?",k:"Ten big rules: worship only Allah, be good to parents, be honest, be fair, keep promises."},{s:7,f:19,t:31,n:"The tree, the whisper, and the clothing of taqwa",sum:"Adam and his wife in the garden; Satan whispers, swears he is a sincere adviser, and they taste the tree; their shame appears; they say: our Lord, we have wronged ourselves, forgive us. O children of Adam, We sent down clothing to cover you, and the clothing of taqwa is best. Take your adornment at every mosque, eat and drink but do not be excessive.",mz:"Al-Mizan reads the clothing of taqwa as the inner covering that the outer garment symbolises, and connects the whole passage to the verse on eating without excess: the first disorder was an appetite deceived by a false adviser. Tabataba'i treats 'do not be excessive' as the Quran's general principle of measure in all enjoyment.",q:"Who is the 'sincere adviser' whispering excess to me?",k:"Satan tricked Adam about food. Allah says: eat and drink, enjoy it, but do not go overboard."},{s:7,f:172,t:174,n:"The covenant of 'am I not your Lord?'",sum:"When your Lord took from the children of Adam their descendants and made them witness over themselves: am I not your Lord? They said: yes, we witness. So that you cannot say on the Day of Judgement: we were unaware of this.",mz:"One of al-Mizan's deepest discussions. Tabataba'i argues that the verse describes a real witnessing in a dimension of existence prior to this world, the 'alam al-dharr', in which every soul knows its Lord by direct acquaintance, and that this is why no one can plead ignorance. He connects it to the fitrah verse (30:30): the covenant is the content of human nature.",q:"What in me already knows the answer before I argue?",k:"Before we were born, every soul already said yes to Allah. Deep inside, everyone knows Him."},{s:9,f:71,t:72,n:"Believers as guardians of one another",sum:"The believing men and women are guardians of one another: they enjoin good and forbid wrong, establish prayer, give zakat, obey Allah and His Messenger; Allah will have mercy on them. Allah promises them gardens, and His good pleasure is greatest.",mz:"Tabataba'i contrasts this verse with the preceding description of the hypocrites, who are 'of one another' in corruption; believers are wali to each other in guarding. He notes that men and women are named equally, and that 'Allah's good pleasure' is set above the garden itself as the greater reward.",q:"Whose guardian am I, and who is mine?",k:"Believers look after each other, remind each other to do good, and pray together."},{s:12,f:1,t:21,n:"Yusuf: the dream, the well, the house of the 'Aziz",sum:"We relate to you the best of stories. Yusuf's dream of eleven stars; Ya'qub's warning; the brothers' plot; the well; the caravan; sold for a few dirhams; the 'Aziz tells his wife to honour him; Allah establishes Yusuf in the land and teaches him interpretation.",mz:"Al-Mizan reads the surah as the story of pure servanthood (ikhlas) tested at every station: envy, slavery, temptation, prison, power. Tabataba'i explains 'the best of stories' by its completeness: one story, told once, showing how tawhid governs a whole life, and he treats Allah's repeated 'We' in the narrative as the real agent behind every turn.",q:"Where has a loss turned out to be the road?",k:"Yusuf's brothers were jealous and threw him in a well, but Allah was planning something good."},{s:12,f:22,t:35,n:"Yusuf: the temptation and the prison",sum:"The wife of the 'Aziz tempts him; he says: I seek refuge in Allah; the shirt torn from behind; the women cut their hands; Yusuf says: prison is dearer to me than what they call me to; he is imprisoned though innocent.",mz:"Tabataba'i reads 'he would have inclined had he not seen the proof of his Lord' as describing a protection that comes from servanthood, not from the absence of desire. He discusses 'burhan' as a vision of the Lord's presence given to the purified, and reads the choice of prison as the clearest Quranic image of preferring Allah over ease.",q:"What is my 'prison is dearer to me' choice this month?",k:"Yusuf said no to something wrong even when it cost him his freedom. Being good can be hard."},{s:12,f:36,t:57,n:"Yusuf: the dreams, the king, and the treasuries",sum:"Two prisoners' dreams; Yusuf calls them to tawhid before interpreting; years pass; the king's dream of seven fat and seven lean cows; Yusuf's plan of seven years of plenty and seven of famine; his innocence is established; set me over the treasuries of the land.",mz:"Al-Mizan notes that Yusuf refuses to leave prison until his name is cleared, placing honour of truth above freedom. Tabataba'i reads his request for office as service, not ambition: 'I am a knowing guardian' names the two qualities competence and trust, and the famine plan is presented as revelation turned into administration.",q:"Do I ask for responsibility, or wait to be handed it?",k:"Yusuf explained the king's dream and saved the whole country from hunger by planning ahead."},{s:12,f:58,t:101,n:"Yusuf: the brothers, the shirt, and the reunion",sum:"The brothers come for grain; Binyamin is kept; Ya'qub's eyes whiten with grief but he says: I complain only to Allah; Yusuf reveals himself: no blame on you today; the shirt restores Ya'qub's sight; the family prostrates; Yusuf prays: take me as a Muslim and join me with the righteous.",mz:"Tabataba'i draws out Ya'qub's 'beautiful patience' as complaint directed only to Allah, and reads 'no blame on you today' as the fruit of a servanthood that has no grievance left to settle. He treats the closing prayer as the key to the surah: the dream fulfilled, Yusuf asks not for more kingdom but for a good ending.",q:"What forgiveness would complete a story in my family?",k:"Yusuf forgave his brothers completely and his father could see again. Forgiving fixes families."},{s:14,f:7,t:7,n:"Gratitude and increase",sum:"And when your Lord proclaimed: if you are grateful, I will surely increase you; but if you are ungrateful, My punishment is severe.",mz:"Al-Mizan reads the increase as unspecified on purpose: it is increase in the blessing itself and beyond it, and gratitude is defined as using the blessing in the way its Giver intends. Tabataba'i connects it to Musa's reminder to his people, so gratitude is a community's path as well as a person's.",q:"What did I use today in a way its Giver would not have intended?",k:"When you really say thank you to Allah, He gives you more to be thankful for."},{s:14,f:35,t:41,n:"Ibrahim's prayer for Makkah and his family",sum:"My Lord, make this city secure and keep me and my children from worshipping idols; I have settled some of my descendants in a barren valley near Your sacred House so they may establish prayer; make hearts incline to them; praise to Allah who gave me Isma'il and Ishaq in old age; make me and my descendants establishers of prayer; forgive me, my parents and the believers on the Day of Reckoning.",mz:"Tabataba'i reads the prayer as the charter of Makkah and of the Prophet's line, and notes its order: faith first, then prayer, then provision. The request 'make hearts incline to them' is read as the origin of the love that draws pilgrims. He also comments on 'my parents', taking it to refer to Ibrahim's actual parents and not to Azar, consistent with 9:114.",q:"What do I ask for my children first: faith, or comfort?",k:"Ibrahim prayed for his children to pray and for people to love them. Parents can pray like that too."},{s:16,f:90,t:97,n:"Justice, excellence, and the good life",sum:"Allah commands justice, ihsan and giving to relatives, and forbids indecency, wrong and oppression; fulfil the covenant; do not break oaths; whatever is with you ends and what is with Allah endures; whoever does good, male or female, as a believer, We will give a good life.",mz:"Al-Mizan reads 16:90 as the most comprehensive verse of ethics, with 'adl as the foundation and ihsan as its completion, and explains why giving to relatives is singled out as the first circle of ihsan. On 16:97 Tabataba'i argues that the 'good life' is a real life granted in this world, a light and contentment the believer actually tastes, not only a promise for the next.",q:"Where is the good life already in my day, unnoticed?",k:"Be fair, do things beautifully, and be good to family; Allah gives good people a happy life."},{s:17,f:23,t:30,n:"Parents, kin, and the measure of spending",sum:"Your Lord decreed that you worship none but Him and be good to parents; do not say 'uff'; lower to them the wing of humility and say: my Lord, have mercy on them as they raised me when I was small. Give the relative his due, and the needy and the traveller, and do not squander; do not tie your hand to your neck nor open it completely.",mz:"Tabataba'i notes the placement of parents immediately after tawhid as the Quran's ranking of duties, and reads 'as they raised me small' as the reason that keeps the duty alive after the parents' authority is gone. On spending, he reads the two images as the two extremes forbidden, with the middle course as the Quran's constant rule of measure.",q:"What is my 'uff', the small impatience I think does not count?",k:"Be gentle with Mama and Baba, do not even say 'uff', and pray for them as they looked after you."},{s:17,f:36,t:39,n:"Knowledge before speech, humility before walking",sum:"Do not follow what you have no knowledge of; hearing, sight and heart will all be questioned. Do not walk on the earth proudly; you cannot tear the earth nor reach the mountains. That is from the wisdom your Lord revealed to you.",mz:"Al-Mizan reads 17:36 as a universal principle of knowledge and conduct: belief and action must rest on knowledge, and the three faculties are each held to account for what they followed. Tabataba'i treats the walking verse as the outward sign of the same inner order: the one who knows his smallness does not strut.",q:"What did I repeat today that I did not know to be true?",k:"Do not say things you are not sure about, and do not walk around like you are the biggest."},{s:18,f:9,t:26,n:"The companions of the cave",sum:"Young men fled to a cave for their faith and prayed: our Lord, give us mercy and prepare for us right guidance. Allah sealed their ears for years; they awoke and sent one to the city with their old coin; the people learned of them; they stayed three hundred years and nine; say: Allah knows best how long.",mz:"Tabataba'i reads the story as a demonstration of resurrection in miniature and of Allah's guardianship over those who stand for tawhid in a hostile society. He discusses the sleepers' prayer, 'prepare for us right guidance' (rushd), as the model of what to ask in a time of trial, and treats the closing 'Allah knows best' as the Quran's correction of the people's quarrels over details.",q:"Where would I need to 'flee to a cave' to keep my faith whole?",k:"Young believers hid in a cave and slept for hundreds of years. Allah protected them the whole time."},{s:18,f:32,t:44,n:"The man with two gardens",sum:"A parable of two men: one with two gardens of vines and date palms and a river between; he enters his garden wronging himself: I do not think this will ever perish. His companion: do you deny Him who created you from dust? Why did you not say: ma sha Allah, there is no power except through Allah? The garden is destroyed and he wrings his hands.",mz:"Al-Mizan reads the parable as the life of this world in picture: the garden is real, the pride is the error, and 'what Allah wills' is the sentence that would have kept the owner safe. Tabataba'i notes that the man's wrong was to see his wealth as his own and lasting, and that the companion's argument moves from creation to tawhid to the Hereafter.",q:"Over what do I need to say 'ma sha Allah, la quwwata illa billah' tonight?",k:"A man showed off his gardens and forgot Allah; the next day they were gone. Say ma sha Allah over your things."},{s:18,f:60,t:82,n:"Musa and the servant given knowledge",sum:"Musa travels to the meeting of the two seas; the fish escapes; they find a servant of Allah given mercy and knowledge; Musa asks to follow him and promises patience; the boat is holed, the boy is killed, the wall is rebuilt; Musa objects three times; the servant explains each act, and says: I did not do it of my own accord.",mz:"Tabataba'i reads the three acts as examples of a knowledge of realities (ta'wil) hidden behind events, the same ta'wil discussed at 3:7, and treats al-Khidr's final words as the key: the acts were by Allah's command, so apparent wrong was concealed mercy. Musa's station as a law-bearing prophet is not lowered; the story shows that there are matters beyond the outward law that belong to another knowledge.",q:"Which event in my life am I still judging from the middle?",k:"Musa followed a wise teacher who did three strange things that all turned out to be kind."},{s:19,f:16,t:36,n:"Maryam and the birth of Isa",sum:"Maryam withdraws; the spirit appears as a man; she seeks refuge; he says: I am a messenger of your Lord to give you a pure boy. She retires to a distant place; the pains bring her to the palm trunk; a voice says: do not grieve, shake the trunk and fresh dates will fall; eat, drink, be comforted. The infant speaks: I am the servant of Allah.",mz:"Al-Mizan draws attention to the honour given to Maryam as a sign for the worlds, and reads 'shake the trunk' as the pairing of divine help with human effort. Tabataba'i treats Isa's first words, 'I am the servant of Allah', as the surah's refutation of divinity claims, placed in the mouth of the child himself.",q:"What trunk is Allah asking me to shake before the dates fall?",k:"Baby Isa was born under a date tree. Allah told Maryam to shake it and eat the sweet dates."},{s:20,f:9,t:36,n:"Musa at the fire and the prayer for ease",sum:"Musa sees a fire, hears: I am your Lord, remove your sandals, you are in the sacred valley; establish prayer for My remembrance; what is in your hand? My staff; throw it; the serpent; his hand white; go to Pharaoh. Musa prays: expand my chest, ease my task, untie the knot in my tongue, and give me a helper from my family, Harun.",mz:"Tabataba'i reads 'I am Allah, there is no god but Me, so worship Me and establish prayer for My remembrance' as the first revelation to Musa and the summary of all revelation: tawhid, worship, and prayer as remembrance. He treats the prayer for ease as the prophet's recognition that the task exceeds the self, and notes that Allah grants every request at once.",q:"What is the 'knot in my tongue' I should ask to have untied?",k:"Musa was scared to speak to the king, so he asked Allah to make his heart brave. Allah said yes."},{s:21,f:51,t:73,n:"Ibrahim breaks the idols",sum:"We gave Ibrahim his guidance before; he asks his people what the statues are; he vows to plot against the idols; he breaks them except the largest; they ask who did it; he says: the big one did, ask them if they can speak; they return to themselves, then revert; they say burn him; We said: O fire, be cool and safe for Ibrahim.",mz:"Al-Mizan reads Ibrahim's 'the big one did it' as an argument staged to make the people confess the idols' helplessness, not a lie. Tabataba'i treats 'they returned to themselves' as the moment reason spoke, and 'then they were turned on their heads' as the reversion to habit over proof, a pattern he finds across the Quran.",q:"When reason speaks to me, how quickly do I turn back on my head?",k:"Ibrahim showed everyone that statues cannot even talk. When they threw him in a fire, Allah made it cool."},{s:21,f:83,t:90,n:"Ayyub, Yunus, Zakariyya: three prayers",sum:"Ayyub: harm has touched me and You are the most merciful; We removed his harm. Dhun-Nun went in anger, called in the darkness: there is no god but You, glory to You, I was among the wrongdoers; We saved him, and thus do We save the believers. Zakariyya: do not leave me alone; We gave him Yahya.",mz:"Tabataba'i reads the three prayers as three forms of servanthood: Ayyub names only Allah's mercy, not his own need; Yunus confesses with tawhid and no request; Zakariyya asks while affirming Allah as the best inheritor. He draws attention to 'thus do We save the believers' as a promise attached to the dua of Yunus for all who use it.",q:"Which of the three prayers is mine tonight?",k:"Three prophets prayed in three ways and Allah answered each. Yunus's dua works for everyone."},{s:24,f:35,t:38,n:"The verse of Light",sum:"Allah is the Light of the heavens and the earth; His light is like a niche in which is a lamp, the lamp in a glass, the glass like a shining star, lit from a blessed olive tree neither of east nor west, whose oil would almost glow without fire; light upon light; Allah guides to His light whom He wills. In houses Allah permitted to be raised, men glorify Him whom no trade distracts.",mz:"One of al-Mizan's longest discussions. Tabataba'i reads 'light' as that by which things appear, so Allah is light in the sense that all existence is manifest by Him; the parable describes the light of faith in the believer's heart, with the niche, glass, lamp and oil as its receptacles and source. He connects 'the houses' to the homes of the prophets and their Households by narration, while reading the verse's universal meaning first.",q:"What trade distracts me from remembering, and what would turn the lamp up?",k:"Allah's guidance is like a beautiful lamp that lights up a dark room. Faith makes your heart bright."},{s:25,f:63,t:77,n:"The servants of the Merciful",sum:"The servants of the Merciful walk humbly and answer the ignorant with peace; they spend the night prostrating and standing; they ask protection from Hell; they are neither wasteful nor stingy; they do not call on another god, kill, or fornicate; they do not witness falsehood; when reminded they do not fall deaf and blind; they pray: make our spouses and children the comfort of our eyes, and make us leaders of the God-conscious.",mz:"Tabataba'i reads the passage as a complete portrait of servanthood, beginning with how one walks and ending with how one prays for one's family. He notes that moderation in spending is placed among the signs, between night prayer and tawhid, and reads 'make us imams for the muttaqin' as a request to lead in good, which the Quran permits to ask for.",q:"Which of these twelve marks could my family see in me this week?",k:"Good people walk gently, say 'peace' to rude people, pray at night, share wisely, and pray for their family."},{s:27,f:15,t:19,n:"Sulayman and the ant",sum:"We gave Dawud and Sulayman knowledge; Sulayman inherited Dawud and said: we were taught the speech of birds. His hosts of jinn, men and birds marched; at the valley of the ants an ant said: enter your dwellings lest Sulayman and his hosts crush you unawares. He smiled at her words and said: My Lord, enable me to be grateful for Your favour on me and on my parents, and to do good that pleases You, and admit me by Your mercy among Your righteous servants.",mz:"Al-Mizan reads Sulayman's prayer as the model response to power: gratitude first, then good work, then the plea to be counted among the righteous by mercy rather than merit. Tabataba'i treats the ant's speech as real, part of the kingdom given to him, and the smile as the mark of a king whom greatness did not harden.",q:"What power do I hold that should make me smile at an ant?",k:"A tiny ant warned her friends about the army. King Sulayman smiled and thanked Allah for everything."},{s:28,f:76,t:84,n:"Qarun",sum:"Qarun was of Musa's people and oppressed them; his treasures' keys burdened a band of strong men; his people said: do not exult; seek the Hereafter with what Allah gave you and do not forget your share of this world; he said: I was given it for my knowledge. He went out in his splendour; the people wished for his like; the knowing said: Allah's reward is better. We caused the earth to swallow him and his house.",mz:"Tabataba'i reads 'do not forget your share of this world' as permission and limit at once: this world is to be used for the next, and the share is what serves that. Qarun's error is named in his own words, attributing wealth to his knowledge, and al-Mizan contrasts the two crowds, those who wished for his wealth and those who knew, as the two ways of looking at a rich man.",q:"What do I say 'I earned by my knowledge' that was given?",k:"Qarun was so rich his keys were heavy, and he said 'I did it myself'. Then it was gone. Say Alhamdulillah instead."},{s:30,f:20,t:30,n:"Signs in creation and the religion of fitrah",sum:"Among His signs: He created you from dust; He created spouses for you that you may find rest in them, and placed love and mercy between you; the heavens and earth, your languages and colours, your sleep and your seeking of His bounty. So set your face to the religion, upright, the fitrah of Allah upon which He created people; there is no changing Allah's creation.",mz:"The fitrah verse is central to Tabataba'i's thought: religion is not imposed on human nature but is its own demand, the way a seed demands its tree. Al-Mizan reads 'no changing Allah's creation' as the reason the true religion is one across the prophets. On 30:21, he treats the love and mercy between spouses as a created sign placed in human nature for the family's sake.",q:"What does my nature demand that my habits deny?",k:"Allah made everyone with a clean heart that already loves Him. Being good is being yourself."},{s:31,f:12,t:19,n:"Luqman's counsel",sum:"We gave Luqman wisdom: be grateful to Allah. He said to his son: do not associate anything with Allah; We enjoined on man goodness to parents, be grateful to Me and to your parents; but if they strive to make you associate, do not obey them, yet keep company with them kindly; my son, nothing is hidden from Allah; establish prayer, enjoin good, forbid wrong, be patient; do not turn your cheek in pride, do not walk arrogantly; be moderate in your walk and lower your voice.",mz:"Al-Mizan notes that the first act of the wise man is gratitude, which Tabataba'i reads as the definition of wisdom itself: seeing a blessing as a blessing. He draws out the order of the counsel, tawhid, parents, awareness of Allah, prayer, social duty, patience, humility, and treats 'the harshest of voices is the braying of donkeys' as the Quran's teaching that loudness is a defect of character.",q:"Which line of Luqman's counsel would my children say I need?",k:"A wise father told his son: thank Allah, be kind to parents, pray, do good, be patient, and talk softly."},{s:33,f:33,t:33,n:"The verse of purification",sum:"Stay in your houses, do not display yourselves as in the former ignorance, establish prayer, give zakat, obey Allah and His Messenger. Allah only wishes to remove impurity from you, O People of the House, and to purify you completely.",mz:"Al-Mizan's discussion is among its most extensive. Tabataba'i argues from the grammar, the masculine plural address, the restrictive 'only', and the narrations of the cloak reported in Sunni and Shi'a collections, that 'the People of the House' here are the Prophet, 'Ali, Fatima, al-Hasan and al-Husayn, and that the 'wish' is a creative (takwini) will that purifies them in fact. He answers the reading that it addresses the wives from the context, noting the change of pronoun.",q:"What impurity would I ask to have removed if I believed it possible today?",k:"Allah promised to keep the Prophet's family pure and clean of all wrong. The Prophet covered them with his cloak."},{s:36,f:13,t:32,n:"The man who came running",sum:"The parable of the town: two messengers, then a third; the people deny and threaten; a man comes running from the farthest part of the city: follow the messengers, follow those who ask no reward and are guided; why should I not worship Him who created me? He is told: enter the garden; he says: would that my people knew how my Lord forgave me.",mz:"Tabataba'i reads the running man as the believer's model in a hostile city: he argues from creation and from the messengers' selflessness, and even after death wishes good for his people. Al-Mizan notes that his entry into the garden is told as immediate, which Tabataba'i uses as evidence for life in the barzakh between death and resurrection.",q:"From which 'farthest part of the city' should I run today?",k:"A brave man ran across the town to tell people to listen to Allah's messengers. Even in Paradise he wished them well."},{s:39,f:53,t:55,n:"Do not despair of the mercy of Allah",sum:"Say: O My servants who have transgressed against themselves, do not despair of Allah's mercy; Allah forgives all sins; He is the Forgiving, the Merciful. Turn to your Lord and submit to Him before the punishment comes; follow the best of what was sent down to you.",mz:"Al-Mizan reads 'My servants' as the address that makes the promise possible: the relationship of servanthood is not broken by sin. Tabataba'i discusses 'forgives all sins' with the following verse: forgiveness is universal in scope but reached through turning and submission, so the verse is an invitation, not a licence.",q:"What have I decided is beyond forgiveness, and on whose authority?",k:"Allah says: My servants, never think I will not forgive you. Just come back to Me."},{s:42,f:36,t:43,n:"Consultation, anger, and forgiveness",sum:"What is with Allah is better and more lasting for those who believe and rely on their Lord, who avoid great sins, who forgive when angry, who answer their Lord and establish prayer, whose affair is consultation among them, who spend, and who defend themselves when wronged. The recompense of a wrong is its like, but whoever pardons and reconciles, his reward is with Allah. Whoever is patient and forgives, that is of the resolve of affairs.",mz:"Tabataba'i reads 'their affair is consultation among them' as the Quran's description of a believing community's way of deciding, and sets it beside the permission to resist wrong and the praise of pardon: justice is the limit, forgiveness the higher road. He notes the pairing of 'forgive when angry' with 'answer their Lord', so self-control is treated as a response to Allah.",q:"Where did I take 'its like' when pardon was open to me?",k:"Good people talk together before deciding, forgive when angry, and share what they have."},{s:49,f:10,t:13,n:"Brotherhood, mockery, suspicion, and the one family",sum:"The believers are brothers, so make peace between your brothers. Let no people mock another; do not defame one another; avoid much suspicion, for some suspicion is sin; do not spy or backbite. O mankind, We created you from a male and a female and made you peoples and tribes that you may know one another; the most noble of you is the most God-conscious.",mz:"Al-Mizan reads the sequence from brotherhood among believers to kinship among all humanity, and treats 49:13 as the Quran's denial of every ground of superiority except taqwa, which only Allah measures. Tabataba'i explains 'that you may know one another' as the purpose of difference: acquaintance, not ranking.",q:"Whom did I rank today, and by what measure?",k:"Allah made different peoples so we can get to know each other. Nobody is better except by being more careful with Allah."},{s:55,f:1,t:13,n:"Ar-Rahman: the Quran, the balance, the fruit",sum:"The Merciful taught the Quran, created man, taught him speech; the sun and moon in reckoning; the star and the tree prostrate; He raised the sky and set the balance, that you not transgress in the balance; the earth He laid for creatures, with fruit, palms, grain and fragrant plants. Which of your Lord's favours will you deny?",mz:"Tabataba'i notes that the first favour listed is the Quran, before the creation of man, and that speech (bayan) follows at once: understanding and expression are placed among the greatest mercies. He reads 'the balance' in both its cosmic and its moral sense, so the command 'do not transgress in the balance' covers measure in trade and measure in living.",q:"Where am I transgressing in the balance: in food, words, or time?",k:"Allah taught us to speak and read, and gave us fruit and grain. Which gift could we say is not a gift?"},{s:56,f:57,t:74,n:"The seed, the water, the fire: who made them?",sum:"We created you; why do you not affirm it? Have you seen what you emit? Do you create it or do We? Have you seen what you sow? Do you make it grow or do We? Have you seen the water you drink? Did you send it down from the clouds? Have you seen the fire you kindle? Did you produce its tree? So glorify the name of your mighty Lord.",mz:"Al-Mizan reads the four questions as a demonstration of resurrection through creation: the One who brings seed, grain, water and fire from nothing can bring the dead to life. Tabataba'i notes that each example is taken from daily sustenance, so the argument is meant to be felt at every meal.",q:"At tonight's meal, which of the four did I thank Him for?",k:"Who makes the seeds grow and the rain fall? We cannot. Only Allah. So we say thank you at dinner."},{s:59,f:18,t:24,n:"Look at what you sent ahead; the beautiful names",sum:"Fear Allah, and let every soul look at what it has sent ahead for tomorrow. Do not be like those who forgot Allah, so He made them forget themselves. Had We sent down this Quran on a mountain, you would have seen it humbled and split apart from fear of Allah. He is Allah, the Knower of the unseen, the Merciful, the King, the Holy, the Peace, the Faithful, the Guardian, the Mighty, the Compeller, the Creator, the Shaper; to Him belong the most beautiful names.",mz:"Tabataba'i reads 'forgot Allah so He made them forget themselves' as the Quran's deepest statement on self-knowledge: the self is known in relation to its Lord, and forgetting Him empties the self of meaning. The list of names is read as a summary of the whole surah's theme, and the parable of the mountain as the weight the Quran should have on a heart.",q:"What did I send ahead today?",k:"Before you sleep, look at what good you sent ahead for tomorrow. And learn Allah's beautiful names."},{s:62,f:9,t:11,n:"Friday: the call, the prayer, the work",sum:"When the call is made for prayer on Friday, hasten to the remembrance of Allah and leave trade. When the prayer is finished, disperse through the land and seek Allah's bounty, and remember Allah much, that you may succeed. But when they saw trade or amusement they rushed to it and left you standing.",mz:"Al-Mizan reads the two commands as balanced: leave trade for the prayer, then return to work as seeking Allah's bounty, with remembrance carried into both. Tabataba'i notes the rebuke in the last verse as showing that the community was still learning the weight of remembrance against gain.",q:"Do I carry remembrance from the prayer into the office, or leave it at the door?",k:"On Friday we stop work to pray, and then go back to work remembering Allah."},{s:67,f:1,t:4,n:"Al-Mulk: the perfect sky and the best deed",sum:"Blessed is He in whose hand is the kingdom; who created death and life to test which of you is best in deed; who created seven heavens in layers; you see no flaw in the creation of the Merciful; return your gaze, do you see any crack? Return your gaze again, it will come back to you humbled and weary.",mz:"Tabataba'i notes that death is named before life, which he reads as a sign that death is a creation and a passage, not a mere ending. 'Best in deed' is explained as the deed most sincere and most correct together, and the flawless creation is read as evidence that the test has a wise purpose.",q:"Which one deed today could I make best rather than most?",k:"Look at the sky. Can you find a crack? Allah made it perfect. Read this surah before bed."},{s:73,f:1,t:10,n:"Al-Muzzammil: the night and the heavy word",sum:"O you wrapped in garments, stand the night except a little, half of it or less or more, and recite the Quran with measured recitation. We will cast upon you a heavy word. The rising of the night is firmer in impression and more upright in speech. By day you have long occupation. Remember the name of your Lord and devote yourself to Him entirely.",mz:"Al-Mizan reads the night vigil as the preparation for receiving the 'heavy word', so worship precedes mission. Tabataba'i treats 'measured recitation' (tartil) as reading that lets meaning land, and reads 'devote yourself entirely' (tabattul) as cutting the heart's attachment to all but Him.",q:"Could I give the Quran ten slow minutes before the day's long occupation?",k:"The Prophet prayed at night to get strong for the day. Reading the Quran slowly helps it stay in your heart."},{s:76,f:5,t:12,n:"Al-Insan: they feed the needy, the orphan and the captive",sum:"The righteous drink from a cup mixed with camphor; they fulfil vows and fear a widespread day; they give food, despite loving it, to the needy, the orphan and the captive: we feed you only for Allah's face, we want no reward or thanks from you; so Allah protected them from that day and gave them radiance and joy.",mz:"Tabataba'i presents the narration, in Sunni and Shi'a sources, that the verses were revealed about 'Ali, Fatima, al-Hasan and al-Husayn giving their iftar away for three nights, and reads 'for Allah's face' as the definition of ikhlas: no reward, no thanks, not even gratitude expected. Al-Mizan notes 'despite loving it', so the merit is in giving what one wants.",q:"What did I give today that I actually wanted to keep?",k:"The Prophet's family gave their dinner to hungry people three nights in a row and said: we only do this for Allah."},{s:87,f:1,t:19,n:"Al-A'la: He who created and proportioned",sum:"Glorify the name of your Lord, the Most High, who created and proportioned, who measured and guided, who brought out the pasture. We will make you recite and you will not forget. Remind, if reminding benefits. He who purifies himself and remembers his Lord's name and prays has succeeded. But you prefer this life, though the Hereafter is better and more lasting. This is in the earlier scriptures, of Ibrahim and Musa.",mz:"Al-Mizan reads 'measured and guided' as a statement of universal guidance: every creature is given a measure and guided to its perfection, which Tabataba'i develops as a foundation of his view of creation. He notes the surah's closing claim that its teaching is in the scriptures of Ibrahim and Musa, the unity of revelation.",q:"What has Allah measured for me that I keep trying to re-measure?",k:"Allah made everything just the right size and showed it what to do. He will help you remember what you learn."},{s:89,f:15,t:30,n:"Al-Fajr: the test of plenty and the serene soul",sum:"When his Lord tests man with honour and favour he says: my Lord has honoured me; when He restricts his provision he says: my Lord has humiliated me. No. You do not honour the orphan, nor urge feeding the poor; you devour inheritance and love wealth greatly. When the earth is pounded and your Lord comes with the angels, man will remember, but how will remembrance help him? O serene soul, return to your Lord, pleased and pleasing; enter among My servants, enter My garden.",mz:"Tabataba'i reads the surah's correction, 'No', as the denial that wealth or poverty measure Allah's regard; both are tests, and the test is passed in how the orphan and the poor are treated. Al-Mizan reads 'the serene soul' as the soul at rest in its Lord through certainty, and 'enter among My servants' as the highest station, servanthood, before the garden is named.",q:"Do I read my income as a verdict, or as a test?",k:"Being rich or poor is a test, not a prize. The calm, peaceful soul is invited home to Allah."},{s:91,f:1,t:10,n:"Ash-Shams: eleven oaths and the soul",sum:"By the sun and its brightness, the moon when it follows, the day when it reveals, the night when it covers, the sky and He who built it, the earth and He who spread it, the soul and He who proportioned it and inspired it with its wickedness and its righteousness: he has succeeded who purifies it, and he has failed who buries it.",mz:"Al-Mizan reads 'inspired it with its wickedness and its righteousness' as the knowledge of good and evil placed in every soul, the practical side of fitrah. Tabataba'i treats the eleven oaths as the Quran's longest run of oaths, all converging on one sentence: success is the purification of the soul, and failure is its burial under what it was not made for.",q:"What am I burying my soul under this week?",k:"Allah swears by the sun and the moon that the person who keeps their heart clean wins."},{s:93,f:1,t:11,n:"Ad-Duha: your Lord has not forsaken you",sum:"By the morning brightness and the night when still, your Lord has not forsaken you nor does He hate you; the last will be better than the first; your Lord will give you and you will be satisfied. Did He not find you an orphan and shelter you, lost and guide you, poor and enrich you? So do not oppress the orphan, nor repulse the asker, and speak of your Lord's blessing.",mz:"Tabataba'i reads the surah as comfort to the Prophet during the pause in revelation, and the three past favours as the proof of future care. Al-Mizan draws the three commands from the three favours: sheltered, so shelter the orphan; guided, so do not repulse the one who asks; enriched, so speak of the blessing. Gratitude is turned into conduct.",q:"Which past care of Allah do I need to remember before I worry about tomorrow?",k:"Allah told the Prophet: I looked after you when you were a little orphan, and I have not forgotten you."},{s:94,f:1,t:8,n:"Al-Inshirah: with hardship, ease",sum:"Did We not expand your chest, remove your burden that weighed on your back, and raise your renown? With hardship comes ease; truly with hardship comes ease. So when you are free, labour on, and to your Lord turn with longing.",mz:"Al-Mizan reads the two 'ease' clauses as two different eases for one hardship, the definite 'the hardship' against the indefinite 'ease', which is the basis of the saying that one hardship will not overcome two eases. Tabataba'i treats 'when you are free, labour on' as the rhythm of a prophet's life: no rest except in turning toward Him.",q:"What is the ease that is already with my hardship?",k:"Allah made the Prophet's heart light. Every hard thing comes with an easy thing, twice."},{s:96,f:1,t:8,n:"Al-'Alaq: read, in the name of your Lord",sum:"Read, in the name of your Lord who created; created man from a clinging clot. Read, and your Lord is the most Generous, who taught by the pen, taught man what he did not know. No, man transgresses because he sees himself self-sufficient. To your Lord is the return.",mz:"Tabataba'i reads the first revelation as joining creation and teaching: the same Lord who created from a clot taught by the pen. Al-Mizan draws out 'he sees himself self-sufficient' as the root of every transgression, placed immediately after the praise of knowledge, so that knowledge without servanthood becomes the very thing that corrupts.",q:"Where do I see myself as self-sufficient, and what does it make me do?",k:"The first word Allah sent was 'Read'. Reading and learning are gifts from the most Generous."},{s:97,f:1,t:5,n:"Al-Qadr: the night of decree",sum:"We sent it down in the Night of Decree; and what will make you know the Night of Decree? The Night of Decree is better than a thousand months; the angels and the Spirit descend in it by their Lord's leave for every affair; peace it is until the rising of dawn.",mz:"Al-Mizan reads the night as recurring every year, since the angels descend 'for every affair' in the present tense, and discusses the sending down of the whole Quran at once in this night alongside its gradual revelation over twenty-three years. Tabataba'i treats 'the Spirit' as a creature greater than the angels, and 'peace until dawn' as the character of the night itself.",q:"If one night were worth a thousand months, how would I spend it?",k:"One night in Ramadan is better than a thousand months. The angels come down and it is all peace."},{s:103,f:1,t:3,n:"Al-'Asr: the four conditions",sum:"By time, mankind is in loss, except those who believe, do righteous deeds, counsel one another to truth, and counsel one another to patience.",mz:"Tabataba'i reads the oath by time as the whole span of human history, in which loss is the rule and the exception has four parts: faith, deeds, and two mutual counsels. Al-Mizan notes that the last two make salvation communal: one is saved with others, by reminding and being reminded of truth and patience.",q:"Whom did I counsel to truth this week, and who counselled me?",k:"Time runs out for everyone. Four things save you: believe, do good, help others be truthful, help others be patient."},{s:107,f:1,t:7,n:"Al-Ma'un: small kindnesses",sum:"Have you seen the one who denies the religion? It is he who pushes away the orphan and does not urge feeding the poor. So woe to those who pray, who are heedless of their prayer, who make a show, and withhold small kindnesses.",mz:"Al-Mizan reads the surah as the Quran's definition of denying the religion by conduct: cruelty to the orphan and indifference to the hungry. Tabataba'i treats 'heedless of their prayer' as prayer emptied of its meaning, shown by its failure to produce the small kindnesses, al-ma'un, that a neighbour needs.",q:"What small kindness did I withhold because it was small?",k:"Real faith shows in small kindnesses: sharing a pot, lending a pen, being gentle with an orphan."},{s:112,f:1,t:4,n:"Al-Ikhlas: say, He is Allah, One",sum:"Say: He is Allah, One; Allah, the Eternal Refuge; He neither begets nor is begotten; and there is none comparable to Him.",mz:"Tabataba'i explains 'ahad' as a oneness that admits no division and no second, distinct from 'wahid', and reads 'samad' as the One to whom all needs are directed while He needs none. Al-Mizan treats the surah as the whole of tawhid, which is why the narrations weigh it as a third of the Quran.",q:"What do I treat as 'samad', the thing I turn to first in need?",k:"Allah is One. He does not need anyone. Nobody is like Him. Four lines that say everything."},{s:2,f:21,t:22,n:"Al-Baqarah 21\u201322, the first command: worship",sum:"The first command addressed to all people in the Quran: worship your Lord who created you and those before you, so that you may become God-conscious; He made the earth a bed and the sky a canopy and sent rain for your provision, so do not set up rivals to Him while you know.",mz:"Al-Mizan notes that this is the first imperative in the mushaf and that it is addressed to people as such, not to believers, because creation and provision are reasons everyone already has. He reads 'so that you may be God-conscious' as the fruit of worship rather than its condition, and 'while you know' as the Quran's refusal to excuse idolatry by ignorance.",q:"What do I know about who feeds me, and whom do I thank first?",k:"The first thing Allah asks everyone to do is to worship Him, because He made us and gives us rain and food."},{s:2,f:45,t:46,n:"Al-Baqarah 45\u201346, help in patience and prayer"
