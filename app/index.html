<title>OnePlate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: glanceable daily dashboard. Phone: sticky top bar, scrolling bento cards, bottom tab bar. Desktop: top bar, left sidebar, two-column bento. Saffron accent on a soft warm-green ground; semantic green/amber/red kept separate from the accent. */
:root{
  --bg:#F4F5F1; --panel:#FFFFFF; --panel2:#F8F9F6; --fg:#17211C; --muted:#5E6B64; --line:#E3E7E0;
  --accent:#C4731A; --accent-2:#F3B55A; --accent-text:#9A560C; --btn:#A35D0E; --accent-ink:#FFFFFF; --soft:#FBF1E1;
  --green:#257553; --green-soft:#E1F3E8; --amber:#85600A; --amber-soft:#FBF0CF; --red:#B03A31; --red-soft:#FAE1DD; --blue:#2F67AE; --blue-soft:#E3EDFA;
  --scrim:rgba(23,33,28,.45); --shadow:0 1px 2px rgba(23,33,28,.05),0 10px 30px -14px rgba(23,33,28,.16); --r:18px;
  --display:"Outfit",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --panel:#182019; --panel2:#1F2922; --fg:#E9EEEA; --muted:#93A098; --line:#28332C;
  --accent:#F0A63A; --accent-2:#F6C87A; --accent-text:#F0A63A; --btn:#F0A63A; --accent-ink:#1B1308; --soft:#2A2114;
  --green:#5ECB97; --green-soft:#163527; --amber:#E6BC4C; --amber-soft:#36300F; --red:#F18E85; --red-soft:#3E1F1C; --blue:#7FB0F0; --blue-soft:#15263A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1412; --panel:#182019; --panel2:#1F2922; --fg:#E9EEEA; --muted:#93A098; --line:#28332C;
  --accent:#F0A63A; --accent-2:#F6C87A; --accent-text:#F0A63A; --btn:#F0A63A; --accent-ink:#1B1308; --soft:#2A2114;
  --green:#5ECB97; --green-soft:#163527; --amber:#E6BC4C; --amber-soft:#36300F; --red:#F18E85; --red-soft:#3E1F1C; --blue:#7FB0F0; --blue-soft:#15263A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:inset 0 0 0 3.5px var(--bg),0 0 0 2px var(--accent)}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.local{background:var(--amber-soft);color:var(--amber)}
.chip.wait{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.view{background:var(--blue-soft);color:var(--blue)}
main{flex:1;min-height:0;overflow-y:auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--panel);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{appearance:none;background:none;border:0;color:var(--muted);font:600 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button .ib{display:grid;place-items:center;width:44px;height:28px;border-radius:999px;transition:background .2s}
.tabs button.on{color:var(--accent-text)}
.tabs button.on .ib{background:var(--soft)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--panel2)}
.card.accent{background:linear-gradient(135deg,var(--soft),var(--panel));border-color:transparent}
.card.locked{background:var(--panel2);box-shadow:none}
.card.link{cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tile .ic{width:16px;height:16px;color:var(--accent-text)}
button.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--body);padding:11px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s}
button.btn:active{transform:scale(.98)}
button.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--btn)}
button.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.btn.wide{width:100%}
button.btn:focus-visible,.sw-row:focus-visible,.dot:focus-visible,.seg button:focus-visible,.info:focus-visible,.card.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* fast hero */
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:148px;height:148px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none;stroke-width:11}
.ring .bar{stroke:url(#ringGrad);fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-variant-numeric:tabular-nums;gap:2px}
.ring .lbl b{font-size:24px;font-weight:500;letter-spacing:-.02em}
.ring .lbl span{font-size:11px;color:var(--muted)}
.ring .lbl .ic{color:var(--muted);width:22px;height:22px}
.hero .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
/* summary strip */
.strip{flex-direction:row;align-items:center;gap:14px;padding:12px 16px}
.strip .mini{position:relative;width:48px;height:48px;flex:0 0 auto}
.strip .mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.strip .mini .t{stroke:var(--line);fill:none;stroke-width:5}
.strip .mini .b{stroke:var(--green);fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s}
.strip .mini b{position:absolute;inset:0;display:grid;place-items:center;font:500 13px var(--mono)}
.strip .txt{flex:1;min-width:0}
.strip .txt b{display:block;font-family:var(--display);font-size:15px}
.strip .txt small{color:var(--muted);font-size:12px}
.streak{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--accent-text);font:600 13px var(--body);white-space:nowrap}
.streak .ic{width:16px;height:16px}
/* check-ins */
.checks{display:flex;flex-direction:column;gap:4px}
.crow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.crow .t b{font-weight:500;display:flex;align-items:center;gap:6px}
.crow .t small{color:var(--muted);font-size:12px}
.crow .lead{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:0 0 auto}
.crow.done .lead{background:var(--green-soft);color:var(--green)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{appearance:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font:500 12px var(--mono);cursor:pointer;display:grid;place-items:center;transition:transform .1s,background .15s;padding:0}
.dot.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.dots.palms .dot.on{background:var(--soft);border-color:var(--accent);color:var(--accent-text)}
.dot:active{transform:scale(.9)}
.dots.ro .dot{cursor:default}
.sw-row{cursor:pointer}
.sw-row:not([data-a]){cursor:default}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.crow.done .sw{background:var(--green)}
.crow.done .sw i{left:21px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill .ic{width:14px;height:14px}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.soft{background:var(--soft);color:var(--accent-text)}
.pill.grey{background:var(--line);color:var(--muted)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
/* plate */
.platewrap{display:flex;gap:16px;align-items:center}
.platewrap svg{width:150px;height:150px;flex:0 0 auto}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.legend .lg{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start;font-size:14px}
.legend i{width:12px;height:12px;border-radius:4px;margin-top:5px}
.legend .lt{min-width:0;display:flex;flex-direction:column;gap:1px}
.legend .lt b{font-family:var(--display);font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.legend .lt b em{font-style:normal;font-weight:400;font-family:var(--body)}
.legend .lt span{color:var(--muted);font-size:12px;line-height:1.35}
@media (max-width:420px){.platewrap{flex-direction:column;align-items:stretch}.platewrap svg{align-self:center;width:170px;height:170px}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 12px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;text-transform:capitalize}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--line)}
.mbar i{display:block;height:100%}
.mbar .p{background:var(--accent)}.mbar .c{background:var(--amber)}.mbar .f{background:var(--muted)}
.mkey{display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;align-items:center}
.mkey b{color:var(--fg);font-weight:500}
.mkey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 16px;box-shadow:var(--shadow)}
details summary>span{min-width:0;flex:1}
details summary{cursor:pointer;padding:13px 0;font-family:var(--display);font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary .chev{color:var(--muted);transition:transform .2s}
details[open] summary .chev{transform:rotate(90deg)}
details .body{padding:0 0 16px;display:flex;flex-direction:column;gap:10px}
.hands{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.hands span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl tr.today td{background:var(--soft)}
.scroll{overflow-x:auto;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);border-left-width:4px}
.item.green{border-left-color:var(--green)}.item.amber{border-left-color:var(--amber)}.item.red{border-left-color:var(--red)}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t small{color:var(--muted);display:block;font-size:12px}
.kcal{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=number],input[type=date],input[type=text],input[type=search],select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;background:var(--panel2);font-size:11px;color:var(--muted)}
.wday .ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--muted);border:1.5px solid var(--line)}
.wday .ib .ic{width:17px;height:17px}
.wday.cycle .ib{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.wday.strength .ib{color:var(--accent-text);background:var(--soft);border-color:transparent}
.wday.easy .ib{color:var(--green);background:var(--green-soft);border-color:transparent}
.wday.today{background:var(--fg);color:var(--bg)}
.wday.today .ib{box-shadow:0 0 0 2px var(--bg)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--accent-2));border-radius:999px;transition:width .6s}
/* progress */
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bignum span{font-size:14px;color:var(--muted)}
.goalbar{display:flex;flex-direction:column;gap:6px}
.goalbar .lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .exp{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .act{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.chart .ptl{fill:var(--panel);stroke:var(--accent);stroke-width:3}
.chart .tgt{stroke:var(--green);stroke-width:1.2;stroke-dasharray:2 3}
.log{display:flex;flex-direction:column}
.log .r{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding:8px 0;border-bottom:1px solid var(--line)}
.log .r:last-child{border-bottom:0}
.log .r button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:2px 4px}
.log .d{color:var(--green);font-weight:500}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:18px 1fr;gap:0 12px}
.tl .n{display:flex;flex-direction:column;align-items:center}
.tl .n i{width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--muted);margin-top:5px}
.tl .n s{flex:1;width:2px;background:var(--line);text-decoration:none;margin:4px 0}
.tl.hit .n i{background:var(--green);border-color:var(--green)}
.tl .c{padding-bottom:14px;display:flex;flex-direction:column;gap:2px}
.tl .c b{font-family:var(--display);font-weight:600}
.tl .c span{font-size:13px;color:var(--muted)}
.rules{counter-reset:r;display:grid;gap:8px}
.rules div{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:14px;padding:12px 14px}
.rules div::before{counter-increment:r;content:counter(r);font-family:var(--display);font-weight:700;color:var(--accent-text);font-size:22px;line-height:1;min-width:22px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1}
ul,ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.note{font-size:13px;color:var(--muted);padding:11px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0}
.info{appearance:none;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);width:17px;height:17px;border-radius:50%;font:700 10px var(--display);line-height:1;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;padding:0;flex:0 0 auto;text-transform:none;letter-spacing:0}
.info:hover{border-color:var(--accent-text);color:var(--accent-text)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);color:var(--fg);border-radius:22px 22px 0 0;padding-block:14px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:none;flex-direction:column;gap:8px;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-width:640px;margin:0 auto}
.sheet.show{display:flex}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.sheet h3{font-size:18px}
.sheet p{font-size:14px;line-height:1.5}
.sheet .x{position:absolute;top:14px;right:16px;border:0;background:var(--panel2);color:var(--muted);width:30px;height:30px;border-radius:50%;font:600 15px var(--body);cursor:pointer}
.erows{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:1fr 72px 36px;gap:6px;align-items:center}
.erow select,.erow input{padding:8px 10px;border-radius:10px}
.erow .btn{padding:6px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);background:var(--soft);color:var(--accent-text);flex:0 0 auto}
.avatar.female{background:var(--blue-soft);color:var(--blue)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px;max-height:330px;overflow:auto;padding:2px}
.qc{appearance:none;border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);font:500 10px var(--mono);height:28px;border-radius:8px;cursor:pointer;padding:0;transition:transform .1s}
.qc:active{transform:scale(.92)}
.qc.read{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.qc.revisit{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.qc.cur{box-shadow:0 0 0 2px var(--accent)}
.qc[disabled]{cursor:default}
.qk{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);background:var(--panel2);vertical-align:middle;margin-right:4px}
.qk.read{background:var(--green-soft);border-color:var(--green)}.qk.revisit{background:var(--amber-soft);border-color:var(--amber)}.qk.cur{box-shadow:0 0 0 2px var(--accent)}

.glist{display:flex;flex-direction:column;gap:6px}
.glist button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}

  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:12px;font:600 14px var(--body);text-transform:capitalize;letter-spacing:0}
  .tabs button .ib{width:auto;height:auto;background:none!important}
  .tabs button.on{background:var(--soft);color:var(--accent-text)}
  .tabs button:hover:not(.on){background:var(--panel2)}
  main{grid-column:2;grid-row:2;padding-block:30px 48px;padding-left:32px;padding-right:32px}
  .wrap{max-width:1060px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .wrap>.hdr,.wrap>h2,.wrap>.seg,.wrap>.note,.wrap>p,.wrap>.row,.wrap>.strip,.wrap>.search{grid-column:1/-1}
  .wrap>.list{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wrap>.glist{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  h1{font-size:32px}
  .ring{width:168px;height:168px}
  .sheet{bottom:auto;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:480px;border-radius:20px;padding-block:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet .grab{display:none}
  .toast{bottom:32px}
}

 hardship and one ease that came with it."},{r:"13:28",m:"Those who believe and whose hearts find rest in the remembrance of Allah. Truly, in the remembrance of Allah do hearts find rest.",c:"Surah ar-Ra'd, on who is guided.",k:"Saying Allah's name quietly makes your heart calm, like a hug for the inside of you.",a:"Rest is not the absence of problems but the presence of remembrance.",do:"Three slow breaths with 'SubhanAllah' before you open your phone this morning."},{r:"2:152",m:"Remember Me and I will remember you. Be grateful to Me and do not be ungrateful.",c:"Al-Baqarah, after the change of the qibla.",k:"When you think of Allah, Allah thinks of you. Say thank you and He gives you more to be thankful for.",a:"Two reciprocal promises in one line: remembrance for remembrance, gratitude kept.",do:"Say 'Alhamdulillah' out loud for three specific things at dinner."},{r:"14:7",m:"If you are grateful, I will surely give you more; but if you are ungrateful, My punishment is severe.",c:"Surah Ibrahim, Musa reminding his people of their blessings.",k:"Thank you is a magic key: the more you say it and mean it, the more good things grow.",a:"Gratitude is presented as the cause of increase, not its result.",do:"Thank one person today for something you usually take for granted."},{r:"65:3",m:"Whoever relies on Allah, He is sufficient for him. Allah will accomplish His purpose.",c:"Surah at-Talaq, in a passage about provision in hard circumstances.",k:"If you trust Allah and do your best, you do not have to carry the worry too.",a:"Tawakkul is effort plus trust, not trust instead of effort.",do:"Do your part of one worry fully, then stop re-checking it."},{r:"39:53",m:"O My servants who have gone to excess against themselves, do not despair of the mercy of Allah. Allah forgives all sins.",c:"Surah az-Zumar. Many commentators call it the most hopeful verse in the Quran.",k:"No matter what mistake you make, you can always say sorry to Allah, and He loves to forgive.",a:"The address is 'My servants', even to those who went to excess. The relationship is not cancelled by the sin.",do:"Make one sincere istighfar for something you have been avoiding."},{r:"2:153",m:"O you who believe, seek help through patience and prayer. Truly Allah is with the patient.",c:"Al-Baqarah, instructions to the new community in Madinah.",k:"When things are hard, two helpers are always there: being patient and praying.",a:"Patience and prayer are named as tools, not moods.",do:"Pray one prayer today slowly, as a request for help, not a task."},{r:"49:13",m:"We made you peoples and tribes that you may know one another. The most noble of you in the sight of Allah is the most God-conscious.",c:"Surah al-Hujurat, on human dignity and equality.",k:"Allah made different kinds of people so we can make friends and learn from each other. The best person is the kindest and most careful, not the richest.",a:"Difference is for knowing, not ranking. The only ranking is taqwa, and only Allah sees it.",do:"Ask someone from a different background one genuine question about their life."},{r:"17:23\u201324",m:"Your Lord has decreed that you worship none but Him, and that you be good to parents. Do not say to them even 'uff', and lower to them the wing of humility out of mercy.",c:"Surah al-Isra, the ten commandments of the Quran.",k:"Be gentle and kind to Mama and Baba, even when you are tired. Not even a grumpy 'uff'.",a:"The command sits beside tawhid itself. Tone of voice is included in the duty.",do:"Call or sit with a parent today without looking at a screen."},{r:"31:17\u201319",m:"Luqman said: My son, establish prayer, enjoin good, forbid wrong, and be patient. Do not turn your cheek in pride, do not walk arrogantly; be moderate in your pace and lower your voice.",c:"Surah Luqman, a father's advice to his son.",k:"A wise father told his son: pray, do good, be patient, do not show off, walk calmly, and speak gently.",a:"A complete parenting script in three verses: worship, ethics, patience, humility, pace, voice.",do:"Read these verses to the children at dinner and ask which one is hardest."},{r:"7:31",m:"O children of Adam, take your adornment at every mosque, and eat and drink, but do not be excessive. He does not love those who are excessive.",c:"Surah al-A'raf. The verse the rule of thirds rests on.",k:"Eat and drink what you need, enjoy it, and stop before your tummy is too full.",a:"The Quran's dietary rule is not what but how much. This is the root of OnePlate.",do:"Stop tonight's dinner at 80 percent full and notice how it feels an hour later."},{r:"16:90",m:"Allah commands justice, excellence, and giving to relatives, and forbids indecency, wrong, and oppression.",c:"Surah an-Nahl. Recited at the end of the Friday sermon across the Muslim world.",k:"Allah asks us to be fair, to do things beautifully, and to be good to family.",a:"'Adl is the floor, ihsan is the ceiling, and family is named between them.",do:"Do one thing today better than it needs to be done."},{r:"3:134",m:"Those who spend in ease and in hardship, who restrain anger and pardon people. Allah loves those who do good.",c:"Aal Imran, describing the God-conscious.",k:"When you feel angry, hold it in and forgive. Allah loves people who do that.",a:"Three stages: restrain, then pardon, then ihsan. Each is harder than the last.",do:"The next time you feel anger rise, wait ten seconds before speaking."},{r:"103:1\u20133",m:"By time, mankind is in loss, except those who believe, do good, and urge one another to truth and to patience.",c:"Surah al-Asr. Imam al-Shafi'i said that if people reflected on this surah alone it would suffice them.",k:"Time runs out for everyone. The winners are those who believe, do good, and help each other stay honest and patient.",a:"Four conditions, and two of them are social. Salvation is not a solo project.",do:"Remind one person gently of something true today, and accept one reminder yourself."},{r:"2:155\u2013156",m:"We will test you with fear, hunger, and loss. Give good tidings to the patient, who say when struck by calamity: we belong to Allah and to Him we return.",c:"Al-Baqarah.",k:"Hard things happen to everyone. Patient people say: we belong to Allah, and that makes them strong.",a:"Hunger is explicitly named as a test. A fasting day is a small rehearsal.",do:"Say 'inna lillahi wa inna ilayhi raji'un' over one small loss today and let it go."},{r:"67:2",m:"He who created death and life to test which of you is best in deed.",c:"Surah al-Mulk.",k:"Life is like a test where the question is: who did the best things? Not the most things.",a:"Ahsanu 'amala: best, not most. Quality over volume in worship and work.",do:"Pick one task today and do it with full attention instead of three half-done."},{r:"93:5\u20138",m:"Your Lord will give you, and you will be satisfied. Did He not find you an orphan and give you shelter? Did He not find you lost and guide you? Did He not find you in need and make you rich?",c:"Surah ad-Duha, revealed when revelation paused and the Prophet was grieving.",k:"Allah took care of the Prophet when he was a little orphan, so He will take care of you too.",a:"The proof of future care is a list of past care. Gratitude is the cure for anxiety here.",do:"List three times in your life when you were carried through something."},{r:"20:114",m:"Say: My Lord, increase me in knowledge.",c:"Surah Ta-Ha. The only increase the Prophet was commanded to ask for.",k:"A little prayer to say before school or reading: 'My Lord, make me know more.'",a:"Rabbi zidni 'ilma. Knowledge is the one thing the Quran tells us to ask for more of.",do:"Say it before opening a book or a lesson today, and read for ten minutes."},{r:"25:63",m:"The servants of the Most Merciful are those who walk on the earth humbly, and when the ignorant address them, they say: peace.",c:"Surah al-Furqan, the portrait of 'Ibad ar-Rahman.",k:"Kind people walk gently and, when someone is rude, they just say 'peace' and walk on.",a:"The first quality of the Merciful's servants is how they walk and how they answer rudeness.",do:"Answer one annoying message today with calm, or not at all."},{r:"59:9",m:"They prefer others over themselves, even though they are in need. Whoever is saved from the greed of his own soul, those are the successful.",c:"Surah al-Hashr, praising the Ansar of Madinah.",k:"The Ansar shared their food and homes with people who had nothing. Sharing when you have little is the best sharing.",a:"Ithar: preferring others. The verse names greed of the self as the thing to be saved from.",do:"Give something today that you would rather have kept."},{r:"3:159",m:"It was by the mercy of Allah that you were gentle with them. Had you been harsh and hard-hearted, they would have left you. So pardon them, ask forgiveness for them, and consult them in affairs. Then, when you have decided, rely on Allah.",c:"Aal Imran, after the battle of Uhud.",k:"The Prophet was gentle, asked people for their ideas, and then trusted Allah. That is how to lead a family too.",a:"Gentleness, consultation, decision, trust: a four-step leadership method.",do:"Ask the family's opinion on one decision tonight and act on it."},{r:"29:69",m:"Those who strive for Us, We will surely guide them to Our ways. Allah is with those who do good.",c:"The last verse of Surah al-Ankabut.",k:"If you really try, Allah shows you the way. Trying comes first, then the path appears.",a:"Guidance follows effort. Not a path then a step, but a step then a path.",do:"Take the first step on something you have been waiting to feel ready for."},{r:"2:201",m:"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.",c:"Al-Baqarah. The Prophet's most frequent supplication.",k:"A perfect little dua: good things here, good things there, and keep us safe.",a:"Both worlds in one breath. Health, family and livelihood are legitimate things to ask for.",do:"Teach it to the children tonight; three lines, easy to memorise."},{r:"41:34",m:"Good and evil are not equal. Repel evil with what is better, and the one between whom and you was enmity will become as a close friend.",c:"Surah Fussilat.",k:"If someone is mean, be extra kind back. Sometimes the mean person becomes your friend.",a:"A strategy, not just a virtue: the better response is what changes the other person.",do:"Think of one tense relationship and do one unexpectedly kind thing."},{r:"4:36",m:"Worship Allah and associate nothing with Him, and do good to parents, relatives, orphans, the needy, the near neighbour, the distant neighbour, the companion at your side, the traveller.",c:"Surah an-Nisa, the verse of rights.",k:"Be good to everyone around you: family, neighbours, people who need help, even the person sitting next to you.",a:"Nine groups of people in one verse, in widening circles from parents to the stranger.",do:"Check on a neighbour this week."},{r:"17:36",m:"Do not follow what you have no knowledge of. The hearing, the sight and the heart: all of these will be questioned.",c:"Surah al-Isra.",k:"Do not repeat things you are not sure are true. Your ears, eyes and heart are responsible.",a:"An epistemology in one verse: knowledge before speech, and the senses held accountable.",do:"Before forwarding one message today, check whether it is true."},{r:"5:2",m:"Cooperate in righteousness and God-consciousness, and do not cooperate in sin and aggression.",c:"Surah al-Ma'idah.",k:"Help each other do good things. Do not help anyone do bad things.",a:"Cooperation is commanded, and its direction is specified.",do:"Join or help one good effort today, however small."},{r:"2:183",m:"O you who believe, fasting is prescribed for you as it was prescribed for those before you, that you may attain taqwa.",c:"Al-Baqarah, the verse of fasting.",k:"Fasting is for growing a careful, Allah-remembering heart. People before us fasted too.",a:"The stated purpose of fasting is taqwa, not weight. OnePlate's fast borrows the practice; the purpose is older.",do:"Make one fast this week consciously about taqwa and not the scale."},{r:"96:1\u20135",m:"Read, in the name of your Lord who created. Created man from a clinging clot. Read, and your Lord is the most Generous, who taught by the pen, taught man what he did not know.",c:"Surah al-'Alaq, the first revelation in the cave of Hira.",k:"The very first word Allah sent to the Prophet was 'Read'. Reading is a holy thing to do.",a:"Revelation opened with a command to read and a reference to the pen. Learning is worship.",do:"Read something that teaches you, for fifteen minutes, before entertainment."},{r:"16:97",m:"Whoever does good, male or female, while a believer, We will surely give them a good life, and reward them according to the best of what they did.",c:"Surah an-Nahl.",k:"Boys and girls who do good get a good life. Allah promises it.",a:"Hayat tayyiba, a good life, is promised in this world. The promise is explicitly for both sexes.",do:"Do one good deed today without telling anyone."},{r:"33:21",m:"In the Messenger of Allah you have an excellent example, for anyone who hopes in Allah and the Last Day and remembers Allah often.",c:"Surah al-Ahzab, during the battle of the Trench.",k:"The Prophet is the best example of how to be. When you do not know what to do, ask: what would he do?",a:"Uswa hasana: the model is a person, not a rulebook.",do:"Choose one habit of the Prophet, such as smiling or eating moderately, and practise it today."},{r:"62:10",m:"When the prayer has ended, disperse through the land and seek the bounty of Allah, and remember Allah much, that you may succeed.",c:"Surah al-Jumu'ah.",k:"After praying, go and work and play, and keep remembering Allah while you do.",a:"Work is placed right after prayer and framed as seeking Allah's bounty.",do:"Begin today's work with Bismillah and treat one task as worship."},{r:"6:162",m:"Say: my prayer, my sacrifice, my living and my dying are for Allah, Lord of the worlds.",c:"Surah al-An'am.",k:"Everything I do, even eating and sleeping, can be for Allah if I mean it that way.",a:"Niyyah turns the ordinary into the sacred. Eating well to serve your family is worship.",do:"Set an intention for tonight's meal before the first bite."},{r:"55:13",m:"Which of the favours of your Lord will you deny?",c:"Surah ar-Rahman, repeated thirty-one times.",k:"Allah keeps asking: look at all the gifts, which one will you pretend is not a gift?",a:"The repetition is the lesson: gratitude needs constant renewal.",do:"Count ten favours before sleep tonight."}];var T=[{n:1,a:"Al-Fatiha",t:"The Opening",v:7,p:"Meccan",s:"Praise, mercy, mastery of the Day of Judgement, worship and help from Allah alone, and the prayer for the straight path. The whole Quran in seven verses; recited in every unit of prayer.",k:"It is the first page of the Quran and the prayer we say in every salah: Allah, show us the right road.",l:"Ask for guidance every day; it is not a one-time request."},{n:2,a:"Al-Baqarah",t:"The Cow",v:286,p:"Medinan",s:"The longest surah: the story of Adam, Bani Israel and the cow, the change of qibla, laws of fasting, charity, marriage and debt, Ayat al-Kursi, and the closing prayer for strength.",k:"A very long surah that teaches the new Muslim community how to live: praying, fasting, sharing and being fair.",l:"A community is built on law and mercy together."},{n:3,a:"Aal Imran",t:"The Family of Imran",v:200,p:"Medinan",s:"Maryam's birth and upbringing, Isa's miracles, the lessons of Uhud, and the call to hold fast to Allah's rope together.",k:"The story of Maryam's family and a lesson that Muslims should stay together like people holding one rope.",l:"Hold the rope together; division is the real defeat."},{n:4,a:"An-Nisa",t:"The Women",v:176,p:"Medinan",s:"Rights of women, orphans and inheritance; justice even against oneself; the verse of rights to parents and neighbours.",k:"Rules to protect women, orphans and people who are weak, so nobody is treated unfairly.",l:"Stand for justice even when it costs you."},{n:5,a:"Al-Ma'idah",t:"The Table Spread",v:120,p:"Medinan",s:"Lawful and unlawful food, the completion of the religion, the story of the two sons of Adam, and Isa's table from heaven.",k:"Which foods are good to eat, and a reminder to keep promises and cooperate in good.",l:"Cooperate in good, never in wrong."},{n:6,a:"Al-An'am",t:"The Cattle",v:165,p:"Meccan",s:"Ibrahim's search for the true God through stars, moon and sun; the oneness of the Creator; the ten commandments of the Quran at its end.",k:"Ibrahim looks at the stars and the moon and realises that only the One who made them deserves worship.",l:"Look at creation until it points you to the Creator."},{n:12,a:"Yusuf",t:"Joseph",v:111,p:"Meccan",s:"The best of stories, told in one surah: jealousy, the well, slavery, prison, dreams, power, and forgiveness of the brothers.",k:"Yusuf's brothers threw him in a well, but he stayed good, became a leader, and forgave them all.",l:"Patience and forgiveness turn a betrayal into a reunion."},{n:14,a:"Ibrahim",t:"Abraham",v:52,p:"Meccan",s:"Gratitude as the key to increase, the parable of the good word as a good tree, and Ibrahim's prayer for Makkah and his descendants.",k:"A good word is like a strong tree with deep roots and fruit all the time.",l:"If you are grateful, you are given more."},{n:18,a:"Al-Kahf",t:"The Cave",v:110,p:"Meccan",s:"Four stories: the youths of the cave, the two gardens, Musa and Khidr, and Dhul-Qarnayn. Trials of faith, wealth, knowledge and power. Recited on Fridays.",k:"Four stories about young believers hiding in a cave, a proud rich man, Musa learning from a teacher, and a just king.",l:"Every trial has a type: faith, wealth, knowledge, power."},{n:19,a:"Maryam",t:"Mary",v:98,p:"Meccan",s:"Zakariyya's prayer for a son, the birth of Isa under the palm tree, and a chain of prophets honoured for their truthfulness.",k:"Maryam was alone under a date tree when baby Isa was born, and Allah told her to shake the tree and eat the dates.",l:"Allah's help often comes with an action you must take."},{n:20,a:"Ta-Ha",t:"Ta-Ha",v:135,p:"Meccan",s:"Musa at the burning bush, his prayer 'expand my chest', the confrontation with Pharaoh and the magicians, and Adam's slip and repentance.",k:"Musa was nervous to speak to the king, so he prayed: My Lord, make my heart big and my words easy.",l:"Rabbi ishrah li sadri: ask for ease before a hard conversation."},{n:24,a:"An-Nur",t:"The Light",v:64,p:"Medinan",s:"Modesty, the household, permission before entering, and the verse of Light: Allah is the Light of the heavens and the earth.",k:"Rules for a polite, safe home, and a beautiful picture of Allah's light like a lamp in a glass.",l:"Manners at home are part of faith."},{n:31,a:"Luqman",t:"Luqman",v:34,p:"Meccan",s:"The wise man Luqman advising his son: tawhid, gratitude to parents, prayer, patience, humility, and a soft voice.",k:"A wise father's advice to his son about praying, being kind, and not showing off.",l:"The best inheritance is advice given with love."},{n:36,a:"Ya-Sin",t:"Ya-Sin",v:83,p:"Meccan",s:"The town that rejected the messengers and the man who ran to defend them, signs in the earth and sky, and the certainty of resurrection.",k:"A brave man ran from the edge of town to tell people to listen to the messengers.",l:"When truth needs a voice, be the one who runs."},{n:55,a:"Ar-Rahman",t:"The Most Merciful",v:78,p:"Medinan",s:"A catalogue of mercy: the Quran, speech, sun and moon, fruit and grain, seas and ships; and the question repeated thirty-one times.",k:"A list of Allah's gifts, and over and over the question: which gift will you say is not a gift?",l:"Gratitude is a practice of noticing."},{n:56,a:"Al-Waqi'ah",t:"The Inevitable",v:96,p:"Meccan",s:"The three groups on the Day of Judgement, and the questions: did you make the seed grow, the water fall, the fire burn?",k:"Who makes the seeds grow and the rain fall? Not us. So we say thank you.",l:"Every meal is a miracle you did not make."},{n:67,a:"Al-Mulk",t:"The Kingdom",v:30,p:"Meccan",s:"Allah's sovereignty, the flawless sky, life and death as a test of the best deed, and the birds held up by the Merciful. Recited before sleep.",k:"Look at the sky: can you find a crack in it? Allah made it perfect. Good to read before bed.",l:"Best in deed, not most."},{n:87,a:"Al-A'la",t:"The Most High",v:19,p:"Meccan",s:"Glorify the name of your Lord who created and proportioned, who guided; purification and prayer bring success; the Hereafter is better and more lasting.",k:"Allah made everything just right, and He will help you remember the Quran.",l:"The one who purifies himself has succeeded."},{n:89,a:"Al-Fajr",t:"The Dawn",v:30,p:"Meccan",s:"The fall of 'Ad, Thamud and Pharaoh; the human who thinks wealth is honour; and the serene soul invited to return to its Lord.",k:"Big proud kingdoms fell, but the calm, peaceful soul is invited into Paradise.",l:"Ya ayyatuha an-nafs al-mutma'inna: aim for the serene soul."},{n:91,a:"Ash-Shams",t:"The Sun",v:15,p:"Meccan",s:"Eleven oaths by sun, moon, day, night, sky, earth and soul; success for the one who purifies the soul; the she-camel of Thamud.",k:"Allah promises by the sun and moon: the person who cleans their heart wins.",l:"Purify the self; that is the whole project."},{n:93,a:"Ad-Duha",t:"The Morning Brightness",v:11,p:"Meccan",s:"Comfort to the Prophet when revelation paused: your Lord has not left you; He sheltered the orphan, guided the lost, enriched the poor; so do not scold the orphan or the asker, and speak of blessings.",k:"Allah told the Prophet: I have not forgotten you. Remember how I looked after you when you were small.",l:"Speak of your blessings, and do not turn away the one who asks."},{n:94,a:"Al-Inshirah",t:"The Relief",v:8,p:"Meccan",s:"Did We not expand your chest and lift your burden? With hardship comes ease, twice. When you finish, keep striving, and turn to your Lord.",k:"Allah made the Prophet's heart light. Hard things always come with easy things.",l:"When one task ends, begin the next; rest is in turning to Him."},{n:96,a:"Al-'Alaq",t:"The Clinging Clot",v:19,p:"Meccan",s:"The first revelation: Read. Allah taught by the pen. Then a warning to the one who stops a servant from praying.",k:"The first word Allah sent was 'Read'. Learning is the beginning of everything.",l:"Read, and prostrate, and draw near."},{n:97,a:"Al-Qadr",t:"The Night of Decree",v:5,p:"Meccan",s:"The Quran was sent down in the Night of Decree, better than a thousand months; angels descend; peace until dawn.",k:"One special night in Ramadan is worth more than a thousand months. Angels come down and it is all peace.",l:"Seek the last ten nights of Ramadan."},{n:99,a:"Az-Zalzalah",t:"The Earthquake",v:8,p:"Medinan",s:"The earth shakes and tells its news; whoever does an atom's weight of good will see it, and an atom's weight of evil will see it.",k:"Even a tiny, tiny good deed is seen and counted. Even a tiny bad one too.",l:"Nothing small is small."},{n:103,a:"Al-'Asr",t:"Time",v:3,p:"Meccan",s:"By time, humanity is in loss, except those who believe, do good, and counsel one another to truth and patience.",k:"Time is running. Only four things save you: believing, doing good, helping others be truthful, and helping them be patient.",l:"Salvation is a team sport."},{n:105,a:"Al-Fil",t:"The Elephant",v:5,p:"Meccan",s:"Abraha's army with elephants came to destroy the Ka'bah in the year of the Prophet's birth; birds with stones turned them to eaten straw.",k:"A huge army with elephants came to knock down the Ka'bah, and Allah sent little birds that stopped them.",l:"Size is not strength."},{n:107,a:"Al-Ma'un",t:"Small Kindnesses",v:7,p:"Meccan",s:"Who denies the religion? The one who pushes away the orphan and does not encourage feeding the poor; who prays for show and withholds small kindnesses.",k:"Real faith shows in small kindnesses: sharing, being nice to orphans, lending things.",l:"Religion is measured in small kindnesses."},{n:108,a:"Al-Kawthar",t:"Abundance",v:3,p:"Meccan",s:"The shortest surah: We have given you abundance, so pray and sacrifice; your enemy is the one cut off.",k:"Allah gave the Prophet so much good, so we pray and give thanks.",l:"Answer abundance with worship and generosity."},{n:109,a:"Al-Kafirun",t:"The Disbelievers",v:6,p:"Meccan",s:"A clear statement of religious identity without compulsion: you have your religion and I have mine.",k:"We are polite to people who believe differently, and we keep our own faith clearly.",l:"Clarity without hostility."},{n:110,a:"An-Nasr",t:"The Help",v:3,p:"Medinan",s:"When help and victory come and people enter the religion in crowds, glorify your Lord and seek His forgiveness. Among the last revelations.",k:"When you win, say thank you to Allah and ask forgiveness, instead of boasting.",l:"Success is met with humility, not pride."},{n:112,a:"Al-Ikhlas",t:"Sincerity",v:4,p:"Meccan",s:"Say: He is Allah, One; Allah the Eternal Refuge; He neither begets nor is born; and there is none like Him. Equal to a third of the Quran.",k:"Allah is One. He does not need anyone. Nobody is like Him. Four lines that say everything.",l:"Tawhid is the centre of everything."},{n:113,a:"Al-Falaq",t:"The Daybreak",v:5,p:"Meccan",s:"Seek refuge in the Lord of daybreak from the evil of creation, of darkness, of those who blow on knots, and of the envier.",k:"A little prayer to keep you safe from bad things, like a shield. Say it before sleep.",l:"Protection is asked for, not assumed."},{n:114,a:"An-Nas",t:"Mankind",v:6,p:"Meccan",s:"Seek refuge in the Lord, King and God of mankind from the whisperer who retreats. The Quran closes with protection of the heart.",k:"Ask Allah to keep bad whispers out of your heart. The last page of the Quran.",l:"Guard the heart; the whisper retreats when Allah is remembered."}];var $=[{t:"Adam and the first mistake",r:"2:30\u201337; 7:19\u201323",s:"Allah taught Adam the names of all things and had the angels bow to him. Iblis refused out of pride. Adam and his wife ate from the forbidden tree, admitted it at once, and were taught the words of repentance. Pride was the sin that was not forgiven; a mistake owned was.",k:"Adam made a mistake, said sorry straight away, and Allah forgave him. Iblis was proud and would not say sorry. Saying sorry is the brave thing.",m:"A mistake admitted is forgiven. Pride is the real fall.",f:"Tonight, each person says one thing they got wrong this week and what they learned."},{t:"Nuh and the long patience",r:"71:1\u201328; 11:36\u201348",s:"Nuh called his people for nine hundred and fifty years, by day and by night, openly and privately. Few believed. He built the ark on dry land while people mocked him, and the flood came as promised. Even his own son refused and was lost.",k:"Nuh told people about Allah for a very, very long time and most of them laughed. He kept going and built a big boat anyway.",m:"Do the right thing for as long as it takes, even when nobody listens.",f:"Ask: what is something good that takes a long time? Learning to read, growing a plant, getting strong."},{t:"Ibrahim and the idols",r:"21:51\u201370; 6:74\u201379",s:"Young Ibrahim reasoned his way past the stars, moon and sun to the One who set them. He broke the idols and left the axe on the largest, so the people would ask it. Thrown into the fire, he was told: O fire, be cool and safe for Ibrahim.",k:"Ibrahim asked: can a statue hear me? No. So he worshipped only Allah. When bad people threw him in a fire, Allah made it cool like a garden.",m:"Think for yourself, then stand firm. Allah protects the sincere.",f:"Ask the children: what can Allah do that nothing else can?"},{t:"Ibrahim, Isma'il and the sacrifice",r:"37:99\u2013111",s:"Ibrahim told his son of the dream. Isma'il answered: do what you are commanded; you will find me patient. When both submitted, the ransom came, and the trial became the feast of Eid al-Adha.",k:"Ibrahim and his son both said 'yes' to Allah even when it was very hard, and Allah gave them a sheep instead. That is why we have Eid.",m:"Obedience freely chosen by both father and son is the model of family trust.",f:"Talk about one thing your family does only because Allah asked."},{t:"Yusuf in the well and the palace",r:"Surah 12",s:"Sold by his brothers, falsely accused, imprisoned for years, Yusuf interpreted the king's dream, managed Egypt's grain through famine, and when his brothers stood before him he said: no blame on you today. His father's sight returned with his shirt.",k:"Yusuf's brothers were jealous and threw him in a well. He never stopped being good, and when he became a big leader he forgave them all.",m:"Goodness practised in the dark becomes leadership in the light. Forgiveness completes the story.",f:"Each person forgives one small thing out loud at dinner."},{t:"Musa and the burning bush",r:"20:9\u201336",s:"Musa saw a fire on the mountain and heard his Lord. Commanded to face Pharaoh, he prayed: expand my chest, ease my task, untie the knot in my tongue, and give me a helper from my family, Harun.",k:"Musa was scared to talk to the mean king, so he asked Allah to make his heart brave and his words clear, and to let his brother help him.",m:"Ask for ease, ask for help, bring family. Then go.",f:"Before a hard thing this week, say Musa's prayer together: Rabbi ishrah li sadri."},{t:"Musa and al-Khidr",r:"18:60\u201382",s:"Musa asked to follow a servant given knowledge from Allah, promising patience. The boat was holed, the boy killed, the wall repaired, and Musa objected each time. The explanations showed mercy hidden inside each act.",k:"Musa followed a wise teacher who did strange things. Each one turned out to be kind in a way Musa could not see yet.",m:"What looks wrong from the middle may be mercy from the end. Patience with what you do not understand.",f:"Share one time something bad turned out to be good."},{t:"Dawud and Jalut",r:"2:246\u2013251",s:"The small army of Talut was tested at the river; most drank and were sent back. The few who remained said: how often a small group has overcome a large one by Allah's leave. Young Dawud killed Jalut with a sling.",k:"A small boy named Dawud beat a giant soldier with a little stone, because he trusted Allah and was brave.",m:"Discipline at the river mattered more than numbers at the battle.",f:"Ask: when did being patient with food or water make you stronger? Link it to fasting."},{t:"Sulayman and the ant",r:"27:15\u201319",s:"Sulayman's army approached a valley of ants. One ant warned the others to enter their homes. Sulayman understood her, smiled, and prayed: My Lord, enable me to be grateful for Your favour and to do good that pleases You.",k:"A tiny ant told her friends to hide from the big army. King Sulayman heard her, smiled, and thanked Allah for his gifts.",m:"Power that smiles at an ant and turns to gratitude is power rightly held.",f:"Go outside and watch ants for five minutes. Who is working for whom?"},{t:"Yunus in the whale",r:"21:87\u201388; 37:139\u2013148",s:"Yunus left his people in anger before permission came. Swallowed by the whale, in the darkness he called: there is no god but You, glory be to You, I was among the wrongdoers. He was answered and returned to a people who believed.",k:"Yunus got swallowed by a huge fish. In the dark he said sorry to Allah with special words, and Allah saved him.",m:"From the deepest darkness, one honest dua reaches Allah.",f:"Learn the dua of Yunus together: La ilaha illa anta, subhanaka, inni kuntu min az-zalimin."},{t:"Maryam under the palm tree",r:"19:16\u201334",s:"Alone and in pain, Maryam was told: shake the trunk of the palm and fresh dates will fall; eat, drink and be comforted. The infant Isa spoke to defend her honour.",k:"Maryam was alone and tired when baby Isa was born. Allah told her to shake the date tree, and sweet dates fell for her to eat.",m:"Help comes with a task. Shake the tree.",f:"Eat a date together and tell the children this is Maryam's food."},{t:"The youths of the cave",r:"18:9\u201326",s:"Young believers fled a tyrant and slept in a cave for three hundred and nine years. When one went to buy food with an old coin, the town learned of them. Their story is read every Friday.",k:"Some young people hid in a cave to keep believing in Allah and fell asleep for hundreds of years. When they woke up, their money was old.",m:"Stand with your friends in faith; Allah guards those who guard Him.",f:"Read Surah al-Kahf's opening on Friday and ask: who are your friends in good?"},{t:"The man with two gardens",r:"18:32\u201344",s:"A man with two rich gardens boasted that they would never perish and doubted the Hour. His companion reminded him to say: ma sha Allah, la quwwata illa billah. The gardens were destroyed overnight and he wrung his hands.",k:"A rich man showed off his gardens and forgot to thank Allah. The gardens were gone the next morning.",m:"Say ma sha Allah over what you have; ownership is on loan.",f:"Walk through your home and say ma sha Allah over three things."},{t:"Luqman's advice to his son",r:"31:12\u201319",s:"Luqman was given wisdom, and his first act was gratitude. He told his son: do not associate anything with Allah; be good to parents; nothing is hidden from Allah; pray, enjoin good, be patient; do not be arrogant; walk and speak moderately.",k:"A wise man gave his son the best advice: thank Allah, be kind to your parents, pray, do not show off, and talk gently.",m:"Wisdom begins with gratitude and ends in a quiet voice.",f:"Parents: tell the children one piece of advice your own parents gave you."},{t:"Qarun and his treasure",r:"28:76\u201382",s:"Qarun's keys needed a band of strong men to carry. He said: I was given this because of my knowledge. The earth swallowed him and his house, and those who had envied him the day before said: had Allah not been gracious to us.",k:"Qarun had so much treasure that the keys were heavy, and he said 'I did it all myself'. Then it was all gone.",m:"Wealth attributed to yourself alone is already lost.",f:"Ask: what do we have that we did nothing to earn? Start with eyes, breath, family."},{t:"The people of the elephant",r:"Surah 105",s:"Abraha marched on Makkah with elephants to destroy the Ka'bah, in the year the Prophet was born. Flocks of birds with stones of baked clay left the army like eaten straw.",k:"A big army with elephants came to break the Ka'bah. Allah sent tiny birds, and the big army lost.",m:"The House is protected by its Lord, not by its guards.",f:"Count the shortest surahs you know; learn al-Fil by heart this week."}];var Z=[{w:"The Prophet Muhammad \uFDFA",q:"The best of you are those who are best to their families, and I am the best of you to my family.",src:"Jami' al-Tirmidhi 3895",v:"graded sahih",k:"The Prophet said the best people are the ones who are kindest at home.",a:"Character is measured where it costs the most: with the people who see you every day."},{w:"The Prophet Muhammad \uFDFA",q:"Seeking knowledge is an obligation upon every Muslim.",src:"Sunan Ibn Majah 224; also al-Kafi, Kitab Fadl al-'Ilm",v:"graded (hasan, al-Albani)",k:"Learning is not a choice; it is part of being Muslim, for everyone.",a:"Reported in both Sunni and Shi'a collections. Learning is a duty, not a hobby."},{w:"The Prophet Muhammad \uFDFA",q:"The strong believer is better and more beloved to Allah than the weak believer, though there is good in both. Strive for what benefits you, seek help from Allah, and do not give up.",src:"Sahih Muslim 2664",v:"graded sahih",k:"Allah loves a believer who looks after their body and keeps trying.",a:"The hadith behind the training plan. Strength is praised, and giving up is named as the thing to avoid."},{w:"The Prophet Muhammad \uFDFA",q:"None of you truly believes until he loves for his brother what he loves for himself.",src:"Sahih al-Bukhari 13; Sahih Muslim 45",v:"graded sahih",k:"Want for your friend the same good things you want for yourself.",a:"A single sentence that settles most ethical questions: would I want this for myself?"},{w:"The Prophet Muhammad \uFDFA",q:"Your smile for your brother is charity.",src:"Jami' al-Tirmidhi 1956",v:"graded (hasan)",k:"A smile is a gift you can give anyone, and Allah counts it as charity.",a:"The lowest-cost sadaqah, and the one most often skipped at home."},{w:"Imam 'Ali ibn Abi Talib (A.S.)",q:"People are of two kinds: either your brother in faith or your equal in creation.",src:"Nahj al-Balagha, Letter 53, to Malik al-Ashtar",v:"received",k:"Every person is either your brother in religion or your equal as a human being. So be kind to all.",a:"Written as instructions to a governor. Mercy toward citizens is set as policy, not sentiment."},{w:"Imam 'Ali ibn Abi Talib (A.S.)",q:"Knowledge is better than wealth: knowledge guards you, while you must guard wealth. Wealth decreases with spending; knowledge grows when it is spent.",src:"Nahj al-Balagha, Saying 147, to Kumayl ibn Ziyad",v:"received",k:"Money gets smaller when you share it, but knowledge gets bigger when you share it.",a:"Spoken to Kumayl, the same companion to whom the Imam taught Dua Kumayl."},{w:"Imam 'Ali ibn Abi Talib (A.S.)",q:"The worth of a person is what he does well.",src:"Nahj al-Balagha, Saying 81",v:"received",k:"You are worth what you can do well. So practise something until you are good at it.",a:"Qimatu kulli imri'in ma yuhsinuh. Mastery, not status, sets a person's value."},{w:"Imam 'Ali ibn Abi Talib (A.S.)",q:"The tongue of the wise is behind his heart, and the heart of the fool is behind his tongue.",src:"Nahj al-Balagha, Saying 40",v:"received",k:"Wise people think first and then talk. Silly people talk first and think later.",a:"Speech ordered by the heart, not the heart dragged by speech."},{w:"Imam 'Ali ibn Abi Talib (A.S.)",q:"Mix with people in such a way that if you die they weep for you, and if you live they long for you.",src:"Nahj al-Balagha, Saying 10",v:"received",k:"Be the kind of person people miss when you are not there.",a:"A test of character you can apply to any relationship tonight."},{w:"Imam 'Ali ibn Abi Talib (A.S.)",q:"Do not be the slave of another, for Allah has made you free.",src:"Nahj al-Balagha, Letter 31, to Imam al-Hasan",v:"received",k:"Allah made you free. Do not let anything or anyone own you, not even a habit.",a:"From a father's letter to his son. Freedom here includes freedom from appetite."},{w:"Fatima al-Zahra (A.S.)",q:"Allah made faith a purification for you from polytheism, prayer a means of humility, zakat a growth of wealth, and fasting a confirmation of sincerity.",src:"The sermon of Fadak, as recorded in al-Ihtijaj of al-Tabrisi and Bihar al-Anwar",v:"received",k:"Fatima explained why we do things: prayer makes us humble, giving makes wealth grow, fasting makes us sincere.",a:"Each act of worship is given a purpose. Fasting's purpose is ikhlas, sincerity."},{w:"Imam al-Hasan ibn 'Ali (A.S.)",q:"Teach people your knowledge, and learn the knowledge of others.",src:"Bihar al-Anwar, as received",v:"received",k:"Share what you know and learn from everyone.",a:"Two directions in one sentence. The teacher who stops learning stops teaching well."},{w:"Imam al-Husayn ibn 'Ali (A.S.)",q:"What did he find who lost You, and what did he lose who found You?",src:"Dua 'Arafa, closing section, in Iqbal al-A'mal of Ibn Tawus",v:"received; al-Majlisi doubted that this section belongs to the dua, and Mafatih al-Jinan reports the question",k:"If you have Allah, you have everything. If you lose Allah, nothing else can fill the gap.",a:"The Bayan dua catalogue flags this passage as questioned by al-Majlisi. It is recited widely; its attribution is reported, not settled."},{w:"Imam 'Ali ibn al-Husayn, al-Sajjad (A.S.)",q:"The right of your stomach is that you do not make it a container for what is unlawful, little or much, and that you keep it in moderation with what is lawful.",src:"Risalat al-Huquq (Treatise of Rights), the right of the stomach; in Tuhaf al-'Uqul and al-Khisal",v:"received",k:"Your tummy has a right too: only good food, and not too much of it.",a:"OnePlate's whole plate in one sentence from the fourth Imam: lawful, and moderate."},{w:"Imam 'Ali ibn al-Husayn, al-Sajjad (A.S.)",q:"O Allah, bless Muhammad and his Household, and do not raise me a single degree among people without lowering me the same in my own soul.",src:"Al-Sahifa al-Sajjadiyya, Supplication 20 (Makarim al-Akhlaq), paraphrased",v:"received",k:"A prayer that says: if people think I am great, let me stay humble inside.",a:"The Sahifa's prayer for noble character. Rank outside, humility inside."},{w:"Imam Muhammad al-Baqir (A.S.)",q:"Nothing is dearer to Allah than being asked; so ask Him.",src:"Al-Kafi, Kitab al-Du'a, as received",v:"received",k:"Allah loves it when you ask Him for things. So ask, for big things and small.",a:"Dua is framed as beloved in itself, independent of the answer."},{w:"Imam Ja'far al-Sadiq (A.S.)",q:"Gratitude for a blessing is to avoid what is forbidden.",src:"Al-Kafi, Kitab al-Iman wa al-Kufr, chapter on gratitude",v:"received",k:"Saying thank you to Allah means using His gifts for good, not for bad.",a:"Shukr is behaviour, not a sentence. A healthy body thanked with good use of it."},{w:"Imam Ja'far al-Sadiq (A.S.)",q:"Be an adornment for us, and not a disgrace to us.",src:"Al-Kafi, as received",v:"received",k:"The Imam said: make people see Islam beautifully through how you behave.",a:"The believer's conduct is the tradition's public face."},{w:"Imam Musa al-Kazim (A.S.)",q:"Allah has two proofs over people: an outward proof, the messengers and Imams, and an inward proof, the intellect.",src:"Al-Kafi, Kitab al-'Aql wa al-Jahl, as received",v:"received",k:"Allah gave us two guides: the prophets outside and our thinking mind inside.",a:"Reason is called a hujjah, a proof, in the first chapter of al-Kafi."},{w:"Imam 'Ali al-Rida (A.S.)",q:"A believer is not a believer until he has three qualities: a practice from his Lord, keeping secrets; from his Prophet, kindness to people; and from his Imam, patience in hardship.",src:"'Uyun Akhbar al-Rida; al-Kafi, as received",v:"received",k:"Three things make a believer: keep secrets, be kind to people, and be patient when things are hard.",a:"Three sources, three habits. Patience is placed as the inheritance of the Imams."},{w:"The Prophet Muhammad \uFDFA and his Household",q:"The Prophet gathered 'Ali, Fatima, al-Hasan and al-Husayn under his cloak, and the verse of purification (33:33) is connected with the event.",src:"The event: Sahih Muslim, merits of the Companions; Jami' al-Tirmidhi, tafsir of al-Ahzab. The long recited form (Hadith al-Kisa): 'Awalim al-'Ulum; appendix of later printings of Mafatih al-Jinan",v:"event graded in its collections; long recited form received and contested",k:"The Prophet covered his family with his cloak and prayed for them. Families who love each other are a blessing.",a:"The Bayan study keeps two things apart: the event, reported in Sunni and Shi'a collections, and the long recited text, whose chain is debated."}];var X=[{t:"Hikmah",ar:"\u062D\u0650\u0643\u0652\u0645\u064E\u0629",rt:"h-k-m",m:"Wisdom: knowing the right thing and doing it at the right time, in the right measure.",k:"Hikmah is being wise: knowing what is good and doing it the smart way.",u:"Allah gave Luqman hikmah (31:12), and his first act was gratitude."},{t:"Adab",ar:"\u0623\u064E\u062F\u064E\u0628",rt:"'-d-b",m:"Good manners, refinement, putting things in their proper place; also literature.",k:"Adab is good manners: saying Bismillah, eating with the right hand, speaking kindly.",u:"The Bayan Library takes adab as one of its first words."},{t:"Sabr",ar:"\u0635\u064E\u0628\u0652\u0631",rt:"s-b-r",m:"Patience, steadfastness, holding firm; the root means to bind or restrain.",k:"Sabr is staying calm and strong when something is hard or slow.",u:"Seek help through sabr and prayer (2:153)."},{t:"Shukr",ar:"\u0634\u064F\u0643\u0652\u0631",rt:"sh-k-r",m:"Gratitude that shows itself in use: thanking with the tongue, the heart and the limbs.",k:"Shukr is saying thank you and then using the gift well.",u:"If you are grateful, I will give you more (14:7)."},{t:"Taqwa",ar:"\u062A\u064E\u0642\u0652\u0648\u064E\u0649",rt:"w-q-y",m:"God-consciousness; a protective awareness that guards you from harm, like walking carefully on a thorny path.",k:"Taqwa is remembering Allah is watching, so you choose the good thing even when no one else sees.",u:"Fasting is prescribed so that you may attain taqwa (2:183)."},{t:"Ihsan",ar:"\u0625\u0650\u062D\u0652\u0633\u064E\u0627\u0646",rt:"h-s-n",m:"Excellence; doing a thing beautifully; worshipping Allah as if you see Him.",k:"Ihsan is doing something extra well and beautifully, not just enough.",u:"Allah commands justice and ihsan (16:90)."},{t:"Tawakkul",ar:"\u062A\u064E\u0648\u064E\u0643\u064F\u0651\u0644",rt:"w-k-l",m:"Trust in Allah after doing your part; tying the camel and then relying on Him.",k:"Tawakkul is doing your best and then trusting Allah with the rest.",u:"Whoever relies on Allah, He is enough for him (65:3)."},{t:"Niyyah",ar:"\u0646\u0650\u064A\u064E\u0651\u0629",rt:"n-w-y",m:"Intention; the inner aim that gives an action its value.",k:"Niyyah is the reason in your heart for doing something.",u:"Set a niyyah before tonight's meal: to be strong for your family."},{t:"Barakah",ar:"\u0628\u064E\u0631\u064E\u0643\u064E\u0629",rt:"b-r-k",m:"Blessing; an increase and lasting goodness that is more than the sum of its parts.",k:"Barakah is when a little becomes enough, like food that feeds more people than you thought.",u:"Suhoor has barakah in it (Bukhari 1923)."},{t:"Rahmah",ar:"\u0631\u064E\u062D\u0652\u0645\u064E\u0629",rt:"r-h-m",m:"Mercy; from the same root as rahim, the womb: a tender, enveloping care.",k:"Rahmah is mercy, the soft love a mother has for her baby, which Allah has for everyone.",u:"Do not despair of the rahmah of Allah (39:53)."},{t:"'Adl",ar:"\u0639\u064E\u062F\u0652\u0644",rt:"'-d-l",m:"Justice; balance; giving each its due.",k:"'Adl is being fair: everyone gets what is right for them.",u:"Allah commands 'adl (16:90). Stand for it even against yourselves (4:135)."},{t:"Haya'",ar:"\u062D\u064E\u064A\u064E\u0627\u0621",rt:"h-y-y",m:"Modesty, a sense of shame that protects dignity; a branch of faith.",k:"Haya' is the feeling that stops you doing something embarrassing or wrong.",u:"Every religion has a character, and the character of Islam is haya' (Ibn Majah 4181)."},{t:"Ikhlas",ar:"\u0625\u0650\u062E\u0652\u0644\u064E\u0627\u0635",rt:"kh-l-s",m:"Sincerity; purity of motive; doing a thing for Allah alone.",k:"Ikhlas is doing good because it is good, not to show off.",u:"Surah al-Ikhlas is named for it."},{t:"Tawbah",ar:"\u062A\u064E\u0648\u0652\u0628\u064E\u0629",rt:"t-w-b",m:"Repentance; literally turning back.",k:"Tawbah is turning around when you went the wrong way and coming back to Allah.",u:"Adam was taught the words of tawbah and forgiven (2:37)."},{t:"Dhikr",ar:"\u0630\u0650\u0643\u0652\u0631",rt:"dh-k-r",m:"Remembrance of Allah, by tongue and by heart.",k:"Dhikr is saying Allah's name and remembering Him.",u:"In the dhikr of Allah do hearts find rest (13:28)."},{t:"'Ilm",ar:"\u0639\u0650\u0644\u0652\u0645",rt:"'-l-m",m:"Knowledge; the Quran's second most frequent concept after Allah Himself.",k:"'Ilm is knowledge, the thing the Prophet asked Allah to give him more of.",u:"Rabbi zidni 'ilma (20:114)."},{t:"Amanah",ar:"\u0623\u064E\u0645\u064E\u0627\u0646\u064E\u0629",rt:"'-m-n",m:"Trust; something placed in your care; the same root as iman.",k:"Amanah is something you are trusted with, like your body or a promise.",u:"Your body is an amanah. OnePlate is one way of returning it well."},{t:"Sidq",ar:"\u0635\u0650\u062F\u0652\u0642",rt:"s-d-q",m:"Truthfulness, in word and in deed; the same root as sadaqah.",k:"Sidq is telling the truth even when a lie would be easier.",u:"Be with the truthful (9:119)."},{t:"Husn al-zann",ar:"\u062D\u064F\u0633\u0652\u0646 \u0627\u0644\u0638\u064E\u0651\u0646\u0651",rt:"z-n-n",m:"Thinking well of others; assuming the good explanation first.",k:"Husn al-zann is guessing the kind reason why someone did something.",u:"Avoid much suspicion; some suspicion is sin (49:12)."},{t:"Qana'ah",ar:"\u0642\u064E\u0646\u064E\u0627\u0639\u064E\u0629",rt:"q-n-'",m:"Contentment; being satisfied with what is sufficient.",k:"Qana'ah is feeling happy with enough.",u:"The Prophet called contentment a treasure that never runs out."},{t:"Rizq",ar:"\u0631\u0650\u0632\u0652\u0642",rt:"r-z-q",m:"Provision; everything that sustains you, from food to a friend.",k:"Rizq is everything Allah gives you to live: food, family, air.",u:"Every meal is rizq already written; your job is the effort and the thanks."},{t:"Fitrah",ar:"\u0641\u0650\u0637\u0652\u0631\u064E\u0629",rt:"f-t-r",m:"The original nature on which humans are created, inclined to truth and to God.",k:"Fitrah is the clean, good nature every baby is born with.",u:"Every child is born upon the fitrah (Bukhari 1385)."},{t:"Tadabbur",ar:"\u062A\u064E\u062F\u064E\u0628\u064F\u0651\u0631",rt:"d-b-r",m:"Deep reflection; looking at the back of a thing, its consequences.",k:"Tadabbur is thinking slowly about what a verse really means for you.",u:"Do they not reflect (yatadabbarun) on the Quran? (47:24)."},{t:"Istiqamah",ar:"\u0627\u0650\u0633\u0652\u062A\u0650\u0642\u064E\u0627\u0645\u064E\u0629",rt:"q-w-m",m:"Steadfastness; staying straight on the path, consistently.",k:"Istiqamah is keeping going the same good way every day, not just once.",u:"Say: I believe in Allah, then be steadfast (Muslim 38)."},{t:"Rida",ar:"\u0631\u0650\u0636\u064E\u0627",rt:"r-d-y",m:"Contentment with Allah's decree; acceptance without bitterness.",k:"Rida is being okay with what Allah chose, even when it is not what you wanted.",u:"Allah is pleased with them and they with Him (98:8)."},{t:"Silat ar-rahim",ar:"\u0635\u0650\u0644\u064E\u0629 \u0627\u0644\u0631\u064E\u0651\u062D\u0650\u0645",rt:"w-s-l / r-h-m",m:"Keeping the ties of kinship; visiting, calling, helping relatives.",k:"Silat ar-rahim is staying close to your family, like calling your grandparents.",u:"Whoever wishes for more provision and a longer life, let him keep kinship ties (Bukhari 5986)."},{t:"'Afw",ar:"\u0639\u064E\u0641\u0652\u0648",rt:"'-f-w",m:"Pardon; wiping away; also the surplus you give.",k:"'Afw is forgiving someone and wiping the slate clean.",u:"Those who restrain anger and pardon people (3:134)."},{t:"Hilm",ar:"\u062D\u0650\u0644\u0652\u0645",rt:"h-l-m",m:"Forbearance; calm self-control when provoked.",k:"Hilm is staying calm and kind when someone makes you angry.",u:"The Prophet was praised for hilm; it is strength that chooses gentleness."},{t:"Yaqin",ar:"\u064A\u064E\u0642\u0650\u064A\u0646",rt:"y-q-n",m:"Certainty; knowledge settled beyond doubt.",k:"Yaqin is being completely sure, like being sure the sun will rise.",u:"Worship your Lord until certainty comes to you (15:99)."},{t:"Thuluth",ar:"\u062B\u064F\u0644\u064F\u062B",rt:"th-l-th",m:"One third. The rule of thirds for food, drink and breath.",k:"Thuluth means one third: a third food, a third water, a third empty for breathing.",u:"Tirmidhi 2380. The name of the app's parent project."}];var ee=[{t:"Consistency beats intensity",w:"The Prophet \uFDFA; Bayan daily practice",i:"The most beloved deeds to Allah are the most consistent, even if small (Bukhari 6464). A plan you repeat beats a plan you admire.",k:"Doing a little every day is better than doing a lot once and stopping.",d:"Keep today's habits small enough to repeat tomorrow."},{t:"The golden mean",w:"Aristotle, Nicomachean Ethics; echoed by Ibn Miskawayh and al-Ghazali",i:"Virtue lies between two vices: courage between cowardice and recklessness, generosity between stinginess and waste. Moderation is not weakness but calibration.",k:"The best way is usually in the middle: not too scared, not too wild; not too stingy, not too wasteful.",d:"Find the middle in one thing today: food, spending, or screen time."},{t:"Attention shapes reality",w:"Bayan daily practice; William James",i:"What you attend to grows. A day spent attending to complaints becomes a complaining life; a day attending to blessings becomes a grateful one.",k:"What you look at a lot becomes big in your mind. Look at good things.",d:"Choose what you will pay attention to for the next hour, on purpose."},{t:"Knowledge without action is wasted",w:"Imam 'Ali, Nahj al-Balagha (received); Bayan daily practice",i:"Knowledge calls out to action; if it is answered, it stays, otherwise it departs. Learning is completed by doing.",k:"Knowing something is only half. Doing it is the other half.",d:"Take one thing you learned this week and do it today."},{t:"The dichotomy of control",w:"Epictetus, Enchiridion; parallels in tawakkul",i:"Some things are up to us (our judgements, efforts, choices) and some are not (outcomes, other people, the weather). Peace comes from working on the first and accepting the second.",k:"Some things you can control, like trying hard. Some things you cannot, like the weather. Worry only about the first kind.",d:"Write two columns: what I control today, what I do not. Act on the first."},{t:"'Asabiyyah: the strength of the group",w:"Ibn Khaldun, Muqaddimah (1377)",i:"Ibn Khaldun argued that civilisations rise on group solidarity and fall when luxury dissolves it. A family is the smallest civilisation; its 'asabiyyah is built at the dinner table.",k:"Groups that stick together are strong. A family that eats together and helps each other is strong.",d:"Do one thing tonight that only works if the whole family joins."},{t:"Habit is second nature",w:"Al-Ghazali, Ihya 'Ulum al-Din; Aristotle",i:"Character is not chosen in a moment; it is the sediment of repeated acts. Al-Ghazali's cure for a bad trait is to practise its opposite until it becomes natural.",k:"If you do something many times, it becomes part of you. So practise good things.",d:"Pick one trait you want and do its smallest action three times today."},{t:"Bani Adam: one body",w:"Saadi Shirazi, Gulistan (1258)",i:"Human beings are members of one body, created from one essence. When one member suffers, the others cannot stay at rest. Inscribed at the United Nations.",k:"All people are like parts of one body. If someone hurts, we should feel it too.",d:"Give to one person outside your family today."},{t:"Khudi: the self made strong",w:"Muhammad Iqbal, Asrar-i-Khudi (1915)",i:"Iqbal taught that the self is strengthened by love, striving and faith until destiny itself asks what you want. Self-respect, not self-indulgence.",k:"Make yourself so strong and good that Allah asks you what you wish for.",d:"Do the hard thing first this morning."},{t:"The examined life",w:"Socrates, in Plato's Apology",i:"The unexamined life is not worth living. A few minutes of honest reflection each day is the difference between living and merely passing time.",k:"Think about your day before you sleep: what went well, what did not. That is how you grow.",d:"Fill in the reflection journal tonight."},{t:"Opportunity cost",w:"Economics; Fr\xE9d\xE9ric Bastiat's 'what is not seen'",i:"Every choice is also a choice against something else. An hour of scrolling costs an hour of reading or walking. The cost is real even when invisible.",k:"When you choose one thing, you are also choosing not to do another thing. Choose carefully.",d:"Before one leisure choice today, name what it costs."},{t:"Marginal gains",w:"Sports science; kaizen",i:"Improve many small things by one percent and the sum is large. OnePlate is built on this: a thumb of oil, a walk, a roti, a bottle of water.",k:"Lots of tiny improvements add up to a big one.",d:"Make one thing one percent better today."},{t:"Muraqabah: self-watching",w:"Al-Muhasibi;
