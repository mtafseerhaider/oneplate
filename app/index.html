the people admit the truth for a moment and then go back?"]}],kids:["Ibrahim's father made statues for people to worship. Ibrahim looked at a star and thought: is that my Lord? But it went away. The moon went away. Even the sun went away. He said: my Lord is the One who made all of these and never goes away.","One day, when everyone was out, Ibrahim broke all the statues except the biggest one, and hung the axe on it. When people asked who did it, he said: ask the big one! They knew statues cannot talk. That was the point.","They were angry and threw him into a huge fire. Allah said: Fire, be cool and safe for Ibrahim. And it was. Ibrahim walked out without a burn."]},"Ibrahim, Isma'il and the sacrifice":{sections:[{h:"The story",p:["Ibrahim had asked his Lord for a righteous child, and was given good news of a forbearing boy. The Quran gives the next scene in a few lines. When the boy reached the age of walking and working with him, Ibrahim said: my son, I see in a dream that I am sacrificing you, so look, what do you think? The son answered: my father, do what you are commanded; you will find me, if Allah wills, among the patient.","When they had both submitted, and Ibrahim had laid him down on his forehead, the call came: O Ibrahim, you have fulfilled the vision. Thus We reward those who do good. This was indeed the clear trial. And We ransomed him with a great sacrifice, and left for him among later generations: peace be upon Ibrahim.","The Quran does not name the son in the passage. Many commentators, including Tabataba'i, hold that it was Isma'il, because the good news of Ishaq comes after the sacrifice in the same surah, as a further gift, and because the rite is remembered at the Ka'bah that Ibrahim and Isma'il built together. The sacrifice became the feast of Eid al-Adha and the rite of the pilgrims at Mina, and every family that shares an animal that day is repeating what the two of them did on the hill.","Notice what the father did and did not do. He did not act in silence; he told his son and asked what he thought. He did not pretend it was easy; he said, look. And the son's answer was not bravado but a condition: you will find me, if Allah wills, patient."]},{h:"Where it is in the Quran",l:["37:99\u2013113: the prayer for a son, the dream, the conversation, the ransom, and the news of Ishaq.","2:124\u2013129: Ibrahim tried with words and fulfilled them; he and Isma'il raise the foundations of the House.","22:34\u201337: the sacrifice as a rite for every community, and the verse that neither meat nor blood reaches Allah, only taqwa.","14:35\u201341: Ibrahim's prayer for Makkah and for his descendants to keep the prayer."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the dream as a real command conveyed in the way prophets receive commands, and the fulfilment as the full submission of both, not the act itself: you have fulfilled the vision was said when the knife was in place and the will complete. The trial was therefore of the will, and the ransom shows that Allah did not want the boy's life but his father's whole heart.","He argues from the sequence of the surah that the son was Isma'il, and reads 'you will find me, if Allah wills, among the patient' as the model of a believer's promise: no claim about oneself without the condition."]},{h:"Lessons",l:["The hardest obedience in the Quran was done by two people who talked first. Consultation is not the opposite of submission.","Promise with a condition. Isma'il said 'if Allah wills' about his own patience.","Allah does not want the sacrifice; He wants the sacrificer. The ram came once the heart was given.","Eid is the memory of a family that obeyed together. Sharing the meat is the smallest form of what they did."]},{h:"Talk about it",l:["Why did Ibrahim ask his son what he thought, when the command was from Allah?","What is something hard you would do if you were sure Allah asked for it?","On Eid, what are we remembering when we share the meat with neighbours?"]}],kids:["Ibrahim asked Allah for a son and Allah gave him Isma'il. When Isma'il was big enough to help his father, Ibrahim had a dream from Allah: he was sacrificing his son. He told Isma'il and asked him what he thought.","Isma'il said: Father, do what Allah commands. You will find me patient, if Allah wills. They both said yes to Allah. Ibrahim laid his son down.","Then Allah called out: Ibrahim, you have done it! You both obeyed. And He sent a big ram to sacrifice instead. That is why we have Eid al-Adha and share meat with everyone."]},"Yusuf in the well and the palace":{sections:[{h:"The story",p:["Yusuf told his father a dream: eleven stars, the sun and the moon bowing to him. Ya'qub told him not to tell his brothers, for Satan is a plain enemy to man. The brothers, who thought their father loved Yusuf and his younger brother more, plotted. They asked to take him out to play, and threw him into the bottom of a well, where Allah revealed to him that one day he would tell them of this deed when they did not recognise him. They came to their father at night weeping, with his shirt stained with false blood. Ya'qub said: your souls have made something seem fair to you; so, beautiful patience. A caravan found the boy and sold him for a few dirhams in Egypt, where the governor's wife raised him.","She wanted him. He refused: he is my master, he has treated me well; wrongdoers do not prosper. She pursued him to the door and tore his shirt from behind, and a witness from her family judged by where the shirt was torn. The women of the city gossiped; she invited them, gave them knives and fruit, and brought him out; they cut their hands. He said: my Lord, prison is dearer to me than what they call me to. He was imprisoned despite the signs of his innocence.","In prison two men asked him to interpret their dreams. He preached to them first, then interpreted; one was freed and forgot him for years. When the king dreamed of seven fat cows eaten by seven lean, the freed man remembered. Yusuf explained the dream and gave the plan: sow seven years and store in the ear; seven hard years will consume what you stored; then a year of relief. He refused to leave prison until his case was cleared. The women confessed; the governor's wife said: now the truth is out. The king made him over the storehouses.","His brothers came for grain and did not know him. He kept his brother, by a ruse within the law, and sent them home. Ya'qub, told the news, said again: beautiful patience, and wept until his eyes went white, and said that he complained only to Allah. He sent them back: do not despair of Allah's relief. Before them Yusuf finally said: I am Yusuf and this is my brother. They admitted their wrong. He said: no blame on you today; may Allah forgive you. He sent his shirt; cast over the father's face, it returned his sight. The family came to Egypt and bowed before him, and the dream was complete. He prayed: my Lord, You have given me kingship and taught me the interpretation of events; take me as a Muslim and join me with the righteous."]},{h:"Where it is in the Quran",l:["Surah 12 is the only surah that tells a single story from beginning to end; the Quran calls it the best of narratives (12:3).","12:4\u20136: the dream. 12:7\u201320: the well. 12:21\u201335: the governor's house and the prison. 12:36\u201357: the dreams and the rise. 12:58\u2013101: the brothers and the reunion. 12:102\u2013111: the lesson drawn.","40:34: Yusuf remembered in Egypt by a later believer, as a prophet whose message the people doubted after his death."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the whole surah as the story of wilayah, Allah's guardianship of a servant who has given himself wholly to Him. Every blow that fell on Yusuf, the well, the slavery, the accusation, the prison, was turned into the step by which he rose, and the surah says so in its own words: thus We established Yusuf in the land. He singles out Yusuf's refusal in the governor's house as the moment the whole story turns, and reads 'he saw the proof of his Lord' as the servant's certainty, not an external sign.","He gives weight to Ya'qub's beautiful patience, sabr jamil, which he defines as patience without complaint to creatures, and notes that Ya'qub's sorrow and his patience existed together. Patience is not the absence of grief."]},{h:"Lessons",l:["The dream came true after thirty years and three disasters. A promise from Allah has its own clock.","Yusuf refused the woman before he refused the prison. Character is decided in private before it is tested in public.","No blame on you today: forgiveness at the moment of full power is the surah's highest act.","Ya'qub grieved, wept and lost his sight, and still said beautiful patience. Grief and patience are not opposites."]},{h:"Talk about it",l:["What do you think Yusuf said to himself at the bottom of the well?","When he had all the power, he forgave. What makes forgiveness harder when you are strong?","Ya'qub said: do not despair of Allah's relief. What relief are we waiting for, and how do we wait?"]}],kids:["Yusuf had a dream that eleven stars, the sun and the moon bowed to him. His brothers were jealous and threw him into a well. A caravan found him and sold him in Egypt as a servant.","Yusuf was honest and good even when a rich woman tried to make him do wrong, and even when he was put in prison for something he did not do. In prison, Allah let him explain people's dreams.","The king had a strange dream about seven fat cows and seven thin ones. Yusuf explained it meant seven good years and seven hungry years, and told them how to save food. The king put Yusuf in charge of the whole country. Years later his brothers came hungry, and Yusuf forgave them and brought his whole family to live with him."]},"Musa and the burning bush":{sections:[{h:"The story",p:["Musa was travelling at night with his family from Madyan, where he had spent years as a shepherd after fleeing Egypt. He saw a fire on the side of the mountain and told his family to wait: perhaps I will bring you a brand from it, or find guidance at the fire. When he came to it, he was called: O Musa, I am your Lord, so take off your sandals; you are in the sacred valley of Tuwa. I have chosen you, so listen to what is revealed. I am Allah, there is no god but Me, so worship Me and establish prayer for My remembrance.","Then the questions and the signs. What is that in your right hand, Musa? My staff; I lean on it, I beat down leaves for my sheep, and I have other uses for it. Throw it down. It became a moving snake. Take it and do not fear; We will return it to its former state. Draw your hand to your side; it comes out white, without harm, another sign. Go to Pharaoh; he has transgressed.","Musa's answer is the dua every teacher, parent and speaker has borrowed since: My Lord, expand for me my breast, and ease for me my task, and untie the knot from my tongue so that they understand my speech; and appoint for me a helper from my family, Harun my brother; strengthen my back with him and let him share my task, so that we may glorify You much and remember You much. The reply: you have been granted your request, Musa. Then Allah reminded him of an earlier favour: the basket on the river, the mother's heart, the sister following, the years in Madyan, and: I have made you for Myself.","Go, you and your brother, with My signs, and do not slacken in My remembrance. Speak to him gently; perhaps he will take heed or fear. They were afraid; He said: do not fear, I am with you both, I hear and I see."]},{h:"Where it is in the Quran",l:["20:9\u201348: the fullest account, with the dua, the reminder of his childhood and the command to speak gently.","28:29\u201335: the same scene with Musa's fear about the man he had killed and his request for Harun as a helper because he is more eloquent.","27:7\u201314: the fire, the blessed one at it, and the nine signs for Pharaoh.","26:10\u201317 and 79:15\u201326: the commission in brief."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the first words at the fire as the whole of religion in order: I am your Lord; there is no god but Me; worship Me; establish prayer for My remembrance. Prayer is named as the form remembrance takes. He treats the questions about the staff as Allah's way of making Musa familiar with what is about to become a sign, so that the miracle is placed in something ordinary and known.","On the dua, he observes that Musa asked first for inner capacity, the opened breast, and only then for the tongue and the helper; and that 'so that we may glorify You much' is the purpose Musa gives for wanting a brother beside him. The mission's aim is worship, not victory."]},{h:"Lessons",l:["Musa went to the fire for a brand and found his Lord. Errands can be callings.","He named what he was afraid of, his tongue, his past, his loneliness, and asked for each. A dua can be specific.","Allah's first favour was named: the basket, the mother, the sister. Before the great task, remember how you have been carried so far.","Speak to Pharaoh gently. If gentleness was commanded toward the worst man alive, it is commanded toward everyone else."]},{h:"Talk about it",l:["Musa asked for a helper from his family. Who is the helper you would ask for?","What is your 'knot in the tongue', the thing you find hard to say?","Why did Allah tell Musa to speak gently to Pharaoh?"]}],kids:["Musa was walking at night with his family and saw a fire on a mountain. He went to get some fire to keep them warm. When he got there, Allah spoke to him and told him: take off your shoes, this is a holy place.","Allah showed Musa two miracles: his walking stick turned into a snake, and his hand shone white like a light. Then Allah told him to go to Pharaoh, the cruel king, and tell him to let the people go.","Musa was scared. He said: Allah, make my heart strong, make my job easy, help me speak clearly, and let my brother Harun come with me. Allah said: yes, you have everything you asked. We still say Musa's dua before hard things."]},"Musa and al-Khidr":{sections:[{h:"The story",p:["Musa set out with his young companion to the meeting of the two seas, saying that he would not stop until he reached it, even if he had to go on for ages. At the place, they forgot their fish, which took its way into the sea. When Musa asked for the meal and the boy remembered, Musa said: that is what we were seeking, and they retraced their steps. There they found a servant of Allah, given mercy and taught knowledge from His presence. Musa asked: may I follow you so that you teach me of the right guidance you were taught? He answered: you will not be able to have patience with me; how could you be patient with what your knowledge does not encompass? Musa promised patience and obedience. The condition was set: ask me about nothing until I mention it to you.","They boarded a boat, and the man made a hole in it. Musa objected: have you holed it to drown its people? You have done a dreadful thing. Did I not say you would not be able to be patient? Musa apologised. They met a boy and the man killed him. Musa objected harder: an innocent soul? The second warning. Musa set his own limit: if I ask you about anything after this, do not keep me with you. They came to a town whose people refused them food, and the man found a wall about to fall and set it straight. Musa said: you could have taken payment for that. This is the parting between you and me.","Then the explanations. The boat belonged to poor people who worked the sea; a king was seizing every sound boat, so the damage saved it. The boy's parents were believers, and he would have burdened them with rebellion and disbelief; they would be given one better in purity and nearer in mercy. The wall belonged to two orphan boys in the town, with a treasure under it left by a righteous father; their Lord willed that they reach maturity and take it out, as a mercy from Him. And I did not do it of my own accord. That is the explanation of what you could not bear with patience.","The Quran places this story in the middle of Surah al-Kahf, the surah read every Friday, between the two gardens and Dhul-Qarnayn."]},{h:"Where it is in the Quran",l:["18:60\u201382: the whole story. The companion is not named in the Quran; the narrations call him al-Khidr.","18:65: given mercy from Us and taught knowledge from Our presence, the phrase that defines what he had.","Compare 12:21 and 12:100: Allah is in control of His affair, the thread in Yusuf that this story makes visible."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the story as the meeting of two kinds of knowledge: the outward law that Musa carried, which judges acts by what appears, and knowledge of the realities behind events, which Allah gives to whom He wills. Musa was not wrong to object; by the law he was right each time. The lesson is that the law judges appearances while Allah's decree works through hidden mercies, and that a believer who sees a calamity may be looking at a rescue.","He notes the care of the final sentence, I did not do it of my own accord, which places all three acts under command, and reads the three explanations as three faces of mercy: the preserved livelihood, the protected faith, the kept inheritance."]},{h:"Lessons",l:["Musa, a prophet with a Book, asked to be a student. Nobody is too senior to learn.","What looks like damage can be protection. The holed boat was the saved boat.","Patience with what you do not understand is a form of knowledge.","A righteous father's goodness was kept for his orphans under a wall. What parents do lasts past them."]},{h:"Talk about it",l:["Has something that seemed bad for you turned out to be the thing that saved you?","Musa promised patience three times and broke it three times. Why is that hard even for a prophet?","What might our father's or mother's goodness be keeping safe for us without our knowing?"]}],kids:["Musa wanted to learn from a special servant of Allah who knew secret things. The man said: you will not be patient with me, because you will not understand what I do. Musa promised not to ask questions.","They got on a boat and the man made a hole in it. Musa said: why! Then the man knocked down a wall and built it again for free. Musa said: why! Each time the man said: I told you that you would not be patient.","Then the man explained. The hole saved the boat from a bad king who was taking all the good boats. The wall had treasure under it for two orphan children. Sometimes things look bad, but Allah is keeping something good hidden inside them."]},"Dawud and Jalut":{sections:[{h:"The story",p:["After Musa, the leaders of Bani Israel asked their prophet to appoint a king so that they might fight in Allah's way. He asked whether they would really fight if fighting were prescribed. They said: why would we not, when we have been driven from our homes and our children? When it was prescribed, most turned away. The prophet announced that Allah had appointed Talut as king. They objected: how can he have kingship over us when we have more right to it and he has not been given wealth? The answer: Allah has chosen him and increased him in knowledge and stature. The sign of his kingship would be the Ark returning to them, carried by angels.","Talut set out with the army and told them: Allah will test you with a river. Whoever drinks from it is not of me, and whoever does not taste it is of me, except for a handful scooped by hand. They drank, all but a few. When he and those who believed with him had crossed, the rest said: we have no strength today against Jalut and his army. But those who were certain they would meet Allah said: how many a small company has overcome a large company by Allah's leave. Allah is with the patient.","Facing Jalut they prayed: our Lord, pour patience upon us, make our feet firm and help us against the disbelieving people. They routed them by Allah's leave, and Dawud killed Jalut. Allah gave Dawud the kingship and wisdom and taught him of what He willed. The passage ends with a principle: if Allah did not check some people by means of others, the earth would be corrupted.","Dawud's later life fills other surahs: the mountains and birds echoing his praise, iron made soft for him, his judgement between the two litigants and his quick repentance, and the Zabur given to him."]},{h:"Where it is in the Quran",l:["2:246\u2013251: the request for a king, Talut, the river, the small company, Dawud and Jalut.","38:17\u201326: Dawud's strength, the mountains and birds, the two litigants and his repentance.","34:10\u201311 and 21:79\u201380: iron softened, the coats of mail, the mountains glorifying with him.","4:163 and 17:55: the Zabur given to Dawud."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the river as a test of self-control before the test of courage: a people who could not hold back their thirst could not hold a line. He connects the objection to Talut, he has not been given wealth, with the Quran's repeated correction that leadership follows knowledge and capacity rather than property, and he treats 'how many a small company' as the believers' general law, spoken by those who were certain they would meet Allah: certainty about the Hereafter produces courage here.","He reads the closing principle, checking some by others, as the Quran's statement that struggle is built into the order of the world and is itself a mercy, since without it corruption would cover the earth."]},{h:"Lessons",l:["The first test was a drink of water. The small discipline decides who is there for the big one.","Numbers do not decide. Patience and certainty do, by Allah's leave.","The people wanted a rich king; Allah chose a knowledgeable, strong one. We still confuse wealth with fitness to lead.","A young shepherd ended the battle. Age and rank are not the measure of what Allah can do through a person."]},{h:"Talk about it",l:["Why did Talut test the army with a river before the battle?","What is a 'handful of water' in your life, a small thing that decides whether you can do the big thing?","When have a few people done what many could not?"]}],kids:["The people of Bani Israel wanted a king to lead them in a battle. Allah chose Talut. Some people grumbled because he was not rich. But Allah chose him because he was wise and strong.","On the way to the battle Talut said: there is a river ahead. Do not drink more than one handful. Most of the soldiers drank and drank. Only a few obeyed. Those few were the real team.","The enemy had a giant called Jalut. The small team prayed: Allah, give us patience and make our feet strong. A young shepherd boy called Dawud fought Jalut with a sling and won. Later Dawud became a king and a prophet."]},"Sulayman and the ant":{sections:[{h:"The story",p:["Dawud and Sulayman were given knowledge, and they said: praise be to Allah, who has favoured us over many of His believing servants. Sulayman inherited from Dawud and said: O people, we have been taught the speech of birds, and we have been given of all things; this is the clear favour. His armies of jinn, men and birds were gathered and marched in order.","When they came to the valley of the ants, an ant said: O ants, enter your dwellings, lest Sulayman and his armies crush you without knowing. Sulayman smiled, laughing at her words, and said: My Lord, enable me to be grateful for Your favour which You have bestowed on me and on my parents, and to do righteous work that pleases You, and admit me by Your mercy among Your righteous servants.","The surah goes on to the hoopoe, who was missing at the inspection and returned with news of Sheba, a queen on a great throne whose people prostrated to the sun. Sulayman sent her a letter beginning with the basmala, calling her to come in submission. She consulted her council, sent a gift, which he refused, and finally came. Her throne was brought before her arrival by one who had knowledge of the Book, in the blink of an eye, and Sulayman said: this is from my Lord's favour, to test whether I will be grateful or ungrateful. She entered the palace, mistook its glass floor for water, and said: my Lord, I have wronged myself, and I submit with Sulayman to Allah, Lord of the worlds.","The ant's sentence has three parts the surah seems to want us to notice: she warned her people, she assumed the best of Sulayman, 'without knowing', and she spoke to be heard. The king who could command the wind stopped for her."]},{h:"Where it is in the Quran",l:["27:15\u201319: the inheritance, the speech of birds, the ant and the prayer.","27:20\u201344: the hoopoe, the letter to Sheba, the throne and the queen's submission.","34:12\u201314: the wind, the jinn's labour, and Sulayman's death unknown until the staff was eaten.","38:30\u201340: the horses, his return to his Lord, and the kingdom asked for.","21:78\u201382: his judgement with Dawud on the field and the wind subjected to him."]},{h:"Al-Mizan's reading",p:["Tabataba'i treats the understanding of the ant as real, not figurative, and part of the knowledge Sulayman says he was taught. The prayer that follows is, in his reading, the response of a servant who sees his gifts and asks for the one thing gifts cannot supply: the ability to be grateful. He notes that gratitude is asked for as a gift, awzi'ni, and that Sulayman includes his parents in it, since his favour came through them.","He reads the story of Sheba as the surah's demonstration that power, knowledge and wealth can be held by a prophet without harm to his servanthood, which is why Sulayman says of the throne brought in a glance: this is to test whether I will be grateful."]},{h:"Lessons",l:["The ant thought well of the king: 'without knowing'. Husn al-zann is the ant's first lesson.","The greatest king in the Quran laughed at an ant's warning and then prayed. Power that can still smile and still kneel is safe.","Gratitude is a gift to ask for, not only a feeling to have.","The ant warned her people. Leadership is sounding the alarm for others before saving yourself."]},{h:"Talk about it",l:["What did Sulayman do first after understanding the ant: command, or pray? Why?","The ant assumed Sulayman would not hurt them on purpose. When do we assume the worst about people?","If you could understand animals for one day, which would you listen to?"]}],kids:["Sulayman was a king and a prophet who could understand what birds and animals said. He had a huge army of people, jinn and birds.","One day the army was walking near a valley full of ants. A little ant shouted: everyone, go into your houses, or Sulayman's army will step on you by accident! Sulayman heard her and smiled.","Then Sulayman said a dua: Allah, help me to thank You for all You gave me and my parents, and help me do good things that make You happy. Even the biggest king stopped to listen to the smallest ant."]},"Yunus in the whale":{sections:[{h:"The story",p:["Yunus was sent to a city of a hundred thousand or more. He called them and they refused, and he warned them of a punishment. Before permission came, he left them in anger, thinking that Allah would not constrain him. He went to a laden ship. When it was in danger, lots were drawn to lighten it, and he was among the losers and was thrown into the sea, and the whale swallowed him while he was blameworthy. Had he not been of those who glorify Allah, he would have stayed in its belly until the Day they are raised.","In the darkness, the darkness of the night, the sea and the whale's belly, he called: there is no god but You, glory be to You; I was indeed among the wrongdoers. The Quran says: so We answered him and saved him from the distress, and thus We save the believers. He was cast on the bare shore, sick, and a gourd plant was made to grow over him. He was sent back to his people, and they believed, so they were given enjoyment for a time.","Yunus's people are the one nation in the Quran that repented before the punishment fell and were spared: why was there not a town that believed and whose faith benefited it, except the people of Yunus? When they believed, We removed from them the punishment of disgrace in this life.","The Prophet was told: be patient for your Lord's judgement and do not be like the companion of the fish, when he called out while choking with grief. And the Prophet taught that no Muslim calls with the words of Yunus but is answered."]},{h:"Where it is in the Quran",l:["21:87\u201388: Dhun-Nun's departure, the call in the darkness, and the promise: thus We save the believers.","37:139\u2013148: the ship, the lots, the whale, the gourd, and the hundred thousand who believed.","10:98: the people of Yunus, the one town whose faith came in time.","68:48\u201350: the warning to the Prophet not to be like the companion of the fish, and the mercy that caught Yunus.","4:163 and 6:86: Yunus among the messengers."]},{h:"Al-Mizan's reading",p:["Tabataba'i is careful about Yunus's fault. A prophet does not sin, so the leaving in anger was a departure before permission that was blameworthy relative to his station, not a disobedience of a command. He reads 'thinking We would not constrain him' as Yunus assuming he was free to go, and the whale as the constraint. The dua is, in his reading, perfect because it contains nothing but acknowledgement: no request, only tawhid, glorification and confession, and Allah answered a request that was not even made.","On the people of Yunus he reads 10:98 as a law of Allah's mercy: a punishment announced can be lifted by repentance before it falls, which the surah offers to Makkah as a real possibility."]},{h:"Lessons",l:["The best dua in distress asks for nothing. It says who Allah is, and who I am.","Being in the dark is not being abandoned. Yunus was heard inside three darknesses.","Leaving early, even from something hard and unjust, has a cost. Permission matters.","A whole city turned in time. Repentance before the deadline is accepted, and the deadline is not known."]},{h:"Talk about it",l:["Why do you think Yunus's dua has no request in it?","What is a place or time that feels like the whale's belly, and what could we say there?","The people of Yunus changed their minds before it was too late. What makes a whole family change direction?"]}],kids:["Yunus was a prophet who told his people about Allah, but they would not listen. He got angry and left before Allah told him he could. He got on a ship, but a storm came, and he was thrown into the sea.","A huge whale swallowed him. Inside the whale it was dark, dark, dark. Yunus did not give up. He said: there is no god but You, Allah, You are perfect, I was wrong.","Allah heard him and the whale put him safely on the beach. Allah grew a plant to shade him. Then Yunus went back to his people, and this time they all believed. When you are scared in the dark, you can say Yunus's words."]},"Maryam under the palm tree":{sections:[{h:"The story",p:["Maryam's mother had vowed what was in her womb to the service of the sanctuary, and when a girl was born she named her Maryam and asked Allah's protection for her and her children from Satan. Zakariyya took charge of her. Whenever he entered her chamber he found provision with her, and asked where it came from; she said: from Allah, who provides without measure. It was there that Zakariyya prayed for a child of his own.","She withdrew from her family to an eastern place and screened herself. Allah sent His Spirit to her in the form of a well-made man. She said: I seek refuge in the Merciful from you, if you are God-fearing. He said: I am only a messenger of your Lord, to give you a pure boy. How can I have a boy when no man has touched me and I have not been unchaste? He said: your Lord says, it is easy for Me, and We will make him a sign for people and a mercy from Us; it is a matter decreed.","She conceived and withdrew to a far place. The pains of labour drove her to the trunk of a palm tree, and she said: would that I had died before this and been forgotten. A voice called from below her: do not grieve; your Lord has placed a stream beneath you. Shake the trunk of the palm toward you; it will drop fresh ripe dates on you. Eat and drink and be comforted. If you see anyone, say: I have vowed a fast to the Merciful and will not speak today to any human.","She brought him to her people carrying him. They said: Maryam, you have done an unheard-of thing; sister of Harun, your father was not a bad man and your mother was not unchaste. She pointed to him. They said: how can we speak to a child in the cradle? He said: I am the servant of Allah; He has given me the Book and made me a prophet, and made me blessed wherever I am, and enjoined on me prayer and zakat as long as I live, and dutiful to my mother. Peace be on me the day I was born, the day I die and the day I am raised alive."]},{h:"Where it is in the Quran",l:["19:16\u201336: the annunciation, the palm tree, and the infant's speech.","3:35\u201347: her mother's vow, her upbringing with Zakariyya, the provision, and the angels' words to her.","66:12 and 21:91: Maryam who guarded her chastity, made with her son a sign for the worlds.","3:42: chosen and purified and chosen above the women of the worlds.","5:75 and 5:110\u2013118: the Messiah son of Maryam and his mother, who both ate food; the table and the final questioning."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the palm-tree verses as a lesson in how Allah provides: the stream and the dates were there, and she was told to shake the trunk. Provision came by her own effort joined to Allah's arrangement, and he draws from it the rule that reliance does not excuse the hand from working. Her cry, would that I had died, he reads as the natural fear of a pure woman for her honour, not despair of Allah, and the comfort came in three parts: do not grieve, eat and drink, keep silent and let Allah answer for you.","He gives her a station the Quran gives few: she is addressed by angels, called a siddiqa, a truthful one, and ranked above the women of the worlds, and he considers her among those Allah speaks to without being prophets, a muhaddatha."]},{h:"Lessons",l:["Shake the trunk. Allah's provision usually asks for one movement from us.","Silence can be the strongest defence. She vowed a fast of speech and let the truth speak.","'Dutiful to my mother' is in the infant's first sentence. The Quran places a mother's right inside a prophet's commission.","Fear is not a failure of faith. Maryam was afraid, said so, and was comforted, not rebuked."]},{h:"Talk about it",l:["Why did Allah ask Maryam to shake the tree instead of simply dropping the dates?","What is the hardest thing about staying quiet when people say something untrue about you?","Isa's first words praised his mother. What would you want your first words to say about yours?"]}],kids:["Maryam was a very good girl who lived in the house of worship. Allah always sent her food, and when the prophet Zakariyya asked where it came from, she said: from Allah.","An angel came and told her she would have a special baby, Isa, even though she had no husband. It was a miracle from Allah. When the baby was about to come, she was alone and scared and leaned against a palm tree.","A voice said: do not be sad. There is a stream under you. Shake the tree and fresh dates will fall. Eat, drink and be calm. When people asked questions, baby Isa spoke from her arms and said: I am Allah's servant, and I am kind to my mother."]},"The youths of the cave":{sections:[{h:"The story",p:["A group of young men believed in their Lord in a city that worshipped others, and Allah increased them in guidance. They stood up and said: our Lord is the Lord of the heavens and the earth; we will never call on any god besides Him, or we would have said something outrageous. These people of ours have taken gods besides Him; why do they not bring a clear authority for them? They decided together: when you have withdrawn from them and what they worship besides Allah, take refuge in the cave; your Lord will spread His mercy for you and arrange your affair with ease.","They prayed as they entered: our Lord, give us mercy from Yourself and arrange for us right guidance in our affair. Allah struck their ears in the cave for a number of years. The Quran describes them asleep: you would think them awake while they slept; We turned them to the right and to the left, and their dog stretched its forelegs at the entrance. Had you looked at them you would have turned from them in flight, filled with fear. The sun, when it rose, moved away from their cave to the right, and when it set, passed them on the left.","Then Allah raised them so that they would ask one another. How long have you stayed? A day, or part of a day. Your Lord knows best how long. Send one of you with this silver coin to the city, let him see which food is purest and bring provision from it, and let him be careful and not let anyone know of you; for if they find you, they will stone you or force you back to their religion. The coin was centuries old, and so the town learned of them, and learned that Allah's promise is true and that there is no doubt about the Hour. They argued over them, and the ones who prevailed said: we will build over them a place of worship.","The Quran gives the number of years, three hundred and nine, and refuses the argument about how many they were: say, my Lord knows best their number. The surah then teaches the Prophet not to say of anything, I will do it tomorrow, without adding if Allah wills."]},{h:"Where it is in the Quran",l:["18:9\u201326: the entire story, the only place it is told.","18:13\u201314: We relate to you their story in truth; We strengthened their hearts when they stood up.","18:23\u201324: the instruction to say 'if Allah wills', placed at the story's end.","18:28: keep yourself patient with those who call on their Lord morning and evening, the verse that follows."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the story as a sign of the resurrection placed inside the surah's larger argument, and he notes that the Quran tells it to remove the strangeness of the resurrection: a people who slept three centuries and woke thinking it a day are a small resurrection shown to a town. He emphasises that they withdrew from society only after society left them no room to believe, and that their withdrawal was itself an act of faith, with a prayer, not a flight from responsibility.","On the dog, the sun and the turning, he reads the details as the Quran's way of saying that their preservation was Allah's management down to the smallest matter, and he takes 'say, if Allah wills' as the lesson the Prophet himself was to draw from a story about time."]},{h:"Lessons",l:["They were young, and the Quran says so with honour. Youth is the age of standing up.","Their first move after deciding was a dua: arrange our affair. Planning and prayer went together.","Buy the purest food, and be careful. Even the hidden believer is told to eat well and to be wise.","The Quran refused the argument about their number. Some details are not worth the fight."]},{h:"Talk about it",l:["Why do you think Allah tells us about the dog at the entrance?","What would you find most changed if you woke up in three hundred years?","The town built a place of worship over them. What should we build over a story like this?"]}],kids:["Some young men believed in Allah in a town where the king wanted everyone to worship statues. They said: our Lord is the Lord of the heavens and the earth, and we will never worship anyone else.","They ran away to hide in a cave, with their dog lying at the door. They prayed: Allah, be kind to us and help us. Allah made them fall asleep, and they slept for three hundred years! The sun never shone on them and they were turned over so they stayed safe.","When they woke up, they thought it was the next day. One of them went to buy food with an old coin. The shopkeeper stared at the coin from hundreds of years ago. That is how everyone learned that Allah can keep people safe for as long as He wants, and can wake them up again."]},"The man with two gardens":{sections:[{h:"The story",p:["The Quran gives the parable of two men. To one, Allah gave two gardens of grapevines, surrounded by date palms, with crops between them; each garden gave its full yield without failing, and a river ran through them. He had fruit, and wealth, and he said to his companion while talking with him: I have more wealth than you and more men. He entered his garden wronging himself and said: I do not think this will ever perish, and I do not think the Hour will come; and if I am ever returned to my Lord, I will surely find something better than this in return.","His companion said: do you disbelieve in Him who created you from dust, then from a drop, then shaped you as a man? As for me, He is Allah, my Lord, and I will not associate anyone with my Lord. Why, when you entered your garden, did you not say: what Allah wills; there is no power except with Allah? If you see me as less than you in wealth and children, perhaps my Lord will give me better than your garden and send on it a bolt from the sky so that it becomes a slippery plain, or its water sinks into the ground so that you can never find it.","His fruit was destroyed, and he began to wring his hands over what he had spent on it, with its trellises fallen down, saying: would that I had not associated anyone with my Lord. He had no party to help him besides Allah, and he could not help himself. There, the surah says, protection belongs to Allah, the True; He is best in reward and best in outcome.","The parable continues into the next verse: the life of this world is like water that We send down from the sky, with which the earth's plants mingle, and then they become dry straw scattered by the winds. Wealth and children are the adornment of this life, but the lasting good deeds are better with your Lord."]},{h:"Where it is in the Quran",l:["18:32\u201344: the parable of the two men and the two gardens.","18:45\u201346: the water and the dry straw; wealth and children as adornment; the lasting good deeds.","68:17\u201333: the companion parable of the owners of the garden who planned to leave nothing for the poor.","28:76\u201382: Qarun, the same lesson told as history rather than parable."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the garden owner's fault not as atheism but as a hidden shirk: he attributed the gardens' permanence to themselves and to his own standing, which is why the companion's remedy is a sentence, ma sha Allah la quwwata illa billah, that places all power with Allah. His 'if I am returned I will find better' is the voice of a man who thinks wealth here proves favour there, which the Quran denies throughout.","He sees the parable's placement in al-Kahf as deliberate: after the youths who left everything for faith comes the man who kept everything and lost faith, and both end at the same verse: protection belongs to Allah."]},{h:"Lessons",l:["Say ma sha Allah, la quwwata illa billah when you enter what you own. The sentence is the protection.","Wealth is adornment, not evidence. A full garden says nothing about the Hereafter.","The poorer companion was not silent. Speaking the truth to a richer friend is part of friendship.","What Allah gave 'without failing' failed in a night. Only the lasting good deeds have no night."]},{h:"Talk about it",l:["What is our 'garden', the thing we feel sure will always be there?","Why did the rich man think the Hereafter would be even better for him?","The poor friend said a short sentence that would have saved the garden. When do we forget to say it?"]}],kids:["Allah tells a story about two friends. One had two beautiful gardens full of grapes and dates with a river running through them. He got proud and said: this will last forever, and I am better than you because I have more.","His friend said: you should say ma sha Allah, whatever Allah wants, there is no power except with Allah. Everything you have is from Him.","That night the gardens were destroyed. The proud man held his head in his hands and said: I wish I had remembered Allah. So when you see something you love, say ma sha Allah."]},"Luqman's advice to his son":{sections:[{h:"The story",p:["The Quran says: We gave Luqman wisdom: be grateful to Allah. Whoever is grateful is grateful for his own soul, and whoever is ungrateful, Allah is free of need, worthy of praise. That is the frame: wisdom's first act is thanks. Luqman is not called a prophet; he is a wise man, and the tradition remembers him as a man of dark skin and plain work who was given hikmah, and whose counsel to his son the Quran chose to preserve.","He said to his son while advising him: my son, do not associate anything with Allah; association is a tremendous wrong. Then the Quran itself interrupts with the right of parents: We enjoined on man concerning his parents, his mother carried him in weakness upon weakness and his weaning is in two years, be grateful to Me and to your parents; but if they strive to make you associate with Me what you have no knowledge of, do not obey them, yet keep company with them in this world kindly.","Luqman continues: my son, if it is the weight of a mustard seed and it is inside a rock or in the heavens or in the earth, Allah will bring it out; Allah is subtle, aware. My son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you; that is of the matters requiring resolve. Do not turn your cheek from people in contempt, and do not walk through the earth exultantly; Allah does not love any self-deluded boaster. Be moderate in your pace and lower your voice; the most hateful of voices is the voice of donkeys.","Eight pieces of advice, from the inside out: tawhid, then the awareness that nothing is hidden, then prayer, then responsibility to others, then patience, then humility in the face, the walk and the voice."]},{h:"Where it is in the Quran",l:["31:12\u201319: the gift of wisdom and the whole counsel.","31:14\u201315: the right of parents, set inside the counsel so that gratitude to Allah and to parents are one command.","17:23\u201324 and 46:15: the same right of parents stated elsewhere.","25:63: the servants of the Merciful who walk gently, the walk Luqman describes."]},{h:"Al-Mizan's reading",p:["Tabataba'i defines hikmah, from this passage, as knowledge joined to the action it calls for, so that the first thing wisdom does is thank. He reads the order of the counsel as a curriculum: belief, then the sense of being seen, then worship, then social duty, then conduct of the body. He notes the Quran's placement of the parents' verses within Luqman's speech, and takes it as the Book's way of saying that a father's advice to his son includes the son's duty to the father, and its limit: no obedience in shirk, but kindness even then.","On the voice of donkeys, he reads it as the Quran's dislike of loudness as such: a raised voice is a claim to a space that is not one's own."]},{h:"Lessons",l:["Wisdom's first act is gratitude; the Quran says so before Luqman says a word.","Children are owed truth about tawhid first, not last.","The mustard seed in the rock: character is what we do where nothing can be seen.","The walk and the voice are part of religion. How we enter a room is a kind of belief."]},{h:"Talk about it",l:["Which of Luqman's eight pieces of advice is hardest for you, and why?","Why does the Quran put the right of parents in the middle of a father's advice?","What does a moderate walk look like? What does a lowered voice sound like at home?"]}],kids:["Luqman was a very wise man, and Allah kept his advice to his son in the Quran so every child can hear it.","He said: my son, worship only Allah. Allah sees everything, even a tiny seed hidden inside a rock. Pray. Tell people to do good. Be patient when things go wrong.","He also said: do not be proud and turn your face away from people. Do not walk like a show-off. Walk calmly and talk quietly, because the loudest voice of all is a donkey's!"]},"Qarun and his treasure":{sections:[{h:"The story",p:["Qarun was of the people of Musa, and he oppressed them. Allah had given him such treasures that the keys alone would weigh down a band of strong men. His people said to him: do not exult; Allah does not love the exultant. Seek, with what Allah has given you, the home of the Hereafter, and do not forget your share of this world; do good as Allah has done good to you, and do not seek corruption in the land; Allah does not love the corrupters.","His answer is the sentence the Quran records against him: I was only given it because of knowledge I have. The Quran replies that Allah had destroyed before him generations stronger and richer, and that the criminals are not even asked about their sins. He went out before his people in his finery, and those who desired this life said: would that we had the like of what Qarun was given; he is truly a man of great fortune. Those who had been given knowledge said: woe to you; Allah's reward is better for one who believes and does right, and none receives it except the patient.","Then: We caused the earth to swallow him and his house, and he had no party to help him against Allah, nor could he help himself. The ones who had envied him the day before now said: it is Allah who extends and restricts provision to whom He wills of His servants; had Allah not been gracious to us, He would have caused the earth to swallow us too. The disbelievers never prosper.","The surah closes the story with a verse that has become a rule: that home of the Hereafter We assign to those who do not desire exaltedness in the earth or corruption, and the good end is for the God-conscious."]},{h:"Where it is in the Quran",l:["28:76\u201383: the whole account, with the people's counsel, Qarun's claim, the procession and the swallowing.","29:39\u201340: Qarun named with Pharaoh and Haman, each taken by his own kind of punishment.","40:23\u201324: Musa sent to Pharaoh, Haman and Qarun.","18:32\u201344: the man with two gardens, the same claim without the earthquake."]},{h:"Al-Mizan's reading",p:["Tabataba'i finds the whole of Qarun in his one sentence, 'because of knowledge I have': the claim that wealth is earned by one's own cleverness, which severs it from Allah and turns it into a reason for exultation. He reads the people's counsel as the Quran's balanced economics: seek the Hereafter with your wealth, do not forget your share here, do good, do not corrupt. Qarun was condemned for the attitude, not for the treasure.","He stresses the before-and-after of the crowd: the ones who envied him on the day of the procession understood the next morning. The story is as much about the spectators as about Qarun, and the closing verse gives the test: the Hereafter belongs to those who do not want to be high in the earth."]},{h:"Lessons",l:["'I earned it' is the sentence that turned treasure into a grave. Barakah leaves what we claim as our own.","Envy of the rich evaporates in one morning. Do not build your wishes on someone else's procession.","The advice to Qarun was balanced: do not forget your share of this world. The Quran is not against wealth; it is against exultation.","The keys weighed down strong men. Possessions carry their own weight on the one who holds them."]},{h:"Talk about it",l:["Is there anything we say 'I earned this' about, forgetting who gave the ability?","The crowd envied Qarun and then thanked Allah they were not him. Which crowd are we in?","What is our 'share of this world' that the Quran says not to forget?"]}],kids:["Qarun was so rich that strong men could not carry the keys to his treasure rooms. People told him: be grateful to Allah and help others. He said: no, I got all this because I am clever.","One day he walked through the town showing off his gold and fine clothes. Some people said: I wish I had what Qarun has!","Then the ground opened and swallowed Qarun and his whole house. The next day the same people said: thank Allah we were not like him. Everything we have is from Allah, not from being clever."]},"The people of the elephant":{sections:[{h:"The story",p:["In the year the Prophet was born, Abraha, the ruler of Yemen under the Abyssinians, built a great church in Sana'a and wanted the Arabs' pilgrimage turned to it. When the Ka'bah remained the Arabs' House, he marched on Makkah with an army and a war elephant to destroy it. The Quraysh could not fight such an army. Abd al-Muttalib, the Prophet's grandfather, who kept the House, asked only for his own camels back and said of the House: it has a Lord who will protect it. The people of Makkah withdrew to the hills.","The Quran's account is five verses: have you not seen how your Lord dealt with the companions of the elephant? Did He not make their plan go astray? He sent against them birds in flocks, striking them with stones of baked clay, and made them like eaten straw. The tradition records that the elephant knelt at the edge of the sanctuary and would not go forward, and that the army perished.","The next surah, Quraysh, follows directly in the mushaf and is read with it: for the security of Quraysh, their security in the journey of winter and summer, let them worship the Lord of this House, who fed them against hunger and secured them from fear. Makkah's safety and trade, the Quran says, are owed to the House's Lord, and the proper answer is worship.","The year became the Arabs' calendar: the Year of the Elephant. The Prophet was born in it, and the people who saw the army destroyed were the ones who, forty years later, heard the first revelation in the same city."]},{h:"Where it is in the Quran",l:["Surah 105, al-Fil: the whole account.","Surah 106, Quraysh: the sequel, read with it; the security and the two journeys.","3:96\u201397: the first House appointed for people, at Bakkah, a safe sanctuary.","2:125\u2013129: Ibrahim and Isma'il raising its foundations, and the prayer for a messenger from among its people."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads al-Fil as a reminder addressed to the Quraysh of an event their elders had seen, so that 'have you not seen' means 'you know this'. The protection of the House was a favour to Quraysh in particular, which is why Surah Quraysh follows: a people protected and fed should worship the Protector. He takes the birds and the stones literally, as the narrations give them, and sees no reason to explain them away.","He notes that the Quran attributes the deliverance wholly to Allah, with no human battle, which made it a sign for the city that a Prophet would soon be sent to, and a warning that a House Allah defended against an army is not to be dishonoured by its own keepers."]},{h:"Lessons",l:["It has a Lord who will protect it: Abd al-Muttalib's sentence is the surah's whole theology.","Allah's help does not need our strength; the city watched from the hills.","Safety and food are blessings with a bill attached, and the bill is worship. Surah Quraysh says so.","A year named for an elephant became the year a Prophet was born. Allah's dates are not ours."]},{h:"Talk about it",l:["Why did Abd al-Muttalib ask only for his camels and not for the House?","What does Surah Quraysh ask in return for safety and food?","What is something we are safe from that we never thank Allah for?"]}],kids:["Long ago, in the year the Prophet Muhammad \uFDFA was born, a king called Abraha came with a huge army and a giant elephant to knock down the Ka'bah in Makkah.","The people of Makkah could not fight such a big army. The Prophet's grandfather said: the Ka'bah has a Lord who will protect it. And the people went up into the hills.","Allah sent flocks of little birds carrying tiny stones. They dropped them on the army, and the whole army was finished, like chewed-up straw. The elephant would not even walk toward the Ka'bah. Allah protected His House without anyone fighting at all."]}};var Re={"The Muqaddimah":{sections:[{h:"What it is",p:["Ibn Khaldun wrote the Muqaddimah, the Introduction, as the opening volume of a universal history, in 1377, in the fortress of Qal'at Ibn Salama in what is now Algeria, after a career in the courts of Tunis, Fez, Granada and Bougie had taught him how dynasties actually rise and fall. He meant it as a new science: the study of human society, umran, its forms and the laws that govern its changes. Historians before him, he argued, repeated reports without testing them against what is possible for societies; he set out the test.","The book runs through six long chapters: human civilisation in general and the influence of climate and food; desert and tribal life; dynasties, kingship and the caliphate; towns and cities; the crafts and ways of earning a living; and the sciences and education. It is at once sociology, economics, political theory, pedagogy and a theory of history, written before any of those words existed."]},{h:"The main ideas",l:["'Asabiyyah, group feeling: the bond that makes people fight and sacrifice for one another. Dynasties are founded by groups with strong 'asabiyyah, usually from the hard life of the desert or the margins.","The cycle of generations: the founders are hardy and united; their children keep the state by imitation; the grandchildren, raised in luxury, lose the feeling and the skill, and a new group with fresh 'asabiyyah replaces them. He gives a dynasty about three generations, roughly a hundred and twenty years.","Luxury and taxation: as a dynasty ages, its needs grow, taxes rise, enterprise falls, and the revenue that heavy taxes were meant to raise falls with it. The observation was repeated by economists six centuries later.","Cities and crafts: sedentary life produces the crafts, sciences and refinement, and also the softness that ends it. Civilisation is both the goal and the solvent of the strength that built it.","Religion and 'asabiyyah: religious conviction multiplies group feeling, since it removes rivalry and fear of death; but religion without group feeling cannot found a state.","Education: he criticises teaching by memorised summaries, recommends gradual exposure to a subject in three passes, and warns that harsh discipline makes children deceitful."]},{h:"Why it still matters",p:["The Muqaddimah is the first book to treat the course of history as something with causes that can be studied rather than a chain of events to be recorded. Its account of how prosperity undoes the discipline that produced it describes families and companies as well as empires, and its remarks on taxation, on the value of labour, and on how to teach are modern. Arnold Toynbee called it the greatest work of its kind ever created by any mind in any time or place."]},{h:"For our family",l:["A family is the smallest dynasty. Its 'asabiyyah is built at the dinner table, in shared hardship and shared worship, not in comfort.","The third-generation problem is a warning to parents: children raised without any hardness lose what their grandparents had. Choose a few hard things to keep.","His rule for teaching, three gradual passes rather than one hard one, is how the Learn tab works: a short line, a longer version, a review later."]},{h:"Read next",l:["The chapters on 'asabiyyah (Chapter 2) and on the sciences (Chapter 6) in Franz Rosenthal's translation, or the one-volume abridgement edited by N. J. Dawood.","Robert Irwin, Ibn Khaldun: An Intellectual Biography (2018), for the man and the misreadings."]}],kids:["Ibn Khaldun lived about six hundred and fifty years ago. He watched kings and kingdoms rise and fall and asked: why does this keep happening?","He found that a group of people who stick together like a family can build something great. But when their grandchildren grow up too comfortable and stop sticking together, it falls apart.","So he wrote a huge book explaining it. Even today people read it to understand countries, companies and families. The secret is simple: stay together, and do not get soft."]},"The Canon of Medicine":{sections:[{h:"What it is",p:["Ibn Sina, known in Europe as Avicenna, completed al-Qanun fi al-Tibb around 1025. It gathers Greek medicine from Hippocrates and Galen, the Islamic physicians before him such as al-Razi, and his own clinical observation into one ordered system in five books: the principles of medicine, including anatomy, physiology and hygiene; simple drugs, listed alphabetically with their properties; diseases of particular organs, from head to foot; diseases that affect the whole body, such as fevers, and surgery; and compound drugs.","It was translated into Latin in the twelfth century and remained a textbook in Montpellier, Louvain and other European universities into the seventeenth century. The author was also a philosopher, and wrote it in the same decades as his great philosophical summa, the Shifa."]},{h:"The main ideas",l:["Health is a balance, of the humours in his language, of the body's systems in ours; disease is an imbalance, and the physician's first task is to restore it by diet, sleep, movement and climate before drugs.","The six necessities of health: air, food and drink, movement and rest, sleep and waking, retention and evacuation, and the states of the soul. Emotion is a medical factor.","Testing drugs: the Canon sets out rules for a trial, including that a drug must be tested on the disease in its pure form, that the dose must match the strength of the disease, and that the effect must be consistent and observed on humans, since a drug may act differently in animals.","Hygiene and exercise: a long section on regimen, with exercise described as the most important of the preservers of health, to be done before meals, and sleep recommended at night and in moderation.","The description of contagion, the role of water and soil in disease, and the first clear accounts of several conditions."]},{h:"Why it still matters",p:["Much of the Canon's physiology has been replaced. Its method has not: the physician who looks at diet, sleep, movement and mood before reaching for medicine, and who tests a remedy against clear rules, is practising what Ibn Sina described. The rules for a drug trial are often cited as the earliest statement of principles that later became the controlled trial."]},{h:"For our family",l:["OnePlate's order of priorities, food, sleep, movement, mood, then anything else, is the Canon's order.","Ibn Sina's rule that exercise comes before meals is the morning walk before suhoor-like breakfast on a non-fasting day, and the walk before the plate.","His sixth necessity, the states of the soul, is why the Today tab asks about mood and gratitude beside steps and water."]},{h:"Read next",l:["The first book of the Canon in O. Cameron Gruner's English (1930), or the selections in Nancy Siraisi's Avicenna in Renaissance Italy for how it was taught.","Ibn Sina's Poem on Medicine, a short verse summary, is a quicker way in."]}],kids:["Ibn Sina was a doctor who lived a thousand years ago. He wrote a giant book about how the body works and how to stay well.","He said the best medicine is simple: good air, good food, moving your body, sleeping well, and keeping a calm heart. Only after that should a doctor give medicine.","Doctors in Europe used his book for six hundred years. Many things he said, like exercise before eating and sleeping at night, we still do today."]},"The Masnavi":{sections:[{h:"What it is",p:["Jalal al-Din Rumi dictated the Masnavi-ye Ma'navi, the Spiritual Couplets, to his student Husam al-Din Chalabi over the last fifteen years of his life in Konya, between about 1258 and his death in 1273. It is six books of rhyming couplets, more than twenty-five thousand lines, in which stories within stories carry teaching on the soul's journey to God. Rumi calls it the roots of the roots of the roots of religion, and the Persian tradition has called it the Quran in the Persian tongue because it is so saturated with Quranic verses and prophetic reports.","It opens with the Song of the Reed: listen to the reed and the tale it tells, how it sings of separation. The reed cut from the reed-bed is the soul cut from its source, and its music is longing."]},{h:"The main ideas",l:["Separation and return: every soul is a reed cut from the bed; the ache of longing is itself the proof of where we came from and the engine of the way back.","The story is the door: Rumi never argues in the abstract for long. A merchant and a parrot, a lion and a hare, a king and a handmaiden, each carries one truth about desire, pride, trust or love, and the digressions are the teaching.","The nafs, the commanding self: most of the Masnavi's villains are the reader's own appetites and self-regard, disguised as other people.","Love over reason: reason is a lamp, love is the sun; reason gets you to the door, love opens it. He is not against reason, he ranks it.","Allah's mercy outruns His justice, and the Prophet's character is the model of that mercy. The Masnavi is a long commentary on the mercy to the worlds."]},{h:"Why it still matters",p:["The Masnavi is the most read work of mystical poetry in the world, in Persian, Turkish and Urdu for seven centuries, and in English since the twentieth. Its stories are told to children and studied by scholars because they work at both levels. It teaches without lecturing, which is why it has outlived every treatise written in the same years."]},{h:"For our family",l:["The Masnavi is a family book in the Persian and Urdu world: a story a night, with the moral found by the listener. The Poem of the day borrows that habit.","Its lesson about the nafs fits the fast: the appetite is a character in the story, and it can be taught.","Rumi's own teacher was the friend who told him the truth. Find the friend who will."]},{h:"Read next",l:["Jawid Mojaddedi's verse translation of Books One to Six (Oxford World's Classics), the best complete English Masnavi.","Reynold Nicholson's full translation and commentary for study. Start with Book One: the reed, the king and the handmaiden, the merchant and the parrot."]}],kids:["Rumi was a teacher in Turkey about eight hundred years ago. Instead of giving lectures, he told stories: about a parrot who wanted to be free, a lion and a clever rabbit, a man who kept making the same mistake.","Every story has a secret lesson inside about loving Allah and being a better person. His book of stories is so long it has six parts, and people still read it in Persian, Turkish, Urdu and English.","It starts with a flute made from a reed. The flute sounds sad because it misses the field it came from. Rumi says our hearts are like that: they miss Allah, and that is why we pray."]},"The Gulistan":{sections:[{h:"What it is",p:["Saadi of Shiraz finished the Gulistan, the Rose Garden, in 1258, a year after the Bustan, after decades of travel from Syria to India. It is eight chapters of short anecdotes in rhymed prose, each capped with a verse: on the manners of kings, the morals of dervishes, the excellence of contentment, the advantages of silence, love and youth, weakness and old age, the effects of education, and rules for conduct in life. For six hundred years it was the first Persian book a child read after the Quran, from Istanbul to Delhi, and it is still memorised in Iran.","Saadi's own preface explains the title: the roses of a real garden fade in days; this garden will last."]},{h:"The main ideas",l:["Wisdom is practical. Saadi is interested in how a merchant, a king, a dervish or a father should actually behave, and his heroes are the ones who answer wisely under pressure.","Contentment protects freedom: the man who wants little cannot be bought. The chapter on contentment is a manual for not being owned.","Silence is a skill: he who speaks before he thinks pays, and the chapter on silence is full of men who could not keep a secret.","Kindness across difference: the famous lines from Chapter 1 that human beings are members of one body, so that no one who is untouched by another's pain deserves the name of human.","Education forms, nature limits: the chapter on upbringing argues that teaching works on a good nature and is wasted on a bad one, but that no one knows which a child has until they have tried."]},{h:"Why it still matters",p:["The Gulistan trained the manners of a civilisation. Its anecdotes gave Persian, Turkish and Urdu their proverbs, and the Bani Adam lines greet visitors at the United Nations. It is short, funny, worldly and devout at once, which is rarer than it sounds."]},{h:"For our family",l:["One anecdote a night at the table, with the question: what would you have said? Saadi's stories are two minutes long and built for this.","The chapter on silence is the cure for the family argument: who speaks last, wins; who speaks first, pays.","His chapter on contentment is the fast's philosophy in prose: enough is a decision."]},{h:"Read next",l:["Wheeler Thackston's translation (Ibex, 2008) is the most faithful; Edward Rehatsek's older version is free online.","Then the Bustan, his earlier book in verse, for the same wisdom at greater length."]}],kids:["Saadi was a poet who travelled everywhere for thirty years and then came home to Shiraz and wrote down the best stories he had heard and seen.","His book is called the Rose Garden. It is full of short stories about kings, poor wise men, teachers and children, each with a lesson at the end.","One of his poems says all people are like parts of one body: if your toe hurts, your whole body feels it. That poem is written on the wall of the United Nations, where all the countries meet."]},"The Revival of the Religious Sciences":{sections:[{h:"What it is",p:["Abu Hamid al-Ghazali wrote Ihya 'Ulum al-Din in the years after he left his professorship in Baghdad in 1095, a crisis of sincerity he describes in his autobiography, and spent a decade in seclusion and travel. The Ihya is forty books in four quarters: acts of worship, from knowledge and belief to prayer, zakat, fasting, pilgrimage and the Quran; the norms of daily life, from eating and marriage to earning, friendship, travel and enjoining good; the things that destroy, the vices of the heart, from the stomach and the tongue to anger, envy, love of the world, pride and self-delusion; and the things that save, repentance, patience, gratitude, fear and hope, poverty, tawhid and trust, love, intention, self-examination, meditation and the remembrance of death.","Its purpose is in the title: to revive religious knowledge by reconnecting the law with the heart that the law is for."]},{h:"The main ideas",l:["Knowledge that does not change the knower is a danger, not a merit; the first book is on knowledge and most of it is on the scholar's own sincerity.","The heart is the battlefield. Outward acts matter because of what they do inside, and the vices of the heart, not the limbs, are what destroy.","Habit is cure: a vice is removed by practising its opposite until the new act becomes natural; a miser gives until giving is easy.","The stomach first: the book on the discipline of eating opens the quarter on vices, because appetite for food is the root appetite and the one most easily trained.","Death remembered: the last book, on the remembrance of death and the afterlife, is the lens that puts every earlier chapter in proportion."]},{h:"Why it still matters",p:["The Ihya is the most influential book of Islamic spirituality ever written, read across every school and region; its books on the discipline of the soul, on marriage, on the manners of eating and on patience and gratitude are still the standard works. Its method, naming the vice, tracing its cause, prescribing the opposite practice, is what modern habit science rediscovered."]},{h:"For our family",l:["The book on the discipline of eating is OnePlate's ancestor: eat when hungry, stop before full, do not make the stomach the aim of the day.","The quarter on things that save gives the Today tab its check-ins: gratitude, patience, intention, self-examination.","Al-Ghazali's practice of replacing a vice with its opposite act is how to handle a child's habit as well as one's own."]},{h:"Read next",l:["Start with the Book of the Discipline of Eating (Book 11) and the Book on Patience and Thankfulness (Book 32), both in the Islamic Texts Society's translations.","His short autobiography, Deliverance from Error, explains why he wrote it."]}],kids:["Al-Ghazali was one of the most famous teachers in the world about nine hundred years ago. One day he realised that he was teaching for fame, not for Allah, so he left his job and went away to fix his own heart.","Then he wrote forty small books in one big one, explaining how to pray, how to eat, how to be patient, how to stop being angry or jealous, and how to remember that life is short.","His big idea is that what matters most is what is inside you. A bad habit can be fixed by doing the opposite thing again and again until the good thing becomes easy."]},"Nicomachean Ethics":{sections:[{h:"What it is",p:["Aristotle's lectures on how to live well, edited after his death, probably by or for his son Nicomachus, around 340 BCE. Ten books: the human good as happiness, eudaimonia, understood as the activity of a life lived well; moral virtue as a state of character formed by habit; the particular virtues, courage, temperance, generosity, magnificence, proper pride, good temper, friendliness, truthfulness, wit, and justice; the intellectual virtues, including practical wisdom; weakness of will; pleasure; two books on friendship; and the contemplative life as the highest happiness.","Islamic philosophers read it in Arabic from the ninth century; Ibn Miskawayh's Refinement of Character and al-Ghazali's Ihya both carry its doctrine of the mean, and al-Farabi and Ibn Rushd commented on it."]},{h:"The main ideas",l:["Happiness is not a feeling but an activity: a life of rational activity in accordance with virtue, over a complete life.","Virtue is a habit: we become just by doing just acts, brave by doing brave acts. Character is the deposit of repeated choices.","The mean: each virtue lies between two vices, an excess and a deficiency, relative to us. Courage sits between cowardice and recklessness; generosity between meanness and waste.","Practical wisdom, phronesis: the virtue that finds the mean in a particular case; without it the other virtues misfire.","Friendship is a virtue and a necessity: friendships of pleasure and of utility pass; friendship of the good, in which each wishes the other's good for the other's sake, is rare and lasting.","The role of pleasure and pain: the good person takes pleasure in good acts; education is largely learning to enjoy the right things."]},{h:"Why it still matters",p:["It is the founding text of virtue ethics and the most read book of moral philosophy in the world. Its claim that character is formed by practice, that the virtues are means, and that happiness is a life rather than a mood, has been absorbed by Islamic, Christian and secular thought alike, and modern psychology on habit and on flourishing keeps confirming it."]},{h:"For our family",l:["The mean is the rule of thirds in philosophy: food between starving and stuffing, exercise between sloth and injury, speech between silence and chatter.","Children become brave by doing brave things: small chosen difficulties, not lectures.","Friendship of the good: the people who want you to be better. Notice who those are."]},{h:"Read next",l:["Terence Irwin's or Roger Crisp's translation; read Books I, II and VIII first.","Ibn Miskawayh, The Refinement of Character, for the Islamic reception."]}],kids:["Aristotle was a teacher in Greece more than two thousand years ago. He asked: what makes a life a good life?","His answer: you become good by doing good things over and over, until they become a habit. Nobody is born brave; you become brave by doing brave things.","He also said the best way is usually in the middle. Being brave is between being a coward and being reckless. Eating well is between eating nothing and eating everything."]},"The Republic":{sections:[{h:"What it is",p:["Plato's dialogue, written around 375 BCE, in which Socrates and a group of friends ask what justice is and whether the just person is happier than the unjust. To find justice in the soul, Socrates proposes to find it first in a city, writ large, and the dialogue builds an ideal city in speech: three classes, the producers, the guardians who defend, and the rulers who are philosophers; a long programme of education in music and gymnastics; the community of the guardians; the famous images of the sun, the divided line and the cave; a theory of the decline of regimes from aristocracy through timocracy, oligarchy and democracy to tyranny; a critique of the poets; and the closing myth of Er on the soul's choice of its next life.","Al-Farabi built his Virtuous City on it, and Ibn Rushd wrote a commentary on it when he could not find Aristotle's Politics."]},{h:"The main ideas",l:["Justice as order: in the soul, reason rules, spirit supports and appetite obeys; in the city, each class does its own work. Injustice is the lower part ruling the higher.","The cave: most people see shadows on a wall and take them for things; education is the painful turning of the whole soul toward the light, and the one who has seen must go back down to help.","Philosophers should rule, or rulers should philosophise: power without knowledge of the good is dangerous, and knowledge that refuses to govern leaves the city to the worst.","Education forms the soul: what children hear and see shapes what they love; hence the care about stories, music and models.","The decline of regimes follows the decline of desires: as a people wants more and rules itself less, its government changes to match."]},{h:"Why it still matters",p:["The Republic set the questions of political philosophy and the philosophy of education for everything after it. Its warning that a people gets the government its appetites deserve, and its image of the cave, remain the clearest descriptions we have of what learning costs and why it is resisted."]},{h:"For our family",l:["The house is the first city. Plato's rule, each does his own work, is the chore list and the family circle.","The cave is the phone: shadows that feel like life. Turning the soul around is uncomfortable, which is why it has to be practised.","What children hear shapes what they love. The Learn tab's stories are chosen on that principle."]},{h:"Read next",l:["Allan Bloom's or C. D. C. Reeve's translation; read Books I, II, IV, VII and the end of X.","Al-Farabi, On the Perfect State, for the Islamic version of the city."]}],kids:["Plato was a Greek thinker who wrote down conversations with his teacher Socrates. In this one they ask: what does it mean to be fair, and is a fair person happier?","Plato's most famous story is about people chained in a cave, watching shadows on a wall, thinking the shadows are real. One person gets out, sees the sun, and comes back to tell the others. They do not believe him.","The lesson: learning can feel strange at first, like bright light after the dark, but it is the only way to see what is really there."]},"The Analects":{sections:[{h:"What it is",p:["The Analects, Lunyu, are sayings and short conversations of Confucius (551\u2013479 BCE) with his students, compiled by his followers over the generations after his death. Twenty short books, in no strict order, about the gentleman, junzi, the person of cultivated character; benevolence, ren; ritual propriety, li; filial piety; learning; government by moral example; and the Way. For two thousand years it was the foundation of education in China, Korea, Japan and Vietnam, and the text every official was examined on."]},{h:"The main ideas",l:["
