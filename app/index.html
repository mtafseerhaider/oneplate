lah to whom the heavens and earth belong; mountains and birds echoing Dawud, the wind and jinn serving Sulayman, his death unknown to the jinn until the staff was eaten; the two gardens of Sheba lost to the flood of the dam through ingratitude; and 'say: my Lord extends and restricts provision'.",l:"'Few of My servants are grateful': gratitude is the rare thing, and Sheba shows what ungrateful plenty becomes.",k:"Sulayman could talk to birds and the wind obeyed him. The people of Sheba had beautiful gardens but forgot to thank Allah, and they lost them."},{n:35,a:"Fatir",t:"The Originator",v:45,p:"Meccan",mz:"Al-Mizan reads the surah as the opening of Allah's mercy that none can withhold and the proof of His oneness from creation, so that people worship the Originator and not what cannot own a date-stone's skin.",s:"Praise to the Originator who makes the angels messengers with wings; what Allah opens of mercy none can hold back; Satan as a plain enemy; the two seas not alike; those who recite the Book and keep prayer trading in a trade that never fails; the believers' inheritors in three ranks; and no bearer of burdens bears another's.",l:"Whatever mercy Allah opens no one can shut; whatever He withholds no one can release; that settles where to ask.",k:"The angels have wings, two or three or four. Allah is the one who opens the door of kindness and nobody can close it."},{n:36,a:"Ya-Sin",t:"Ya-Sin",v:83,p:"Meccan",mz:"Al-Mizan reads the surah as the three pillars of faith in one place: the prophethood proved by the town's story, tawhid proved by the signs, and resurrection proved by the dead earth and the One who created the first time."},{n:37,a:"As-Saffat",t:"Those Ranged in Ranks",v:182,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the angels in ranks on Allah's oneness, the argument against idolatry, and the prophets, above all Ibrahim and the son laid down for sacrifice, as the servants Allah delivered.",s:"The angels sworn in ranks that your God is One; the mockers at the resurrection and the two companions in Paradise and the Fire; Nuh, Ibrahim and the ransom of his son with a great sacrifice, Musa and Harun, Ilyas, Lut and Yunus; the lie that Allah has daughters; and peace upon the messengers.",l:"Ibrahim and his son both said 'we hear and obey' before the ransom came; submission came first, the relief after.",k:"Ibrahim was ready to obey Allah in the hardest thing, and Allah sent a ram instead. The surah ends with 'peace upon the messengers'."},{n:38,a:"Sad",t:"Sad",v:88,p:"Meccan",mz:"Al-Mizan reads the surah as the warning to the proud who rejected the Reminder, with Dawud, Sulayman and Ayyub as servants who turned back to Allah, and Iblis's refusal to bow as the root of pride.",s:"The disbelievers' pride and the clash over 'one God'; Dawud's judgement between the two disputants and his repentance; Sulayman's horses and his return; Ayyub's patience and the bundle of twigs; the nearness of the Hereafter's two gardens; and Iblis refusing to bow to the one Allah made with His two hands.",l:"Dawud, Sulayman and Ayyub are each called 'awwab', one who keeps returning; the surah's praise is for coming back.",k:"Ayyub was sick for a long time and kept trusting Allah, and Allah gave him health and his family back. Great people keep coming back to Allah."},{n:39,a:"Az-Zumar",t:"The Groups",v:75,p:"Meccan",mz:"Al-Mizan reads the surah as the command of sincere religion: worship Allah making the religion purely His, since He alone creates, provides and forgives; the groups driven to the two abodes close it.",s:"The Book sent down so worship Allah with sincere religion; He created the pairs and you in three darknesses; the believer who stands by night is not like the one who does not; 'My servants who have wronged yourselves, do not despair of Allah's mercy'; the earth held in His grasp on that Day; and the groups led to the Fire and to the Garden with 'peace be upon you'.",l:"Do not despair of Allah's mercy: the verse was sent to those who had gone furthest, so it covers everyone.",k:"Allah says: My servants, even if you did wrong, never give up on My mercy. He forgives everything for the one who returns."},{n:40,a:"Ghafir",t:"The Forgiver",v:85,p:"Meccan",mz:"Al-Mizan reads the surah as the warning to the disputers against Allah's signs, carried by the believer from Pharaoh's family who hid his faith and spoke for Musa, and by the angels who carry the Throne and pray for the believers' forgiveness.",s:"Forgiver of sin and accepter of repentance; the angels who bear the Throne asking forgiveness for those who repent; the believer in Pharaoh's household who argued for Musa with the story of Yusuf; 'call on Me and I will answer you'; and the blind and seeing are not equal.",l:"'Call on Me and I will answer you': dua is the surah's command, and the hidden believer's courage is its example.",k:"A man in Pharaoh's palace secretly believed in Allah and bravely spoke up for Musa. Allah says, 'Ask Me and I will answer.'"},{n:41,a:"Fussilat",t:"Explained in Detail",v:54,p:"Meccan",mz:"Al-Mizan reads the surah as the Quran detailed for a people who know, with the creation of the earth and heavens in days, the witness of skins and ears against their owners, and the command to repel evil with what is better.",s:"A Book whose verses are explained, which the idolaters refuse to hear; the earth and heavens created and the sky told 'come willingly or unwillingly'; Ad and Thamud; the Day when hearing, sight and skin testify; 'those who say our Lord is Allah and stand firm, the angels descend on them'; repel evil with what is better and the enemy becomes a close friend; and 'We will show them Our signs in the horizons and in themselves'.",l:"Repel evil with what is better and the one between you and whom there was enmity becomes a warm friend.",k:"If someone is unkind, answer with something better and they might become your friend. Allah's signs are in the sky and inside us."},{n:42,a:"Ash-Shura",t:"The Consultation",v:53,p:"Meccan",mz:"Al-Mizan reads the surah as revelation itself: how Allah speaks to humans, by inspiration, from behind a veil or through a messenger, and the one religion enjoined on Nuh, Ibrahim, Musa and Isa; the believers' affairs by mutual consultation are its community rule.",s:"The same religion given to Nuh, Ibrahim, Musa and Isa: establish it and do not divide; 'say: I ask no reward except love of the near kin'; the believers answer their Lord, keep prayer, decide by consultation and spend; forgiveness when able; the three ways Allah speaks to a human; and the Quran as a spirit sent to a man who did not know what the Book was.",l:"Their affairs are by consultation among them: a family or a community that decides together is following this surah.",k:"Good people talk together before deciding, forgive when they can, and stand up against bullying. Allah speaks to prophets in special ways."},{n:43,a:"Az-Zukhruf",t:"The Ornaments of Gold",v:89,p:"Meccan",mz:"Al-Mizan reads the surah as the refutation of the idolaters' claim that Allah has daughters and that wealth and ornament mark His favour, with Ibrahim's word of tawhid left among his descendants and Isa as a servant, not a son.",s:"The Quran in the Mother of the Book; the idolaters assign daughters to Allah and bury their own; Ibrahim's word 'I am free of what you worship' left as a lasting word; gold roofs would be given to disbelievers if people would not then all disbelieve; Musa and Pharaoh's rivers; Isa as a servant on whom Allah bestowed favour; and friends on that Day are enemies except the God-conscious.",l:"Allah would have given the disbelievers houses with silver roofs, so little is this world worth to Him; measure success by something else.",k:"Gold and silver houses do not mean Allah is pleased with someone. Ibrahim taught his children one sentence: I worship only Allah."},{n:44,a:"Ad-Dukhan",t:"The Smoke",v:59,p:"Meccan",mz:"Al-Mizan reads the surah as the warning of the smoke and of a Day of decision, with the blessed night of the Quran's descent and the end of Pharaoh's people, over whom neither sky nor earth wept, as the proof of that Day.",s:"The clear Book sent down on a blessed night in which every wise matter is decided; the smoke that will cover the people; Musa sent to Pharaoh and the sea left parted behind the drowned, over whom neither heaven nor earth wept; the tree of zaqqum; and the God-conscious in gardens and springs, where they taste no death but the first.",l:"Neither heaven nor earth wept for Pharaoh's people: a life can end leaving nothing that mourns it, or leaving a legacy that does.",k:"The Quran came down on a special blessed night. Pharaoh's army chased Musa into the sea and Allah closed the water over them."},{n:45,a:"Al-Jathiyah",t:"The Kneeling",v:37,p:"Meccan",mz:"Al-Mizan reads the surah as the signs in the heavens, the earth and the self for people who believe, and the warning to those who take their desire as their god, until every nation kneels before its record.",s:"Signs in the heavens and earth, in your own creation and in the scattered beasts, in the alternation of night and day; the one who takes his desire as his god; the Bani Israel given the Book and then divided; 'we die and we live and nothing destroys us but time'; and every community kneeling, called to its book.",l:"The one who takes his own desire as his god has the most patient and attentive deity of all; the surah names the danger exactly.",k:"Everything around us is a sign from Allah: the day, the night, the rain, the animals. One day every person will see a book of everything they did."},{n:46,a:"Al-Ahqaf",t:"The Sand Dunes",v:35,p:"Meccan",mz:"Al-Mizan reads the surah as the warning of the Hour delivered by a messenger who is nothing new among messengers, with the kind person who at forty prays for gratitude and the people of Hud among the dunes as the two ways of receiving it.",s:"The idolaters' gods created nothing; the Prophet is no novelty among messengers and does not know what will be done with him; the person who at forty asks to be grateful and to have good descendants, with kindness to a mother who carried him in hardship; Hud warning Ad among the sand dunes and the cloud they took for rain; and the jinn who heard the Quran and went back as warners.",l:"At forty, pray the surah's prayer: Lord, let me be grateful for Your favour on me and my parents, and set right my descendants.",k:"A good person thanks Allah for their mother who carried them, and asks Allah to make their own children good. Even the jinn listened to the Quran and were amazed."},{n:47,a:"Muhammad",t:"Muhammad",v:38,p:"Medinan",mz:"Al-Mizan reads the surah as the division of people into those who disbelieve and bar from Allah's way and those who believe in what was sent down to Muhammad, with fighting ordered for the second against the first and the hypocrites exposed in between.",s:"The deeds of those who disbelieve are made to fail and the believers' state is set right; firmness in battle and the rivers of the Garden described; the hypocrites who listen and understand nothing; 'if you help Allah He will help you and make your feet firm'; do not be weak and call for peace when you have the upper hand; and 'will you not then reflect on the Quran, or are there locks on hearts?'",l:"Are there locks on hearts? The surah asks the question that every reader has to answer for themselves.",k:"If you help Allah's religion, Allah helps you and keeps you steady. The surah asks: do you think carefully about the Quran, or is your heart locked?"},{n:48,a:"Al-Fath",t:"The Victory",v:29,p:"Medinan",mz:"Al-Mizan reads the surah as the clear victory of Hudaybiyyah: the treaty that looked like a setback was the opening, the pledge under the tree earned Allah's pleasure, and the Prophet's companions are described in the Torah and the Gospel as a seed that grows strong.",s:"'We have given you a clear victory', revealed on the road back from Hudaybiyyah; tranquillity sent down on the believers; the pledge under the tree, 'Allah was pleased with the believers'; the Bedouins who stayed behind; the vision of entering the Sacred Mosque in safety fulfilled; and the companions as a crop that delights the sowers.",l:"The treaty everyone took as a loss was named the clear victory; judge Allah's openings by their outcome, not by the day they arrive.",k:"The Muslims made a peace agreement and some were sad, but Allah called it a big victory, and soon they entered Makkah safely."},{n:49,a:"Al-Hujurat",t:"The Private Chambers",v:18,p:"Medinan",mz:"Al-Mizan reads the surah as the manners of a believing community: with the Prophet, with news brought by the wicked, between two groups who fight, and between persons, where mockery, suspicion, spying and backbiting are forbidden and only piety ranks one above another.",s:"Do not raise your voices above the Prophet's; verify news from a wicked person; make peace between two fighting groups of believers; do not mock, call names or be suspicious, spy or backbite, which is eating a brother's dead flesh; peoples and tribes to know one another and the noblest is the most God-conscious; and the Bedouins who said 'we believe' when they had only submitted.",l:"Backbiting is eating your brother's dead flesh; the surah's manners begin with the tongue.",k:"Do not make fun of people or call them names, and never talk about someone behind their back. The best person is the one most careful of Allah."},{n:50,a:"Qaf",t:"Qaf",v:45,p:"Meccan",mz:"Al-Mizan reads the surah as the proof of resurrection against those who found a return after dust strange, from the first creation, the rain on dead land, and the two recording angels; Allah is nearer than the jugular vein.",s:"The disbelievers' amazement that dust will live; the sky built without flaws and the rain that gives life to a dead land; 'We are nearer to him than his jugular vein' and the two angels who record every word; the Day when the Fire asks 'is there more?'; the Garden brought near for every returning keeper; and listen on the Day of the cry.",l:"Not a word is uttered without a watcher ready; and Allah is nearer than the vein in your neck.",k:"Allah is closer to you than the vein in your neck. Two angels write down everything you say, so say good things."},{n:51,a:"Adh-Dhariyat",t:"The Scattering Winds",v:60,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the winds that the promise is true, with the God-conscious who sleep little at night and give the beggar a share, Ibrahim's guests, the destroyed nations, and the purpose of creation: 'I created jinn and humans only to worship Me'.",s:"The winds that scatter and the clouds that carry; the God-conscious sleep little at night, ask forgiveness before dawn and keep a share for the beggar and the deprived; Ibrahim's honoured guests and the roasted calf; Musa, Ad, Thamud and Nuh's people; the heaven built with power and still expanded; and 'I did not create jinn and humans except to worship Me'.",l:"'In their wealth is a known share for the one who asks and the one deprived': generosity is a fixed line, not a mood.",k:"Allah says He made us to worship Him. Good people wake before dawn to ask forgiveness and always keep something for the poor."},{n:52,a:"At-Tur",t:"The Mount",v:49,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by Mount Sinai and the written Book that the punishment is coming, the Garden where families who believed are joined with their descendants, and the answer to every objection of the deniers in a run of questions.",s:"By the Mount and the Book inscribed, the punishment will fall; the God-conscious in gardens with their descendants who followed them in faith joined to them; cups passed with no idle talk; the questions: were they created from nothing, did they create themselves, do they own the treasures; and 'be patient for your Lord's judgement, you are under Our eyes'.",l:"'We will join their descendants with them': a family's faith is counted together in the Garden.",k:"Allah will bring families together in Paradise when they believed together. The Prophet is told: be patient, you are under Our eyes."},{n:53,a:"An-Najm",t:"The Star",v:62,p:"Meccan",mz:"Al-Mizan reads the surah as the truth of the revelation seen by the Prophet at the Lote Tree of the farthest boundary, the refutation of Lat, Uzza and Manat, and the principles of the scrolls of Musa and Ibrahim: no soul bears another's burden and a person has only what he strives for.",s:"By the star when it sets, your companion has not strayed; taught by one mighty in power; he saw at the Lote Tree what he saw; Lat, Uzza and Manat are names you invented; the scrolls of Ibrahim and Musa: no burden-bearer carries another's load, a person has only what he strives for, and to your Lord is the final end; He makes laugh and weep, gives death and life; and so prostrate to Allah and worship.",l:"A person has nothing but what he strives for: effort is the currency of this surah.",k:"The Prophet saw the angel Jibril in his real form. The surah says we only get what we work for, and it ends with a sajdah."},{n:54,a:"Al-Qamar",t:"The Moon",v:55,p:"Meccan",mz:"Al-Mizan reads the surah as the splitting of the moon and the warning repeated with the nations of Nuh, Ad, Thamud, Lut and Pharaoh, each closed by 'We have made the Quran easy to remember, so is there anyone who will remember?'",s:"The moon split and they called it magic; Nuh's ark of planks and nails; Ad's furious wind that tore people out like palm trunks; Thamud and the she-camel; Lut's people struck blind; Pharaoh's people taken by a mighty grasp; 'We have made the Quran easy to remember' four times; and the God-conscious in a seat of truth with a Sovereign who is Able.",l:"'We have made the Quran easy to remember, so is there anyone who will remember?' The surah asks it four times.",k:"Allah says the Quran is made easy to remember, and asks: who will remember it? He says it four times so we really hear it."},{n:55,a:"Ar-Rahman",t:"The Most Merciful",v:78,p:"Medinan",mz:"Al-Mizan reads the surah as a count of the Merciful's favours to the two weighty beings, jinn and humans, from the teaching of the Quran and the balance to the two gardens, with 'which of your Lord's favours will you deny?' as the refrain of accountability."},{n:56,a:"Al-Waqi'ah",t:"The Inevitable Event",v:96,p:"Meccan",mz:"Al-Mizan reads the surah as the Event that divides people into three: the foremost brought near, the companions of the right and the companions of the left, with the proofs of resurrection from the seed, the crop, the water and the fire."},{n:57,a:"Al-Hadid",t:"The Iron",v:29,p:"Medinan",mz:"Al-Mizan reads the surah as the call to believe and spend in Allah's way, since He is the First and the Last and the Outward and the Inward and all wealth is His; the lending of a goodly loan and the light that runs before the believers are its images.",s:"Everything glorifies Allah; He is the First, the Last, the Outward and the Inward; believe and spend, for the one who spent before the opening is not like the one after; the goodly loan multiplied; the light of the believers running before them while the hypocrites beg for a spark; this life is play, adornment and boasting, like rain whose crop delights the farmer and then dries; iron sent down with great strength; and the monasticism they invented but did not keep.",l:"Has the time not come for the hearts of the believers to be humbled by Allah's remembrance? The surah asks; the answer is yours.",k:"Allah is the First and the Last, and He sees everything inside and outside. Giving to others is like lending to Allah, and He pays back much more."},{n:58,a:"Al-Mujadila",t:"The Pleading Woman",v:22,p:"Medinan",mz:"Al-Mizan reads the surah as Allah hearing the woman who pleaded about her husband, the abolition of zihar, the rules of private conversation and of making room in gatherings, and the party of Allah who do not love those who oppose Him.",s:"Allah heard the woman who argued about her husband and ended the custom of zihar; there is no secret counsel of three but He is the fourth; whisper not in sin and enmity; make room in gatherings and Allah raises those given knowledge by degrees; the hypocrites who swear falsely; and the party of Allah are the successful.",l:"Allah heard one woman's complaint and sent a law for her; no one's grievance is too small to be heard.",k:"A woman came to the Prophet with a problem and Allah answered her from above the seven heavens. Allah hears every quiet voice."},{n:59,a:"Al-Hashr",t:"The Gathering",v:24,p:"Medinan",mz:"Al-Mizan reads the surah as the exile of Banu Nadir, the law of fay' so that wealth does not circulate only among the rich, the praise of the helpers who prefer others over themselves, the hypocrites' broken promises, and the closing names of Allah.",s:"The expulsion of the Banu Nadir, whose fortresses did not protect them; fay' distributed so that wealth does not circulate only among the rich; the helpers who love those who migrated and prefer them over themselves even in need; the hypocrites like Satan who says 'disbelieve' and then disowns; had the Quran come down on a mountain it would have crumbled; and the beautiful names: the Knower of the unseen, the King, the Holy, the Peace.",l:"'They prefer others over themselves even when they are in need': the helpers' generosity is the surah's standard.",k:"The people of Medina shared their homes and food with the Muslims who had to leave Makkah, even when they had little. The surah ends with Allah's beautiful names."},{n:60,a:"Al-Mumtahanah",t:"The Woman to Be Examined",v:13,p:"Medinan",mz:"Al-Mizan reads the surah as the line between loyalty to Allah and loyalty to His enemies, with Ibrahim's clean break as the example, kindness and justice kept for those who do not fight the believers, and the testing of the women who migrated.",s:"Do not take My enemies and yours as allies; Ibrahim and those with him as the beautiful example: 'we are free of you until you believe in Allah alone'; Allah does not forbid kindness and justice to those who did not fight you over religion; the examination of the believing women who migrated; and the pledge of the women not to steal, commit adultery, kill their children or disobey in what is right.",l:"Allah does not forbid you to be kind and just to those who did not fight you over religion: the surah draws its line with mercy left outside it.",k:"Be fair and kind to people who are not Muslims and who do not harm you. Ibrahim is the example of being brave about what you believe."},{n:61,a:"As-Saff",t:"The Ranks",v:14,p:"Medinan",mz:"Al-Mizan reads the surah as the command to fight in Allah's way in a rank like a solid building, with the rebuke of saying what one does not do, Isa's good news of Ahmad, and the trade that saves from a painful punishment.",s:"Why say what you do not do? Allah loves those who fight in His way in a rank like a solid structure; Musa's people who hurt him and Isa who brought good news of a messenger named Ahmad; they want to put out Allah's light with their mouths; the trade that saves: faith and striving with wealth and self; and be helpers of Allah as the disciples were.",l:"Why do you say what you do not do? The surah's first question is about the gap between speech and action.",k:"Allah does not like it when we say things we do not do. Isa told his people that a prophet named Ahmad would come after him."},{n:62,a:"Al-Jumu'ah",t:"The Friday Congregation",v:11,p:"Medinan",mz:"Al-Mizan reads the surah as the Prophet sent among the unlettered to purify them and teach the Book, the donkey carrying books as the image of knowledge unlived, and the Friday prayer that must not be abandoned for trade.",s:"He sent among the unlettered a messenger from themselves to recite, purify and teach; those given the Torah who did not carry it are like a donkey carrying volumes; if you claim to be Allah's friends then wish for death; when the call is made on Friday, hasten to Allah's remembrance and leave trade; and do not leave the Prophet standing for a passing caravan.",l:"Knowledge not carried in the life is a load on a donkey; the surah measures learning by what it changes.",k:"Friday prayer is special: when the call comes, stop everything and go. Knowing things without doing them is like a donkey carrying heavy books."},{n:63,a:"Al-Munafiqun",t:"The Hypocrites",v:11,p:"Medinan",mz:"Al-Mizan reads the surah as the exposure of the hypocrites, who testify with their tongues and use their oaths as a shield, and the warning to the believers that wealth and children must not distract from Allah's remembrance before death asks for a little more time.",s:"The hypocrites say 'we bear witness that you are Allah's Messenger' and lie; their oaths are a shield; propped-up timbers, they think every cry is against them; 'the mighty will expel the weaker' and the honour belongs to Allah, His Messenger and the believers; do not let wealth and children distract you; and spend before death comes and one says 'Lord, give me a little while longer'.",l:"Spend from what We gave you before death comes and you say, 'My Lord, if only You would delay me a little': the surah's clock is the point.",k:"Some people said they believed but did not mean it. Allah says: do not let money and toys make you forget Him, and give before it is too late."},{n:64,a:"At-Taghabun",t:"Mutual Loss and Gain",v:18,p:"Medinan",mz:"Al-Mizan reads the surah as tawhid and the resurrection stated plainly, the Day of mutual loss and gain when the deceived discover it, and the believer's rule that no affliction strikes except by Allah's leave, with spouses and children named as a test to be met with forgiveness.",s:"Everything glorifies Him; He created you and some of you disbelieve; the Day of Taghabun, mutual loss and gain; no affliction strikes except by Allah's permission, and whoever believes in Allah, He guides his heart; among your spouses and children there are enemies to you, so beware, and if you pardon and forgive, Allah is Forgiving; and fear Allah as much as you are able.",l:"No calamity strikes except by Allah's leave, and whoever believes in Allah, He guides his heart: the surah's remedy for shock.",k:"When something sad happens, Allah already knew and He will guide your heart. Love your family but do not let them pull you away from Allah."},{n:65,a:"At-Talaq",t:"Divorce",v:12,p:"Medinan",mz:"Al-Mizan reads the surah as the law of divorce bounded by Allah's limits, with the promise that whoever fears Allah is given a way out and provision from where he did not expect, and the seven heavens and earths created so that you may know His knowledge encompasses all.",s:"Divorce at the proper time, counting the waiting period, keeping the women in their homes; whoever fears Allah, He makes a way out for him and provides from where he did not expect; whoever relies on Allah, He is enough for him; let the wealthy spend from his wealth and the straitened from what Allah gave him; the towns that rebelled; and seven heavens and of the earth the like of them.",l:"Whoever fears Allah, He makes a way out for him and provides from where he never expected: the surah's promise is written inside a law about endings.",k:"Even when a family goes through a hard change, Allah tells people to be fair and kind. Whoever trusts Allah, He finds a way out for them."},{n:66,a:"At-Tahrim",t:"The Prohibition",v:12,p:"Medinan",mz:"Al-Mizan reads the surah as the household of the Prophet corrected and taught: a secret disclosed, the two wives called to repentance, the command to protect oneself and one's family from the Fire, and the two pairs of examples, the wives of Nuh and Lut against Pharaoh's wife and Maryam.",s:"Why do you forbid what Allah made lawful seeking your wives' pleasure; the secret told and disclosed; 'if you both turn to Allah, your hearts have inclined'; O believers, protect yourselves and your families from a Fire whose fuel is people and stones; sincere repentance; the wives of Nuh and Lut who betrayed; and Pharaoh's wife who asked for a house near Allah, and Maryam who guarded her chastity.",l:"Guard yourselves and your families from the Fire: the surah makes the home the first place of responsibility.",k:"Allah tells parents to keep their family safe from the Fire by teaching them good things. Pharaoh's wife and Maryam are two of the best women ever."},{n:67,a:"Al-Mulk",t:"The Sovereignty",v:30,p:"Meccan",mz:"Al-Mizan reads the surah as the sovereignty of Allah shown in a creation without flaw and in life and death made to test who is best in deeds, with the hearing of the Fire's keepers 'did no warner come to you?' as its warning."},{n:68,a:"Al-Qalam",t:"The Pen",v:52,p:"Meccan",mz:"Al-Mizan reads the surah as the defence of the Prophet's sanity and character, 'you are of a tremendous character', against the slanderer and the swearer of oaths, with the owners of the garden who planned to give the poor nothing and found it black by morning as the warning.",s:"By the pen and what they write, you are not mad, and you are of a tremendous character; do not obey the swearer, the slanderer, the preventer of good; the owners of the garden who swore to harvest at dawn without leaving anything for the poor and found it burnt; the companion of the fish who called out while choked with grief; and they would almost make you slip with their eyes.",l:"The garden was burnt the night its owners decided to leave the poor nothing; generosity withheld is a crop at risk.",k:"Some men planned to pick all their fruit secretly so the poor would get none, and in the morning the garden was gone. The Prophet's character was wonderful."},{n:69,a:"Al-Haqqah",t:"The Inevitable Reality",v:52,p:"Meccan",mz:"Al-Mizan reads the surah as the Reality of the Hour proved by the destruction of Thamud, Ad and Pharaoh, the scene of the book given in the right hand or the left, and the oath that the Quran is the word of a noble messenger and not a poet or soothsayer.",s:"The Reality: Thamud by the overwhelming blast, Ad by a wind seven nights and eight days, Pharaoh and the overturned cities; the trumpet, the heaven split, eight angels bearing the Throne; 'here, read my book' from the one given it in his right hand and 'would that I had not been given my book' from the other; and had he invented sayings against Us, We would have cut his aorta.",l:"'Here, read my book!' The joy of the one who receives it in the right hand is the surah's picture of a life well kept.",k:"On the Last Day some people will shout happily, 'Look, read my book!' because they lived well. The surah tells us to be one of them."},{n:70,a:"Al-Ma'arij",t:"The Ascending Stairways",v:44,p:"Meccan",mz:"Al-Mizan reads the surah as the punishment the questioner asked for, the Day of fifty thousand years, the human being created anxious, and the exception: those who keep their prayers, give a known share to the beggar, guard their chastity and keep their trusts.",s:"A questioner asked for a punishment that none can avert; the angels ascend in a Day of fifty thousand years; the sinner would ransom himself with his children and his whole family; the human was created anxious, fretful in harm and withholding in good, except those who pray constantly, keep a known share for the beggar and the deprived, believe in the Day, guard chastity and trust, and stand by their testimony.",l:"Humans are created anxious; the surah's cure is a list: steady prayer, a fixed share for the poor, trust kept, witness kept.",k:"People worry a lot, but praying regularly and giving to the poor make the heart calm. Keep your promises and tell the truth."},{n:71,a:"Nuh",t:"Noah",v:28,p:"Meccan",mz:"Al-Mizan reads the surah as Nuh's own account of his call, by night and day, openly and secretly, with the promise that seeking forgiveness brings rain, wealth and children, and his final prayer against a people who clung to Wadd, Suwa and Nasr.",s:"Nuh sent to warn; he called night and day and they put fingers in their ears; 'ask your Lord's forgiveness: He will send rain, help you with wealth and children, and gardens and rivers'; the seven heavens in layers and the moon as a light; the idols Wadd, Suwa, Yaghuth, Ya'uq and Nasr; and his prayer for his parents, his household and every believer who enters it.",l:"Istighfar brings rain, wealth, children and gardens: Nuh ties seeking forgiveness to provision, and the surah lets him.",k:"Nuh told people for a very long time to say sorry to Allah, and that Allah would send rain and gifts. He prayed for his parents and for everyone who believes."},{n:72,a:"Al-Jinn",t:"The Jinn",v:28,p:"Meccan",mz:"Al-Mizan reads the surah as the jinn's own testimony after hearing the Quran, that Allah has no spouse or child and that they will no longer ascribe partners, with the Prophet told that he controls neither harm nor guidance for anyone and that the unseen is Allah's alone.",s:"A group of jinn listened and said 'we have heard a wonderful Quran'; some of us are righteous and some otherwise; we used to sit in the heavens to listen and now find shooting flames; 'say: I have no power to harm or guide you'; the mosques belong to Allah so call on no one with Him; and He discloses His unseen to no one except a messenger He has chosen.",l:"Even the jinn, who thought they had the heavens, said 'we have heard a wonderful Quran' and submitted; hearing honestly is the first step.",k:"Jinn are creatures we cannot see. Some of them heard the Quran, loved it, and became Muslims. Mosques are only for Allah."},{n:73,a:"Al-Muzzammil",t:"The Enshrouded One",v:20,p:"Meccan",mz:"Al-Mizan reads the surah as the Prophet's training for the weighty word: stand in prayer at night, recite slowly, remember Allah and devote yourself to Him, bear what they say with a graceful patience, and then the final verse that lightens the night prayer for the community.",s:"O you wrapped in garments, stand the night except a little, and recite the Quran slowly; We will cast on you a heavy word; the rising by night is firmer and clearer; remember your Lord's name and devote yourself to Him entirely; be patient over what they say and leave them with a graceful leaving; Pharaoh's messenger and his seizure; and the closing verse: recite what is easy, since some are ill, some travel and some fight.",l:"Recite the Quran slowly and with measure: the surah's first instruction is about pace, not quantity.",k:"Allah told the Prophet to wake up at night and read the Quran slowly and beautifully. Night prayer makes the heart strong."},{n:74,a:"Al-Muddaththir",t:"The Cloaked One",v:56,p:"Meccan",mz:"Al-Mizan reads the surah as the first command to rise and warn, the portrait of the man who thought and plotted and called the Quran magic, the nineteen over the Fire, and the companions of the right asking the criminals 'what brought you into Saqar?': not praying, not feeding the poor.",s:"O you wrapped in a cloak, rise and warn, magnify your Lord, purify your garments; the one created alone and given wealth and sons who turned away and said 'this is only magic'; over it are nineteen; 'what led you into Saqar?' 'We did not pray, nor feed the poor, and we denied the Day'; and every soul is held for what it earned except the companions of the right.",l:"'We were not of those who prayed, nor did we feed the poor': the two things the people of the Fire name first are the two to guard first.",k:"Allah told the Prophet: get up and warn people. The people who end up in the Fire say they did not pray and did not feed the hungry, so let us do both."},{n:75,a:"Al-Qiyamah",t:"The Resurrection",v:40,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the Day of Resurrection and the self-reproaching soul that Allah will reassemble even the fingertips, with the faces radiant looking at their Lord and the scene of the soul reaching the collarbone as its two ends.",s:"By the Day of Resurrection and the self-reproaching soul; does man think We will not gather his bones? We can restore his very fingertips; do not hurry your tongue with the Quran, its collection and recitation are upon Us; faces that Day radiant, looking at their Lord; when the soul reaches the collarbone and the leg is wound around the leg; was he not a drop of emitted fluid?",l:"Man would rather deny what lies ahead; the surah answers with fingertips, which Allah can restore to their lines.",k:"Allah can bring every person back to life, even the tiny lines on your fingertips. The best thing on that Day will be to look at Allah."},{n:76,a:"Al-Insan",t:"The Human",v:31,p:"Medinan",mz:"Al-Mizan reads the surah as the human guided to the way, grateful or ungrateful, and the righteous who feed the needy, the orphan and the captive for Allah's face alone, 'we want no reward or thanks from you', with the reward of the Garden described in cups of camphor and ginger.",s:"Was there a time when the human was nothing mentioned? Created from a mingled drop to be tested, shown the way, grateful or ungrateful; the righteous who fulfil vows, fear a Day of widespread harm, and feed the needy, the orphan and the captive saying 'we feed you only for Allah's face; we want no reward or thanks'; silk, cups of camphor and ginger, boys like scattered pearls; and 'remember your Lord morning and evening, and prostrate to Him part of the night'.",l:"'We feed you only for Allah's face; we want no reward or thanks from you': the standard for every act of giving.",k:"The best people give food to the poor and say: we do this only for Allah, we do not need a thank-you. Allah gives them a beautiful garden."},{n:77,a:"Al-Mursalat",t:"Those Sent Forth",v:50,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the winds and the angels that the promise will fall, with the refrain 'woe that Day to the deniers' marking each proof: the destroyed nations, creation from a despised fluid, the earth that holds the living and the dead, and the Day of decision.",s:"By those sent forth in succession, what you are promised will fall; when the stars are erased and the mountains scattered; the earlier peoples destroyed and the later sent after them; did We not create you from a despised fluid in a firm place; the earth a gathering place for living and dead; 'woe that Day to the deniers' ten times; the shade of three columns that gives no shade; and the God-conscious among shades and springs.",l:"'Woe that Day to the deniers' is repeated ten times, once for each proof the surah gives them.",k:"Allah swears by the winds that the Last Day is real. He reminds us how small we started and how much He gave us, so we should not deny Him."},{n:78,a:"An-Naba",t:"The Great News",v:40,p:"Meccan",mz:"Al-Mizan reads the surah as the great news of the resurrection they dispute, proved by the earth as a bed, the mountains as pegs, sleep as rest, the night as a cover and the rain that brings grain, and then the Day of decision when the Spirit and the angels stand in rows.",s:"What are they asking about: the great news on which they differ; the earth a bed and the mountains pegs, created in pairs, sleep as rest, night as a garment, day for livelihood, seven strong heavens and a blazing lamp, rain for grain and gardens; the Day of decision and the trumpet; Hell lying in wait, the transgressors tasting only boiling water; the God-conscious with gardens and grapes; and the Day the Spirit and the angels stand in rows and none speaks.",l:"The surah lists ten gifts, from the bed of the earth to the rain, and then asks how the Giver could be denied.",k:"Allah made the earth like a bed and the mountains like tent pegs, and He gave us sleep to rest. One day everyone will stand in rows before Him."},{n:79,a:"An-Nazi'at",t:"Those Who Pull Out",v:46,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the angels who draw out souls that the quaking and the second blast will come, with Musa and Pharaoh as the proof of what overweening ends in, and the question 'when is the Hour?' answered: it is as if, on the day they see it, they had stayed only an evening or a morning.",s:"By those who pull out violently and those who glide; the day the quake shakes and the second follows, hearts pounding; Musa called in the sacred valley, Pharaoh's 'I am your lord most high' and his seizure; are you harder to create or the heaven He built; the one who feared his Lord's standing and restrained his soul from desire has the Garden; and 'when is the Hour?' You are only a warner for the one who fears it.",l:"Whoever feared standing before his Lord and restrained himself from desire, the Garden is his home: the surah's whole path in one verse.",k:"Pharaoh said he was a god and Allah showed everyone he was not. The person who stops themselves from doing wrong because they remember Allah goes to Paradise."},{n:80,a:"Abasa",t:"He Frowned",v:42,p:"Meccan",mz:"Al-Mizan reads the surah as the rebuke over the blind man who came seeking purification while a self-sufficient man was being attended, the Quran in honoured, exalted scrolls, and the human reminded of his creation from a drop and his food from the split earth, until the Day each one flees even from his mother.",s:"He frowned and turned away because the blind man came; the one who considers himself self-sufficient is attended, and the one who comes running in fear is neglected; the Reminder in honoured, exalted scrolls carried by noble scribes; from what did He create him: a drop, measured, the way made easy, then death and the grave; let the human look at his food, water poured, earth split, grain and grapes and olives; and the Day a man flees from his brother, his mother and his father, each with a concern that suffices him.",l:"Let the human look at his food: the surah turns a plate into a proof.",k:"A blind man came to learn and was ignored for someone important, and Allah said that was wrong. Everyone matters. Look at your food and see what Allah made."},{n:81,a:"At-Takwir",t:"The Folding Up",v:29,p:"Meccan",mz:"Al-Mizan reads the surah as the signs of the Hour's arrival in twelve 'whens', the buried girl asked for what sin she was killed, and the oath that the Quran is the word of a noble messenger, Jibril, seen by the Prophet on the clear horizon, and not the word of an outcast Satan.",s:"When the sun is folded up, the stars fall, the mountains move, the pregnant camels are abandoned, the seas boil, souls are paired, and the buried girl is asked for what sin she was killed, then each soul knows what it brought; by the retreating stars, it is the word of a noble messenger, strong, honoured with the Throne's Lord; your companion is not mad; he saw him on the clear horizon; and 'where then are you going? It is only a reminder for whoever wills to go straight.'",l:"'When the buried girl is asked for what sin she was killed': the surah puts one child's question at the centre of the end of the world.",k:"One day the sun will be folded up and the stars will fall. Allah will ask about every baby girl who was hurt. The Quran was brought by Jibril, a noble angel."},{n:82,a:"Al-Infitar",t:"The Cleaving",v:19,p:"Meccan",mz:"Al-Mizan reads the surah as the sky split and the graves overturned, the human asked what deceived him about his Generous Lord who shaped him in whatever form He willed, and the noble recording angels who know what you do, until the Day no soul can do anything for another.",s:"When the sky splits, the stars scatter, the seas burst and the graves are overturned, each soul knows what it sent ahead and left behind; O human, what deceived you about your Generous Lord, who created you, proportioned you and composed you in whatever form He willed; over you are guardians, noble scribes who know what you do; the righteous in bliss and the wicked in the Fire; and a Day when no soul owns anything for another, the command that Day being Allah's.",l:"'What deceived you about your Generous Lord?' His generosity is the thing we mistake for permission.",k:"Allah made you in a beautiful shape and asks: what made you forget Me? Kind angels write down what we do, so do good things for them to write."},{n:83,a:"Al-Mutaffifin",t:"The Defrauders",v:36,p:"Meccan",mz:"Al-Mizan reads the surah as woe to those who take full measure and give short, who do not think they will be raised, with the record of the wicked in Sijjin and of the righteous in Illiyyin, the rust on hearts from what they earned, and the laughing reversed on the Day.",s:"Woe to the defrauders who demand full measure and give less; do they not think they will be raised on a tremendous Day; the record of the wicked in Sijjin; 'their hearts are rusted by what they earned'; the record of the righteous in Illiyyin, witnessed by those brought near; sealed nectar whose seal is musk, 'so let the competitors compete'; and the criminals who laughed at the believers and winked, while today the believers laugh.",l:"Their hearts are rusted by what they used to earn: the surah's diagnosis of dishonesty is a rust that builds up.",k:"Cheating in the shop, giving less than you should, is a big wrong. Doing wrong again and again makes the heart rusty like old metal."},{n:84,a:"Al-Inshiqaq",t:"The Splitting Open",v:25,p:"Meccan",mz:"Al-Mizan reads the surah as the sky and earth obeying their Lord as they must, the human toiling toward his Lord to meet Him, the book given behind the back, and the oath by the twilight and the moon that you will ride stage after stage; why then do they not believe and not prostrate when the Quran is recited?",s:"When the sky splits and listens to its Lord as it must, and the earth is stretched and empties itself; O human, you are toiling toward your Lord and will meet Him; the one given his book in his right hand has an easy reckoning and returns to his people rejoicing; the one given it behind his back calls for ruin; by the twilight, the night and the full moon, you will surely ride stage after stage; and when the Quran is recited they do not prostrate.",l:"You are toiling toward your Lord with all your toil and will meet Him: the surah tells you where the work is going.",k:"Everyone is on a journey to meet Allah, stage after stage like the moon growing. Those who did well get their book in the right hand and go home happy."},{n:85,a:"Al-Buruj",t:"The Constellations",v:22,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the heaven of constellations that the people of the trench, who burned the believers for believing in Allah the Mighty, the Praised, are cursed, with Pharaoh and Thamud as witnesses that Allah's grasp is severe and the Quran is glorious in a guarded tablet.",s:"By the heaven with constellations and the promised Day, a witness and what is witnessed; cursed are the companions of the trench, the fire fed with fuel, sitting watching what they did to the believers, who were punished only for believing in Allah the Mighty, the Praised; those who persecute and do not repent have the punishment of burning; your Lord's grasp is severe; He originates and repeats; the Forgiving, the Loving, Lord of the Throne; Pharaoh and Thamud; and a glorious Quran in a guarded tablet.",l:"They hated the believers only because they believed in Allah, the Mighty, the Praised: the surah names the one thing that was held against them.",k:"Long ago a cruel king burned people just for believing in Allah, and Allah remembers every one of them. Allah is strong and also full of love."},{n:86,a:"At-Tariq",t:"The Night-Comer",v:17,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the piercing star that every soul has a keeper over it, with creation from a gushing fluid as the proof that the Creator can return him, and the Quran as a decisive word, not a jest, while the disbelievers plot and Allah plans.",s:"By the sky and the night-comer, the piercing star: every soul has a keeper over it; let the human look at what he was created from, a fluid gushing out from between the backbone and the ribs; surely He is able to bring him back on the Day secrets are examined, when he will have no power or helper; by the sky that returns rain and the earth that splits, it is a decisive word and not a jest; they plot and I plot; so give the disbelievers respite a little.",l:"'The Day secrets are examined': the surah gives the examination date for what we keep hidden.",k:"Allah swears by a bright star that every person has an angel keeping watch. Allah, who made us from a tiny drop, can bring us back on the Last Day."},{n:87,a:"Al-A'la",t:"The Most High",v:19,p:"Meccan",mz:"Al-Mizan reads the surah as the command to glorify the Most High who creates, proportions and guides, the promise that the Prophet will not forget the recitation, and the reminder that the Hereafter is better and more lasting, as the scrolls of Ibrahim and Musa also said."},{n:88,a:"Al-Ghashiyah",t:"The Overwhelming",v:26,p:"Meccan",mz:"Al-Mizan reads the surah as the news of the overwhelming event with its two kinds of faces, downcast and toiling or joyful in a high garden, and then the call to look at the camel, the sky, the mountains and the earth, with the Prophet told he is a reminder and not a controller.",s:"Has the news of the Overwhelming reached you? Faces that Day humbled, toiling, weary, burning in a hot fire, with food of bitter thorn; faces that Day joyful, pleased with their effort, in a high garden with raised couches and cups set out; do they not look at the camel, how it was created, the sky raised, the mountains set up, the earth spread out; remind, you are only a reminder, not a controller over them; and to Us is their return and their reckoning.",l:"'You are only a reminder; you are not in control over them': the limit of every parent and teacher, written for the Prophet himself.",k:"Look at a camel and think how Allah made it. The Prophet's job was to remind people, not to force them, and that is our job too."},{n:89,a:"Al-Fajr",t:"The Dawn",v:30,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the dawn and the ten nights that Allah is ever watchful, with Ad, Thamud and Pharaoh as proof, the correction of the belief that wealth is honour and poverty humiliation, and the soul at peace called to return to its Lord, well pleased."},{n:90,a:"Al-Balad",t:"The City",v:20,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by Makkah that the human is created in toil and should not boast of wealth spent, with the steep path, freeing a neck and feeding on a day of hunger an orphan of near kin or a needy person in the dust, as what the two ways come to.",s:"By this city in which you are free, and by a father and what he begot: the human is created in toil; he says 'I have squandered abundant wealth', thinking no one sees him; did We not give him two eyes, a tongue and two lips, and show him the two highways; he has not attempted the steep path: freeing a neck, or feeding on a day of hunger an orphan of near kin or a poor person lying in the dust, and being of those who believe and counsel patience and mercy.",l:"The steep path is named: free a neck, feed an orphan of kin or a poor person in the dust on a day of hunger, and counsel patience and mercy.",k:"Allah gave us two eyes, a tongue and two lips. The hard but good road is to free someone, feed a hungry orphan, and tell each other to be patient and kind."},{n:91,a:"Ash-Shams",t:"The Sun",v:15,p:"Meccan",mz:"Al-Mizan reads the surah as eleven oaths leading to one sentence: the soul inspired with its wrong and its right prospers if purified and fails if buried, with Thamud's hamstrung she-camel as the example of burying it."},{n:92,a:"Al-Layl",t:"The Night",v:21,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the night and day that human efforts are diverse, with the one who gives, fears Allah and affirms the best eased toward ease, and the one who is stingy and self-sufficient eased toward hardship, while the most God-conscious gives his wealth seeking only his Lord's face.",s:"By the night when it covers and the day when it appears, your efforts are diverse; whoever gives, fears Allah and affirms the best, We will ease him toward ease; whoever is stingy, considers himself self-sufficient and denies the best, We will ease him toward hardship, and his wealth will not help him when he falls; guidance is upon Us; the most God-conscious will be kept from the Fire, he who gives his wealth to purify himself, owing no favour to anyone, seeking only the face of his Lord Most High, and he will be satisfied.",l:"Giving, fearing Allah and believing the best: the surah says those three ease a life, and their opposites harden it.",k:"Allah makes life easy for the person who gives, is careful of Him and believes in good things. Giving to others cleans the heart."},{n:93,a:"Ad-Duha",t:"The Morning Brightness",v:11,p:"Meccan",mz:"Al-Mizan reads the surah as Allah's reassurance to the Prophet that his Lord has not abandoned him nor is displeased, counting the orphanhood, the wandering and the need that were each met, and asking in return that the orphan not be oppressed, the beggar not be repulsed and the favour be proclaimed."},{n:94,a:"Ash-Sharh",t:"The Opening of the Breast",v:8,p:"Meccan",mz:"Al-Mizan reads the surah as the completion of ad-Duha: the breast opened, the burden removed and the name raised, with the law stated twice that with hardship comes ease, and the instruction to turn to one labour as soon as another is done."},{n:95,a:"At-Tin",t:"The Fig",v:8,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the fig, the olive, Mount Sinai and the secure city that the human was created in the best stature and then reduced to the lowest of the low, except those who believe and do right, so what then makes him deny the judgement, when Allah is the most just of judges.",s:"By the fig and the olive, Mount Sinai and this secure city: We created the human in the best of forms, then returned him to the lowest of the low, except those who believe and do righteous deeds, who have a reward unending; what then makes you deny the Judgement after this? Is not Allah the most just of judges?",l:"Created in the best stature and able to fall to the lowest of the low: the surah gives the human both the height and the warning.",k:"Allah made people in the very best shape. The ones who believe and do good keep that beauty forever. Allah is the fairest judge of all."},{n:96,a:"Al-'Alaq",t:"The Clinging Clot",v:19,p:"Meccan",mz:"Al-Mizan reads the first five verses as the beginning of revelation, reading in the name of the Lord who created and taught by the pen, and the rest as the human who transgresses because he sees himself self-sufficient and forbids a servant from praying, answered with 'prostrate and draw near'."},{n:97,a:"Al-Qadr",t:"The Night of Decree",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as the descent of the whole Quran in the Night of Decree, which is better than a thousand months, when the angels and the Spirit descend by their Lord's leave with every command, and which is peace until dawn; he holds that the night recurs every year."},{n:98,a:"Al-Bayyinah",t:"The Clear Proof",v:8,p:"Medinan",mz:"Al-Mizan reads the surah as the clear proof, a messenger reciting purified pages, after which the People of the Book divided though they were commanded only sincere worship, prayer and zakat, with the believers who do right named the best of creation, whose Lord is pleased with them and they with Him.",s:"Those who disbelieved among the People of the Book and the idolaters would not desist until the clear proof came, a messenger from Allah reciting purified pages with upright writings; they divided only after the clear proof came; they were commanded nothing but to worship Allah with sincere religion, to establish prayer and give zakat; the disbelievers are the worst of creation; and those who believe and do righteous deeds are the best of creation, with gardens of Eden, Allah pleased with them and they with Him, for whoever fears his Lord.",l:"'Allah is pleased with them and they are pleased with Him': the surah names the one reward that makes every other one small.",k:"Allah asked people for three things: worship Him alone, pray, and give to the poor. Those who do are the best of all creatures, and Allah is happy with them."},{n:99,a:"Az-Zalzalah",t:"The Earthquake",v:8,p:"Medinan",mz:"Al-Mizan reads the surah as the earth's final quaking and her reporting of her news by her Lord's inspiration, with people coming forth in groups to see their deeds, and the law that whoever does an atom's weight of good or evil will see it."},{n:100,a:"Al-'Adiyat",t:"The Chargers",v:11,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the charging horses that the human is ungrateful to his Lord and a witness to it, intense in his love of wealth, and that he does not know that when the graves are overturned and what is in the breasts is brought out, his Lord that Day is fully aware of them.",s:"By the panting chargers, striking sparks, raiding at dawn, raising dust and penetrating the enemy's centre: the human is ungrateful to his Lord, and he is a witness to that, and he is intense in his love of wealth; does he not know that when what is in the graves is scattered and what is in the breasts is obtained, their Lord that Day is fully aware of them?",l:"Intense in love of wealth and ungrateful to the Lord: the surah pairs the two and says the human is a witness against himself.",k:"Horses run bravely for their riders, but people often forget to thank Allah who gave them everything. Allah knows what is in every heart."},{n:101,a:"Al-Qari'ah",t:"The Striking Calamity",v:11,p:"Meccan",mz:"Al-Mizan reads the surah as the striking calamity when people are like scattered moths and mountains like carded wool, and the balance that decides: heavy scales for a pleasant life, light scales for a mother that is the Abyss, a hot fire.",s:"The Striking Calamity: what is the Striking Calamity? The Day people are like scattered moths and mountains like carded wool; whoever's scales are heavy is in a pleasant life; whoever's scales are light, his mother is the Abyss, and what will make you know what it is: a blazing fire.",l:"The scale is the only thing that counts that Day; the surah says nothing about how it got heavy, only that it must.",k:"On the Last Day people will be like moths flying everywhere. Everyone's good deeds are weighed. Let us make our side of the scale heavy."},{n:102,a:"At-Takathur",t:"The Rivalry in Increase",v:8,p:"Meccan",mz:"Al-Mizan reads the surah as the rivalry in increase that distracts until the graves are visited, and the threefold 'you will come to know', followed by seeing the Fire with the eye of certainty and being asked that Day about the bliss.",s:"Competing to have more distracts you until you visit the graves; no, you will come to know; then no, you will come to know; no, if only you knew with the knowledge of certainty, you would see the Blaze, then you would see it with the eye of certainty; then you will be asked that Day about the bliss.",l:"Rivalry in more distracts you until you visit the graves: the surah's first word is the diagnosis and the grave is the end of the race.",k:"Wanting more and more toys and money keeps people busy until they die. Allah will ask us what we did with all the good things He gave."},{n:103,a:"Al-'Asr",t:"The Declining Day",v:3,p:"Meccan",mz:"Al-Mizan reads the surah as the whole of the Quran's teaching in three verses: by time, every human is in loss, except those who combine faith, righteous deeds, and mutual counsel to truth and to patience."},{n:104,a:"Al-Humazah",t:"The Slanderer",v:9,p:"Meccan",mz:"Al-Mizan reads the surah as woe to every backbiter and slanderer who gathers wealth and counts it, thinking it will make him immortal, and who will be thrown into the Crusher, Allah's kindled fire that reaches the hearts and closes over them in extended columns.",s:"Woe to every backbiter and slanderer, who collects wealth and counts it, thinking his wealth will make him live forever; no, he will be thrown into the Crusher; and what will make you know what the Crusher is: Allah's kindled fire, which rises over the hearts; it closes over them in extended columns.",l:"Collecting wealth and counting it, thinking it will keep him alive: the surah pairs greed and mockery as one disease.",k:"Making fun of people and talking behind their backs is a big wrong. Counting money all day does not make anyone live forever."},{n:105,a:"Al-Fil",t:"The Elephant",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as the reminder of the army of the elephant in the year of the Prophet's birth, whose plot Allah turned to loss by flocks of birds with stones of baked clay, leaving them like eaten straw: the Kaaba's protection as a sign for Quraysh."},{n:106,a:"Quraysh",t:"Quraysh",v:4,p:"Meccan",mz:"Al-Mizan reads the surah with al-Fil: for the security of Quraysh and their winter and summer journeys, let them worship the Lord of this House, who fed them against hunger and made them safe from fear.",s:"For the accustomed security of Quraysh, their security in the journey of winter and of summer, let them worship the Lord of this House, who fed them against hunger and secured them against fear.",l:"Food against hunger and safety from fear: the surah names the two blessings that make worship the obvious reply.",k:"The people of Makkah could travel safely and had food because Allah protected the Kaaba. So Allah says: worship the Lord of this House."},{n:107,a:"Al-Ma'un",t:"Small Kindnesses",v:7,p:"Meccan",mz:"Al-Mizan reads the surah as the portrait of the one who denies the religion: he pushes away the orphan and does not urge the feeding of the poor, and the surah joins to him those who are heedless of their prayer, pray to be seen and withhold small kindnesses."},{n:108,a:"Al-Kawthar",t:"Abundance",v:3,p:"Meccan",mz:"Al-Mizan reads al-Kawthar as the abundant good given to the Prophet, which he takes to include his numerous descendants through Fatimah, with the reply to the one who called him cut off: it is the hater who is cut off."},{n:109,a:"Al-Kafirun",t:"The Disbelievers",v:6,p:"Meccan",mz:"Al-Mizan reads the surah as the complete separation of worship: the Prophet does not worship what they worship, nor will they worship what he worships, so each has their own religion, with no bargain possible."},{n:110,a:"An-Nasr",t:"The Divine Support",v:3,p:"Medinan",mz:"Al-Mizan reads the surah as the help of Allah and the conquest, after which the Prophet is told to glorify his Lord with praise and seek forgiveness, since He is ever accepting repentance; the companions understood it as announcing his approaching departure."},{n:111,a:"Al-Masad",t:"The Palm Fibre",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as the ruin of Abu Lahab's hands and of himself, whom neither wealth nor earnings availed, and of his wife, the carrier of firewood, with a rope of palm fibre around her neck: the one surah that names an enemy of the Prophet.",s:"May the hands of Abu Lahab be ruined, and ruined is he; his wealth and what he earned did not avail him; he will burn in a fire of blazing flame, and his wife, the carrier of firewood, with a rope of twisted palm fibre around her neck.",l:"Wealth and earnings did not avail him: the surah says of the Prophet's own uncle what it says of everyone who hates the truth.",k:"The Prophet's uncle Abu Lahab was very cruel to him and his wife spread thorns in his path. Allah says their money could not save them."},{n:112,a:"Al-Ikhlas",t:"Sincerity",v:4,p:"Meccan",mz:"Al-Mizan reads the surah as the pure statement of Allah's oneness: He is One, as-Samad on whom all depend, neither begetting nor begotten, with no equal, and holds that it equals a third of the Quran because tawhid is a third of its content."},{n:113,a:"Al-Falaq",t:"The Daybreak",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as refuge with the Lord of the daybreak from the evil of what He created, of darkness as it settles, of those who blow on knots and of the envier when he envies: refuge from evils outside the self."},{n:114,a:"An-Nas",t:"Mankind",v:6,p:"Meccan",mz:"Al-Mizan reads the surah as refuge with the Lord, King and God of mankind from the retreating whisperer who whispers in the breasts of people, from jinn and from humans: refuge from the evil that works inside the self, completing al-Falaq."}],q=wa.map(a=>{let e=M.find(t=>t.n===a.n);return{n:a.n,a:e?.a??a.a,t:e?.t??a.t,v:a.v,p:a.p,mz:a.mz,s:a.s??e?.s??"",l:a.l??e?.l??"",k:a.k??e?.k??""}}),ga=q.reduce((a,e)=>a+e.v,0);var ce={draft:{label:"Draft",short:"draft",tone:"grey",means:"Written for this app and not yet checked by a named reader against the source. Read it as a study aid, not as a citation."},reviewed:{label:"Reviewed",short:"reviewed",tone:"blue",means:"A named reader compared the note with the source text and found it faithful. The name and date are recorded."},verified:{label:"Verified",short:"verified",tone:"green",means:"Checked against the printed edition, with the volume and page recorded, so anyone can open the book to the same place."},disputed:{label:"Disputed",short:"disputed",tone:"red",means:"A reviewer found a problem. The note stays visible with the reviewer's objection until it is corrected or withdrawn."}},fe={};var we=["quran-1-1-7","quran-2-1-5","quran-2-30-39","quran-2-124-129","quran-2-153-157","quran-2-183-187","quran-2-255-257","quran-2-284-286","quran-3-7-9","quran-3-102-105","quran-3-133-136","quran-3-159-160","quran-4-1-1","quran-4-36-36","quran-4-58-59","quran-4-135-135","quran-5-1-3","quran-5-54-56","quran-6-74-83","quran-6-151-153","quran-7-19-31","quran-7-172-174","quran-9-71-72","quran-12-1-21","quran-12-22-35","quran-12-36-57","quran-12-58-101","quran-14-7-7","quran-14-35-41","quran-16-90-97","quran-17-23-30","quran-17-36-39","quran-18-9-26","quran-18-32-44","quran-18- ,"quran-80-22-42","quran-81-1-29","quran-82-1-19","quran-83-1-18","quran-83-19-36","quran-84-1-25","quran-85-1-22","quran-86-1-17","quran-87-1-19","quran-88-1-26","quran-89-1-14","quran-89-15-30","quran-90-1-20","quran-91-1-10","quran-91-11-15","quran-92-1-21","quran-93-1-11","quran-94-1-8","quran-95-1-8","quran-96-1-8","quran-96-9-19","quran-97-1-5","quran-98-1-8","quran-99-1-8","quran-100-1-11","quran-101-1-11","quran-102-1-8","quran-103-1-3","quran-104-1-9","quran-105-1-5","quran-106-1-4","quran-107-1-7","quran-108-1-3","quran-109-1-6","quran-110-1-3","quran-111-1-5","quran-112-1-4","quran-113-1-5","quran-114-1-6"];var Le={"Adam and the first mistake":{sections:[{h:"The story",p:["Before Adam was made, Allah told the angels that He would place a vicegerent on the earth. The angels asked whether He would put there one who would spread corruption and shed blood, while they glorified and sanctified Him. Allah answered that He knew what they did not know. He then taught Adam the names of all things and set them before the angels, who could not name them; Adam could. The angels bowed when commanded. Iblis, who was among them though he was of the jinn, refused. His reason was a comparison: You created me from fire and him from clay. He was expelled, and he asked for respite until the Day people are raised, promising to sit in wait for them on the straight path.","Adam and his wife were settled in the Garden and told to eat freely from wherever they wished, but not to approach one tree, lest they be among the wrongdoers. Satan whispered to them both, swearing that he was a sincere adviser, and told them the tree would make them angels or immortal. They ate. Their nakedness became apparent to them and they began to cover themselves with leaves of the Garden. Their Lord called to them: did I not forbid you that tree and tell you that Satan is a plain enemy to you?","Their answer is the centre of the story. They said: Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy on us we will surely be among the losers. Al-Baqarah adds that Adam received words from his Lord, and He turned to him in forgiveness. They were sent down to the earth, which was always going to be their home, with the promise that guidance would come and that whoever followed it would have nothing to fear.","Two creatures disobeyed in this story. One argued and blamed Allah: because You have led me astray. The other said: we have wronged ourselves. The difference between them is the whole of the story."]},{h:"Where it is in the Quran",l:["2:30\u201339: the announcement to the angels, the names, the bowing, the tree and the words of repentance.","7:11\u201325: the fullest account of the whispering and the covering with leaves, with Iblis's argument and his request for respite.","20:115\u2013123: Adam forgot, and We did not find in him firm resolve; the promise of guidance after the descent.","15:26\u201344 and 38:71\u201385: Iblis's refusal and his oath to mislead all but the sincere servants.","17:61\u201365: Satan's threat and the limit on his power: over My servants you have no authority."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the Garden episode as the human being's first lesson rather than its first crime. The prohibition was not a legal command of the kind that later law brought, because there was no law yet; it was guidance, and crossing it brought its natural result, the loss of ease, not a legal penalty. He points to the Quran's own words: Adam forgot. The earth was the destination from the start, since the announcement to the angels said a vicegerent on the earth before the Garden is mentioned.","He notes that the words of repentance were given to Adam, not invented by him: a human cannot find the way back on his own, and Allah teaches even the form of the apology. The story is thus the pattern of all later guidance: a slip, a turning, and a Lord who turns first."]},{h:"Lessons",l:["The sin that was not forgiven was pride, not the eating. Iblis never admitted anything.","An apology has a form: naming the wrong, asking for mercy, and not shifting blame. The Quran gives it in one sentence.","Knowledge, the names, is what made the human worth bowing to. Learning is part of being human, not an extra.","Satan's first weapon was an oath that he was a sincere adviser. Flattery still arrives dressed as advice."]},{h:"Talk about it",l:["What is the difference between an excuse and an apology? Give one example of each from this week.","Iblis compared fire and clay. When do we compare ourselves to others to avoid doing what is right?","What were the names Adam learned? What does it mean that the first gift was knowledge?"]}],kids:["A long time ago Allah made the first man, Adam, and taught him the names of everything. The angels bowed to him because Allah said so. One of them, Iblis, said: no, I am better than him, I am made of fire and he is made of mud. Allah sent Iblis away because he was proud.","Adam and his wife lived in a beautiful garden. Allah said: eat anything you like, just not from that one tree. Iblis whispered to them: that tree will make you live forever. They listened and ate from it. Straight away they felt terrible.","But Adam did not make excuses. He said: Allah, we did wrong, please forgive us. And Allah forgave him and taught him the right words to say sorry. Iblis never said sorry. So who was the brave one?"]},"Nuh and the long patience":{sections:[{h:"The story",p:["Nuh was sent to a people who had made idols of righteous men from earlier generations, Wadd, Suwa', Yaghuth, Ya'uq and Nasr, and who worshipped them. Surah Nuh is his own report to his Lord: I called my people night and day, but my calling only made them flee further. Whenever I called them so that You might forgive them, they put their fingers in their ears and covered themselves with their garments, persisted and grew arrogant. He tried every register: openly, then privately, then both. He offered them the simplest promise in the Quran: ask your Lord's forgiveness, He is ever forgiving; He will send the sky upon you in showers, support you with wealth and children, and give you gardens and rivers.","They answered with the oldest objection: you are only a man like us, and only the lowest of us follow you. The nobles demanded that he drive away the poor believers. He refused: I will not drive away those who believe. After nine hundred and fifty years, Allah told him that none would believe except those who already had, and commanded him to build the ark under His eyes and inspiration. He built it on dry land. Every time a group of his people passed by, they mocked him. He said: if you mock us, we will mock you as you mock, and you will know on whom a punishment comes.","When the oven gushed, the sign came. He loaded two of every kind, his family except those already judged, and the believers, who were few. The ark moved on waves like mountains. Nuh called to his son, who stood apart: my son, ride with us, do not be with the disbelievers. The son said: I will take refuge on a mountain. Nuh answered: there is no refuge today from Allah's command except for whom He has mercy on. A wave came between them.","Afterward Nuh prayed: my Lord, my son is of my family, and Your promise is true. The reply is one of the Quran's hardest and clearest sentences: he is not of your family; he is a deed that was not righteous. Nuh asked refuge from asking what he did not know, and was told to disembark with peace and blessings."]},{h:"Where it is in the Quran",l:["71:1\u201328: Nuh's own account of the call and his final prayer.","11:25\u201349: the fullest narrative, with the building, the mockery, the son, and the verse that family is a deed.","7:59\u201364, 10:71\u201373, 23:23\u201330, 26:105\u2013122: the call and the refusal told in the pattern of the messengers.","54:9\u201317: the ark of planks and nails, and the refrain that the Quran is made easy to remember.","29:14: the figure of a thousand years less fifty."]},{h:"Al-Mizan's reading",p:["Tabataba'i treats Nuh as the first of the messengers with a law and a book, and reads the length of his mission as the Quran's proof that guidance does not depend on results: a prophet is responsible for the call, not for the acceptance. He gives weight to the sentence about the son. Kinship in the Quran's sight is a relation of faith and deed, so a son who chose the mountain over the ark had left the family before the wave reached him.","He also reads the promise of rain, wealth and children in Surah Nuh as a general law and not a favour for one nation: seeking forgiveness opens provision, because provision is withheld by sin, a theme he links to 7:96 on the towns that believed."]},{h:"Lessons",l:["Patience has a length the Quran gives in numbers so that no one may say their own effort has gone on too long.","Mockery is a stage, not a verdict. Nuh kept working on the ark in front of the people who laughed.","A family is a shared direction before it is a shared blood. The ark was the family that day.","Nuh did not drive away the poor to win the rich. The condition of the nobles was refused at the cost of the mission's success."]},{h:"Talk about it",l:["What would you keep doing for a year without anyone agreeing with you? For ten years?","Why did Nuh refuse to send the poor believers away, when it might have won the rich?","What does it mean that the son was 'a deed that was not righteous'?"]}],kids:["Nuh was a prophet who told his people to worship only Allah. He told them in the day and in the night, loudly and quietly, for hundreds of years. Most of them laughed at him and put their fingers in their ears.","Allah told Nuh to build a huge ship, far from the sea. People walked past and laughed: a ship on dry land! Nuh kept building. Then the rain came and the water rose everywhere.","Nuh, his family and all the believers were safe in the ship, with two of every animal. Nuh's own son would not get in, and the water took him. The people who listened were the ones who were saved."]},"Ibrahim and the idols":{sections:[{h:"The story",p:["Ibrahim grew up in a city of idol-makers; his father Azar carved them. The Quran lets us hear his thinking as a young man. He looked at a star and said, this is my lord; when it set he said, I do not love things that set. The moon rose, and the sun, larger each time, and each one set. He concluded aloud: I have turned my face toward Him who created the heavens and the earth, as a true believer, and I am not of those who associate others with Him. Surah al-An'am adds that this was Allah's argument given to him, and that he was shown the kingdom of the heavens and the earth so that he might have certainty.","He asked his father and his people what they worshipped. Statues, they said, that we are devoted to. Do they hear you when you call, he asked, or benefit or harm you? They answered that they had found their fathers doing so. He said that he was free of what they worshipped, except the Lord of the worlds. Then he made a plan. When the people went out to their festival, he went to the idols, offered them food, asked why they did not eat, and broke them to pieces, all but the largest, on which he hung the axe.","When they returned and asked who had done this, they brought him before the people. He said: ask the big one, if they can speak. For a moment they turned to themselves and admitted that they were the wrongdoers. Then they went back on it: you know these do not speak. He asked why they worshipped what could neither benefit nor harm them. Their answer was the fire: burn him and support your gods. They built a furnace and threw him in. Allah said: O fire, be coolness and safety for Ibrahim. They had wished him harm, and were made the losers.","He left them, with Lut, for the land Allah had blessed, and was given Ishaq and Ya'qub as a grandson, and made an imam for the people after him."]},{h:"Where it is in the Quran",l:["6:74\u201383: the star, the moon and the sun, and the argument Allah gave him.","21:51\u201373: the breaking of the idols, the trial and the fire.","37:83\u201399: the same story told with his sickness, the glance at the stars and the departure.","19:41\u201350: his gentle address to his father, my father, why do you worship what does not hear, and his promise to pray for him.","29:16\u201327: the people's answer, kill him or burn him, and Lut's belief in him.","2:124\u2013131 and 60:4: Ibrahim as imam, builder of the House, and the example of a clean break."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the star, moon and sun passage not as a period of real doubt but as an argument conducted in public, Ibrahim taking his people's premises and showing where they lead. 'I do not love things that set' is, for him, the key sentence: a lord one can love is a lord who does not leave. He connects it to the seeing of the kingdom mentioned just before, so that Ibrahim argued from certainty, not toward it.","On the idols, he notes that Ibrahim's question, do they hear you, is the Quran's standing test of every object of devotion, and he reads the people's momentary admission, we are the wrongdoers, as the Quran's record that the truth was seen before it was refused."]},{h:"Lessons",l:["Reasoning is an act of faith in the Quran. Ibrahim argued, and Allah calls the argument His gift.","A plan can serve the truth. Ibrahim chose the festival day, left the axe, and let the idols convict themselves.","He stayed tender with his father while rejecting his father's idols: my father, come, I will guide you. Rejecting an idea is not rejecting a person.","The fire was made cool for a man who had already accepted the fire. The rescue came after the submission, not instead of it."]},{h:"Talk about it",l:["What are our idols, the things we treat as if they could help or hurt us, though they cannot?","Ibrahim spoke gently to his father while disagreeing completely. Where do we need that?","Why did
