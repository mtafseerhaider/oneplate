<title>OnePlate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: glanceable daily dashboard. Phone: sticky top bar, scrolling bento cards, bottom tab bar. Desktop: top bar, left sidebar, two-column bento. Saffron accent on a soft warm-green ground; semantic green/amber/red kept separate from the accent. */
:root{
  --bg:#F4F5F1; --panel:#FFFFFF; --panel2:#F8F9F6; --fg:#17211C; --muted:#5E6B64; --line:#E3E7E0;
  --accent:#C4731A; --accent-2:#F3B55A; --accent-text:#9A560C; --btn:#A35D0E; --accent-ink:#FFFFFF; --soft:#FBF1E1;
  --green:#257553; --green-soft:#E1F3E8; --amber:#85600A; --amber-soft:#FBF0CF; --red:#B03A31; --red-soft:#FAE1DD; --blue:#2F67AE; --blue-soft:#E3EDFA;
  --scrim:rgba(23,33,28,.45); --shadow:0 1px 2px rgba(23,33,28,.05),0 10px 30px -14px rgba(23,33,28,.16); --r:18px;
  --display:"Outfit",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --panel:#182019; --panel2:#1F2922; --fg:#E9EEEA; --muted:#93A098; --line:#28332C;
  --accent:#F0A63A; --accent-2:#F6C87A; --accent-text:#F0A63A; --btn:#F0A63A; --accent-ink:#1B1308; --soft:#2A2114;
  --green:#5ECB97; --green-soft:#163527; --amber:#E6BC4C; --amber-soft:#36300F; --red:#F18E85; --red-soft:#3E1F1C; --blue:#7FB0F0; --blue-soft:#15263A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1412; --panel:#182019; --panel2:#1F2922; --fg:#E9EEEA; --muted:#93A098; --line:#28332C;
  --accent:#F0A63A; --accent-2:#F6C87A; --accent-text:#F0A63A; --btn:#F0A63A; --accent-ink:#1B1308; --soft:#2A2114;
  --green:#5ECB97; --green-soft:#163527; --amber:#E6BC4C; --amber-soft:#36300F; --red:#F18E85; --red-soft:#3E1F1C; --blue:#7FB0F0; --blue-soft:#15263A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:inset 0 0 0 3.5px var(--bg),0 0 0 2px var(--accent)}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.local{background:var(--amber-soft);color:var(--amber)}
.chip.wait{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.view{background:var(--blue-soft);color:var(--blue)}
main{flex:1;min-height:0;overflow-y:auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--panel);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{appearance:none;background:none;border:0;color:var(--muted);font:600 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button .ib{display:grid;place-items:center;width:44px;height:28px;border-radius:999px;transition:background .2s}
.tabs button.on{color:var(--accent-text)}
.tabs button.on .ib{background:var(--soft)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--panel2)}
.card.accent{background:linear-gradient(135deg,var(--soft),var(--panel));border-color:transparent}
.card.locked{background:var(--panel2);box-shadow:none}
.card.link{cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tile .ic{width:16px;height:16px;color:var(--accent-text)}
button.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--body);padding:11px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s}
button.btn:active{transform:scale(.98)}
button.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--btn)}
button.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.btn.wide{width:100%}
button.btn:focus-visible,.sw-row:focus-visible,.dot:focus-visible,.seg button:focus-visible,.info:focus-visible,.card.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* fast hero */
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:148px;height:148px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none;stroke-width:11}
.ring .bar{stroke:url(#ringGrad);fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-variant-numeric:tabular-nums;gap:2px}
.ring .lbl b{font-size:24px;font-weight:500;letter-spacing:-.02em}
.ring .lbl span{font-size:11px;color:var(--muted)}
.ring .lbl .ic{color:var(--muted);width:22px;height:22px}
.hero .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
/* summary strip */
.strip{flex-direction:row;align-items:center;gap:14px;padding:12px 16px}
.strip .mini{position:relative;width:48px;height:48px;flex:0 0 auto}
.strip .mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.strip .mini .t{stroke:var(--line);fill:none;stroke-width:5}
.strip .mini .b{stroke:var(--green);fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s}
.strip .mini b{position:absolute;inset:0;display:grid;place-items:center;font:500 13px var(--mono)}
.strip .txt{flex:1;min-width:0}
.strip .txt b{display:block;font-family:var(--display);font-size:15px}
.strip .txt small{color:var(--muted);font-size:12px}
.streak{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--accent-text);font:600 13px var(--body);white-space:nowrap}
.streak .ic{width:16px;height:16px}
/* check-ins */
.checks{display:flex;flex-direction:column;gap:4px}
.crow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.crow .t b{font-weight:500;display:flex;align-items:center;gap:6px}
.crow .t small{color:var(--muted);font-size:12px}
.crow .lead{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:0 0 auto}
.crow.done .lead{background:var(--green-soft);color:var(--green)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{appearance:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font:500 12px var(--mono);cursor:pointer;display:grid;place-items:center;transition:transform .1s,background .15s;padding:0}
.dot.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.dots.palms .dot.on{background:var(--soft);border-color:var(--accent);color:var(--accent-text)}
.dot:active{transform:scale(.9)}
.dots.ro .dot{cursor:default}
.sw-row{cursor:pointer}
.sw-row:not([data-a]){cursor:default}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.crow.done .sw{background:var(--green)}
.crow.done .sw i{left:21px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill .ic{width:14px;height:14px}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.soft{background:var(--soft);color:var(--accent-text)}
.pill.grey{background:var(--line);color:var(--muted)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
/* plate */
.platewrap{display:flex;gap:16px;align-items:center}
.platewrap svg{width:150px;height:150px;flex:0 0 auto}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.legend .lg{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start;font-size:14px}
.legend i{width:12px;height:12px;border-radius:4px;margin-top:5px}
.legend .lt{min-width:0;display:flex;flex-direction:column;gap:1px}
.legend .lt b{font-family:var(--display);font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.legend .lt b em{font-style:normal;font-weight:400;font-family:var(--body)}
.legend .lt span{color:var(--muted);font-size:12px;line-height:1.35}
@media (max-width:420px){.platewrap{flex-direction:column;align-items:stretch}.platewrap svg{align-self:center;width:170px;height:170px}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 12px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;text-transform:capitalize}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--line)}
.mbar i{display:block;height:100%}
.mbar .p{background:var(--accent)}.mbar .c{background:var(--amber)}.mbar .f{background:var(--muted)}
.mkey{display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;align-items:center}
.mkey b{color:var(--fg);font-weight:500}
.mkey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:0 16px;box-shadow:var(--shadow)}
details summary>span{min-width:0;flex:1}
details summary{cursor:pointer;padding:13px 0;font-family:var(--display);font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary .chev{color:var(--muted);transition:transform .2s}
details[open] summary .chev{transform:rotate(90deg)}
details .body{padding:0 0 16px;display:flex;flex-direction:column;gap:10px}
.hands{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.hands span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl tr.today td{background:var(--soft)}
.scroll{overflow-x:auto;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);border-left-width:4px}
.item.green{border-left-color:var(--green)}.item.amber{border-left-color:var(--amber)}.item.red{border-left-color:var(--red)}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t small{color:var(--muted);display:block;font-size:12px}
.kcal{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=number],input[type=date],input[type=text],input[type=search],select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;background:var(--panel2);font-size:11px;color:var(--muted)}
.wday .ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--muted);border:1.5px solid var(--line)}
.wday .ib .ic{width:17px;height:17px}
.wday.cycle .ib{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.wday.strength .ib{color:var(--accent-text);background:var(--soft);border-color:transparent}
.wday.easy .ib{color:var(--green);background:var(--green-soft);border-color:transparent}
.wday.today{background:var(--fg);color:var(--bg)}
.wday.today .ib{box-shadow:0 0 0 2px var(--bg)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--accent-2));border-radius:999px;transition:width .6s}
/* progress */
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bignum span{font-size:14px;color:var(--muted)}
.goalbar{display:flex;flex-direction:column;gap:6px}
.goalbar .lbls{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .exp{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .act{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.chart .ptl{fill:var(--panel);stroke:var(--accent);stroke-width:3}
.chart .tgt{stroke:var(--green);stroke-width:1.2;stroke-dasharray:2 3}
.log{display:flex;flex-direction:column}
.log .r{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding:8px 0;border-bottom:1px solid var(--line)}
.log .r:last-child{border-bottom:0}
.log .r button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:2px 4px}
.log .d{color:var(--green);font-weight:500}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:18px 1fr;gap:0 12px}
.tl .n{display:flex;flex-direction:column;align-items:center}
.tl .n i{width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--muted);margin-top:5px}
.tl .n s{flex:1;width:2px;background:var(--line);text-decoration:none;margin:4px 0}
.tl.hit .n i{background:var(--green);border-color:var(--green)}
.tl .c{padding-bottom:14px;display:flex;flex-direction:column;gap:2px}
.tl .c b{font-family:var(--display);font-weight:600}
.tl .c span{font-size:13px;color:var(--muted)}
.rules{counter-reset:r;display:grid;gap:8px}
.rules div{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:14px;padding:12px 14px}
.rules div::before{counter-increment:r;content:counter(r);font-family:var(--display);font-weight:700;color:var(--accent-text);font-size:22px;line-height:1;min-width:22px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1}
ul,ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.note{font-size:13px;color:var(--muted);padding:11px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0}
.info{appearance:none;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);width:17px;height:17px;border-radius:50%;font:700 10px var(--display);line-height:1;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;padding:0;flex:0 0 auto;text-transform:none;letter-spacing:0}
.info:hover{border-color:var(--accent-text);color:var(--accent-text)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);color:var(--fg);border-radius:22px 22px 0 0;padding-block:14px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:none;flex-direction:column;gap:8px;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-width:640px;margin:0 auto}
.sheet.show{display:flex}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.sheet h3{font-size:18px}
.sheet p{font-size:14px;line-height:1.5}
.sheet .x{position:absolute;top:14px;right:16px;border:0;background:var(--panel2);color:var(--muted);width:30px;height:30px;border-radius:50%;font:600 15px var(--body);cursor:pointer}
.erows{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:1fr 72px 36px;gap:6px;align-items:center}
.erow select,.erow input{padding:8px 10px;border-radius:10px}
.erow .btn{padding:6px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);background:var(--soft);color:var(--accent-text);flex:0 0 auto}
.avatar.female{background:var(--blue-soft);color:var(--blue)}
.glist{display:flex;flex-direction:column;gap:6px}
.glist button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.glist button b{font-family:var(--display);font-weight:600;font-size:14px}
.glist button span{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
  .top{grid-column:1/-1;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .brand{font-size:22px}
  .tabs{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:4px;align-items:stretch;border-top:0;border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:12px;font:600 14px var(--body);text-transform:capitalize;letter-spacing:0}
  .tabs button .ib{width:auto;height:auto;background:none!important}
  .tabs button.on{background:var(--soft);color:var(--accent-text)}
  .tabs button:hover:not(.on){background:var(--panel2)}
  main{grid-column:2;grid-row:2;padding-block:30px 48px;padding-left:32px;padding-right:32px}
  .wrap{max-width:1060px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .wrap>.hdr,.wrap>h2,.wrap>.seg,.wrap>.note,.wrap>p,.wrap>.row,.wrap>.strip,.wrap>.search{grid-column:1/-1}
  .wrap>.list{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wrap>.glist{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  h1{font-size:32px}
  .ring{width:168px;height:168px}
  .sheet{bottom:auto;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:480px;border-radius:20px;padding-block:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet .grab{display:none}
  .toast{bottom:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const G={
palm:["Palm of protein","A piece of cooked meat, fish, eggs or paneer about the size and thickness of your palm, without the fingers. Roughly 100 to 120 g, about 25 to 30 g of protein."],
fist:["Fist of vegetables","Vegetables or salad about the size of your closed fist. Roughly one cup. Very few calories, lots of fullness."],
cupped:["Cupped hand of carbs","Rice, pulao or boiled potato that fits in one cupped hand. About three quarters of a cup. One roti counts the same. Rice OR roti, not both."],
thumb:["Thumb of fat","Oil, ghee, butter or cream about the size of your thumb, roughly one tablespoon. Measure it with a spoon instead of pouring."],
bowl:["Bowl","A normal medium bowl, about 250 ml. Used for daal and for plain yogurt. Yogurt gives protein and calcium for bones."],

palms:["Protein palms","Count every palm-sized portion of protein you eat today. Four is the minimum. Five on days you train."],

macros:["Macros","Short for protein, carbs and fat, the three parts of food that carry energy. P = protein, C = carbs, F = fat, in grams."],
carbs:["Carbs","Rice, roti, bread, potato, sugar. Not bad, just easy to overeat. One cupped hand or one roti per dinner is the rule."],
fat:["Fat","Oil, ghee, cream, nuts. Very high in calories, so it is the easiest thing to cut without feeling hungry. One thumb per meal."],
fast:["Fast","The hours you eat nothing. Water, black coffee and plain tea are fine. The fast is a tool for eating less, not a magic fat burner."],
fastgoal:["Fast goal","Hours from the last bite at night to the first food the next evening. The plan uses about 21 hours: kitchen closed 9:30 PM, break the fast at home around 7:00 PM."],
starter:["Protein starter","The first thing you eat when the fast ends: a bowl of yogurt and two boiled eggs, or a whey shake. Small, fast, high in protein. It stops the ravenous raid on the kitchen."],
closed:["Kitchen closed","No more food after 9:30 PM. Water or plain tea only. This is where most one-meal days quietly turn into too many calories."],
walk:["Post-dinner walk","A gentle 10 to 15 minute walk within half an hour of finishing dinner. It lowers blood sugar after the meal and helps digestion."],
water:["Water bottles","Count each 700 ml bottle you finish. Four bottles is 2.8 L, five is 3.5 L. Aim for four on a normal day and five on a hot day or a motorcycle commute in the heat. A pinch of salt in the first bottle of the morning prevents dizziness."],
streak:["Streak","How many days in a row the kitchen was closed by 9:30 PM. The one habit that keeps a one-meal day from drifting into late-night eating. Missing a day resets it; that is fine, just start again."],
hijri:["Hijri date","The Islamic lunar date, from the Umm al-Qura calendar on this phone (or an arithmetic calendar if the phone lacks it). Local moon sighting can differ by a day: set the offset in Settings."],
sunnahfast:["Sunnah fast day","A day on which voluntary fasting is recommended in the tradition: Mondays and Thursdays, the 13th to 15th of each Hijri month (Ayyam al-Bid), the Day of Arafah and Ashura. You fast daily anyway; whether and how to carry a voluntary intention is a question for a scholar, not this app."],
ramadan:["Ramadan mode","The app follows the Hijri date and switches the fast to Fajr-to-Maghrib for your city, with suhoor and iftar guidance. Goal in Ramadan is to hold weight, not lose it. Force it on or off in Settings if your community's moon sighting differs."],
suhoor:["Suhoor","The pre-dawn meal. It ends at Fajr. Slow carbs plus protein plus water spread out, low salt. The Prophet (peace be upon him) said there is blessing in suhoor (Bukhari 1923)."],
iftar:["Iftar","Breaking the fast at Maghrib: dates and water first, then prayer, then the main plate 20–30 minutes later at your normal dinner portion."],
thuluth:["Rule of thirds (Qānūn al-Thuluth)","From the hadith: one third for food, one third for drink, one third for breath (Tirmidhi 2380). In practice: half the plate vegetables, a quarter protein, a quarter grain; water before the meal, sips during; about 20 minutes per meal; stop at 70–80 % full."],
familyrules:["Family rules","Taken from the Qānūn al-Thuluth project: children are never restricted, the family eats one pot with different portions, meals are together and unhurried, water comes before the meal. The rule of thirds is taught to children as rhythm and gratitude, never as eating less."],
cookfor:["Cook for everyone","The cooking quantity adds up each person's portion: a full plate for the adults, the full plate for a teen, half for a child (as a start) and a third for a toddler, each rounded up. Children may always have more."],
growth:["Growth log","Weight and height, about once a month, for the trend only. The app does not show percentiles or targets; that reading belongs to the paediatrician. A child who is eating, playing and growing along their own line is doing well."],
steps:["Steps","Your phone counts them. 8,000 a day is the target, including the walk after dinner. More is a bonus, not a requirement."],
phase:["Phase","Where you are in the plan. Weeks 1 to 3 are the beginner phase, 4 to 7 intermediate, 8 to 12 intervals, then maintenance. Your start date sets it."],
week:["Week number","Counted from your start date in Settings."],
cycle:["Stationary cycling","Riding an exercise bike that stays in place. No impact on the healed leg, good for the heart, burns calories. Four rides of 30 minutes make 120 minutes a week."],
rpe:["RPE (how hard it feels)","A 1 to 10 scale of effort. 3 to 4: you can talk in full sentences. 5 to 6: short sentences only. 7 to 8: a few words at a time."],
steady:["Steady ride","One continuous ride at an easy, talkable pace. The bread and butter of the cycling plan."],
intervals:["Intervals","Short hard efforts with easy recovery between them, for example 1 minute hard then 2 minutes easy, eight times. Only from week 8."],
recovery:["Active recovery","An easy day. A gentle walk or an easy 15-minute spin plus stretching. Rest is when the body actually improves."],
strength:["Strength training","Lifting or bodyweight exercises that make muscles stronger. It protects muscle while you lose fat and loads the leg bone in a healthy way. Locked until you have lost 5 kg; no equipment needed yet."],
unlock:["Unlocking strength","Strength training switches on automatically once your latest weigh-in is 5 kg below your start weight. Until then: fasting, walking and cycling only."],
deload:["Deload week","One easier week every 6 to 8 weeks: half the usual training. It prevents burnout and lets the body catch up."],
rate:["Weekly rate","How many kg you are losing per week, worked out from your first and latest weigh-ins. Healthy target: 0.45 to 0.65 kg a week."],
projected:["Projected date","If you keep losing at your current weekly rate, this is when you would reach the target. It moves as you log more weigh-ins."],
plateau:["Plateau","Three Monday weigh-ins in a row with no drop and no change in waist. Two flat weeks is normal noise, not a plateau."],
waist:["Waist measurement","Tape around the belly at the navel, relaxed, at the end of a normal breath out. Every second Monday. It shows fat loss even when the scale is stubborn."],
maintenance:["Maintenance week","One planned week every 8 to 10 weeks where you eat a little more (an extra roti or cupped hand) and train lighter. It makes the plan last."],
deficit:["Calorie deficit","Eating a bit less energy than your body uses each day, so it burns stored fat to make up the difference. About 500 to 700 calories a day on this plan."],
strict:["Strict fast","Nothing with any calories at all. Water, black coffee and plain tea only. The religious and research definition."],
fatloss:["Fat-loss fast","The one that matters here. Keeps calories near zero so the day's deficit stays intact. A few calories from ispaghol or a splash of milk do not change the result."],
autophagy:["Autophagy","The body's cell clean-up process, which rises during long fasts. Heavily marketed, but human evidence at 20 to 24 hours is weak. Not something to optimise for weight loss."],
cheat:["Cheat meal","One planned relaxed meal a week, Saturday 7 PM, in place of dinner. One meal, not a whole day. Protein first, one plate, no refill, walk after."],
electrolytes:["Electrolytes","Salt and minerals (sodium, potassium, magnesium) lost in sweat and during fasting. Low sodium causes the dizziness people blame on hunger. A pinch of salt in water fixes it."],
creatine:["Creatine","A safe, well-studied powder that helps muscles hold strength while dieting. 3 to 5 g a day. Causes 1 to 2 kg of harmless water weight in the first week. Start it when strength training unlocks."],
whey:["Whey protein","Milk protein powder. Mixed with water it gives 25 to 30 g of protein in a few seconds. A food, not a drug. Useful as the starter on meatless nights."],
vitd:["Vitamin D","Needed for bone strength around the healed fracture. Very common to be low in Pakistan with an indoor job. 1,000 to 2,000 IU a day with dinner."],
omad:["OMAD","One Meal A Day. Your original routine. It works, but it makes eating enough protein and recovering from exercise harder. The plan uses a small starter plus one plate instead."],
sync:["Synced","Your check-ins and weigh-ins are saved to your Claude account, so the same data appears on your iPhone and your Android phone."],
local:["This device only","Not signed in or offline, so data is saved only in this browser. Sign in to claude.ai and reopen the link to sync."],
viewonly:["View only","You can see everything live: the fast timer, today's check-ins, all progress and weigh-ins, the training week and the full meal list. Only the owner can change entries. Use the five tabs at the bottom to navigate."],

tibia:["Tibia and fibula","The two bones of the lower leg. The tibia is the big shin bone that holds the nail."]

function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.settings=Object.assign(S.settings,j.settings||{});S.fast=Object.assign(S.fast,j.fast||{});S.days=j.days||{};S.weighins=j.weighins||{};S.meals=j.meals||{};S.family=j.family||{}}}catch(e){}}

const queues={};
function dbWrite(path,data){ if(!db||readOnly)return; const run=()=>db.doc(path).set(data).catch(e=>{console.warn("db set",path,e);if(e&&e.code==="invalid_argument"){readOnly=true;setChip();render();toast("View only")}else toast("Could not sync")}); queues[path]=(queues[path]||Promise.resolve()).then(run); }
function dbDelete(path){ if(!db||readOnly)return; const run=()=>db.doc(path).delete().catch(e=>console.warn("db delete",path,e)); queues[path]=(queues[path]||Promise.resolve()).then(run); }
function persistSettings(){saveLocal();dbWrite("settings/main",S.settings)}

async function connect(){
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ syncState="local"; setChip(); render(); return; }
  try{ const u=await window.claude.use("user"); if(u){ const w=await u.can("data.write"); if(w===false){ readOnly=true; setChip(); render(); } } }catch(e){}
  let got=0; const timer=setTimeout(()=>{ if(syncState==="wait"){syncState="local";setChip()} },10000);
  const ready=()=>{ got++; if(got>=6){ clearTimeout(timer); syncState="db"; setChip(); } render(); };
  const err=e=>{ console.warn("db",e); clearTimeout(timer); syncState="local"; setChip(); render(); };
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists)S.settings=Object.assign({},S.settings,s.data()); else if(got<6&&!readOnly)dbWrite("settings/main",S.settings); saveLocal(); ready(); },err);
  db.doc("fast/current").onSnapshot(s=>{ if(s.exists)S.fast=Object.assign({},S.fast,s.data()); saveLocal(); ready(); },err);
  db.collection("days").orderBy("date","desc").limit(120).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.days=o;saveLocal()} ready(); },err);
  db.collection("family").limit(20).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.family=o;saveLocal()} ready(); },err);
  db.collection("meals").limit(200).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.meals=o;saveLocal()} ready(); },err);
  db.collection("weighins").orderBy("date","asc").limit(400).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.weighins=o;saveLocal()} ready(); },err);
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function day(d){ if(!S.days[d])S.days[d]={date:d,water:0,palms:0}; return S.days[d]; }
function weekNo(){const a=new Date(S.settings.startDate+"T00:00:00"),b=new Date(todayStr()+"T00:00:00");return Math.max(1,Math.floor((b-a)/864e5/7)+1)}
function phase(w){return w<=3?CYCLE[0]:w<=7?CYCLE[1]:w<=12?CYCLE[2]:CYCLE[3]}
function weighList(){return Object.values(S.weighins).filter(w=>!w.m||w.m==="tafseer").sort((a,b)=>a.date<b.date?-1:1)}
function currentWeight(){const l=weighList();return l.length?Number(l[l.length-1].weight):Number(S.settings.startWeight)}
function lostKg(){return Number(S.settings.startWeight)-currentWeight()}
function strengthOn(){return lostKg()>=(S.settings.unlockKg||5)}
function planFor(wd){return (strengthOn()?PLAN1:PLAN0)[wd]}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function hhmm(ms){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

function ageOf(dob){if(!dob)return null;const b=new Date(dob+"T00:00:00"),n=new Date();if(isNaN(b)||b>n)return null;let months=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());if(n.getDate()<b.getDate())months--;return {years:Math.floor(months/12),months}}

const STAGE_LABEL={infant:"Infant",toddler:"Toddler",child:"Child",teen:"Teen",adult:"Adult"};
function ageLabel(m){const a=ageOf(m.dob);if(!a)return "age not set";return a.years<2?a.months+" months":a.years+" years"}
/* Portion factors against the adult plate (Thuluth 14 §6): toddler ⅓, child ½ as a START, teen the full plate, always rounded UP to a quarter. Children may always have seconds. */
function portionFactor(m){const s=stageOf(m);if(s==="adult")return m.goal==="fat_loss"?1:1;if(s==="teen")return 1;if(s==="child")return 0.5;if(s==="toddler")return 0.34;return 0}
function roundUpQ(q){return Math.ceil(q*4-1e-9)/4}
function memberPortions(meal,m){const f=portionFactor(m);if(!f)return [];return normItems(meal.items).map(it=>{const fd=FOODS[it.f];return portion(roundUpQ(it.q*f),fd)})}
function cookQuantities(meal){const tot={};normItems(meal.items).forEach(it=>{tot[it.f]=0});members().forEach(m=>{const f=portionFactor(m);if(!f)return;normItems(meal.items).forEach(it=>{tot[it.f]+=roundUpQ(it.q*f)})});return Object.keys(tot).map(k=>portion(Math.ceil(tot[k]*2)/2,FOODS[k]))}
function memberWeighs(id){return Object.values(S.weighins).filter(w=>(w.m||"tafseer")===id).sort((a,b)=>a.date<b.date?-1:1)}
function initials(n){return (n||"?").trim().slice(0,1).toUpperCase()}
function childGuide(m){const s=stageOf(m),a=ageOf(m.dob);const yrs=a?a.years:null;
  const plate=s==="toddler"?"Small quarters: a little protein, a little rice or roti, a little vegetable, some fruit or yogurt. Tiny portions, offered often. Milk after the meal, not before.":"Quarters, not thirds: protein, grain, vegetables, and fruit or dairy, in roughly equal parts. The first serving is a start; seconds whenever still hungry. No calorie talk, ever.";
  const fast=s==="infant"||s==="toddler"||(yrs!==null&&yrs<7)?"No fasting at all under 7. Join the family at suhoor if awake, open iftar with a date, help set the table.":s==="child"?"Practice fasts only, chosen by you: until Dhuhr or until Asr, at most 3 a week, suhoor always, never on a very hot day. Stop at once for dizziness, headache, unusual tiredness, no urine for 6 hours, vomiting: give water and food.":"From puberty fasting is an obligation in Islamic law; the app supports full fasts with the same stop signs, and suhoor and iftar portions are never reduced. If puberty is uncertain, that is a question for a scholar, not this app.";
  const water=s==="toddler"?"Water in a cup at the table; no milk or juice in the hour before meals.":"Half a glass on waking, water at the table, nothing sweet in the hour before meals. Chai is not for children.";
  return {plate,fast,water}}

/* ---------- Hijri calendar, Sunnah fast days, prayer times (ported from the Qanun al-Thuluth project) ---------- */
const HIJRI_MONTHS=["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Ula","Jumada al-Akhirah","Rajab","Sha'ban","Ramadan","Shawwal","Dhu al-Qa'dah","Dhu al-Hijjah"];
const ISLAMIC_EPOCH=1948439.5;
function islamicToJd(y,m,d){return d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+ISLAMIC_EPOCH-1}
function tabularHijri(dt){const jd=Math.floor(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate())/864e5+2440587.5)+0.5;const year=Math.floor((30*(jd-ISLAMIC_EPOCH)+10646)/10631);const month=Math.min(12,Math.ceil((jd-(29+islamicToJd(year,1,1)))/29.5)+1);const day=jd-islamicToJd(year,month,1)+1;return {year,month,day,cal:"tabular"}}
let _umf;
function hijriOf(dateStr){const off=Number((S.settings||{}).hijriOffset||0);const [y,m,d]=dateStr.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d,12)-off*864e5);
  if(_umf===undefined){try{const f=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{timeZone:"UTC",year:"numeric",month:"numeric",day:"numeric"});_umf=f.resolvedOptions().calendar==="islamic-umalqura"?f:null}catch(e){_umf=null}}
  if(_umf){try{const p=_umf.formatToParts(dt);const n=t=>Number(((p.find(x=>x.type===t)||{}).value||"").replace(/\D/g,""));const r={year:n("year"),month:n("month"),day:n("day"),cal:"umalqura"};if(r.year&&r.month&&r.day)return r}catch(e){}}
  return tabularHijri(dt)}
function hijriLabel(h){return h.day+" "+HIJRI_MONTHS[h.month-1]+" "+h.year}
/* Sunnah fast days: Monday/Thursday, Ayyam al-Bid (13–15, not Ramadan), Arafah (9 Dhu al-Hijjah), Ashura (10 Muharram + 9th). Never suggested: Ramadan, 1 Shawwal, 10–13 Dhu al-Hijjah. The app suggests; it never rules. */
function sunnahFast(dateStr){const h=hijriOf(dateStr),t=(S.settings||{}).tradition||"sunni";const {month,day}=h;
  if(month===9)return null;if(month===10&&day===1)return null;if(month===12&&day===10)return null;if(t!=="shia"&&month===12&&day>=11&&day<=13)return null;
  if(month===12&&day===9)return {k:"arafah",t:"Day of Arafah"};
  if(t!=="shia"&&month===1&&(day===10||day===9))return {k:"ashura",t:day===10?"Ashura (10 Muharram)":"9 Muharram, with Ashura"};
  if(day>=13&&day<=15)return {k:"bid",t:"Ayyam al-Bid ("+day+"th)"};
  const wd=new Date(dateStr+"T12:00:00").getDay();
  if(t!=="shia"&&(wd===1||wd===4))return {k:"monthu",t:wd===1?"Monday Sunnah fast":"Thursday Sunnah fast"};
  return null}
/* Solar position (Meeus) and prayer times, University of Islamic Sciences Karachi method: Fajr 18°, Isha 18°, Maghrib at sunset. */
const DEG=Math.PI/180,sn=d=>Math.sin(d*DEG),cs=d=>Math.cos(d*DEG);
function fixAngle(a){const r=a%360;return r<0?r+360:r}
function julianDay(y,m,d){if(m<=2){y-=1;m+=12}const a=Math.floor(y/100),b=2-a+Math.floor(a/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5}
function solarPosition(jd){const t=(jd-2451545)/36525;const l0=fixAngle(280.46646+t*(36000.76983+0.0003032*t));const m=fixAngle(357.52911+t*(35999.05029-0.0001537*t));const e=0.016708634-t*(0.000042037+0.0000001267*t);const c=sn(m)*(1.914602-t*(0.004817+0.000014*t))+sn(2*m)*(0.019993-0.000101*t)+sn(3*m)*0.000289;const omega=125.04-1934.136*t;const lambda=l0+c-0.00569-0.00478*sn(omega);const eps0=23+(26+(21.448-t*(46.815+t*(0.00059-t*0.001813)))/60)/60;const eps=eps0+0.00256*cs(omega);const declination=Math.asin(sn(eps)*sn(lambda))/DEG;const y=Math.tan(eps/2*DEG)**2,l0r=l0*DEG,mr=m*DEG;const eot=y*Math.sin(2*l0r)-2*e*Math.sin(mr)+4*e*y*Math.sin(mr)*Math.cos(2*l0r)-0.5*y*y*Math.sin(4*l0r)-1.25*e*e*Math.sin(2*mr);return {declination,eot:(4*eot)/DEG}}
function hourAngle(alt,lat,decl){const x=(sn(alt)-sn(lat)*sn(decl))/(cs(lat)*cs(decl));if(x<-1||x>1)return NaN;return Math.acos(x)/DEG}
function prayerTimes(dateStr,lat,lon){const [y,m,d]=dateStr.split("-").map(Number);const jd0=julianDay(y,m,d);const noonAt=h=>12-lon/15-solarPosition(jd0+h/24).eot/60;let noon=12-lon/15;for(let i=0;i<3;i++)noon=noonAt(noon);
  const atAlt=(alt,side)=>{let t=noon+side*6;for(let i=0;i<4;i++){const {declination}=solarPosition(jd0+t/24);const h=hourAngle(alt,lat,declination);if(isNaN(h))return NaN;t=noonAt(t)+side*h/15}return t};
  const sunrise=atAlt(-0.8333,-1),sunset=atAlt(-0.8333,1);if(isNaN(sunrise)||isNaN(sunset))return null;const night=24-(sunset-sunrise);
  let fajr=atAlt(-18,-1);const safeF=sunrise-night/2;if(isNaN(fajr)||safeF>fajr)fajr=safeF;
  let isha=atAlt(-18,1);const safeI=sunset+night/2;if(isNaN(isha)||safeI<isha)isha=safeI;
  const base=Date.UTC(y,m-1,d);const at=h=>new Date(base+Math.round(h*60)*6e4);
  return {fajr:at(fajr),sunrise:at(sunrise),dhuhr:at(noon+1/60),maghrib:at(sunset),isha:at(isha)}}
const CITIES={karachi:["Karachi",24.8607,67.0011],lahore:["Lahore",31.5204,74.3587],islamabad:["Islamabad",33.6844,73.0479],rawalpindi:["Rawalpindi",33.5651,73.0169],faisalabad:["Faisalabad",31.4504,73.135],multan:["Multan",30.1575,71.5249],peshawar:["Peshawar",34.0151,71.5249],quetta:["Quetta",30.1798,66.975],hyderabad:["Hyderabad",25.396,68.3578],gujranwala:["Gujranwala",32.1877,74.1945],sialkot:["Sialkot",32.4945,74.5229]};
function fastingTimes(dateStr){const c=CITIES[(S.settings||{}).city]||CITIES.karachi;const t=prayerTimes(dateStr,c[1],c[2]);if(!t)return null;return {city:c[0],fajr:t.fajr,imsak:new Date(t.fajr.getTime()-10*6e4),maghrib:t.maghrib,isha:t.isha}}
function ramadanActive(){const mode=(S.settings||{}).ramadan||"auto";if(mode==="on")return true;if(mode==="off")return false;return hijriOf(todayStr()).month===9}

/* ---------- meal maths ---------- */
function normItems(items){return (items||[]).map(it=>Array.isArray(it)?{f:it[0],q:Number(it[1])}:{f:it.f,q:Number(it.q)}).filter(it=>FOODS[it.f]&&it.q>0)}
function mealCalc(m){let k=0,p=0,c=0,f=0;normItems(m.items).forEach(it=>{const fd=FOODS[it.f];k+=fd.kcal*it.q;p+=fd.p*it.q;c+=fd.c*it.q;f+=fd.f*it.q});return {kcal:Math.round(k/5)*5,p:Math.round(p),c:Math.round(c),f:Math.round(f)}}
function qtyStr(q){const w=Math.floor(q),r=q-w;const fr=r>=.74?"¾":r>=.49?"½":r>=.24?"¼":"";return (w?w:"")+(fr?(w?" ":"")+fr:"")||String(q)}
function portion(q,fd){const u=UNITS[fd.u]||["",""];return (qtyStr(q)+" "+(q<=1?u[0]:u[1])+" "+(fd.short||"")).replace(/\s+/g," ").trim()}
function hands(m){const g={protein:[],veg:[],carb:[],fat:[],plus:[]};normItems(m.items).forEach(it=>{const fd=FOODS[it.f];g[fd.cat].push(portion(it.q,fd))});return g}
function handLine(m){const g=hands(m);return [].concat(g.protein,g.veg,g.carb,g.fat,g.plus).join(" · ")}
function allMeals(){const o=S.meals||{};const list=BASE_MEALS.map(b=>{const v=o[b.id];if(v&&v.deleted)return null;return Object.assign({},b,v||{},{base:true})}).filter(Boolean);Object.values(o).forEach(v=>{if(v&&v.id&&/^c_/.test(v.id)&&!v.deleted)list.push(Object.assign({},v,{base:false}))});return list}
function tonightMeal(){const l=allMeals();if(!l.length)return null;return l[(new Date().getDate()+new Date().getMonth())%l.length]}
function foodOptions(sel){const cats=[["protein","Protein"],["veg","Vegetables"],["carb","Carbs"],["fat","Fats"],["plus","Daal, dairy & extras"]];return cats.map(c=>`<optgroup label="${c[1]}">${Object.keys(FOODS).filter(k=>FOODS[k].cat===c[0]).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(FOODS[k].n)} · ${esc(FOODS[k].ur||"")} · per ${esc((UNITS[FOODS[k].u]||[""])[0]||"item")}</option>`).join("")}</optgroup>`).join("")}
function mealTotals(d){const t=mealCalc(d);const line=handLine(d);return `${mbar(t)}<p class="small"><b>By hand:</b> ${line?esc(line):"<span class='muted'>add foods to see the portions</span>"}</p>`}
function mealEditor(d){return `

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`}

  <text x="46" y="84" text-anchor="middle" font-family="Outfit,sans-serif" font-size="11" font-weight="600" fill="var(--green)">2 fists</text>
  <text x="108" y="56" text-anchor="middle" font-family="Outfit,sans-serif" font-size="11" font-weight="600" fill="var(--accent-text)">2 palms</text>

function chart(ws){
  const st=S.settings,W=360,H=190,L=34,R=10,T=12,B=26;
  const start=new Date(st.startDate+"T00:00:00");
  const planWeeks=Math.max(8,Math.ceil((st.startWeight-st.targetWeight)/0.5)+2);
  let endMs=start.getTime()+planWeeks*7*864e5;
  if(ws.length){endMs=Math.max(endMs,new Date(ws[ws.length-1].date+"T00:00:00").getTime()+14*864e5)}
  const span=endMs-start.getTime();
  const ys=[st.startWeight,st.targetWeight].concat(ws.map(w=>Number(w.weight)));
  const ymin=Math.floor(Math.min.apply(null,ys))-1,ymax=Math.ceil(Math.max.apply(null,ys))+1;
  const X=ms=>L+(ms-start.getTime())/span*(W-L-R),Y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
  let g="";for(let v=ymin;v<=ymax;v+=(ymax-ymin>12?4:2)){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`}
  const months=[];let m=new Date(start.getFullYear(),start.getMonth()+1,1);while(m.getTime()<endMs){months.push(m);m=new Date(m.getFullYear(),m.getMonth()+1,1)}
  const xl=months.map(d=>`<text x="${X(d.getTime()).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.toLocaleDateString(undefined,{month:"short"})}</text>`).join("");
  const expEnd=start.getTime()+((st.startWeight-st.targetWeight)/0.5)*7*864e5;
  const exp=`<line class="exp" x1="${X(start.getTime()).toFixed(1)}" y1="${Y(st.startWeight).toFixed(1)}" x2="${X(Math.min(expEnd,endMs)).toFixed(1)}" y2="${Y(Math.max(st.targetWeight,st.startWeight-0.5*(Math.min(expEnd,endMs)-start.getTime())/864e5/7)).toFixed(1)}"/>`;
  const tgt=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${Y(st.targetWeight).toFixed(1)}" y2="${Y(st.targetWeight).toFixed(1)}"/>`;
  const pts=ws.map(w=>[X(new Date(w.date+"T00:00:00").getTime()),Y(Number(w.weight))]);
  let act="";if(pts.length){const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const lp=pts[pts.length-1];act=`<path fill="url(#areaGrad)" d="${path} L${lp[0].toFixed(1)} ${(H-B).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H-B).toFixed(1)} Z"/><path class="act" d="${path}"/>`+pts.slice(0,-1).map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("")+`<circle class="ptl" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="4.5"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time against the expected 0.5 kg per week line"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>${g}${xl}${tgt}${exp}${act}</svg><div class="mkey"><span><i style="background:var(--accent)"></i>your weigh-ins</span><span><i style="background:var(--muted)"></i>plan, 0.5 kg/week</span><span><i style="background:var(--green)"></i>target</span></div>`;
}
function glossaryList(q){q=(q||"").trim().toLowerCase();const keys=Object.keys(G).filter(k=>!["sync","local","viewonly"].includes(k));const hits=q?keys.filter(k=>(G[k][0]+" "+G[k][1]).toLowerCase().includes(q)):keys.slice(0,6);return hits.length?hits.map(k=>`<button data-a="info" data-k="${k}"><b>${esc(G[k][0])}</b><span>${esc(G[k][1])}</span></button>`).join(""):`<p class="small muted">No term matches "${esc(q)}".</p>`}

    <div class="scroll"><table class="tbl"><tbody>

  if(a==="me_add"){d.items.push({f:"salad",q:1});render();return true}
  if(a==="me_del"){d.items.splice(Number(b.dataset.i),1);render();return true}
  if(a==="me_save"){const n=(document.getElementById("me_n")||{}).value||d.n;d.n=n.trim();d.items=d.items.filter(it=>FOODS[it.f]&&it.q>0);if(!d.n){toast("Give the meal a name");return true}if(!d.items.length){toast("Add at least one food");return true}const id=d.id||("c_"+Date.now().toString(36));const rec={id,n:d.n,tag:d.tag,note:d.note||"",items:d.items.map(it=>({f:it.f,q:it.q}))};S.meals[id]=rec;persistMeal(id);S._medit=null;S._mopen=id;toast("Meal saved · "+mealCalc(rec).kcal+" kcal");render();return true}
  if(a==="me_reset"){removeMeal(d.id);S._medit=null;toast("Reset to default");render();return true}
  if(a==="me_delete"){if(d.base){S.meals[d.id]={id:d.id,deleted:true};persistMeal(d.id);toast("Hidden")}else{removeMeal(d.id);toast("Deleted")}S._medit=null;render();return true}
  return false;
}
document.addEventListener("change",e=>{
  const t=e.target,d=S._medit;
  if(t.id==="me_tag"&&d){d.tag=t.value;return}
  if(t.dataset&&t.dataset.me&&d){const i=Number(t.dataset.i);if(!d.items[i])return;if(t.dataset.me==="food")d.items[i].f=t.value;else d.items[i].q=Math.max(0,Math.min(12,parseFloat(t.value)||0));refreshTotals()}
});
document.addEventListener("input",e=>{
  const t=e.target,d=S._medit;
  if(t.id==="me_n"&&d)d.n=t.value;
  if(t.id==="me_note"&&d)d.note=t.value;
  if(t.dataset&&t.dataset.me==="qty"&&d){const i=Number(t.dataset.i);if(d.items[i]){d.items[i].q=Math.max(0,Math.min(12,parseFloat(t.value)||0));refreshTotals()}}
});

const VIEWS={today:vToday,plate:vPlate,family:vFamily,train:vTrain,progress:vProgress,guide:vGuide};
const TAB_ICON={today:"clock",plate:"plate",family:"family",train:"bike",progress:"trend",guide:"book"};
function render(){
  const v=document.getElementById("view");
  const scroll=v.parentElement.scrollTop;
  v.innerHTML=VIEWS[tab]();
  v.parentElement.scrollTop=scroll;
  document.getElementById("tabs").innerHTML=["today","plate","family","train","progress","guide"].map(k=>`<button class="${k===tab?"on":""}" data-a="tab" data-v="${k}" aria-label="${k}" aria-current="${k===tab?"page":"false"}"><span class="ib">${ic(TAB_ICON[k])}</span>${k}</button>`).join("");
  tick();
}
function tick(){
  const mt=document.getElementById("mealT");if(mt&&S._meal){const ms=Date.now()-S._meal;mt.textContent=hhmm(ms).slice(3);const mm=document.getElementById("mealMsg");if(mm){mm.textContent=ms<5*6e4?"Bismillah. Protein first. Spoon down between bites.":ms<15*6e4?"Halfway. Small sips of water only. Keep chewing slowly.":ms<20*6e4?"Fullness check: could you eat more if you had to? If yes, you have had enough. Wait 15 minutes before any seconds.":"20 minutes done. Alhamdulillah. Walk in 30 minutes; chai at least an hour after eating."}}
  const rc=document.getElementById("rCount");if(rc){const ft=fastingTimes(todayStr());if(ft){const now=Date.now();if(now<ft.fajr){rc.textContent="Suhoor ends in "+hhmm(ft.fajr-now).slice(0,5)+" h"}else if(now<ft.maghrib){rc.textContent="Iftar in "+hhmm(ft.maghrib-now).slice(0,5)+" h"}else{const ft2=fastingTimes(todayStr(new Date(now+864e5)));rc.textContent="Fast over for today. Next suhoor ends "+(ft2?fmtClock(ft2.fajr):"")}}}
  const bar=document.getElementById("ringBar");if(!bar)return;
  const t=document.getElementById("ringTime"),s=document.getElementById("ringSub");
  if(!S.fast.startedAt){bar.style.strokeDashoffset=326.7;return}
  let goal=(S.settings.fastHours||21)*36e5;if(ramadanActive()){const ft=fastingTimes(todayStr());if(ft)goal=ft.maghrib-ft.fajr}
  const ms=Date.now()-new Date(S.fast.startedAt).getTime(),frac=Math.min(1,ms/goal);
  bar.style.strokeDashoffset=(326.7*(1-frac)).toFixed(1);
  t.textContent=hhmm(Math.max(0,ms));
  s.textContent=ms>=goal?"goal reached":(hhmm(goal-ms).slice(0,5)+" to go");
  const gl=document.getElementById("kvGoal");if(gl)gl.textContent=(goal/36e5).toFixed(1)+" h";
}
setInterval(tick,1000);
function openInfo(k){const g=G[k];if(!g)return;document.getElementById("sheetTitle").textContent=g[0];document.getElementById("sheetBody").textContent=g[1];document.getElementById("sheet").classList.add("show");document.getElementById("scrim").classList.add("show");document.getElementById("sheetClose").focus()}
function closeInfo(){document.getElementById("sheet").classList.remove("show");document.getElementById("scrim").classList.remove("show")}
document.getElementById("scrim").addEventListener("click",closeInfo);
document.getElementById("sheetClose").addEventListener("click",closeInfo);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeInfo();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-a]:not(button):not(input)")){e.preventDefault();e.target.click()}});
document.addEventListener("toggle",e=>{const dt=e.target;if(dt.tagName==="DETAILS"&&dt.dataset.fid){S._fo=S._fo||{};S._fo[dt.dataset.fid]=dt.open}if(dt.tagName==="DETAILS"&&dt.dataset.mid){S._mopen=dt.open?dt.dataset.mid:(S._mopen===dt.dataset.mid?null:S._mopen)}},true);
document.addEventListener("input",e=>{if(e.target.id==="gq"){S._gq=e.target.value;document.getElementById("gres").innerHTML=glossaryList(S._gq)}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,t=todayStr();
  if(a==="info"){e.preventDefault();e.stopPropagation();openInfo(b.dataset.k);return}
  if(a==="tab"){tab=b.dataset.v;history.replaceState(null,"","#"+tab);render();document.querySelector("main").scrollTop=0;return}
  if(a==="mf"){S._mf=b.dataset.v;render();return}
  if(a==="ff"){S._ff=b.dataset.v;render();return}
  if(readOnly){toast("View only");return}
  if(a==="ftimes"){S._ft=!S._ft;render();return}
  if(a==="rfajr"){const ft=fastingTimes(t);if(ft){S.fast={startedAt:ft.fajr.toISOString(),lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();toast("Fasting since Fajr "+fmtClock(ft.fajr));render()}return}
  if(a==="mealstart"){S._meal=Date.now();render();return}
  if(a==="mealstop"){const m=Math.round((Date.now()-S._meal)/6e4);S._meal=null;toast(m>=15?"Meal took "+m+" min. Well paced.":"Meal took "+m+" min. Try to slow down tomorrow.");render();return}
  if(a==="ftcancel"){S._ft=false;render();return}
  if(/^me_/.test(a)){mealAction(a,b);return}
  if(a==="startfast"){S.fast={startedAt:new Date().toISOString(),lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();toast("Fast started");render();return}
  if(a==="startfast930"){const d=new Date();d.setHours(21,30,0,0);if(d>new Date())d.setDate(d.getDate()-1);S.fast={startedAt:d.toISOString(),lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();toast("Fast started from 9:30 PM");render();return}
  if(a==="cancelfast"){S.fast={startedAt:null,lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();render();return}
  if(a==="endfast"){const h=(Date.now()-new Date(S.fast.startedAt).getTime())/36e5;S.fast={startedAt:null,lastHours:Math.round(h*10)/10,lastEndedAt:new Date().toISOString()};persistFast();const d=day(t);d.fastH=Math.round(h*10)/10;persistDay(t);toast("Fast ended: "+h.toFixed(1)+" h");render();return}
  if(a==="dot"){const d=day(t),f=b.dataset.f,v=Number(b.dataset.v);d[f]=(d[f]||0)===v?v-1:v;persistDay(t);render();return}
  if(a==="tog"){const d=day(t);d[b.dataset.k]=!d[b.dataset.k];persistDay(t);render();return}
  if(a==="delw"){removeWeigh(b.dataset.d);toast("Removed");render();return}
  if(a==="fedit"){S._fedit=b.dataset.id;S._fo=S._fo||{};S._fo[b.dataset.id]=true;render();return}
});
document.addEventListener("submit",e=>{
  if(readOnly){e.preventDefault();return}
  if(e.target.classList&&e.target.classList.contains("fam-form")){e.preventDefault();const id=e.target.dataset.m;const rec=Object.assign({},S.family[id]||{},{id});e.target.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;let v=el.value;if(k==="startWeight"||k==="targetWeight"){v=parseFloat(v);if(!(v>0)){delete rec[k];return}}if(k==="name"&&!v.trim())return;rec[k]=v});S.family[id]=rec;persistFamily(id);S._fedit=null;S._fo=S._fo||{};S._fo[id]=true;toast("Saved");render();return}
  if(e.target.classList&&e.target.classList.contains("grow-form")){e.preventDefault();const id=e.target.dataset.m;const g=k=>{const el=e.target.querySelector(`[data-k="${k}"]`);return el?el.value:""};const date=g("date"),kg=parseFloat(g("weight")),h=parseFloat(g("height")),wc=parseFloat(g("waist"));if(!date||!(kg>0))return;const key=id==="tafseer"?date:id+"-"+date;const r={date,weight:Math.round(kg*10)/10};if(id!=="tafseer")r.m=id;if(h>0)r.height=Math.round(h*2)/2;if(wc>0)r.waist=Math.round(wc*2)/2;S.weighins[key]=r;persistWeigh(key);S._fo=S._fo||{};S._fo[id]=true;toast("Logged "+kg.toFixed(1)+" kg");render();return}
  if(e.target.id==="fform"){e.preventDefault();const sv=document.getElementById("f_start").value,ev=document.getElementById("f_end").value;if(!sv)return;const st=new Date(sv);if(isNaN(st))return;if(ev){const en=new Date(ev);if(isNaN(en)||en<=st){toast("End must be after start");return}const h=(en-st)/36e5;if(h>72){toast("That is longer than 72 h; check the dates");return}S.fast={startedAt:null,lastHours:Math.round(h*10)/10,lastEndedAt:en.toISOString()};persistFast();const k=todayStr(en),dd=day(k);dd.fastH=Math.round(h*10)/10;persistDay(k);toast("Logged "+h.toFixed(1)+" h fast")}else{if(st>new Date()){toast("Start is in the future");return}S.fast={startedAt:st.toISOString(),lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();toast("Start time set")}S._ft=false;render();return}
  if(e.target.id==="wform"){e.preventDefault();const d=document.getElementById("wdate").value,kg=parseFloat(document.getElementById("wkg").value),cm=parseFloat(document.getElementById("wcm").value);if(!d||!(kg>0))return;const r={date:d,weight:Math.round(kg*10)/10};if(cm>0)r.waist=Math.round(cm*2)/2;S.weighins[d]=r;persistWeigh(d);toast("Saved "+kg.toFixed(1)+" kg"+(strengthOn()?" · strength unlocked!":""));render()}
  if(e.target.id==="sform"){e.preventDefault();const sw=parseFloat(document.getElementById("s_sw").value),tw=parseFloat(document.getElementById("s_tw").value),sd=document.getElementById("s_sd").value,fh=parseInt(document.getElementById("s_fh").value,10),uk=parseFloat(document.getElementById("s_uk").value);if(sw>0)S.settings.startWeight=sw;if(tw>0)S.settings.targetWeight=tw;if(sd)S.settings.startDate=sd;if(fh>=14&&fh<=24)S.settings.fastHours=fh;if(uk>0)S.settings.unlockKg=uk;const cty=document.getElementById("s_city"),ram=document.getElementById("s_ram"),hoff=document.getElementById("s_hoff"),trad=document.getElementById("s_trad");if(cty&&CITIES[cty.value])S.settings.city=cty.value;if(ram)S.settings.ramadan=ram.value;if(hoff)S.settings.hijriOffset=Number(hoff.value);if(trad)S.settings.tradition=trad.value;persistSettings();toast("Settings saved");render()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab){tab=h;render()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

loadLocal();render();setChip();
