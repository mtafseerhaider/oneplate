<style>
/* Layout: one-screen app. Sticky top band, scrolling main, bottom tab bar. Saffron accent on a cool green-grey ground. */
:root{
  --bg:#F3F6F2; --panel:#FFFFFF; --fg:#1B2823; --muted:#5B6B63; --line:#D9E1DB;
  --accent:#C9791A; --accent-ink:#FFFFFF; --soft:#FBEFD9;
  --green:#2E7D5B; --green-soft:#DDF0E5; --amber:#B8860B; --amber-soft:#FBF0CC; --red:#B4433A; --red-soft:#F8DEDA;
  --display:"Outfit",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111816; --panel:#1A2320; --fg:#E7EDE8; --muted:#9DAAA2; --line:#2B3732;
  --accent:#F0A63A; --accent-ink:#1B1308; --soft:#2E2414;
  --green:#5CC693; --green-soft:#17372A; --amber:#E2B84A; --amber-soft:#3A3014; --red:#F08A80; --red-soft:#3F1F1C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111816; --panel:#1A2320; --fg:#E7EDE8; --muted:#9DAAA2; --line:#2B3732;
  --accent:#F0A63A; --accent-ink:#1B1308; --soft:#2E2414;
  --green:#5CC693; --green-soft:#17372A; --amber:#E2B84A; --amber-soft:#3A3014; --red:#F08A80; --red-soft:#3F1F1C; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
#app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:inset 0 0 0 3px var(--bg),0 0 0 2px var(--accent)}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.chip.local{background:var(--amber-soft);color:var(--amber)}
.chip.wait{background:var(--line);color:var(--muted)}
main{flex:1;min-height:0;overflow-y:auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{appearance:none;background:none;border:0;color:var(--muted);font:600 11px var(--body);letter-spacing:.03em;text-transform:uppercase;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.accent{background:var(--soft);border-color:transparent}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
button.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.danger{color:var(--red);border-color:var(--red-soft)}
button.btn:focus-visible,.check:focus-visible,.stepper button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.btn.wide{width:100%}
.timer{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none;stroke-width:10}
.ring .bar{stroke:var(--accent);fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ring .lbl b{font-size:22px;font-weight:500}
.ring .lbl span{font-size:11px;color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center}
.check.done .box{background:var(--green);border-color:var(--green)}
.check.done .box::after{content:"";width:6px;height:11px;border:solid var(--panel);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{flex:1;min-width:0}
.check .t small{display:block;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 18px var(--body);cursor:pointer;line-height:1}
.stepper b{font-family:var(--mono);min-width:28px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.soft{background:var(--soft);color:var(--accent)}
.plate{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plate div{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.plate div b{font-family:var(--display);font-size:15px}
.plate .pr{background:var(--soft)}.plate .vg{background:var(--green-soft)}.plate .cb{background:var(--amber-soft)}.plate .ft{background:var(--line)}
.plate div span{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 12px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 14px}
details summary{cursor:pointer;padding:12px 0;font-family:var(--display);font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-weight:500;color:var(--muted);font-size:18px}
details[open] summary::after{content:"–"}

.macros{display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.macros b{color:var(--fg);font-weight:500}
.hands{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.hands span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl tr.today td{background:var(--soft)}
.scroll{overflow-x:auto;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t small{color:var(--muted);display:block;font-size:12px}
.kcal{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=number],input[type=date],input[type=text],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .exp{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .act{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .area{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.chart .tgt{stroke:var(--green);stroke-width:1;stroke-dasharray:2 3}
.log{display:flex;flex-direction:column;gap:6px}
.log .r{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding:6px 0;border-bottom:1px solid var(--line)}
.log .r button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:2px 4px}
.rules{counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rules div{display:flex;gap:12px;align-items:flex-start}
.rules div::before{counter-increment:r;content:counter(r);font-family:var(--display);font-weight:700;color:var(--accent);font-size:22px;line-height:1;min-width:22px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--muted);padding:10px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const queues={};
function dbWrite(path,data){ if(!db)return; const run=()=>db.doc(path).set(data).catch(e=>{console.warn("db set",path,e);toast("Could not sync: "+(e&&e.code||"error"))}); queues[path]=(queues[path]||Promise.resolve()).then(run); }
function dbDelete(path){ if(!db)return; const run=()=>db.doc(path).delete().catch(e=>console.warn("db delete",path,e)); queues[path]=(queues[path]||Promise.resolve()).then(run); }

async function connect(){
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ syncState="local"; setChip(); render(); return; }
  let got=0; const timer=setTimeout(()=>{ if(syncState==="wait"){syncState="local";setChip()} },10000);
  const ready=()=>{ got++; if(got>=4){ clearTimeout(timer); syncState="db"; setChip(); } render(); };
  const err=e=>{ console.warn("db",e); clearTimeout(timer); syncState="local"; setChip(); render(); };
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists)S.settings=Object.assign({},S.settings,s.data()); else if(got<4)dbWrite("settings/main",S.settings); saveLocal(); ready(); },err);
  db.doc("fast/current").onSnapshot(s=>{ if(s.exists)S.fast=Object.assign({},S.fast,s.data()); saveLocal(); ready(); },err);
  db.collection("days").orderBy("date","desc").limit(120).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.days=o;saveLocal()} ready(); },err);
  db.collection("weighins").orderBy("date","asc").limit(400).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.weighins=o;saveLocal()} ready(); },err);
}

function chart(ws){
  const st=S.settings,W=360,H=190,L=34,R=10,T=12,B=26;
  const start=new Date(st.startDate+"T00:00:00");
  const planWeeks=Math.max(8,Math.ceil((st.startWeight-st.targetWeight)/0.5)+2);
  let endMs=start.getTime()+planWeeks*7*864e5;
  if(ws.length){endMs=Math.max(endMs,new Date(ws[ws.length-1].date+"T00:00:00").getTime()+14*864e5)}
  const span=endMs-start.getTime();
  const ys=[st.startWeight,st.targetWeight].concat(ws.map(w=>Number(w.weight)));
  const ymin=Math.floor(Math.min.apply(null,ys))-1,ymax=Math.ceil(Math.max.apply(null,ys))+1;
  const X=ms=>L+(ms-start.getTime())/span*(W-L-R),Y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
  let g="";for(let v=ymin;v<=ymax;v+=(ymax-ymin>12?4:2)){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`}
  const months=[];let m=new Date(start.getFullYear(),start.getMonth()+1,1);while(m.getTime()<endMs){months.push(m);m=new Date(m.getFullYear(),m.getMonth()+1,1)}
  const xl=months.map(d=>`<text x="${X(d.getTime()).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.toLocaleDateString(undefined,{month:"short"})}</text>`).join("");
  const expEnd=start.getTime()+((st.startWeight-st.targetWeight)/0.5)*7*864e5;
  const exp=`<line class="exp" x1="${X(start.getTime()).toFixed(1)}" y1="${Y(st.startWeight).toFixed(1)}" x2="${X(Math.min(expEnd,endMs)).toFixed(1)}" y2="${Y(Math.max(st.targetWeight,st.startWeight-0.5*(Math.min(expEnd,endMs)-start.getTime())/864e5/7)).toFixed(1)}"/>`;
  const tgt=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${Y(st.targetWeight).toFixed(1)}" y2="${Y(st.targetWeight).toFixed(1)}"/>`;
  const pts=ws.map(w=>[X(new Date(w.date+"T00:00:00").getTime()),Y(Number(w.weight))]);
  let act="";if(pts.length){const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");act=`<path class="area" d="${path} L${pts[pts.length-1][0].toFixed(1)} ${(H-B).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H-B).toFixed(1)} Z"/><path class="act" d="${path}"/>`+pts.map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join("")}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time against the expected 0.5 kg per week line">${g}${xl}${tgt}${exp}${act}</svg><p class="small muted">Solid: your weigh-ins. Dashed: the plan's 0.5 kg/week line. Dotted: target.</p>`;
}
function vGuide(){

  return `
  <div><p class="eyebrow">Reference</p><h1>Guide</h1></div>

    <p class="eyebrow">The only 5 rules</p>

      <div><p><b>During the fast, drink only what has nothing in it.</b> Water, black coffee, plain tea.</p></div>
      <div><p><b>Four palms of protein every day.</b> One at 5:45 PM before leaving the office, three at dinner.</p></div>

    </div>
  </section>
  <h2>Fasting traffic light</h2>
  <div class="seg">${[["all","All"],["green","Green"],["amber","Yellow"],["red","Red"]].map(k=>`<button class="${f===k[0]?"on":""}" data-a="ff" data-v="${k[0]}">${k[1]}</button>`).join("")}</div>
  <div class="list">${items.map(i=>`<div class="item"><span class="dot ${i.g}"></span><div class="t"><b>${esc(i.n)}</b><small>Strict: ${esc(i.s)} · Fat-loss: ${esc(i.f)} · Autophagy: ${esc(i.a)}</small><small>${esc(i.note)}</small></div><span class="kcal">${esc(i.k)} kcal</span></div>`).join("")}</div>
  <p class="small muted">Green: use freely. Yellow: small calories; fine for fat loss, better in the window. Red: sugar, insulin, hunger an hour later.</p>
  <details><summary>Cheat meal rules</summary><div class="body">
    <p class="small">Saturday 7 PM, in place of dinner, finished by 8:30. One meal, not a day.</p>
    <ul class="small"><li><b>Biryani:</b> 2 heaped cupped hands rice max, all the chicken you want, salad and raita first.</li><li><b>Pizza:</b> 3 thin slices (2 thick) with a salad. No garlic bread, no stuffed crust.</li><li><b>Burger:</b> single patty. If fries, one fist, shared.</li><li><b>BBQ:</b> unlimited tikka and kebab, one naan.</li><li><b>Nihari:</b> one bowl, pour off the oil, half to one naan.</li></ul>
    <p class="small muted">Protein first, salad before the main, one plate no refill, water or diet drink, 20 minutes minimum, 15-min walk after. Expect +1–2 kg Sunday from salt; gone by Tuesday.</p>
  </div></details>
  <details><summary>Eating out ranking</summary><div class="body">
    <ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px"><li>Chicken tikka</li><li>Seekh kebab</li><li>Grilled fish</li><li>Daal (less tarka)</li><li>Chicken karahi (leave the oil pool)</li><li>Haleem (skip poured oil, ½ naan)</li><li>Pulao (1 cupped hand)</li><li>Biryani</li><li>Nihari</li><li>Burger</li><li>Pizza</li><li>Fried chicken</li></ol>
    <p class="small muted">Decide before you arrive. Roti instead of naan. Share rice dishes and take extra chicken. Weddings count as that week's cheat meal.</p>
  </div></details>
  <details><summary>Supplements</summary><div class="body"><ul class="small">
    <li><b>Whey:</b> yes. 1 scoop at 5:45 PM or with dinner.</li><li><b>Creatine monohydrate:</b> yes, 3–5 g daily once lifting starts. Expect 1–2 kg water in week 1.</li><li><b>Vitamin D3:</b> yes, 1,000–2,000 IU with dinner; test if you can.</li><li><b>Magnesium:</b> optional, 200–400 mg glycinate at night for cramps or sleep.</li><li><b>Omega-3:</b> optional, 1–2 g EPA+DHA if you don't eat oily fish twice a week.</li><li><b>Electrolytes:</b> no product needed; ¼ tsp salt in 1 L water.</li></ul>
    <p class="small muted">Skip fat burners, keto pills, ACV gummies, green-tea extract, detox teas, BCAAs.</p></div></details>
  <details><summary>Warning signs</summary><div class="body"><ul class="small">
    <li><b>Fatigue over a week:</b> add a cupped hand of carbs for a week; check sleep; move the starter to 3:30 PM.</li><li><b>Dizziness standing:</b> salt in water morning and afternoon; persistent → doctor.</li><li><b>Performance down 2 weeks:</b> 18:6, carbs on all training days, deload week.</li><li><b>Soreness past 48 h:</b> confirm 4–5 palms protein; repeat last week's training.</li><li><b>Sleep disrupted:</b> earlier dinner, no caffeine after 2 PM, yogurt at 9 PM is fine.</li><li><b>Strength dropping, arms thinner:</b> 5 palms, maintenance week, 3 strength sessions.</li><li><b>Persistent left-leg pain, swelling, night pain:</b> stop impact and heavy leg loading; orthopaedic review and X-ray.</li><li><b>Numbness, tingling, left-leg weakness:</b> medical review promptly.</li></ul>

  <details><summary>Daily routine</summary><div class="body"><div class="scroll"><table class="tbl"><tbody>
    ${[["6:45","Wake. 500 ml water + pinch of salt."],["7:00","15–20-min walk."],["7:25","Black coffee #1. Pack the starter."],["8:00","Leave."],["9:30","Coffee #2 or green tea."],["10:30","Water. 5-min walk."],["12:30","Lunch-hour walk 15 min, then black tea."],["14:00","Last caffeine."],["15:30","Herbal tea. 5-min walk."],["17:45","Protein starter. Fast ends."],["19:15","Train (or 20-min walk)."],["20:00","OnePlate dinner, protein first, 20 min."],["20:45","10–15-min walk."],["21:30","Kitchen closed. Fast starts."],["22:00","Screens dim. Calf stretch."],["22:45","Lights out."]].map(r=>`<tr><td class="kcal">${r[0]}</td><td class="small">${esc(r[1])}</td></tr>`).join("")}
  </tbody></table></div></div></details>
  <details><summary>When to see a doctor first</summary><div class="body"><ul class="small"><li>Diabetes, blood pressure, heart, kidney, liver or gout history, or any daily medication.</li><li>Baseline bloods: CBC, fasting glucose/HbA1c, lipids, vitamin D, B12, TSH, liver and kidney, uric acid. Repeat vitamin D and lipids at 12 weeks.</li><li>Orthopaedic review before any running, jumping or sport on the nailed leg.</li></ul><p class="small muted">OnePlate is educational and does not replace individual medical advice.</p></div></details>`;
}

/* ---------- render & events ---------- */
const VIEWS={today:vToday,plate:vPlate,train:vTrain,progress:vProgress,guide:vGuide};
function render(){
  const v=document.getElementById("view");
  const scroll=v.parentElement.scrollTop;
  v.innerHTML=VIEWS[tab]();
  v.parentElement.scrollTop=scroll;
  document.getElementById("tabs").innerHTML=["today","plate","train","progress","guide"].map(k=>`<button class="${k===tab?"on":""}" data-a="tab" data-v="${k}" aria-label="${k}">${svgIcon(k)}${k}</button>`).join("");
  tick();
}
function tick(){
  const bar=document.getElementById("ringBar");if(!bar)return;
  const t=document.getElementById("ringTime"),s=document.getElementById("ringSub");
  if(!S.fast.startedAt){bar.style.strokeDashoffset=326.7;return}
  const ms=Date.now()-new Date(S.fast.startedAt).getTime(),goal=(S.settings.fastHours||20)*36e5,frac=Math.min(1,ms/goal);
  bar.style.strokeDashoffset=(326.7*(1-frac)).toFixed(1);
  t.textContent=hhmm(Math.max(0,ms));
  s.textContent=ms>=goal?"goal reached":(Math.round(frac*100)+"% of "+(S.settings.fastHours||20)+" h");
}
setInterval(tick,1000);
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,t=todayStr();
  if(a==="tab"){tab=b.dataset.v;history.replaceState(null,"","#"+tab);render();return}
  if(a==="mf"){S._mf=b.dataset.v;render();return}
  if(a==="ff"){S._ff=b.dataset.v;render();return}
  if(a==="startfast"){S.fast={startedAt:new Date().toISOString(),lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();toast("Fast started");render();return}
  if(a==="startfast930"){const d=new Date();d.setHours(21,30,0,0);if(d>new Date())d.setDate(d.getDate()-1);S.fast={startedAt:d.toISOString(),lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();toast("Fast started from 9:30 PM");render();return}
  if(a==="cancelfast"){S.fast={startedAt:null,lastHours:S.fast.lastHours||null,lastEndedAt:S.fast.lastEndedAt||null};persistFast();render();return}
  if(a==="endfast"){const h=(Date.now()-new Date(S.fast.startedAt).getTime())/36e5;S.fast={startedAt:null,lastHours:Math.round(h*10)/10,lastEndedAt:new Date().toISOString()};persistFast();const d=day(t);d.fastH=Math.round(h*10)/10;persistDay(t);toast("Fast ended: "+h.toFixed(1)+" h");render();return}
  if(a==="water"||a==="palms"){const d=day(t);d[a]=Math.max(0,Math.min(20,(d[a]||0)+Number(b.dataset.v)));persistDay(t);render();return}
  if(a==="tog"){const d=day(t);d[b.dataset.k]=!d[b.dataset.k];persistDay(t);render();return}
  if(a==="delw"){removeWeigh(b.dataset.d);toast("Removed");render();return}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="wform"){e.preventDefault();const d=document.getElementById("wdate").value,kg=parseFloat(document.getElementById("wkg").value),cm=parseFloat(document.getElementById("wcm").value);if(!d||!(kg>0))return;const r={date:d,weight:Math.round(kg*10)/10};if(cm>0)r.waist=Math.round(cm*2)/2;S.weighins[d]=r;persistWeigh(d);toast("Saved "+kg.toFixed(1)+" kg");render()}
  if(e.target.id==="sform"){e.preventDefault();const sw=parseFloat(document.getElementById("s_sw").value),tw=parseFloat(document.getElementById("s_tw").value),sd=document.getElementById("s_sd").value,fh=parseInt(document.getElementById("s_fh").value,10);if(sw>0)S.settings.startWeight=sw;if(tw>0)S.settings.targetWeight=tw;if(sd)S.settings.startDate=sd;if(fh>=14&&fh<=24)S.settings.fastHours=fh;persistSettings();toast("Settings saved");render()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab){tab=h;render()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

loadLocal();render();setChip();
if(window.claude&&window.claude.use){connect()}else{syncState="local";setChip()}
</script>
