 living from the dead and the dead from the living, and provide without measure.",mz:"Al-Mizan reads the prayer as the believer's answer to the power of states that seem to decide everything: sovereignty is lent, honour is given, and the same hand that turns night into day turns one ruler into another. He notes that 'in Your hand is the good' does not add 'and the evil', because evil is the absence of a good that was withheld.",q:"Whose power am I afraid of this week, and who gave it?",k:"Kings and bosses only have power because Allah lent it to them. Allah can take it back, and He gives without counting."},{s:3,f:31,t:32,n:"Aal Imran 31\u201332, if you love Allah, follow me",sum:"Say: if you love Allah, follow me and Allah will love you and forgive your sins. Say: obey Allah and the Messenger; if they turn away, Allah does not love the disbelievers.",mz:"Al-Mizan makes this verse the test of a claim: love of Allah is real only when it becomes following of the Prophet, since the Prophet is the lived form of what Allah wants, and the reward of that following is Allah's own love. He stresses that the verse turns the direction of love around: the servant starts by loving, and ends by being loved.",q:"Which habit of the Prophet have I copied this month?",k:"If you really love Allah, copy the Prophet. Then Allah will love you back."},{s:3,f:169,t:171,n:"Aal Imran 169\u2013171, the living martyrs",sum:"Do not think of those killed in Allah's way as dead; they are alive with their Lord, provided for, rejoicing in what Allah gave them and glad for those left behind who will join them, that they have nothing to fear or grieve.",mz:"Al-Mizan takes the verse as plain proof of life in the barzakh, the interval between death and resurrection, and reads 'provided for' and 'rejoicing' as a real condition and not a figure of speech. He notes that the martyrs' gladness is for those still on the road, which makes the verse a consolation to the living as much as a promise to the dead.",q:"Who in my family is 'alive with their Lord', and how do I remember them?",k:"People who die for Allah are not really gone. They are alive with Him, happy, and waiting for the people they love."},{s:3,f:190,t:195,n:"Aal Imran 190\u2013195, those who remember standing, sitting and lying",sum:"In the creation of the heavens and the earth and the alternation of night and day are signs for people of understanding, who remember Allah standing, sitting and on their sides, and reflect on creation: Our Lord, You did not create this in vain; glory to You; save us from the Fire. Their prayer for forgiveness and firmness is answered: I never waste the work of any worker among you, male or female.",mz:"Al-Mizan calls this the Quran's portrait of the ulu al-albab: remembrance in every bodily state joined to thought about creation, so that worship and reason are one act. He reads 'You did not create this in vain' as the conclusion that thought reaches, and notes that the answer 'male or female, you are of one another' makes the reward independent of sex.",q:"When did I last look at the sky long enough to say 'You did not make this for nothing'?",k:"Smart people remember Allah everywhere, standing, sitting and lying down, and they look at the sky and say: Allah, You made all this for a reason."},{s:4,f:82,t:82,n:"An-Nisa 82, a Book without contradiction",sum:"Do they not reflect on the Quran? Had it been from other than Allah they would have found in it much contradiction.",mz:"Al-Mizan reads the verse as the Quran's own proof of itself: a text revealed over twenty-three years, in peace and war, on every subject, with no contradiction between its parts, could not come from a human mind whose views change. He makes the verse the basis of his method, explaining the Quran by the Quran, since a consistent text interprets itself.",q:"Which two verses seem to me to disagree, and have I read them together?",k:"The Quran came over 23 years and nothing in it disagrees with anything else. That is one way we know it is from Allah."},{s:5,f:8,t:8,n:"Al-Ma'idah 8, justice even toward those you dislike",sum:"Be steadfast for Allah as witnesses in justice, and do not let hatred of a people make you unjust. Be just: that is nearer to God-consciousness.",mz:"Al-Mizan reads the verse with 4:135, where justice is demanded even against oneself and one's parents; here it is demanded even toward an enemy. He notes that justice is named 'nearer to taqwa', so that fairness to someone you dislike is a religious act and not only a social one.",q:"Who do I dislike enough that I might not be fair to them?",k:"Even if you do not like someone, you must still be fair to them. Being fair is close to being good with Allah."},{s:5,f:32,t:32,n:"Al-Ma'idah 32, one soul and all of humanity",sum:"Because of that We decreed for Bani Israel that whoever kills a soul, other than for a soul or for corruption in the land, it is as if he had killed all of humanity; and whoever saves one, it is as if he had saved all of humanity.",mz:"Al-Mizan explains the 'as if': humanity is a single reality present whole in each person, so that the one who treats a single life as nothing has denied the worth of the human as such. He notes that the verse follows the story of Adam's two sons, and that the two exceptions are the law's own limits, not loopholes.",q:"Whose life do I weigh less than my own, and why?",k:"One person is so important that hurting one is like hurting everybody, and saving one is like saving everybody."},{s:6,f:59,t:62,n:"Al-An'am 59\u201362, the keys of the unseen",sum:"With Him are the keys of the unseen; none knows them but He. He knows what is on land and sea; not a leaf falls but He knows it, nor a grain in the darkness of the earth, nor anything wet or dry, but it is in a clear book. He takes your souls by night and knows what you earn by day; He is the Master over His servants and sends guardians, until death comes and His messengers take the soul.",mz:"Al-Mizan reads 'the keys of the unseen' as the sources from which events issue, known to Allah alone, and takes 'a clear book' as the record in which everything exists before it appears. He explains sleep as a lesser taking of the soul that proves the greater, and notes that the angels who 'never fail' are the Quran's answer to the fear of death as an accident.",q:"Which falling leaf in my life did Allah not know about?",k:"Allah knows every leaf that falls and every seed in the dark ground. He watches over you when you sleep and when you wake."},{s:7,f:199,t:201,n:"Al-A'raf 199\u2013201, take to pardon",sum:"Take to pardon, command what is right and turn away from the ignorant. If a prompting from Satan stirs you, seek refuge in Allah. Those who are God-conscious, when a touch from Satan reaches them, remember, and then they see.",mz:"Al-Mizan calls 199 the whole of good character in three clauses and reads 'turn away from the ignorant' as refusing to answer provocation on its own level. He takes 'remember, and then they see' as the mechanism of taqwa: the touch of Satan clouds sight, remembrance clears it, and the believer differs from others not in never being touched but in how fast he remembers.",q:"What is the last provocation I answered on its own level?",k:"Forgive easily, tell people what is good, and walk away from silly arguments. If a bad thought comes, say 'a'udhu billah' and it goes."},{s:8,f:2,t:4,n:"Al-Anfal 2\u20134, hearts that tremble",sum:"The believers are those whose hearts tremble when Allah is mentioned, whose faith grows when His verses are recited, who rely on their Lord, keep prayer and spend from what He gave them. Those are the believers in truth; they have ranks with their Lord, forgiveness and generous provision.",mz:"Al-Mizan reads the five marks as a sequence from the heart outward: fear at His mention, growth at His word, reliance, prayer and spending, and takes 'in truth' as the Quran's distinction between faith claimed and faith lived. He notes that faith can increase, which settles a theological dispute in the Quran's own words.",q:"Does anything happen in my chest when Allah's name is said?",k:"Real believers feel something in their heart when they hear Allah's name, and their faith grows every time they hear the Quran."},{s:13,f:11,t:11,n:"Ar-Ra'd 11, until they change what is in themselves",sum:"Each person has guardians before and behind, protecting him by Allah's command. Allah does not change the condition of a people until they change what is in themselves; and when Allah intends harm for a people there is no turning it back.",mz:"Al-Mizan reads the law in this verse together with 8:53: a blessing is withdrawn only after the inner state that deserved it has changed, so that decline is never arbitrary. He notes that the verse states the rule for loss; the parallel rule for gain is stated elsewhere and holds for communities as well as persons.",q:"What has changed in me over the last year, and what has changed around me?",k:"Allah does not take away a good thing from people until they change on the inside. So keep your inside good."},{s:13,f:28,t:29,n:"Ar-Ra'd 28\u201329, hearts find rest",sum:"Those who believe and whose hearts find rest in the remembrance of Allah; surely in the remembrance of Allah hearts find rest. Those who believe and do good have blessedness and a beautiful return.",mz:"Al-Mizan explains why remembrance, and nothing else, settles the heart: the heart is restless because it seeks something that will not fail it, and only Allah does not fail. He reads the verse as answering the disbelievers' demand for a sign in the preceding verses: the believer already has the sign, inside.",q:"What do I reach for when my heart is restless, before I reach for Allah?",k:"Your heart feels calm when you remember Allah. Nothing else can make it feel that way for long."},{s:16,f:125,t:128,n:"An-Nahl 125\u2013128, call with wisdom",sum:"Call to your Lord's way with wisdom and good counsel, and argue with them in the best way; your Lord knows best who strays and who is guided. If you punish, do so as you were punished; but if you are patient, it is better. Be patient, and your patience is only through Allah; do not grieve over them. Allah is with those who are God-conscious and those who do good.",mz:"Al-Mizan reads the three methods as addressed to three kinds of listener: wisdom for those who think, good counsel for those who feel, and the best argument for those who contend. He notes that even the argument must be 'the best', which rules out winning by humiliation, and that the surah ends with the Prophet's own patience as the method behind the methods.",q:"Which of the three ways do I use with my own children, and which do they need?",k:"When you tell people about Allah, be wise, be kind and argue nicely. Allah is with people who are patient and do good."},{s:17,f:78,t:84,n:"Al-Isra 78\u201384, from the sun's decline to the praised station",sum:"Keep prayer from the sun's decline to the darkness of night, and the Quran of dawn, which is witnessed. Stand part of the night with it as an extra for you; your Lord may raise you to a praised station. Pray for a true entry and a true exit. Truth has come and falsehood has vanished. We send down of the Quran what is healing and mercy for the believers. Everyone acts after his own manner.",mz:"Al-Mizan reads 78 as covering the five prayers in one sentence: the four from midday to night, then the dawn prayer named separately because the angels of night and day witness it. He takes the night prayer as a duty specific to the Prophet and 'the praised station' as the intercession, and reads 'healing' as the Quran's effect on the diseases of the heart and 'everyone acts after his own manner' as the Quran's word for character.",q:"Is the dawn prayer, the witnessed one, the one I keep best or worst?",k:"Allah told the Prophet when to pray, and that the morning prayer is special because angels come to watch it. The Quran is medicine for the heart."},{s:20,f:114,t:114,n:"Ta-Ha 114, my Lord, increase me in knowledge",sum:"Exalted is Allah, the true King. Do not hurry with the Quran before its revelation to you is completed, and say: my Lord, increase me in knowledge.",mz:"Al-Mizan notes that the only increase the Prophet is told to ask for is knowledge, and reads the instruction not to hurry as a lesson in receiving: the Quran is taken in slowly, as it comes. He connects the verse to 75:16, where the same hurry is corrected, and takes 'knowledge' here to mean knowledge of the Book itself.",q:"What did I ask Allah to give me more of today?",k:"The Prophet was taught one special dua: 'My Lord, give me more knowledge.' You can say it before school."},{s:21,f:30,t:33,n:"Al-Anbiya 30\u201333, the heavens and earth were joined",sum:"Do the disbelievers not see that the heavens and the earth were one mass and We split them, and made every living thing from water? We set mountains so the earth would not shake, and passes as roads; We made the sky a protected roof, yet they turn from its signs. He created night and day, the sun and the moon, each swimming in an orbit.",mz:"Al-Mizan reads the joined mass and its splitting as a statement about origins that the listener is asked to see with the eye of reason, and refuses to tie it to any one scientific picture while allowing it to be read with the cosmology of each age. He takes 'every living thing from water' literally, and 'each swimming in an orbit' as the Quran's own description of celestial motion.",q:"Which sign of the four named here have I looked at this week?",k:"Allah says the sky and the earth were once one thing and He split them, and that every living thing is made from water. The sun and moon swim in space like fish."},{s:24,f:30,t:31,n:"An-Nur 30\u201331, lowering the gaze",sum:"Tell the believing men to lower their gaze and guard their chastity; that is purer for them. Tell the believing women to lower their gaze, guard their chastity and not display their adornment except what appears, to draw their covers over their chests, and not to show their adornment except to their husbands and the near relatives listed. Turn to Allah together, believers, that you may succeed.",mz:"Al-Mizan reads the command to men first, and the same words for women, so that modesty is a shared duty before it is a dress code; the details of the women's verse follow because their adornment is what the law has to define. He takes 'what appears' as the face and hands, following the narrations from the Imams, and reads the closing 'turn to Allah together' as the reason: the rules protect a community, not a sex.",q:"Where do my eyes go when I am bored, and what would change if I lowered them?",k:"Allah tells boys and men first, then girls and women, to look away from what is not theirs to look at. Modesty is for everyone."},{s:29,f:45,t:45,n:"Al-Ankabut 45, prayer restrains",sum:"Recite what has been revealed to you of the Book and keep prayer; prayer restrains from indecency and wrong, and the remembrance of Allah is greater. Allah knows what you do.",mz:"Al-Mizan reads 'restrains' as the nature of prayer, not a promise about every prayer: a prayer that does not restrain is lacking as prayer. He discusses 'the remembrance of Allah is greater' and prefers the reading that Allah's remembrance of His servant is greater than the servant's remembrance of Him, which is what prayer brings about.",q:"What did my last prayer stop me from doing?",k:"Real prayer keeps you away from bad things. And when you remember Allah, He remembers you, and that is even bigger."},{s:29,f:69,t:69,n:"Al-Ankabut 69, We guide those who strive",sum:"Those who strive in Us, We will surely guide them to Our ways; and Allah is with those who do good.",mz:"Al-Mizan reads 'strive in Us', not 'for Us', as striving in the matter of Allah, whatever form it takes, and the promise as a law: effort toward Him is met with guidance into the many ways that lead to Him. He takes the plural 'ways' as the diversity of paths within the one straight path, and 'Allah is with the doers of good' as the surah's last word on its opening question about being tested.",q:"What am I striving at that Allah could count as 'in Him'?",k:"If you try hard for Allah, Allah promises to show you the way. He is with people who do good."},{s:33,f:21,t:21,n:"Al-Ahzab 21, the beautiful example",sum:"There is for you in the Messenger of Allah a beautiful example, for whoever hopes for Allah and the Last Day and remembers Allah much.",mz:"Al-Mizan reads the verse in its place in the Battle of the Trench: the Prophet dug, went hungry and stood firm with the believers, and the example is of that, not only of ritual. He notes the three conditions on the one who takes the example, hope in Allah, hope in the Last Day and much remembrance, as the inner state that makes following possible.",q:"In what hard situation this week could I ask what the Prophet did in his?",k:"The Prophet is the best example. When things are hard, ask: what did he do? He stayed patient and kept working."},{s:33,f:35,t:35,n:"Al-Ahzab 35, the ten qualities, men and women",sum:"Muslim men and Muslim women, believing men and believing women, obedient, truthful, patient, humble, charitable, fasting, chaste, and those who remember Allah much, men and women: Allah has prepared for them forgiveness and a great reward.",mz:"Al-Mizan records that the verse came after the women asked why the Quran addressed men, and reads the ten paired qualities as the Quran's statement that the road and its reward are identical for both. He takes the order as a progression from submission to remembrance, with 'much remembrance' last because it is the state the others produce.",q:"Of the ten, which two are strongest in Uzma and which two in me?",k:"Allah lists ten good things and says them for men and for women, both. Boys and girls get exactly the same reward for being good."},{s:33,f:70,t:71,n:"Al-Ahzab 70\u201371, a straight word",sum:"O believers, be God-conscious and speak a straight word; He will set right your deeds and forgive your sins. Whoever obeys Allah and His Messenger has won a great victory.",mz:"Al-Mizan reads 'a straight word' as speech that matches the truth and the heart at once, and notes the order: straight speech first, then Allah sets the deeds right, so that honesty in words is the root of a sound life. He takes 'great victory' as the surah's summary term for the believers' outcome.",q:"What did I say today that was not quite straight?",k:"Say things that are true and clear. When your words are straight, Allah makes your actions good too."},{s:35,f:15,t:17,n:"Fatir 15\u201317, you are the needy ones",sum:"O people, you are the ones in need of Allah, and Allah is the Self-Sufficient, the Praised. If He willed, He could remove you and bring a new creation; that is not hard for Him.",mz:"Al-Mizan reads 'the needy' with the definite article as the human's definition: not needy in some things, but need itself in relation to Allah, who alone is rich. He connects the verse with the surah's opening on mercy that none withholds: the needy are provided for by the One whose richness is matched by praise.",q:"In what part of my life do I pretend not to need Allah?",k:"We need Allah for everything, even for the next breath. He needs nothing from anybody."},{s:39,f:9,t:10,n:"Az-Zumar 9\u201310, are those who know equal",sum:"Is one who worships through the night, prostrating and standing, fearing the Hereafter and hoping for his Lord's mercy, like the other? Say: are those who know equal to those who do not know? Only people of understanding take heed. Say: My servants who believe, fear your Lord; those who do good in this world have good, and Allah's earth is wide; the patient will be paid their reward without measure.",mz:"Al-Mizan reads the night worshipper and the knower as one person described twice, so that knowledge in the Quran's sense is what produces fear and hope and standing at night. He takes 'Allah's earth is wide' as the command to migrate rather than live where faith cannot be practised, and 'without measure' as the reward that patience alone earns.",q:"What do I know that has not yet changed what I do?",k:"Someone who prays at night and really knows Allah is not the same as someone who does not. Learning should change how you live."},{s:39,f:22,t:23,n:"Az-Zumar 22\u201323, skins that shiver",sum:"Is one whose breast Allah has opened to Islam, so that he is on a light from his Lord, like the hard-hearted? Woe to those whose hearts are hardened against Allah's remembrance. Allah has sent down the best narration, a Book consistent and paired, at which the skins of those who fear their Lord shiver; then their skins and hearts soften to Allah's remembrance.",mz:"Al-Mizan reads 'consistent and paired' as the Quran describing its own form: its parts resemble each other and its themes come in pairs, promise and warning, so that one part explains another. He takes the shiver and then the softening as the two stages of the Quran's effect on a living heart, fear first and then rest.",q:"When did a verse last give me goosebumps?",k:"When people who love Allah hear the Quran, they get goosebumps, and then their hearts go soft and calm."},{s:40,f:60,t:60,n:"Ghafir 60, call Me and I will answer",sum:"Your Lord says: call on Me and I will answer you. Those who are too proud to worship Me will enter Hell humbled.",mz:"Al-Mizan reads 'call Me' as a command and 'I will answer' as an unconditional promise, and then explains the condition hidden in the words: a real call, to Allah alone, from a heart that means it. He notes that the verse calls dua 'worship' in its second half, so refusing to ask is a form of pride.",q:"What have I been too proud to ask Allah for?",k:"Allah says: ask Me, I will answer. People who are too proud to ask Him will be sorry."},{s:41,f:30,t:36,n:"Fussilat 30\u201336, those who stand firm",sum:"Those who say 'our Lord is Allah' and then stand firm, the angels descend on them: do not fear or grieve, rejoice in the Garden you were promised; we are your friends in this life and the next. Who speaks better than one who calls to Allah, does right and says 'I am of the Muslims'? Good and evil are not equal; repel evil with what is better and your enemy becomes a warm friend. None attains this but the patient and the greatly fortunate. If Satan stirs you, seek refuge in Allah.",mz:"Al-Mizan reads istiqama, standing firm, as the whole of the religion after its first sentence, and the angels' descent as beginning at death and continuing. He takes 'repel with what is better' as a law of souls, not a tactic, and explains why only the patient attain it: answering evil with good is a long effort against one's own first reaction.",q:"Who is my enemy this month, and what is 'the better' I could answer with?",k:"If you say 'Allah is my Lord' and keep going straight, angels become your friends. Answer bad with good and enemies turn into friends."},{s:46,f:15,t:16,n:"Al-Ahqaf 15\u201316, the prayer at forty",sum:"We enjoined on the human kindness to his parents: his mother carried him in hardship and bore him in hardship, thirty months of carrying and weaning. When he reaches full strength and forty years, he says: my Lord, let me be grateful for Your favour on me and my parents, let me do good that pleases You, and set right my descendants; I turn to You and I am of the Muslims. From those We accept the best of what they did and overlook their faults.",mz:"Al-Mizan reads the verse as the human life in one arc: carried, weaned, grown, and at forty turned to a prayer that looks back to parents and forward to children. He notes that gratitude is asked for as a gift, 'let me be grateful', and that 'set right my descendants' is the prayer of the one who has understood that his own righteousness is incomplete without theirs.",q:"At thirty-eight, which line of the forty-year prayer am I already saying?",k:"Your mother carried you and fed you with difficulty. A good grown-up thanks Allah for his parents and asks Allah to make his children good."},{s:50,f:16,t:18,n:"Qaf 16\u201318, nearer than the jugular vein",sum:"We created the human and know what his soul whispers to him, and We are nearer to him than his jugular vein. Two receivers sit on his right and left, and he utters no word without a watcher ready.",mz:"Al-Mizan reads the nearness as Allah's knowledge and presence beyond all mediation, nearer than the vein that carries life itself, and takes the two angels as real recorders whose writing is the book opened on the Day. He notes that 'no word' sets the standard: speech is the first thing recorded, before deeds.",q:"If every word is written, which sentence of mine today would I delete?",k:"Allah is closer to you than your own neck. Two angels write down every word you say. Make the book beautiful."},{s:57,f:20,t:23,n:"Al-Hadid 20\u201323, the crop that withers, the book that was written",sum:"This life is play, diversion, adornment, boasting and rivalry in wealth and children, like rain whose growth pleases the farmers, then dries, yellows and crumbles. Race to forgiveness and a Garden as wide as the heavens and earth. No calamity strikes the earth or yourselves but it is in a book before We bring it about, so that you do not grieve over what escapes you or exult over what you are given.",mz:"Al-Mizan reads the five stages of the world's life, play to rivalry, as the ages of a human life, and the rain parable as its end. He takes 'in a book before We bring it about' as the verse's medicine for grief and pride at once: what came was written, what left was written, and neither is a verdict on you.",q:"What loss this year am I still grieving as if it had not been written?",k:"This life is like a crop that grows, goes yellow and dries. The real race is for Paradise. Whatever happens was already written, so do not be too sad or too proud."},{s:58,f:11,t:11,n:"Al-Mujadila 11, make room",sum:"O believers, when you are told to make room in gatherings, make room; Allah will make room for you. When you are told to rise, rise; Allah raises those who believe among you, and those who were given knowledge, by degrees.",mz:"Al-Mizan reads the small courtesy of the first half and the great promise of the second as one lesson in degrees: those who make room are given room, and those with knowledge are raised above those with faith alone. He notes that the verse grades the believers by knowledge, which is the Quran's consistent measure of rank.",q:"Who did I make room for this week, in a gathering or in a decision?",k:"When you make space for others, Allah makes space for you. And Allah lifts people higher when they learn."},{s:65,f:2,t:3,n:"At-Talaq 2\u20133, a way out from where you did not expect",sum:"Whoever fears Allah, He makes a way out for him and provides for him from where he did not expect. Whoever relies on Allah, He is enough for him. Allah accomplishes His purpose; He has set a measure for everything.",mz:"Al-Mizan reads the three sentences as three laws stated inside a chapter on divorce, so that the believer in the hardest domestic situation hears them first: taqwa opens a door, reliance is answered with sufficiency, and Allah's purpose is reached whatever the obstacles. He notes that 'He has set a measure for everything' means the way out comes by means, not against them.",q:"Where in my life am I waiting for a door that taqwa has not yet opened?",k:"If you are careful of Allah, He finds you a way out of every problem, from somewhere you never thought of."},{s:66,f:6,t:6,n:"At-Tahrim 6, guard yourselves and your families",sum:"O believers, protect yourselves and your families from a Fire whose fuel is people and stones, over which are stern angels who do not disobey what Allah commands and do what they are told.",mz:"Al-Mizan reads the command as making the family the first field of responsibility after the self: the protection is by teaching, example and the habits of the house. He notes from the narrations that 'protect your family' was explained as commanding them what Allah commands and forbidding what He forbids, which is a duty before it is a feeling.",q:"What does my family learn from how I live, not from what I say?",k:"Allah tells parents to keep their children safe from the Fire by teaching them good things, and children to help by listening."},{s:70,f:19,t:35,n:"Al-Ma'arij 19\u201335, the anxious human and the exception",sum:"The human was created anxious: fretful when harm touches him, withholding when good comes, except those who pray and are constant in their prayers; who keep a known share for the beggar and the deprived; who believe in the Day of Judgement and fear their Lord's punishment; who guard their chastity; who keep their trusts and promises; who stand by their testimony; and who guard their prayers.",mz:"Al-Mizan reads 'created anxious' as a description of the human's natural state and the exception as the cure, with prayer named first and last so that it frames the list. He takes 'a known share' as a fixed obligation beyond zakat, and sees in the whole passage the believer's inner steadiness built out of outward habits.",q:"Which of the eight habits of the exception do I keep most reliably?",k:"People worry a lot, but praying regularly, giving to the poor and keeping promises make the heart steady."},{s:90,f:8,t:18,n:"Al-Balad 8\u201318, the steep path",sum:"Did We not give him two eyes, a tongue and two lips, and show him the two highways? He has not attempted the steep path. What is the steep path? Freeing a neck, or feeding on a day of hunger an orphan of near kin or a poor person in the dust, and then being of those who believe and counsel one another to patience and to mercy. Those are the companions of the right.",mz:"Al-Mizan reads the two highways as good and evil set before every person with the faculties to tell them apart, and the steep path as the hard climb against the self. He notes that the Quran names concrete acts, freeing and feeding, before it names faith and counsel, so that the climb is made of deeds the body does.",q:"What is the steepest good thing in front of me this week?",k:"Allah gave you eyes, a tongue and lips, and showed you the easy road and the hard good road. The hard road is feeding the hungry and freeing people."},{s:99,f:1,t:8,n:"Az-Zalzalah, an atom's weight",sum:"When the earth is shaken with its quake and brings out its burdens, and the human says 'what is wrong with it', that Day it reports its news by your Lord's inspiration. People come out in groups to be shown their deeds. Whoever does an atom's weight of good will see it, and whoever does an atom's weight of evil will see it.",mz:"Al-Mizan reads the earth's report as its witness about what was done on it, and 'to be shown their deeds' as seeing the deeds themselves, which he takes as the embodiment of works in the Hereafter. He makes the last two verses the Quran's most exact statement of accountability: nothing is too small to be seen, in either direction.",q:"What atom's weight of good can I do before tonight?",k:"On the Last Day the earth will tell everything that happened on it. Even the tiniest good thing you did will be shown to you."},{s:102,f:1,t:8,n:"At-Takathur, rivalry in more",sum:"Rivalry in increase distracts you until you visit the graves. No, you will come to know; again, you will come to know. If only you knew with certain knowledge; you will see the Blaze, then see it with the eye of certainty; then you will be asked that Day about the bliss.",mz:"Al-Mizan reads 'takathur' as boasting of having more, in wealth, children or standing, and 'until you visit the graves' as the race ending only at death. He distinguishes the knowledge of certainty from the eye of certainty, and reads the final question about 'the bliss' as covering every blessing, so that the asking is about gratitude, not guilt.",q:"What am I quietly competing to have more of, and with whom?",k:"Wanting more and more keeps people busy until they die. Allah will ask us whether we said thank you for what we had."},{s:110,f:1,t:3,n:"An-Nasr, when the help of Allah comes",sum:"When Allah's help and the conquest come, and you see people entering Allah's religion in crowds, glorify your Lord with praise and ask His forgiveness; He is ever accepting of repentance.",mz:"Al-Mizan reads the surah as the announcement of the Prophet's work completed and, as the companions understood, of his approaching departure; the response commanded at the moment of victory is praise and seeking forgiveness, not celebration. He notes that the Prophet increased in 'subhanallah wa bihamdih, astaghfirullah' after it came down.",q:"What is my first reaction when something I worked for finally succeeds?",k:"When the Muslims finally won, Allah told the Prophet to say 'subhanallah' and ask forgiveness, not to show off. Success is a time to thank."},{s:113,f:1,t:5,n:"Al-Falaq, refuge with the Lord of daybreak",sum:"Say: I seek refuge in the Lord of the daybreak from the evil of what He created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of the envier when he envies.",mz:"Al-Mizan reads the four evils as coming from outside the self, with the envier last because envy is the evil most hidden in people near you, and 'the Lord of the daybreak' as the name chosen because He splits every darkness. He treats the two refuge surahs as one pair: this one against evils outside, an-Nas against the one inside.",q:"What do I say before I sleep, and who taught it to me?",k:"Before bed we say this surah: Allah, keep me safe from everything bad, from the dark, from bad magic and from jealous people."},{s:114,f:1,t:6,n:"An-Nas, refuge from the whisperer",sum:"Say: I seek refuge in the Lord of people, the King of people, the God of people, from the evil of the retreating whisperer who whispers in the breasts of people, from jinn and from humans.",mz:"Al-Mizan reads the three names, Lord, King and God, as three reasons to seek refuge from the one evil that works inside, the whisper that retreats when Allah is remembered and returns when He is forgotten. He takes 'from jinn and from humans' as the two sources of the same whisper, so that a human friend can be a whisperer too.",q:"Whose voice is my 'whisperer' this week, and does it retreat when I remember Allah?",k:"The last surah of the Quran: Allah, protect me from the quiet bad thoughts that come from shaytan and from people. They run away when you remember Allah."}];var ie=[{n:"Water / mineral / sparkling",k:"0",g:"green",s:"No",f:"No",a:"No",note:"2.5\u20133.5 L a day. Carbonation adds 20\u201330 min of fullness."},{n:"Black coffee / Americano",k:"2\u20135",g:"green",s:"No",f:"No",a:"No",note:"Suppresses appetite 1\u20133 h. Max 3 cups, none after 2 PM."},{n:"Green tea",k:"0\u20132",g:"green",s:"No",f:"No",a:"No",note:"Small thermogenic effect. Skip extract pills."},{n:"Black tea (plain)",k:"2",g:"green",s:"No",f:"No",a:"No",note:"Lemon or a pinch of cinnamon is fine."},{n:"Herbal tea / qehwa (no sugar)",k:"0\u20132",g:"green",s:"No",f:"No",a:"No",note:"Warm volume beats a hunger wave. Avoid 'detox' teas."},{n:"Lemon squeeze in water",k:"1\u20133",g:"green",s:"No",f:"No",a:"No",note:"No detox effect; rinse teeth."},{n:"Pinch of cinnamon",k:"2\u20133",g:"green",s:"No",f:"No",a:"No",note:"Prefer Ceylon cinnamon."},{n:"Sugar-free electrolytes / pinch of salt",k:"0\u201310",g:"green",s:"Purists: yes",f:"No",a:"No",note:"\xBC tsp salt in 1 L water does the job for a long daily fast."},{n:"Apple cider vinegar (1 tbsp diluted)",k:"3",g:"green",s:"No",f:"No",a:"No",note:"Only helps glucose when taken with a meal. Optional."},{n:"Ispaghol (1 tsp in water)",k:"15\u201320",g:"amber",s:"Technically",f:"No",a:"No",note:"Fibre, mostly non-absorbed. Helps regularity on one meal a day. Best with dinner."},{n:"Splash of milk in tea (1 tsp)",k:"\u224810",g:"amber",s:"Yes",f:"No",a:"Marginal",note:"Irrelevant for fat loss. Full doodh patti is red."},{n:"Bone broth (1 cup)",k:"30\u201350",g:"amber",s:"Yes",f:"Marginal",a:"Yes",note:"Unnecessary. Fine as a fast-breaker."},{n:"Chia seeds (1 tbsp)",k:"60",g:"amber",s:"Yes",f:"Marginal",a:"Yes",note:"Put them in the dinner yogurt instead."},{n:"MCT oil (1 tbsp)",k:"115\u2013130",g:"amber",s:"Yes",f:"Yes",a:"Probably not",note:"120 kcal of fat you then won't burn from your body. Skip."},{n:"Honey / honey water",k:"64+",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"A sugar drink, however natural."},{n:"Milk tea with sugar (doodh patti)",k:"80\u2013150",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"Two cups erase half your deficit. Window only."},{n:"Coffee with milk / latte",k:"120\u2013200",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"Window only."},{n:"Coffee creamer",k:"20\u201335/tbsp",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"Sugar plus hydrogenated oil."},{n:"Fruit juice (250 ml)",k:"110\u2013120",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"25\u201328 g sugar, little fibre. Eat the fruit at dinner."},{n:"Coconut water (250 ml)",k:"45\u201360",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"Fine as a post-exercise fast-breaker."},{n:"Sugar in tea or coffee (1 tsp)",k:"16",g:"red",s:"Yes",f:"Yes",a:"Yes",note:"Trains the sweet habit."}];var he=["What should I improve today?","What should I stop doing?","What habit should I build this week?","What virtue should I strengthen?","What weakness should I reduce?","What one action should I take today?","What belief might I be wrong about?","What deserves more of my attention?","What does wisdom require in the situation I am in?","Who did I help today, and who helped me?","What am I avoiding, and what is it costing?","What would I do today if I remembered I will die?","What did I learn today that I did not know yesterday?","What am I grateful for that I usually skip?","Who in my family needs me to listen more than to speak?","What is one thing I can do beautifully instead of merely adequately?","What would the Prophet \uFDFA do in my place tonight?","What am I teaching the children by how I eat, speak and rest?","What is enough, for me, today?","Which of my habits would my grandfather not recognise, and is that good?"],re=["Gratitude","Patience","Knowledge","Justice","Family","Mercy","Health","Wisdom"],de=["What made you smile today?","Who did you help today?","What is one thing you are thankful for right now?","What was hard today, and what did you do?","What is something new you learned?","Who were you kind to today?","What would you like to ask Allah for tonight?"],le=[[1,[1,1,2,93],"confirmed"],[2,[2,94,2,182],"confirmed"],[3,[2,183,2,223],"confirmed"],[4,[2,224,2,286],"confirmed"],[5,[3,1,3,41],"confirmed"],[6,[3,42,3,120],"confirmed"],[7,[3,121,3,200],"inferred"],[8,[4,1,4,76],"inferred"],[9,[4,77,5,3],"confirmed"],[10,[5,4,5,54],"inferred"],[11,[5,55,5,105],"inferred"],[12,[5,106,5,120],"confirmed"],[13,[6,1,6,83],"confirmed"],[14,[6,84,6,165],"confirmed"],[15,[7,1,7,100],"confirmed"],[16,[7,101,7,206],"confirmed"],[17,[8,1,8,75],"confirmed"],[18,[9,1,9,129],"confirmed"],[19,[10,1,11,24],"confirmed"],[20,[11,25,11,99],"confirmed"],[21,[11,100,12,57],"confirmed"],[22,[12,58,13,43],"confirmed"],[23,[14,1,15,99],"confirmed"],[24,[16,1,16,128],"confirmed"],[25,[17,1,17,111],"confirmed"],[26,[18,1,18,110],"confirmed"],[27,[19,1,20,135],"confirmed"],[28,[21,1,22,78],"confirmed"],[29,[23,1,25,77],"confirmed"],[30,[26,1,27,93],"confirmed"],[31,[28,1,30,60],"confirmed (one listing says 28\u201329 only)"],[32,[31,1,34,54],"confirmed (one listing says 32\u201334)"],[33,[35,1,38,88],"confirmed"],[34,[39,1,41,54],"confirmed"],[35,[42,1,46,35],"confirmed"],[36,[47,1,51,60],"confirmed"],[37,[52,1,57,29],"confirmed"],[38,[58,1,69,52],"confirmed"],[39,[70,1,77,50],"confirmed"],[40,[78,1,114,6],"confirmed"]],ue={palm:["Palm of protein","A piece of cooked meat, fish, eggs or paneer about the size and thickness of your palm, without the fingers. Roughly 100 to 120 g, about 25 to 30 g of protein."],fist:["Fist of vegetables","Vegetables or salad about the size of your closed fist. Roughly one cup. Very few calories, lots of fullness."],cupped:["Cupped hand of carbs","Rice, pulao or boiled potato that fits in one cupped hand. About three quarters of a cup. One roti counts the same. Rice OR roti, not both."],thumb:["Thumb of fat","Oil, ghee, butter or cream about the size of your thumb, roughly one tablespoon. Measure it with a spoon instead of pouring."],bowl:["Bowl","A normal medium bowl, about 250 ml. Used for daal and for plain yogurt. Yogurt gives protein and calcium for bones."],protein:["Protein","The part of food that builds and protects muscle. Meat, chicken, fish, eggs, paneer, daal, yogurt. Aim for four palms a day so weight lost is fat, not muscle."],palms:["Protein palms","Count every palm-sized portion of protein you eat today. Four is the minimum. Five on days you train."],kcal:["kcal (calories)","The energy in food. Eating fewer calories than your body burns is what makes fat loss happen. You do not need to count them; the plate does it for you."],macros:["Macros","Short for protein, carbs and fat, the three parts of food that carry energy. P = protein, C = carbs, F = fat, in grams."],carbs:["Carbs","Rice, roti, bread, potato, sugar. Not bad, just easy to overeat. One cupped hand or one roti per dinner is the rule."],fat:["Fat","Oil, ghee, cream, nuts. Very high in calories, so it is the easiest thing to cut without feeling hungry. One thumb per meal."],fast:["Fast","The hours you eat nothing. Water, black coffee and plain tea are fine. The fast is a tool for eating less, not a magic fat burner."],fastgoal:["Fast goal","Hours from the last bite at night to the first food the next evening. The plan uses about 21 hours: kitchen closed 9:30 PM, break the fast at home around 7:00 PM."],starter:["Protein starter","The first thing you eat when the fast ends: a bowl of yogurt and two boiled eggs, or a whey shake. Small, fast, high in protein. It stops the ravenous raid on the kitchen."],closed:["Kitchen closed","No more food after 9:30 PM. Water or plain tea only. This is where most one-meal days quietly turn into too many calories."],walk:["Post-dinner walk","A gentle 10 to 15 minute walk within half an hour of finishing dinner. It lowers blood sugar after the meal and helps digestion."],water:["Water bottles","Count each 700 ml bottle you finish. Four bottles is 2.8 L, five is 3.5 L. Aim for four on a normal day and five on a hot day or a motorcycle commute in the heat. A pinch of salt in the first bottle of the morning prevents dizziness."],streak:["Streak","How many days in a row the kitchen was closed by 9:30 PM. The one habit that keeps a one-meal day from drifting into late-night eating. Missing a day resets it; that is fine, just start again."],hijri:["Hijri date","The Islamic lunar date, from the Umm al-Qura calendar on this phone (or an arithmetic calendar if the phone lacks it). Local moon sighting can differ by a day: set the offset in Settings."],sunnahfast:["Sunnah fast day","A day on which voluntary fasting is recommended in the tradition: Mondays and Thursdays, the 13th to 15th of each Hijri month (Ayyam al-Bid), the Day of Arafah and Ashura. You fast daily anyway; whether and how to carry a voluntary intention is a question for a scholar, not this app."],ramadan:["Ramadan mode","The app follows the Hijri date and switches the fast to Fajr-to-Maghrib for your city, with suhoor and iftar guidance. Goal in Ramadan is to hold weight, not lose it. Force it on or off in Settings if your community's moon sighting differs."],suhoor:["Suhoor","The pre-dawn meal. It ends at Fajr. Slow carbs plus protein plus water spread out, low salt. The Prophet (peace be upon him) said there is blessing in suhoor (Bukhari 1923)."],iftar:["Iftar","Breaking the fast at Maghrib: dates and water first, then prayer, then the main plate 20\u201330 minutes later at your normal dinner portion."],thuluth:["Rule of thirds (Q\u0101n\u016Bn al-Thuluth)","From the hadith: one third for food, one third for drink, one third for breath (Tirmidhi 2380). In practice: half the plate vegetables, a quarter protein, a quarter grain; water before the meal, sips during; about 20 minutes per meal; stop at 70\u201380 % full."],familyrules:["Family rules","Taken from the Q\u0101n\u016Bn al-Thuluth project: children are never restricted, the family eats one pot with different portions, meals are together and unhurried, water comes before the meal. The rule of thirds is taught to children as rhythm and gratitude, never as eating less."],cookfor:["Cook for everyone","The cooking quantity adds up each person's portion: a full plate for the adults, the full plate for a teen, half for a child (as a start) and a third for a toddler, each rounded up. Children may always have more."],growth:["Growth log","Weight and height, about once a month, for the trend only. The app does not show percentiles or targets; that reading belongs to the paediatrician. A child who is eating, playing and growing along their own line is doing well."],theme:["Weekly theme","Each week has a theme from the Bayan Library's daily practice: gratitude, patience, knowledge, justice, family, mercy, health, wisdom. It colours the week's reflection; the daily items rotate on their own."],twolayer:["Two layers","Every item is written twice, the Bayan way: once for an eight-year-old and once for an adult. Switch names at the top to see the children's version and read it to them."],verse:["Verse of the day","One Quranic verse with its reference, the context it was revealed in, a reflection and a small action. The wording is a paraphrase of the meaning, not a translation of record; read the Arabic with a translation you trust."],word:["Word of the day","A Quranic or Islamic concept with its Arabic, root letters and plain meaning. Thirty words rotate; after a month you will have met them all."],teaching:["Teaching","A saying of the Prophet or one of the Ahl al-Bayt with the work it is found in. 'Graded' means a named scholar's grading exists; 'received' means the attribution as found in that work, not yet checked against the printed edition. The app cites; it never rules."],story:["Story of the day","A Quranic story with its reference, told for adults and for children, with a moral and something to do together at dinner."],surah:["Surah of the day","A short summary of one surah: name, meaning, length, Meccan or Medinan, what it covers, and one lesson. Thirty-four surahs are covered so far."],idea:["Idea of the day","A principle or concept from philosophy, the Islamic tradition or science, with the thinker it comes from and one way to apply it today."],bookday:["Book of the day","One great book from the Bayan Library's Top 100 canon, in the Bayan template: why it matters, core idea, key takeaway, next step."],dua:["Dua of the day","A short supplication with its meaning, source and the moment to use it. Quranic duas for the children; the longer supplications of the Imams for adults, with their received sources."],poem:["Poem of the day","A few lines from Rumi, Saadi, Hafez, Iqbal, Ghalib and others, translated loosely. Poetry is the Bayan Library's training for emotional intelligence."],question:["Question of the day","From the Quran program's Track 8 on personal transformation: a question meant to lead to one action, not to a long debate."],journal:["Reflection journal","The Bayan daily reflection template: what I learned, what surprised me, a question, a next action. One line each is enough. It saves to the shared database by date."],circle:["Family circle","Five minutes after dinner: one verse in the children's words, one story moral, one question for the children, one dua together. Tick it when done; it counts as the Family dimension of the day."],spaced:["Spaced review","Seeing an item again after 1, 7 and 30 days is what moves it from short-term to long-term memory. The review shows the verse and word from those days back."],wholeself:["Whole self","Five dimensions of the day: Body (at least 4 of the 7 habits), Mind (today's learning done), Heart (mood and gratitude logged), Soul (the verse read), Family (the circle done). Aim for all five most days, not every day."],mood:["Mood","One honest word for how you feel right now. Naming a feeling lowers its charge. Over weeks the pattern tells you what helps and what hurts."],quranplan:["Daily Quran reading","The whole Quran in 365 readings, one a day from the date in Settings, in the Quran's own order and never crossing a surah. One hundred and twelve passages are close readings with a summary, notes from al-Mizan, a reflection question and a line for the children; the other readings carry the surah's summary and al-Mizan's statement of its purpose. The course repeats; the count on the right is how many readings you have marked done."],mizan:["Al-Mizan","Tafsir al-Mizan by Allamah Muhammad Husayn Tabataba'i (d. 1981), twenty volumes in Arabic, whose method is to explain the Quran by the Quran. The notes in the app summarise the main lines of his discussion on each passage as the app's author understands them. They are summaries, not quotations: verify in the printed al-Mizan or its English translations before citing him."],review:["Scholar review","Every note in Learn starts as a draft: written for this app, not yet checked by a named person. Reviewed means a named reader compared it with the source and found it faithful. Verified means it was checked against the printed edition with the volume and page recorded. Disputed means a reviewer found a problem, which stays visible until fixed. The gates follow the Bayan Library's review process. A badge is information about the note, not a ruling about the text it summarises."],mizanvol:["Volume references","The English al-Mizan is 40 volumes: 1 to 13 by WOFIS in Rizvi's translation, 14 to 40 by Tawheed Institute Australia, about two English volumes per Arabic volume. The volume shown is taken from publisher and bookseller listings; a volume marked 'inferred' is worked out from the neighbouring volumes. Page numbers for a passage are not published anywhere, so record the page from your own copy in the field; it syncs and shows in the course index."],qprogress:["Recording progress","Three states per reading: read, read but worth revisiting, or not yet. Tap the big buttons for today, or tap any square in the grid to cycle it. Bulk update marks a range at once, or everything up to today, for catching up or reading ahead. Progress is stored once per reading, not per day, so it survives the course repeating."],backdate:["Logging a past day","Missed a day? Pick the date in 'Logging for' and everything you enter, check-ins, mood, sleep, gratitude, the verse read, the journal, learning done and the family circle, is saved to that day. The Learn tab shows that day's readings so the journal matches. Tap 'Back to today' when done. Weigh-ins and growth entries already carry their own date."],readmore:["Read more","Every item on the Learn tab has a long-form companion: for a story, the full narrative, where it is in the Quran, al-Mizan's reading, lessons and questions; for a book, what it is, its main ideas, why it matters, how it applies to the family and what to read next; for a teaching, the context, meaning, source and grading. The children's layer shows a longer bedtime version instead. Copy puts the whole thing on the clipboard as plain text; Share opens the phone's share sheet. All of it is a draft until reviewed."],appearance:["Appearance","Auto follows the phone or computer: light by day if the device is, dark if it is. Light and Dark fix it for this device only; each phone keeps its own choice. The button at the top cycles through the three."],push:["Notifications","Only on the self-hosted OnePlate, installed to the Home Screen. Reminders arrive as app notifications: when the fast is complete, the protein starter at 7 pm, the weigh-in on Friday morning, the family circle at 8:30 pm and the Quran reading at 9:30 pm. Each is sent once and only if the thing is not already recorded; untick the ones you do not want. iPhone needs iOS 16.4 or later and the app installed from Safari's Share \u2192 Add to Home Screen."],health:["Apple Health","A web app cannot read Apple Health; only a native app can. An iPhone Shortcut can read Health and post the numbers to OnePlate every night through a private address. Weight becomes a weigh-in (a weigh-in typed by hand is never overwritten), steps and sleep and cycling fill the day's check-ins, and the raw numbers show under the check-ins. Revoke the address from the Account card if it leaks. Children are never tracked."],familylink:["Family links","Only on the self-hosted OnePlate. Each adult gets a private link. Opening it asks for that person's date of birth, which must match the Family tab, then signs the device in and offers Face ID or fingerprint (a passkey). After that the link, or the installed app, opens by itself. The link is the real secret: 32 random characters; the date of birth stops someone who merely finds the link. Revoke a link from the Account card if it leaks. Children do not get links; their parents log for them."],account:["Account","Only on the self-hosted OnePlate. Invite codes let Uzma register as a contributor; Export downloads every record of the household as JSON; Delete removes the household and all its data permanently after a second tap."],steps:["Steps","Your phone counts them. 8,000 a day is the target, including the walk after dinner. More is a bonus, not a requirement."],phase:["Phase","Where you are in the plan. Weeks 1 to 3 are the beginner phase, 4 to 7 intermediate, 8 to 12 intervals, then maintenance. Your start date sets it."],week:["Week number","Counted from your start date in Settings."],cycle:["Stationary cycling","Riding an exercise bike that stays in place. No impact on the healed leg, good for the heart, burns calories. Four rides of 30 minutes make 120 minutes a week."],rpe:["RPE (how hard it feels)","A 1 to 10 scale of effort. 3 to 4: you can talk in full sentences. 5 to 6: short sentences only. 7 to 8: a few words at a time."],steady:["Steady ride","One continuous ride at an easy, talkable pace. The bread and butter of the cycling plan."],intervals:["Intervals","Short hard efforts with easy recovery between them, for example 1 minute hard then 2 minutes easy, eight times. Only from week 8."],recovery:["Active recovery","An easy day. A gentle walk or an easy 15-minute spin plus stretching. Rest is when the body actually improves."],strength:["Strength training","Lifting or bodyweight exercises that make muscles stronger. It protects muscle while you lose fat and loads the leg bone in a healthy way. Locked until you have lost 5 kg; no equipment needed yet."],unlock:["Unlocking strength","Strength training switches on automatically once your latest weigh-in is 5 kg below your start weight. Until then: fasting, walking and cycling only."],deload:["Deload week","One easier week every 6 to 8 weeks: half the usual training. It prevents burnout and lets the body catch up."],rate:["Weekly rate","How many kg you are losing per week, worked out from your first and latest weigh-ins. Healthy target: 0.45 to 0.65 kg a week."],projected:["Projected date","If you keep losing at your current weekly rate, this is when you would reach the target. It moves as you log more weigh-ins."],plateau:["Plateau","Three Monday weigh-ins in a row with no drop and no change in waist. Two flat weeks is normal noise, not a plateau."],waist:["Waist measurement","Tape around the belly at the navel, relaxed, at the end of a normal breath out. Every second Monday. It shows fat loss even when the scale is stubborn."],maintenance:["Maintenance week","One planned week every 8 to 10 weeks where you eat a little more (an extra roti or cupped hand) and train lighter. It makes the plan last."],deficit:["Calorie deficit","Eating a bit less energy than your body uses each day, so it burns stored fat to make up the difference. About 500 to 700 calories a day on this plan."],strict:["Strict fast","Nothing with any calories at all. Water, black coffee and plain tea only. The religious and research definition."],fatloss:["Fat-loss fast","The one that matters here. Keeps calories near zero so the day's deficit stays intact. A few calories from ispaghol or a splash of milk do not change the result."],autophagy:["Autophagy","The body's cell clean-up process, which rises during long fasts. Heavily marketed, but human evidence at 20 to 24 hours is weak. Not something to optimise for weight loss."],cheat:["Cheat meal","One planned relaxed meal a week, Saturday 7 PM, in place of dinner. One meal, not a whole day. Protein first, one plate, no refill, walk after."],electrolytes:["Electrolytes","Salt and minerals (sodium, potassium, magnesium) lost in sweat and during fasting. Low sodium causes the dizziness people blame on hunger. A pinch of salt in water fixes it."],creatine:["Creatine","A safe, well-studied powder that helps muscles hold strength while dieting. 3 to 5 g a day. Causes 1 to 2 kg of harmless water weight in the first week. Start it when strength training unlocks."],whey:["Whey protein","Milk protein powder. Mixed with water it gives 25 to 30 g of protein in a few seconds. A food, not a drug. Useful as the starter on meatless nights."],vitd:["Vitamin D","Needed for bone strength around the healed fracture. Very common to be low in Pakistan with an indoor job. 1,000 to 2,000 IU a day with dinner."],omad:["OMAD","One Meal A Day. Your original routine. It works, but it makes eating enough protein and recovering from exercise harder. The plan uses a small starter plus one plate instead."],sync:["Synced","Your check-ins and weigh-ins are saved to your Claude account, so the same data appears on your iPhone and your Android phone."],local:["This device only","Not signed in or offline, so data is saved only in this browser. Sign in to claude.ai and reopen the link to sync."],familyeditor:["Family editor","You are signed in as a family member with Contributor access. You can log weigh-ins and growth for Uzma, Abbas and Eliyya, edit their profiles, and add or edit meals. Tafseer's own fast, check-ins, weigh-ins and settings stay his."],viewonly:["View only","You can see everything live: the fast timer, today's check-ins, all progress and weigh-ins, the training week and the full meal list. Only the owner can change entries. Use the five tabs at the bottom to navigate."],nail:["Titanium nail","The metal rod inside the left shin bone from the fracture. Walking and cycling are good for it. No running or jumping until an orthopaedic surgeon says so."],tibia:["Tibia and fibula","The two bones of the lower leg. The tibia is the big shin bone that holds the nail."]},me={Today:"\u0622\u062C",Plate:"\u067E\u0644\u06CC\u0679",Family:"\u062E\u0627\u0646\u062F\u0627\u0646",Train:"\u0648\u0631\u0632\u0634",Progress:"\u067E\u06CC\u0634 \u0631\u0641\u062A",Learn:"\u0633\u06CC\u06A9\u06BE\u06CC\u06BA","Good morning":"\u0635\u0628\u062D \u0628\u062E\u06CC\u0631","Good afternoon":"\u062F\u0648\u067E\u06C1\u0631 \u0628\u062E\u06CC\u0631","Good evening":"\u0634\u0627\u0645 \u0628\u062E\u06CC\u0631","Catching up":"\u067E\u0686\u06BE\u0644\u06D2 \u062F\u0646 \u06A9\u0627 \u0627\u0646\u062F\u0631\u0627\u062C",Fast:"\u0631\u0648\u0632\u06C1",Fasting:"\u0631\u0648\u0632\u06C1 \u062C\u0627\u0631\u06CC","Eating window":"\u06A9\u06BE\u0627\u0646\u06D2 \u06A9\u0627 \u0648\u0642\u062A","Start fast now":"\u0627\u0628\u06BE\u06CC \u0631\u0648\u0632\u06C1 \u0634\u0631\u0648\u0639 \u06A9\u0631\u06CC\u06BA","End fast, eat":"\u0631\u0648\u0632\u06C1 \u062E\u062A\u0645\u060C \u06A9\u06BE\u0627\u0626\u06CC\u06BA",Cancel:"\u0645\u0646\u0633\u0648\u062E","Set times":"\u0648\u0642\u062A \u062F 7\u0632\u0639",Review:"\u062C\u0627\u0626\u0632\u06C1",Close:"\u0628\u0646\u062F \u06A9\u0631\u06CC\u06BA"};var wa=[{n:1,a:"Al-Fatiha",t:"The Opening",v:7,p:"Meccan",mz:"Al-Mizan reads the surah as the servant's own words taught by Allah: praise, then worship and help sought from Him alone, then the single request that matters, the straight path."},{n:2,a:"Al-Baqarah",t:"The Cow",v:286,p:"Medinan",mz:"Al-Mizan states the surah's purpose as one call: believe in everything Allah sent down without separating one messenger from another; the stories of Adam and Bani Israel show what accepting or refusing that call looks like."},{n:3,a:"Aal Imran",t:"The Family of Imran",v:200,p:"Medinan",mz:"Al-Mizan sees the surah urging the believers to unite on faith and patience against the pressure of the People of the Book and the hypocrites, with Uhud as the lesson in holding fast together."},{n:4,a:"An-Nisa",t:"The Women",v:176,p:"Medinan",mz:"Al-Mizan reads the surah as the law of the household and the community: women, orphans, inheritance, marriage, and the justice that must hold between people before it can hold between nations."},{n:5,a:"Al-Ma'idah",t:"The Table Spread",v:120,p:"Medinan",mz:"Al-Mizan takes 'fulfil your covenants' as the surah's thread: the covenant with Allah, the covenants of the earlier communities and what breaking them cost, and the completion of the religion."},{n:6,a:"Al-An'am",t:"The Cattle",v:165,p:"Meccan",mz:"Al-Mizan reads the whole surah as an argument for tawhid against the idolaters: Allah's creation and lordship, the refutation of invented laws about cattle, and Ibrahim as the model of reasoning to the One."},{n:7,a:"Al-A'raf",t:"The Heights",v:206,p:"Meccan",mz:"Al-Mizan reads the surah as the covenant taken from all humanity and the record of how nations answered their messengers, Nuh to Musa, so the listener knows which line they stand in.",s:"The fall of Iblis and the descent of Adam, the people of the Heights between the two gardens, the messengers Nuh, Hud, Salih, Lut and Shu'ayb each rejected by their people, Musa before Pharaoh and the calf, and the primordial covenant 'Am I not your Lord?'",l:"Every nation was asked the same question and answered with its deeds; the answer is still being given.",k:"A long surah of stories about prophets whose people would not listen, and a reminder that we all once said 'Yes' to Allah."},{n:8,a:"Al-Anfal",t:"The Spoils of War",v:75,p:"Medinan",mz:"Al-Mizan reads the surah through the day of Badr: the spoils belong to Allah and the Messenger, victory came from Allah and the angels, and obedience and unity are what a believing community owes in return.",s:"Revealed after Badr: who the spoils belong to, how Allah aided the few against the many, the qualities of true believers, the warning against fleeing, treachery and division, and the bond of brotherhood between the emigrants and their helpers.",l:"Victory is Allah's gift to a community that obeys and holds together; it is not the arithmetic of numbers.",k:"After the first big battle Allah told the Muslims that He had helped them, and that they should share fairly and stay united."},{n:9,a:"At-Tawbah",t:"The Repentance",v:129,p:"Medinan",mz:"Al-Mizan reads the surah as the final settlement with idolatry and with hypocrisy inside Medina: treaties ended, Tabuk and the ones who stayed behind, and repentance held open to the sincere, including the three who were left waiting.",s:"The only surah without a basmala: the end of treaties with the idolaters, the expedition to Tabuk, the hypocrites exposed by their excuses, zakat and its recipients, the three left behind whose repentance was accepted, and the Prophet described as grieving over his people.",l:"Sincerity cannot be faked for long; Allah accepts the repentance of the one who stops making excuses.",k:"This surah is about keeping your word and being truthful. Three men told the truth about a mistake, and Allah forgave them."},{n:10,a:"Yunus",t:"Jonah",v:109,p:"Meccan",mz:"Al-Mizan reads the surah as a proof of the Quran and of the resurrection from Allah's signs in creation, with Nuh, Musa and Yunus's people as examples of punishment and of the one city that believed in time.",s:"Allah's signs in the sun, moon and the alternation of day and night; the idolaters' demand for a different Quran; Nuh and Musa before Pharaoh, who believed only as he drowned; and the people of Yunus, the one nation that repented and was spared.",l:"Repentance before the moment of punishment is accepted; at the moment of drowning it is too late.",k:"Pharaoh said he believed only when the water was closing over him, but the people of Yunus said sorry in time and Allah saved them."},{n:11,a:"Hud",t:"Hud",v:123,p:"Meccan",mz:"Al-Mizan reads the surah as the call to worship Allah alone and seek His forgiveness, with the stories of Nuh, Hud, Salih, Ibrahim, Lut, Shu'ayb and Musa told at length as the proof of what follows refusal; the Prophet is told to stand firm as commanded.",s:"Nuh building the ark while his people mocked and his own son refusing to board; Hud, Salih and Shu'ayb each pleading with their people; the angels visiting Ibrahim with good news and then Lut; and the command 'stand firm as you were commanded'.",l:"Standing firm is quiet and daily; the prophets held their course while their people laughed.",k:"Nuh built a big ship while people laughed at him. When the flood came, the ones who had listened were safe inside."},{n:12,a:"Yusuf",t:"Joseph",v:111,p:"Meccan",mz:"Al-Mizan reads the surah as one continuous story of wilayah: Allah's guardianship of a servant who gave himself wholly to Him, carrying Yusuf from the well to the throne and finally to the reunion."},{n:13,a:"Ar-Ra'd",t:"The Thunder",v:43,p:"Medinan",mz:"Al-Mizan reads the surah as establishing that the Quran is the truth from Allah, proven by His signs in creation and His knowledge of every soul, so that the disbelievers' demand for a different sign is answered.",s:"The heavens raised without pillars, the earth spread with rivers and paired fruits, thunder glorifying Allah, the parable of the flood's foam and the lasting metal, the qualities of those who keep the covenant, and the promise that hearts find rest in Allah's remembrance.",l:"Hearts find rest in the remembrance of Allah; everything else is foam carried off by the flood.",k:"Even the thunder praises Allah. The surah says our hearts become calm when we remember Him."},{n:14,a:"Ibrahim",t:"Abraham",v:52,p:"Meccan",mz:"Al-Mizan reads the surah as the Book that brings people from darkness to light, with Ibrahim's prayer for Makkah and his descendants as the surah's heart and the parable of the good word as its image."},{n:15,a:"Al-Hijr",t:"The Rocky Tract",v:99,p:"Meccan",mz:"Al-Mizan reads the surah as consolation for the Prophet under mockery: Allah guards the Quran, the stories of Iblis, Ibrahim's guests, Lut and the people of al-Hijr show how refusal ends, and the surah closes with 'worship your Lord until certainty comes'.",s:"The disbelievers will wish they had submitted; Allah sent down the Reminder and guards it; the story of Iblis's refusal and his respite; Ibrahim's guests and Lut's people; the dwellers of al-Hijr who carved homes in the mountains; the gift of the seven oft-repeated verses; and the command to proclaim openly and worship until death.",l:"Mockery is answered with proclamation and worship, not with argument; Allah guards what He sent down.",k:"Allah promised to protect the Quran. People made fun of the Prophet, but Allah told him to keep going and keep praying."},{n:16,a:"An-Nahl",t:"The Bee",v:128,p:"Meccan",mz:"Al-Mizan reads the surah as a catalogue of Allah's blessings, from the cattle and rain to the bee and the milk, that convicts ingratitude and calls to the religion of Ibrahim with wisdom and good counsel.",s:"The surah of blessings: cattle, rain, the sea, the mountains, the bee inspired to build and give honey, milk from between blood and dung, the parable of the ungrateful town, the command to be just and generous, and the final instruction to call to Allah with wisdom and patience.",l:"Count the blessings honestly and ingratitude becomes impossible; gratitude is the beginning of worship.",k:"Allah told the bee how to build its home and make honey. The surah lists many gifts so we remember to say thank you."},{n:17,a:"Al-Isra",t:"The Night Journey",v:111,p:"Meccan",mz:"Al-Mizan reads the surah as the glorification of Allah who carried His servant by night, followed by the two decrees about Bani Israel, the charter of commandments from tawhid to kindness to parents, and the Quran as the sign that cannot be matched.",s:"The night journey to the farthest mosque; the two corruptions of Bani Israel and their consequences; the great charter of commandments, from worshipping Allah alone and honouring parents to honest measure and humility in walking; the Quran that jinn and humans together could not match; and the night prayer as a station of praise.",l:"Honour your parents, say to them not even 'uff', and the whole charter of this surah follows from that gentleness.",k:"One night Allah took the Prophet on a journey to Jerusalem. The surah also says to be very kind to your parents and never say 'uff' to them."},{n:18,a:"Al-Kahf",t:"The Cave",v:110,p:"Meccan",mz:"Al-Mizan reads the surah as praise of the Book that warns, with four trials laid out in its stories, faith, wealth, knowledge and power, and the sleepers, the two gardens, Khidr and Dhul-Qarnayn as their answers."},{n:19,a:"Maryam",t:"Mary",v:98,p:"Meccan",mz:"Al-Mizan reads the surah as a chain of Allah's mercy to His servants, Zakariyya, Maryam, Ibrahim and Musa, against the claim that the Merciful has a son."},{n:20,a:"Ta-Ha",t:"Ta-Ha",v:135,p:"Meccan",mz:"Al-Mizan reads the surah as reassurance to the Prophet that the Quran was not sent to distress him, with Musa's commissioning, Pharaoh and the calf as the long example of a prophet carried by Allah's care."},{n:21,a:"Al-Anbiya",t:"The Prophets",v:112,p:"Meccan",mz:"Al-Mizan reads the surah as the nearing reckoning and the one message of every prophet: there is no god but Me, so worship Me; the prophets are paraded quickly to show that the message never changed.",s:"The reckoning draws near while people play; the heavens and earth were one mass that Allah split; Ibrahim breaking the idols and the fire made cool; Lut, Nuh, Dawud and Sulayman, Ayyub's patience, Yunus's cry from the darkness, Zakariyya and Maryam; and the mercy sent to all the worlds.",l:"Every prophet carried the same sentence: there is no god but Allah; the differences are in the trials, not the message.",k:"Many prophets in one surah. Yunus called to Allah from inside the fish and Allah answered him, as He answers everyone who calls."},{n:22,a:"Al-Hajj",t:"The Pilgrimage",v:78,p:"Medinan",mz:"Al-Mizan reads the surah as fear of the Hour and the proof of resurrection from the stages of a human life and the reviving of dead earth, with the hajj and the first permission to fight as the community's duties.",s:"The earthquake of the Hour; resurrection proved from the drop, the clot and the dead earth brought to life by rain; the ones who worship on an edge; the hajj proclaimed by Ibrahim; the sacrifice where only piety reaches Allah; the first permission to fight for those wronged; and the call to strive for Allah as He deserves.",l:"Neither the meat nor the blood reaches Allah; only the piety of the one who offers it.",k:"This surah is about hajj, the big journey to the Kaaba that Ibrahim built. It also says Allah can bring dry earth back to life with rain."},{n:23,a:"Al-Mu'minun",t:"The Believers",v:118,p:"Meccan",mz:"Al-Mizan reads the surah as the call to faith through a portrait of the believers who succeed, the stages of human creation and the stories of Nuh and the messengers, with the warning that no one may ask to return once death comes.",s:"The successful believers described: humble in prayer, turning from the vain, paying zakat, guarding chastity and trust; the stages of creation from clay to a new being; Nuh and the messengers after him; the nearness of 'My Lord, send me back' at death; and the weighing of deeds.",l:"The surah opens with 'the believers have succeeded' and lists the daily habits that success is made of.",k:"The surah tells what good believers do every day: pray with a quiet heart, stay away from silly things, keep promises and give to others."},{n:24,a:"An-Nur",t:"The Light",v:64,p:"Medinan",mz:"Al-Mizan reads the surah as the laws that protect honour and the home, modesty, permission and slander, gathered around the verse of light that describes Allah's guidance in a believing heart."},{n:25,a:"Al-Furqan",t:"The Criterion",v:77,p:"Meccan",mz:"Al-Mizan reads the surah as the defence of the Prophet and the Quran against the objections of the disbelievers, closing with the portrait of the servants of the Merciful who walk the earth gently.",s:"The Criterion sent to warn the worlds; the objections that the Prophet eats and walks in markets; the destroyed nations; the signs in the shade, night, wind and the two seas; and the servants of the Merciful: gentle in walking, answering ignorance with peace, standing in prayer by night, neither wasteful nor stingy, and praying for their families.",l:"The servants of the Merciful answer the ignorant with 'peace'; that is the whole manner of the surah.",k:"The best people walk gently and when someone is rude they just say 'peace'. They pray at night and ask Allah for a good family."},{n:26,a:"Ash-Shu'ara",t:"The Poets",v:227,p:"Meccan",mz:"Al-Mizan reads the surah as consolation for the Prophet grieving over his people's refusal: seven nations and their messengers, each ending 'surely in this is a sign', to show that most never believed and Allah's mercy still prevailed.",s:"Musa before Pharaoh and the sorcerers who bowed; Ibrahim's reasoning with his father; Nuh, Hud, Salih, Lut and Shu'ayb each saying 'I ask you no wage'; the Quran brought down by the trusted Spirit on a clear Arabic tongue; and the poets who say what they do not do, except those who believe and do right.",l:"'I ask you no wage for it' is the mark of every true messenger and of every sincere reminder.",k:"Seven stories of prophets who said: I do not want anything from you, only that you listen to Allah. The surah repeats, 'there is a sign in this'."},{n:27,a:"An-Naml",t:"The Ant",v:93,p:"Meccan",mz:"Al-Mizan reads the surah as good news for the believers and warning for the deniers, with Sulayman's kingdom over the jinn, the birds and the ant, and the Queen of Sheba brought to submission, as its central proof of Allah's hidden ways.",s:"Musa and the fire in the valley; Sulayman understanding the ant's warning to her colony, the hoopoe's report from Sheba, the throne brought in the blink of an eye and the queen who submitted; Salih and Lut; and 'who answers the distressed when he calls'.",l:"Sulayman had everything and still said, 'This is from my Lord's favour, to test whether I am grateful.'",k:"An ant told her friends to hide from Sulayman's army, and Sulayman smiled because Allah let him understand her. A hoopoe bird brought him news of a queen."},{n:28,a:"Al-Qasas",t:"The Stories",v:88,p:"Meccan",mz:"Al-Mizan reads the surah as Allah's promise to favour the weak and make them inheritors, told through Musa's life from the basket to the burning bush, and through Qarun who was swallowed with his treasures.",s:"Musa's birth under Pharaoh's decree, the basket on the river, his mother's heart kept firm, the years in Madyan, the call at the fire and the return to Pharaoh; the truth that the Prophet could not have known these stories; and Qarun, whose treasure keys weighed down strong men and who sank into the earth.",l:"Allah wished to favour those who were oppressed and make them leaders; the weak are not forgotten.",k:"Baby Musa floated down the river in a basket and Allah brought him back to his mother. Later a rich man called Qarun showed off and lost everything."},{n:29,a:"Al-Ankabut",t:"The Spider",v:69,p:"Meccan",mz:"Al-Mizan reads the surah as the law of trial: people are not left to say 'we believe' without testing, and the nations of Nuh, Ibrahim, Lut and Shu'ayb show that every protector other than Allah is a spider's house.",s:"'Do people think they will be left alone saying 'we believe' and not tested?'; kindness to parents short of shirk; Nuh's nine hundred and fifty years, Ibrahim in the fire, Lut, Shu'ayb, Ad and Thamud; the spider's house as the frailest of homes; and prayer that restrains from wrong.",l:"Faith is tested, not declared; whoever leans on anything besides Allah leans on a spider's web.",k:"A spider's web looks like a house but it cannot keep you safe. Only trusting Allah is a real shelter. Believing means being tested sometimes."},{n:30,a:"Ar-Rum",t:"The Romans",v:60,p:"Meccan",mz:"Al-Mizan reads the surah as the promise that Allah's word comes true, the Romans' defeat and foretold victory, and the signs of His lordship in the pairs, the languages, sleep and the rain, so that people return to the natural religion.",s:"The Romans defeated and then victorious within a few years, as foretold; the signs: creation from dust, spouses with love and mercy between them, the colours of languages, sleep and seeking of bounty, lightning and rain; 'set your face to the religion, the fitra on which Allah created people'; and corruption on land and sea from what hands have earned.",l:"Allah placed love and mercy between spouses as one of His signs; the home is a place where His signs can be read.",k:"Allah made husbands and wives love each other, and that is one of His signs. He also promised the Romans would win again, and they did."},{n:31,a:"Luqman",t:"Luqman",v:34,p:"Meccan",mz:"Al-Mizan reads the surah as an invitation to tawhid and the Hereafter, with Luqman's advice to his son as a wise man's summary of the whole Book."},{n:32,a:"As-Sajdah",t:"The Prostration",v:30,p:"Meccan",mz:"Al-Mizan reads the surah as the proof of the Quran's origin, the creation and resurrection of humans, and the difference between those whose sides forsake their beds at night and those who deny.",s:"The Book without doubt from the Lord of the worlds; creation of humans from clay, then a despised fluid, then the spirit breathed in; the believers whose sides leave their beds to call on their Lord in fear and hope; what no soul knows is kept hidden for them; and the dead earth given life as the sign of the return.",l:"Those who leave their beds at night to call on their Lord have a reward no eye has seen.",k:"Some people wake up at night just to talk to Allah, and He has a surprise ready for them that nobody has seen."},{n:33,a:"Al-Ahzab",t:"The Confederates",v:73,p:"Medinan",mz:"Al-Mizan reads the surah as the Prophet's authority and household: the end of adoption as lineage, the Battle of the Trench and the believers' steadfastness, the verse of purification for the Ahl al-Bayt, and the trust that humanity undertook.",s:"Allah has not placed two hearts in one body; the Prophet is closer to the believers than their own selves; the Trench and the confederates driven back by wind and unseen forces; the wives of the Prophet and the verse of purification for the Ahl al-Bayt; the Prophet as the beautiful example and the seal of the prophets; the trust the mountains refused; and the command to send blessings on him.",l:"Allah and His angels send blessings on the Prophet; the surah asks us to join them, and to be with him as he was with us.",k:"The Prophet is the best example to copy. Allah and the angels send him salam, and we should say 'Allahumma salli ala Muhammad' too."},{n:34,a:"Saba",t:"Sheba",v:54,p:"Meccan",mz:"Al-Mizan reads the surah as the proof of the Hereafter against those who deny it, with Dawud and Sulayman's gratitude and the people of Sheba's ingratitude as the two ends of the same test.",s:"Praise to Al
