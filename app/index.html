h:"Objections and limits",p:["Some goals need a burst: a deadline, a surgery, a move. The principle is about what you repeat, not a ban on effort; the burst should be built on a base of habits that survive it."]},{h:"Practice",l:["Make tomorrow's habits small enough to be certain, not large enough to be impressive.","Count streaks of days, not sizes of sessions."]}],kids:["Doing a little bit every day, like brushing your teeth, is better than doing a huge amount once and then stopping."]},"The golden mean":{sections:[{h:"The argument",p:["Aristotle observed that every excellence of character sits between two failures: courage between cowardice and rashness, generosity between meanness and waste, good temper between irritability and apathy, friendliness between quarrelsomeness and flattery. The mean is not the arithmetic middle but the right amount for this person in this situation, found by practical wisdom. Virtue is therefore a skill of calibration, and the vices are miscalibrations in either direction."]},{h:"Where it comes from",p:["Nicomachean Ethics, Book II. The Islamic philosophers took it up: Ibn Miskawayh's Refinement of Character and al-Ghazali's Ihya set the four cardinal virtues as means, wisdom between cunning and dullness, courage between recklessness and cowardice, temperance between greed and insensibility, and justice as the balance of all three. The Quran's own words: a middle community (2:143), and neither wasteful nor stingy (25:67)."]},{h:"Objections and limits",p:["Not every virtue has two opposites: truthfulness has no excess. And the mean can become an excuse for mediocrity if 'moderate' is read as 'average'. Aristotle's reply is that the mean is an extreme of rightness."]},{h:"Practice",l:["Name the two failures around a virtue you want: what is too little, what is too much?","The plate is a mean: between the fast that weakens and the feast that dulls."]}],kids:["The best way is usually in the middle: not too scared and not too wild, not too stingy and not too wasteful."]},"Attention shapes reality":{sections:[{h:"The argument",p:["What you attend to is what you experience; everything else is, for you, not happening. William James wrote that experience is what I agree to attend to, and the Bayan practice adds that attention is trainable: a day spent noticing blessings builds a brain that notices blessings. The Quran's command to remember Allah much is a command about attention, and its warnings about heedlessness, ghaflah, are about the same faculty left to drift."]},{h:"Where it comes from",p:["James, Principles of Psychology (1890), on attention; the Quranic vocabulary of dhikr and ghaflah; the Bayan practice of a daily gratitude record. Cognitive science calls it attentional bias and finds it in anxiety and in contentment alike."]},{h:"Objections and limits",p:["Attention does not change facts; a real problem ignored stays real. The claim is about which facts become your life, not about whether facts exist."]},{h:"Practice",l:["The three gratitudes on Today are an attention exercise, not a mood exercise.","Notice what you noticed today; it is what you practised."]}],kids:["What you pay attention to grows. If you look for things to be thankful for, you find more and more of them."]},"Knowledge without action is wasted":{sections:[{h:"The argument",p:["Imam 'Ali is reported to have said that knowledge calls out to action, and if it is answered it stays, and if not it departs. The claim is that knowledge not acted on is not merely idle but lost: the mind forgets what the hands never confirmed, and the self stops trusting what it knows. Learning is completed by doing; the doing is part of the knowing."]},{h:"Where it comes from",p:["Nahj al-Balagha, Saying 366, received; the Quran's donkey carrying books (62:5) and the question why you say what you do not do (61:2); the Bayan practice's 'next action' line in the journal."]},{h:"Objections and limits",p:["Some knowledge is for its own sake and some is for later; the principle is about knowledge that has an action and is denied it. Mathematics is not wasted by not being used tonight."]},{h:"Practice",l:["End every reading with a next action, as the journal asks.","Teach the children one thing and have them do it the same day."]}],kids:["If you learn something good and do not do it, you forget it. Learning is finished when you do it."]},"The dichotomy of control":{sections:[{h:"The argument",p:["Epictetus opened his Handbook with it: some things are up to us, our opinions, impulses, desires and aversions; some are not, our body, property, reputation and office. Confusing the two is the source of misery; sorting them is the beginning of freedom. The Islamic parallel is tawakkul: work on the causes you are given, and entrust the outcome to Allah, who is the only one in control of it."]},{h:"Where it comes from",p:["Epictetus, Enchiridion 1; Marcus Aurelius throughout; the hadith of the camel: tie it, and rely; and 65:3, whoever relies on Allah, He is sufficient."]},{h:"Objections and limits",p:["The Stoic version can slide into indifference about outcomes that matter to others; the Islamic version keeps the duty of effort and the hope of result, and only transfers the anxiety."]},{h:"Practice",l:["Before worrying, sort: mine, or Allah's?","The plate and the training are yours; the number on the scale is not."]}],kids:["Some things you can control, like how hard you try. Some things you cannot, like what other people do. Work on the first, and trust Allah with the second."]},"'Asabiyyah: the strength of the group":{sections:[{h:"The argument",p:["Ibn Khaldun saw that the power of a people is not its wealth or weapons but the feeling that makes its members stand together, 'asabiyyah, and that this feeling is strongest in groups that have shared hardship and weakest in those who have shared only comfort. Dynasties rise on it and decline when luxury loosens it. The smallest group with 'asabiyyah is the family, and the dinner table is where it is made or lost."]},{h:"Where it comes from",p:["The Muqaddimah (1377), Chapter 2 and 3. The Quran's 'hold fast to the rope of Allah, all together' (3:103) and the Ansar's brotherhood with the emigrants. The Prophet's rule that the hand of Allah is with the group."]},{h:"Objections and limits",p:["'Asabiyyah can become tribalism, which the Prophet condemned: not of us is he who calls to 'asabiyyah in the sense of partisanship. Ibn Khaldun's point is the strength of solidarity, and faith is its best content."]},{h:"Practice",l:["One shared hardship a week: the fast kept together, the long walk, the early morning.","Eat together; it is the cheapest 'asabiyyah there is."]}],kids:["A family that sticks together, shares hard things and eats together is strong. That strength is called 'asabiyyah."]},"Habit is second nature":{sections:[{h:"The argument",p:["Al-Ghazali's method for curing a bad trait is to practise the opposite until it feels natural: the miser gives until giving is easy, the hot-tempered man practises gentleness until it is his manner. Aristotle said the same: we become just by doing just acts. Character is not chosen in a moment of decision; it is the sediment of repeated acts, and the good news is that sediment can be laid down on purpose."]},{h:"Where it comes from",p:["Ihya 'Ulum al-Din, the Book of the Discipline of the Soul; Nicomachean Ethics II; modern habit research on cue, routine and reward."]},{h:"Objections and limits",p:["Habits set the default, not the whole person; a crisis can override them. But a crisis is rare and the default is daily."]},{h:"Practice",l:["Pick one trait and its opposite act; do the act daily for forty days, the tradition's number.","Children's habits are made the same way: the bedtime, the greeting, the bismillah."]}],kids:["If you do something again and again, it becomes part of you. To stop being grumpy, practise being cheerful until it is easy."]},"Bani Adam: one body":{sections:[{h:"The argument",p:["Saadi's lines in the Gulistan say that the children of Adam are limbs of one body, created from one essence; when one limb is in pain, the others cannot rest; and whoever is unmoved by another's suffering does not deserve the name of human. The claim is anthropological before it is moral: we are one, and compassion is the recognition of a fact."]},{h:"Where it comes from",p:["Gulistan, Chapter 1, Story 10 (1258). The Quran: O people, We created you from a male and a female (49:13); whoever saves one soul has saved all of humanity (5:32); and the hadith of the body: when one limb complains, the whole body responds with fever and sleeplessness."]},{h:"Objections and limits",p:["One body does not mean no boundaries; a limb has its own function. The point is that no limb can treat another's pain as not its concern."]},{h:"Practice",l:["When news of suffering comes, do one thing for it rather than scroll past.","Teach the children the poem; it is three couplets."]}],kids:["All people are like one body. If one person is hurting, everyone should feel it and help, the way your whole body feels it when your toe hurts."]},"Khudi: the self made strong":{sections:[{h:"The argument",p:["Iqbal turned a word that had meant selfishness, khudi, into a philosophy: the self is real, is the point of creation, and is strengthened by love, by desire for great things, by courage and by faith, until a servant so formed is one Allah consults. The opposite of khudi is not humility but the dissolution of the self in fear, imitation and begging. Self-respect, not self-indulgence, is the goal."]},{h:"Where it comes from",p:["Asrar-e-Khudi (1915) and the famous quatrain in Bal-e-Jibril: raise your self so high that before every decree God asks the servant what he wants. The Quran's trust carried by the human (33:72) and the strong believer of the hadith."]},{h:"Objections and limits",p:["Khudi is balanced in Iqbal's own next book, Rumuz-e-Bekhudi, the Secrets of Selflessness: the strong self exists for the community. Without that, khudi is pride."]},{h:"Practice",l:["Keep one promise to yourself a day; khudi is built from kept promises.","Teach the children Iqbal's quatrain, in Urdu, before any other poem."]}],kids:["Iqbal said: believe in yourself, work hard and be brave, and make yourself so good that Allah asks you what you want."]},"The examined life":{sections:[{h:"The argument",p:["Socrates told the jury that sentenced him that the unexamined life is not worth living for a human being: a life that never asks what it is doing, or why, is a life only in the biological sense. The Islamic tradition says it as muhasabah, taking account of oneself, and 'Umar's sentence: take yourselves to account before you are taken to account. Five minutes of honest review a day is the difference between living and passing through."]},{h:"Where it comes from",p:["Plato's Apology, 38a; the tradition of muhasabah in al-Muhasibi and al-Ghazali; the Bayan journal's four questions, which are an examination in miniature."]},{h:"Objections and limits",p:["Examination can become self-absorption; the tradition pairs it with action and with mercy toward oneself. Examine, correct, move on."]},{h:"Practice",l:["The journal: what I learned, what surprised me, what I ask, what I will do.","Ask the children one examining question at bedtime: what was the best thing you did today?"]}],kids:["A wise man called Socrates said that a life you never think about is not really a life. So ask yourself every night: what did I do well today?"]},"Opportunity cost":{sections:[{h:"The argument",p:["Every choice is also a refusal: the hour given to one thing is taken from everything else it could have been given to, and the true cost of anything is the best alternative forgone. Bastiat called it what is not seen, the thing that did not happen because the resource went elsewhere. The idea makes time visible as the scarce thing it is, and the Quran swore by it: by time, the human is in loss."]},{h:"Where it comes from",p:["Economics since Bastiat's 1850 essay; Surah al-'Asr; the hadith: two blessings most people waste, health and free time."]},{h:"Objections and limits",p:["Not every hour must be optimised; rest has value too, and the calculation can become tyranny. The point is to choose rather than drift."]},{h:"Practice",l:["Before an hour of scrolling, name what it is costing: the walk, the reading, the child.","Budget the evening like money."]}],kids:["Every time you choose to do one thing, you are choosing not to do something else. An hour of games is an hour you did not read or play outside."]},"Marginal gains":{sections:[{h:"The argument",p:["Improve many small things by a little and the sum is large, because the gains compound and because small changes are kept where large ones are abandoned. The British cycling team's phrase for it was the aggregation of marginal gains; the Japanese word is kaizen, continuous improvement. OnePlate is built on it: a thumb less oil, a bottle more water, a walk after dinner, a roti fewer."]},{h:"Where it comes from",p:["Sports science and Toyota's production method; and the hadith on consistent small deeds, which says the same about worship."]},{h:"Objections and limits",p:["Some problems need one big change, not many small ones: a toxic job, a bad medication. Marginal gains work on a sound structure."]},{h:"Practice",l:["Change one thing by one percent this week and keep it.","List the small wins on Sunday; they are easy to forget and they are the whole story."]}],kids:["Lots of tiny improvements add up to a big one. A little less sugar, a little more walking, every day, and in a year you are a different person."]},"Muraqabah: self-watching":{sections:[{h:"The argument",p:["Muraqabah is living in the knowledge that you are seen; muhasabah is reviewing what you did in that knowledge. Together they are the engine of character in the Sufi tradition: the first keeps the act clean while it happens, the second corrects the ones that were not. The Quran's name for the state is ihsan, worship as if you see Him, since He sees you."]},{h:"Where it comes from",p:["Al-Muhasibi (d. 857), whose very name means the self-accountant; al-Ghazali's book on muraqabah and muhasabah in the Ihya; the hadith of Jibril on ihsan; 'Umar's saying about accounting."]},{h:"Objections and limits",p:["Muraqabah without mercy becomes scrupulosity; the tradition pairs it with hope and with the knowledge that the Watcher is the Forgiver."]},{h:"Practice",l:["One hour a day of deliberate muraqabah: the fast's last hour, say.","The evening review on Today is muhasabah in checkboxes."]}],kids:["Muraqabah means remembering that Allah can see you all the time, so you behave well even when nobody else is looking."]},"Division of responsibility":{sections:[{h:"The argument",p:["Ellyn Satter's rule for feeding children: the parent decides what food is served, when and where; the child decides whether to eat and how much. Pressure to eat more, or less, or to finish, teaches a child to ignore the signals of hunger and fullness that regulate weight for life, and produces the picky eater and the overeater alike. Trust the child's appetite, structure the meals, and stop at that."]},{h:"Where it comes from",p:["Satter, Child of Mine (1983 onward), adopted by paediatric bodies; the Thuluth project's rule that children are never restricted; the hadith that the Prophet never criticised food, and the fitrah."]},{h:"Objections and limits",p:["It assumes the food offered is good; the parent's half of the deal is real work. And a medical condition can need a doctor's plan."]},{h:"Practice",l:["Serve the family plate; let Abbas and Eliyya decide how much.","Never praise a clean plate; praise trying a new food."]}],kids:["Parents decide what food is on the table and when. Children decide how much they want to eat. Nobody has to finish their plate."]},"First principles":{sections:[{h:"The argument",p:["Reasoning by analogy says: this is how it is done. Reasoning from first principles says: what is actually true here, and what follows? Aristotle called the starting truths archai and Ibn Sina built the Canon on them: a diet is reasoned from physiology, not from fashion. For OnePlate the first principles are a handful: energy balance, protein for muscle, fibre for fullness, sleep for appetite, and what revelation says about the stomach's thirds."]},{h:"Where it comes from",p:["Aristotle's Posterior Analytics; Ibn Sina's method in the Canon; modern engineering's use of the phrase."]},{h:"Objections and limits",p:["Tradition carries knowledge that first principles cannot derive quickly; the recipe that survived a thousand years has reasons in it. Use both."]},{h:"Practice",l:["When a diet claim arrives, ask what principle it rests on.","Teach the children to ask 'why' and to accept 'I do not know yet' as an answer."]}],kids:["Instead of copying what everyone does, ask: what is really true here? Then work it out from there."]},"The virtuous city":{sections:[{h:"The argument",p:["Al-Farabi's ideal city is one where each member performs a function toward the shared goal of happiness, like organs in a healthy body, under a ruler who is both wise and good. The household is the first such city: its members have roles, its goal is the flourishing of all, and its ruler leads by knowledge and care. A family with no shared goal is a city without a purpose."]},{h:"Where it comes from",p:["Al-Farabi, Al-Madina al-Fadila (tenth century), built on Plato's Republic; the Quran's household verses; and Imam 'Ali's letter to Malik, which treats the ruler as physician."]},{h:"Objections and limits",p:["Organs do not choose; people do. The image is about cooperation, not about fixed castes, and al-Farabi's own ruler is a teacher."]},{h:"Practice",l:["Name the family's goal in a sentence and put it where the children see it.","Give each person a function toward it, including the youngest."]}],kids:["Al-Farabi said a good city is like a healthy body: every part does its job for the whole. A family is the same, and everyone has a job."]},"Grief as a guest":{sections:[{h:"The argument",p:["Rumi's image, in the poem known in English as The Guest House, is that each feeling is a visitor: welcome it, learn why it came, and it leaves; bar the door and it moves in. The claim is about resistance: a sorrow acknowledged passes, a sorrow denied becomes a resident. The Quran's patient say 'we belong to Allah' at the moment of loss, which is an acknowledgement, not a denial."]},{h:"Where it comes from",p:["Masnavi, Book V, in Coleman Barks's free rendering as The Guest House; 2:156; the Prophet's tears for his son Ibrahim: the eye weeps and the heart grieves, and we say only what pleases our Lord."]},{h:"Objections and limits",p:["Some guests need a doctor: grief that will not leave for months is depression, and the metaphor should not delay help."]},{h:"Practice",l:["Name the feeling at the mood check-in; naming is welcoming.","Teach the children that sad is allowed, and that it leaves."]}],kids:["Rumi said feelings are like guests who knock at your door. Let sadness in, ask what it wants, and it will leave. If you lock it out, it stays."]},"Ask, do not assume":{sections:[{h:"The argument",p:["Consultation is commanded to the Prophet in the verse after a disaster caused by the people he is to consult, which tells us what it is for: not for getting consent but for discovering what you do not know you do not know. Socrates' method was the same: questions expose the gap between what we think we know and what we know. A leader who asks is corrected before he fails; one who assumes is corrected by the failure."]},{h:"Where it comes from",p:["3:159 and 42:38, their affairs by consultation; the Prophet's consultation at Badr and the Trench; Plato's dialogues."]},{h:"Objections and limits",p:["Consultation ends in a decision; the verse continues 'when you have decided'. Endless asking is its own failure."]},{h:"Practice",l:["Ask Uzma what she sees in the plan that you do not.","Ask the children what would make the family circle better, and do one thing they say."]}],kids:["Before deciding something that affects other people, ask them what they think. You might learn something you did not know."]},"Know thyself":{sections:[{h:"The argument",p:["The inscription at Delphi, gnothi seauton, meant first: know that you are mortal and not a god. The Islamic tradition's saying, whoever knows himself knows his Lord, turns it upward: the self, seen honestly, is a sign of its Maker, limited, dependent, needing, and every quality in it points to the One who has it fully. Self-knowledge is the beginning of all knowledge because it is the only knowledge from the inside."]},{h:"Where it comes from",p:["The Delphic maxim, through Plato; the saying man 'arafa nafsahu, which al-Nawawi and others say has no established chain but whose meaning is sound, and which Imam 'Ali is reported to have said in Ghurar al-Hikam; 41:53, We will show them Our signs in the horizons and in themselves."]},{h:"Objections and limits",p:["Self-knowledge is not self-esteem; it includes the faults. And it is not complete: Allah knows you better than you do."]},{h:"Practice",l:["Write three things you know about yourself that you would rather not; that is where the knowledge is.","Ask a trusted person what they see."]}],kids:["Know yourself: what you are good at, what you find hard, and what makes you cross. Knowing yourself helps you know how much you need Allah."]},"The pen is mightier":{sections:[{h:"The argument",p:["Revelation began with 'read' and the Quran swears by the pen and what they write. The Bayan Library's founding verse is 55:4, He taught him speech. The argument is that civilisation is what is written down and read again, that a people's knowledge compounds only if it is recorded, and that a family that reads together compounds its knowledge across generations in the same way."]},{h:"Where it comes from",p:["96:1\u20135, 68:1, 55:4; the hadith that the first thing Allah created was the pen; the House of Wisdom in Baghdad; the Bayan Library's manifesto."]},{h:"Objections and limits",p:["Reading without reflection is the donkey with books. The pen is mighty when what it writes is understood."]},{h:"Practice",l:["Write in the journal; the pen that writes your own day is the mightiest one you hold.","Keep a family book of what the children said; it is the family's hadith."]}],kids:["The first word of the Quran was 'read', and Allah swears by the pen. Reading and writing are how people get wiser from one generation to the next."]},"Sleep is a sign":{sections:[{h:"The argument",p:["The Quran counts sleep among Allah's signs, beside the creation of the heavens and the languages of peoples, and says He made the night a covering and sleep a rest. Sleep science has filled in why: seven to eight hours is when the body repairs tissue, the brain consolidates memory and clears waste, and the hormones of hunger and fullness, ghrelin and leptin, reset. A short night raises appetite the next day; the plate is harder to keep on five hours."]},{h:"Where it comes from",p:["30:23, 78:9, 25:47; the Prophet's practice of sleeping early after 'isha and rising for the night prayer; sleep research on appetite hormones."]},{h:"Objections and limits",p:["Sleep need varies; the sign is in the rhythm, not a single number. And the night prayer is a sign too."]},{h:"Practice",l:["Lights out at 10:45, as the plan says; the sleep field on Today keeps the record.","No screens in the hour before; the night is a covering."]}],kids:["Allah made the night for sleeping and calls sleep one of His signs. When you sleep enough, your body repairs itself and your brain files away what you learned."]},"Enough is a decision":{sections:[{h:"The argument",p:["Sufficiency is a judgement, not a quantity: the same plate is too little for one and too much for another, and the same income is enough or not depending on what is wanted. Qana'ah is the decision to call a sufficient thing enough; Epicurus found that simple pleasures, bread and water with a friend, give most of what the elaborate ones promise. The stop point at seventy to eighty percent full is a decision made before the meal, because during it the stomach is not a reliable judge."]},{h:"Where it comes from",p:["The tradition of qana'ah; the Okinawan practice of hara hachi bu, eight parts of ten; Epicurus's Letter to Menoeceus; the hadith of the thirds."]},{h:"Objections and limits",p:["Enough should not become a cover for deprivation; a growing child and a pregnant woman need more, and the plan says so."]},{h:"Practice",l:["Decide the plate before sitting down; the decision is the meal.","Teach the children the Okinawan phrase as a game: eight out of ten."]}],kids:["Enough is something you decide, not something your tummy tells you. Decide how much before you start, then stop when you get there."]},"Serve to lead":{sections:[{h:"The argument",p:["The Prophet carried bricks at the mosque, mended his own clothes, and said that the leader of a people is their servant. Imam 'Ali's letter to Malik makes the governor the people's physician and shepherd, answerable for their hunger. The claim reverses the usual direction of authority: the one with power is the one who owes service, and the father who cooks, carries and consults leads more than the one who commands from a chair."]},{h:"Where it comes from",p:["The hadith sayyid al-qawm khadimuhum, received with a weak chain but accepted in meaning; the sirah; Letter 53."]},{h:"Objections and limits",p:["Service is not the absence of decision; the servant-leader still decides. The point is where the authority comes from."]},{h:"Practice",l:["One act of service a day to someone you have authority over.","Teach the older child to serve the younger at the table."]}],kids:["The Prophet said the leader of a group is its servant. A good leader helps the people, like a father who cooks and carries, not one who only gives orders."]},"Memento mori, tadhkirat al-mawt":{sections:[{h:"The argument",p:["Remembering death is not morbid; it is a sorting instrument. Put the day's items against the fact of an ending and the important separates from the urgent: tonight's dinner together is important, most notifications are not. The Stoics kept the thought at hand; the Prophet commanded it: remember often the destroyer of pleasures. The Quran's last word in al-Takathur is that rivalry in more distracts until the graves are visited."]},{h:"Where it comes from",p:["Jami' al-Tirmidhi 2307; Seneca and Marcus; al-Ghazali's last book of the Ihya; Surah al-Takathur."]},{h:"Objections and limits",p:["For someone grieving or depressed the practice needs care; the tradition pairs it with hope in mercy."]},{h:"Practice",l:["Visit a grave with the children; the Prophet said it softens the heart.","Ask of a worry: will this matter at the end?"]}],kids:["Remembering that life does not last forever helps you see what really matters: being with your family, being kind, remembering Allah."]},"Beauty is a duty":{sections:[{h:"The argument",p:["Allah is beautiful and loves beauty, the Prophet said, in answer to a man who asked whether liking a good garment was pride. Ihsan, doing a thing beautifully, is prescribed in everything. The claim is that beauty in the small is a form of worship: the plate arranged with care, the room kept, the voice kept soft, the handwriting legible. Ugliness tolerated is a small ingratitude for the sight."]},{h:"Where it comes from",p:["Sahih Muslim 91; the hadith of ihsan in everything; 7:31, take your adornment; the calligraphers' tradition that a beautiful script is a form of dhikr."]},{h:"Objections and limits",p:["Beauty is not luxury; the Prophet's house was bare and clean. The duty is care, not expense."]},{h:"Practice",l:["Arrange tonight's plate as if for a guest.","Teach the children to make the bed beautifully, not only to make it."]}],kids:["Allah is beautiful and loves beautiful things. Doing something neatly and carefully, like setting the table nicely, is a way of thanking Him."]}};var Oe={"Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhab an-nar":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0622\u062A\u0650\u0646\u064E\u0627 \u0641\u0650\u064A \u0627\u0644\u062F\u064F\u0651\u0646\u0652\u064A\u064E\u0627 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0641\u0650\u064A \u0627\u0644\u0652\u0622\u062E\u0650\u0631\u064E\u0629\u0650 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0642\u0650\u0646\u064E\u0627 \u0639\u064E\u0630\u064E\u0627\u0628\u064E \u0627\u0644\u0646\u064E\u0651\u0627\u0631\u0650. Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire. Hasanah, good, is left unspecified: whatever is good, in each world."]},{h:"When and why",p:["The Quran contrasts it with the prayer of those who ask only for this world and have no share in the next (2:200\u2013202). The Prophet said it more than any other dua; it was his prayer between the two corners of the Ka'bah, and the companions report it after prayers and in gatherings. It is balanced: this world first, with the word 'good' as the limit."]},{h:"Source",p:["Quran 2:201; the Prophet's practice in Sahih al-Bukhari 6389 and Sahih Muslim 2690, from Anas."]},{h:"How to use it",l:["After every prayer, as he did.","The first dua after the Fatihah for the children to learn; teach the Arabic with the meaning line by line."]}],kids:["This was the Prophet's favourite dua: Allah, give us good things in this life and in the next life, and keep us safe from the Fire."]},"Rabbi zidni 'ilma":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u0650\u0651 \u0632\u0650\u062F\u0652\u0646\u0650\u064A \u0639\u0650\u0644\u0652\u0645\u064B\u0627. My Lord, increase me in knowledge. Three words, and the only increase the Prophet was commanded to ask for."]},{h:"When and why",p:["Revealed in Ta-Ha beside the command not to hurry the Quran before its revelation is complete: knowledge comes by receiving, slowly. Said before study, before reading the day's verse, before a decision that needs understanding."]},{h:"Source",p:["Quran 20:114."]},{h:"How to use it",l:["Before the Learn tab, aloud.","The children's dua before school and before homework."]}],kids:["My Lord, give me more knowledge. Say it before you learn anything, even a game."]},"Rabbi ishrah li sadri wa yassir li amri wahlul 'uqdatan min lisani yafqahu qawli":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u0650\u0651 \u0627\u0634\u0652\u0631\u064E\u062D\u0652 \u0644\u0650\u064A \u0635\u064E\u062F\u0652\u0631\u0650\u064A \u0648\u064E\u064A\u064E\u0633\u0650\u0651\u0631\u0652 \u0644\u0650\u064A \u0623\u064E\u0645\u0652\u0631\u0650\u064A \u0648\u064E\u0627\u062D\u0652\u0644\u064F\u0644\u0652 \u0639\u064F\u0642\u0652\u062F\u064E\u0629\u064B \u0645\u0650\u0651\u0646 \u0644\u0650\u0651\u0633\u064E\u0627\u0646\u0650\u064A \u064A\u064E\u0641\u0652\u0642\u064E\u0647\u064F\u0648\u0627 \u0642\u064E\u0648\u0652\u0644\u0650\u064A. My Lord, expand for me my breast, ease for me my task, and untie the knot from my tongue so that they understand my speech."]},{h:"When and why",p:["Musa's words at the burning bush when commanded to go to Pharaoh; he asked for capacity inside, ease outside, and clear speech, in that order, and then for Harun as a helper. Allah answered: you have been granted your request. It is the dua before any hard conversation, presentation, exam or difficult call."]},{h:"Source",p:["Quran 20:25\u201328."]},{h:"How to use it",l:["Before the meeting, the interview, the hard talk with a child.","Teach the children to say it before reading aloud in class."]}],kids:["Musa said this before talking to the cruel king: Allah, make my heart calm, make my job easy, and help me speak clearly. Say it before anything scary."]},"La ilaha illa anta subhanaka inni kuntu min az-zalimin":{sections:[{h:"Arabic and meaning",p:["\u0644\u064E\u0651\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u062A\u064E \u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0625\u0650\u0646\u0650\u0651\u064A \u0643\u064F\u0646\u062A\u064F \u0645\u0650\u0646\u064E \u0627\u0644\u0638\u064E\u0651\u0627\u0644\u0650\u0645\u0650\u064A\u0646\u064E. There is no god but You; glory be to You; I was indeed among the wrongdoers. Three parts and no request: tawhid, glorification, confession."]},{h:"When and why",p:["Yunus's call from inside the whale, in three darknesses, answered at once: so We answered him and saved him from the distress, and thus We save the believers. The Prophet said: no Muslim calls with it for anything but Allah answers him. It is the dua of distress of every kind."]},{h:"Source",p:["Quran 21:87\u201388; the hadith in Jami' al-Tirmidhi 3505, graded sahih."]},{h:"How to use it",l:["In any tight place: a hospital corridor, a debt, a fear at night.","Teach it to the children as the dua for when they are scared in the dark."]}],kids:["Yunus said this inside the whale: there is no god but You, Allah, You are perfect, I was wrong. Allah saved him. Say it when you are frightened."]},"Rabbana la tuzigh qulubana ba'da idh hadaytana wa hab lana min ladunka rahmah":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0644\u064E\u0627 \u062A\u064F\u0632\u0650\u063A\u0652 \u0642\u064F\u0644\u064F\u0648\u0628\u064E\u0646\u064E\u0627 \u0628\u064E\u0639\u0652\u062F\u064E \u0625\u0650\u0630\u0652 \u0647\u064E\u062F\u064E\u064A\u0652\u062A\u064E\u0646\u064E\u0627 \u0648\u064E\u0647\u064E\u0628\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646 \u0644\u064E\u0651\u062F\u064F\u0646\u0643\u064E \u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064B \u0625\u0650\u0646\u064E\u0651\u0643\u064E \u0623\u064E\u0646\u062A\u064E \u0627\u0644\u0652\u0648\u064E\u0647\u064E\u0651\u0627\u0628\u064F. Our Lord, do not let our hearts deviate after You have guided us, and grant us mercy from Yourself; You are the Bestower."]},{h:"When and why",p:["The prayer of those firm in knowledge in Aal Imran, after the verse on the clear and the ambiguous verses of the Book: those who know most ask most for steadiness. The Prophet often prayed: O Turner of hearts, make my heart firm on Your religion. It is the dua for the day after a good day."]},{h:"Source",p:["Quran 3:8."]},{h:"How to use it",l:["After a week of kept fasts, say it; steadiness is asked for, not assumed.","Teach the children that even good people ask to stay good."]}],kids:["Allah, do not let my heart go wrong after You have shown me the right way. Even good people ask Allah to help them stay good."]},"Rabbi awzi'ni an ashkura ni'mataka allati an'amta 'alayya wa 'ala walidayya wa an a'mala salihan tardahu":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u0650\u0651 \u0623\u064E\u0648\u0652\u0632\u0650\u0639\u0652\u0646\u0650\u064A \u0623\u064E\u0646\u0652 \u0623\u064E\u0634\u0652\u0643\u064F\u0631\u064E \u0646\u0650\u0639\u0652\u0645\u064E\u062A\u064E\u0643\u064E \u0627\u0644\u064E\u0651\u062A\u0650\u064A \u0623\u064E\u0646\u0652\u0639\u064E\u0645\u0652\u062A\u064E \u0639\u064E\u0644\u064E\u064A\u064E\u0651 \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0648\u064E\u0627\u0644\u0650\u062F\u064E\u064A\u064E\u0651 \u0648\u064E\u0623\u064E\u0646\u0652 \u0623\u064E\u0639\u0652\u0645\u064E\u0644\u064E \u0635\u064E\u0627\u0644\u0650\u062D\u064B\u0627 \u062A\u064E\u0631\u0652\u0636\u064E\u0627\u0647\u064F. My Lord, enable me to be grateful for Your favour which You bestowed on me and on my parents, and to do righteous work that pleases You. Awzi'ni, enable me, asks for gratitude as a gift."]},{h:"When and why",p:["Sulayman's prayer when he understood the ant, and the prayer of the person who reaches forty in al-Ahqaf, which continues: and set right my descendants; I turn to You and I am of the Muslims. Gratitude is asked for the parents' sake too, since the favour came through them."]},{h:"Source",p:["Quran 27:19 and 46:15."]},{h:"How to use it",l:["On your birthday, and on your parents'.","The dua to pair with the three gratitudes on Today."]}],kids:["Allah, help me to be thankful for everything You gave me and my parents, and help me do good things that make You happy."]},"Rabbi ij'alni muqim as-salati wa min dhurriyyati, Rabbana wa taqabbal du'a":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u0650\u0651 \u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u0650\u064A \u0645\u064F\u0642\u0650\u064A\u0645\u064E \u0627\u0644\u0635\u064E\u0651\u0644\u064E\u0627\u0629\u0650 \u0648\u064E\u0645\u0650\u0646 \u0630\u064F\u0631\u0650\u0651\u064A\u064E\u0651\u062A\u0650\u064A \u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0648\u064E\u062A\u064E\u0642\u064E\u0628\u064E\u0651\u0644\u0652 \u062F\u064F\u0639\u064E\u0627\u0621\u0650. My Lord, make me one who establishes prayer, and of my descendants too; our Lord, accept my prayer."]},{h:"When and why",p:["Ibrahim's prayer at Makkah after settling Isma'il and Hajar in the valley, in the long prayer of Surah Ibrahim that asks for the city's safety, for his descendants' prayer, for forgiveness for his parents and all believers. Prayer is asked for the children before anything else; the prayer habit is the inheritance."]},{h:"Source",p:["Quran 14:40."]},{h:"How to use it",l:["After each prayer, with the children's names in mind.","Say it aloud at the family circle so they hear themselves prayed for."]}],kids:["Ibrahim prayed: Allah, make me someone who prays, and my children too. Your parents say this dua for you."]},"Rabbana hab lana min azwajina wa dhurriyyatina qurrata a'yunin waj'alna lil-muttaqina imama":{sections:[{h:"Arabic and meaning",p:["\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0647\u064E\u0628\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u0652 \u0623\u064E\u0632\u0652\u0648\u064E\u0627\u062C\u0650\u0646\u064E\u0627 \u0648\u064E\u0630\u064F\u0631\u0650\u0651\u064A\u064E\u0651\u0627\u062A\u0650\u0646\u064E\u0627 \u0642\u064F\u0631\u064E\u0651\u0629\u064E \u0623\u064E\u0639\u0652\u064A\u064F\u0646\u064D \u0648\u064E\u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u064E\u0627 \u0644\u0650\u0644\u0652\u0645\u064F\u062A\u064E\u0651\u0642\u0650\u064A\u0646\u064E \u0625\u0650\u0645\u064E\u0627\u0645\u064B\u0627. Our Lord, grant us from our spouses and our children the comfort of our eyes, and make us a model for the God-conscious. Qurrat a'yun, coolness of the eyes: the rest of an eye that has found what it was looking for."]},{h:"When and why",p:["The last of the qualities of the servants of the Merciful in al-Furqan; the portrait ends with a family prayer. It asks for a good spouse and good children, and then for the family to be an example, which is a prayer for one's own conduct."]},{h:"Source",p:["Quran 25:74."]},{h:"How to use it",l:["The family's own dua; say it together at the circle.","Teach the children the phrase 'coolness of the eyes' and what it means to be that for their parents."]}],kids:["Allah, make our family a joy to each other's eyes, and make us a good example for other families. This is our family's dua."]},"Hasbunallahu wa ni'mal wakil":{sections:[{h:"Arabic and meaning",p:["\u062D\u064E\u0633\u0652\u0628\u064F\u0646\u064E\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u0646\u0650\u0639\u0652\u0645\u064E \u0627\u0644\u0652\u0648\u064E\u0643\u0650\u064A\u0644\u064F. Allah is sufficient for us, and the best of those entrusted with affairs. Wakil: the agent you appoint to act for you."]},{h:"When and why",p:["Said by the believers after Uhud when told that the enemy had gathered against them; they went out anyway and returned with Allah's favour, unharmed (3:173\u2013174). Ibrahim said it when thrown into the fire, by the narration in al-Bukhari, and the Prophet said it when told the same. The dua of being outnumbered."]},{h:"Source",p:["Quran 3:173; Sahih al-Bukhari 4563."]},{h:"How to use it",l:["When the news is bad and the odds are long.","Teach the children to say it when they feel small."]}],kids:["Allah is enough for us, and He is the best one to take care of things. Say it when you feel small or scared."]},"Allahumma inni as'aluka al-'afiyah":{sections:[{h:"Arabic and meaning",p:["\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0627\u0644\u0652\u0639\u064E\u0627\u0641\u0650\u064A\u064E\u0629\u064E. O Allah, I ask You for well-being. 'Afiyah is health, safety and soundness in religion, body, family and property together; the full morning dua continues: in this world and the next, and asks for pardon and well-being in religion, worldly life, family and wealth, and to be covered and protected from every direction."]},{h:"When and why",p:["The Prophet's morning and evening remembrance, from Ibn 'Umar; and his answer to his uncle al-'Abbas, who asked what to pray for: ask Allah for 'afiyah. It is the dua of health in the widest sense, the right one for a health plan."]},{h:"Source",p:["Sunan Abu Dawud 5074 and Jami' al-Tirmidhi 3514, graded sahih by al-Albani."]},{h:"How to use it",l:["Morning and evening, with the full text once you know it.","Before the weigh-in; the body's health is 'afiyah."]}],kids:["Allah, I ask You for 'afiyah: a healthy body, a safe family and a good heart. Say it in the morning and in the evening."]},"Dua Kumayl":{sections:[{h:"Arabic and meaning",p:["A long supplication that Imam 'Ali is reported to have taught to his companion Kumayl ibn Ziyad: a confession of sins and a plea by Allah's mercy, His power, His names and His light, with the famous passage asking how a servant could bear the Fire having tasted the sweetness of His remembrance, and ending with the plea to be forgiven, by His mercy, O most Merciful."]},{h:"When and why",p:["Recited on Thursday nights and on the night of mid-Sha'ban; it takes about twenty-five minutes aloud. The Bayan study records the attribution as received: the text is transmitted through al-Tusi's Misbah al-Mutahajjid (eleventh century) and later in Mafatih al-Jinan, without an early chain to the Imam, and is loved for its content."]},{h:"Source",p:["Misbah al-Mutahajjid of Shaykh al-Tusi; Mafatih al-Jinan of al-Qummi. Bayan label: received attribution."]},{h:"How to use it",l:["Thursday night, with the translation beside the Arabic, a section at a time.","Read the passage on the sweetness of remembrance to the children once; it is the heart of the dua."]}],kids:["Dua Kumayl is a long, beautiful prayer that Imam 'Ali taught a friend called Kumayl, asking Allah to forgive us because He is so kind. People read it on Thursday nights."]},"Dua 'Arafa":{sections:[{h:"Arabic and meaning",p:["The supplication attributed to Imam al-Husayn on the afternoon of 'Arafa during his last pilgrimage: a long praise of Allah through the stages of the Imam's own creation and life, bone by bone and year by year, the recognition of His favours, and an intimate address, with the closing section's questions: what did he find who lost You, and what did he lose who found You?"]},{h:"When and why",p:["Recited on the Day of 'Arafa, 9 Dhu al-Hijjah, by pilgrims at 'Arafat and by everyone else wherever they are. The Bayan study notes two layers: the main body, transmitted in Ibn Tawus's Iqbal al-A'mal and Kaf'ami's al-Balad al-Amin, and the closing section, present in Iqbal but not in the earlier Misbah al-Za'ir, whose attribution al-Majlisi doubted."]},{h:"Source",p:["Iqbal al-A'mal of Ibn Tawus; al-Balad al-Amin of al-Kaf'ami. Bayan label: received attribution; closing section contested."]},{h:"How to use it",l:["On 'Arafa afternoon, fasting, with the translation.","Read the passage on being carried from a drop to a man with the children; it is a biology lesson and a thanksgiving."]}],kids:["Dua 'Arafa is a long prayer Imam al-Husayn said on the Day of 'Arafa, thanking Allah for every part of his body and every year of his life."]}},Fe={"Saadi Shirazi|Gulistan, chapter 1, story 10":{sections:[{h:"The poet",p:["Saadi of Shiraz (c. 1210\u20131291) studied in Baghdad, travelled for decades through Syria, Arabia and perhaps India, was captured by Crusaders and ransomed, and came home to write the Bustan and the Gulistan in two years. He is the most quoted poet of the Persian world after Hafez, and his tomb in Shiraz carries these lines."]},{h:"The poem",p:["Bani Adam a'za-ye yek peykar-and, ke dar afarinesh ze yek gowhar-and: the children of Adam are limbs of one body, created from one essence. Chu 'ozvi be dard avarad ruzegar, degar 'ozvha ra namanad qarar: when fate brings one limb to pain, the other limbs cannot stay at rest. To k'az mehnat-e digaran bighami, nashayad ke namat nahand adami: you who are careless of others' suffering do not deserve to be called human."]},{h:"What it means",p:["The poem comes inside a story about a king who could not sleep after seeing a poor man in distress; the lines are the moral. It makes compassion a condition of being human rather than a virtue added to it, and it grounds the unity of people in creation, as 49:13 does. The lines are woven into a carpet at the United Nations and quoted by heads of state."]},{h:"Read more",l:["The Gulistan, Chapter 1, in Thackston's translation.","The hadith of the one body, Sahih Muslim 2586."]}],kids:["Saadi says all people are like parts of one body. If one part hurts, the whole body feels it. If you do not care when someone is hurting, you have forgotten what being a person means."]},"Muhammad Iqbal|Bal-e-Jibril (Khudi ko kar buland itna)":{sections:[{h:"The poet",p:["Muhammad Iqbal (1877\u20131938) of Sialkot, philosopher, lawyer and the poet of the Muslim revival in India. Bal-e-Jibril, Gabriel's Wing, is his finest Urdu collection; this quatrain is its most quoted."]},{h:"The poem",p:["Khudi ko kar buland itna ke har taqdeer se pehle, Khuda bande se khud puche bata teri raza kya hai. Raise your selfhood so high that before every decree, God Himself asks His servant: tell me, what is your wish?"]},{h:"What it means",p:["The verse is the whole of Iqbal's khudi in two lines: the servant who has strengthened the self by faith, love and effort is consulted by his Lord, not because God needs to ask but because such a servant's wish has become one with His will. It is not a claim against submission; it is the fruit of it. The Quranic root is the hadith qudsi that Allah becomes the hearing and sight of the servant He loves."]},{h:"Read more",l:["Bal-e-Jibril, with a translation; Mustansir Mir's Tulip in the Desert.","Asrar-e-Khudi for the philosophy."]}],kids:["Iqbal says: become so strong and good that Allah asks you, before He decides, what you want. Believe in yourself and work hard."]},"Jalal al-Din Rumi|Masnavi, Book I, opening":{sections:[{h:"The poet",p:["Rumi (1207\u20131273), born in Balkh, settled in Konya, a scholar turned poet after meeting Shams of Tabriz. The Masnavi was dictated to Husam al-Din over fifteen years."]},{h:"The poem",p:["Beshnow az ney chun hekayat mikonad, az joda'iha shekayat mikonad: listen to the reed as it tells its tale, complaining of separations. Since I was cut from the reed-bed, men and women have wept at my cry. I want a breast torn by separation, to tell the pain of longing. Everyone who is far from his source seeks the time of his return."]},{h:"What it means",p:["The eighteen opening lines are the key to the whole Masnavi: the soul is a reed cut from its bed, its music is the sound of longing, and everyone who hears it hears their own separation. The complaint is not despair; the reed sings because it was cut, and the cutting is the beginning of the return. Rumi wrote the first eighteen lines himself; the rest was dictated."]},{h:"Read more",l:["Masnavi, Book One, in Mojaddedi's translation; the first story, the king and the handmaiden, follows the reed.","The Quran: to Him we return (2:156), the verse behind the poem."]}],kids:["A reed flute sounds sad because it misses the field it was cut from. Rumi says our hearts are like that: they miss Allah, and that is why we pray and why we go back to Him."]},"Attributed to Rumi (also to Abu Sa'id Abi al-Khayr)|Quatrain, attribution debated":{sections:[{h:"The poet",p:["The quatrain is carved on the entrance to Rumi's tomb in Konya and sung at Mevlevi gatherings, but it appears in no manuscript of Rumi's own works; scholars find it in the quatrains attributed to Abu Sa'id Abi al-Khayr (d. 1049), and its attribution is open."]},{h:"The poem",p:["Baz a, baz a, har anche hasti baz a, gar kafar o gabr o botparasti baz a: come back, come back, whatever you are, come back; if you are an unbeliever, a fire-worshipper, an idolater, come back. This door of ours is not a door of despair; if you have broken your vow a hundred times, come back."]},{h:"What it means",p:["The poem is a door held open, and its theology is 39:53: do not despair of Allah's mercy. The hundred broken vows are the point: the invitation is addressed to the one who has failed most. It is sung because the sound of 'baz a', come back, repeated, is itself the welcome."]},{h:"Read more",l:["The quatrains of Abu Sa'id, in Reza Ordoubadian's translation.","Surah az-Zumar, 53\u201355."]}],kids:["This poem says: come back, come back, whoever you are, even if you broke your promise a hundred times, come back. Allah's door is never closed."]},"Hafez|Divan, paraphrased":{sections:[{h:"The poet",p:["Hafez of Shiraz (c. 1315\u20131390), the memoriser of the Quran whose ghazals are the most loved in Persian."]},{h:"The poem",p:["The line is a paraphrase of a theme that runs through the Divan: every heart that holds a longing for the Beloved is already on the road, and the longing itself is the proof of nearness. In one ghazal: the one who seeks finds, if he seeks with his life; in another: never did I see a heart lose its longing for the Friend."]},{h:"What it means",p:["Hafez's beloved is a person and God at once, and the lines work either way: desire is not the opposite of arrival; it is the sign of it. The Islamic root is the hadith qudsi that Allah comes to the one who approaches Him walking, running."]},{h:"Read more",l:["Dick Davis, Faces of Love, for Hafez in English with the double meaning preserved.","The hadith qudsi in Sahih al-Bukhari 7405."]}],kids:["Hafez says: if your heart misses Allah, you are already close to Him. Wanting to be good is the first step of being good."]},"Ghalib|Urdu divan, paraphrased":{sections:[{h:"The poet",p:["Mirza Asadullah Khan Ghalib (1797\u20131869) of Delhi, the greatest Urdu poet, who lived through the fall of the Mughal court and the uprising of 1857 and wrote in Urdu and Persian with a wit and despair no one has matched."]},{h:"The poem",p:["The paraphrase gathers a theme of the divan: not everything in the heart can be said, and the saying is not the point; the heart's weight is its own witness. Ghalib's couplets repeatedly stage the gap between what is felt and what language carries, and make the gap itself the poem."]},{h:"What it means",p:["For a family, the line is a reminder that silence is not emptiness: a child who cannot say what is wrong still has a heart full of it, and a spouse's quiet is sometimes the fullest speech. Ghalib's own grief, for seven children who died in infancy, is behind much of it."]},{h:"Read more",l:["Ghalib's Urdu divan with Frances Pritchett's online commentary, A Desertful of Roses.","Ralph Russell's Ghalib: Life, Letters and Ghazals."]}],kids:["Ghalib says: not everything in your heart can be put into words. Sometimes a quiet person has the most inside."]},"Inscribed on the Buland Darwaza, Fatehpur Sikri; attributed to Jesus in Islamic sources|Inscription, 1601":{sections:[{h:"The poet",p:["The sentence is carved in Persian on the Buland Darwaza, the great gate Akbar built at Fatehpur Sikri in 1601: Jesus, son of Mary, said: the world is a bridge; pass over it, but build no house upon it. It is one of the sayings of Jesus preserved in Islamic sources, where he is the prophet of renunciation; al-Ghazali quotes it in the Ihya."]},{h:"The poem",p:["The world is a bridge; pass over it, but build no house upon it. He who hopes for an hour may hope for eternity; the world is but an hour; spend it in prayer, for the rest is unseen."]},{h:"What it means",p:["A bridge is for crossing; to build on it is to misunderstand what it is. The saying does not forbid walking well or carrying what you need; it forbids settling. The Quran says the same of the Hereafter as the abode and this life as a passage, and the Prophet: be in this world as a stranger or a traveller."]},{h:"Read more",l:["Tarif Khalidi, The Muslim Jesus: Sayings and Stories in Islamic Literature.","The hadith in Sahih al-Bukhari 6416."]}],kids:["This is carved on a huge gate in India: the world is a bridge. Walk across it, but do not build your house on it. We are travelling to somewhere better."]},"Rumi|Masnavi, paraphrased":{sections:[{h:"The poet",p:["Rumi, in a passage of the Masnavi on loss and compensation, often quoted in the form: do not grieve; anything you lose comes round in another form."]},{h:"The poem",p:["The theme recurs through the Masnavi: the child weaned from milk is given bread; the lover who loses one beloved is shown the Beloved behind all beloveds; what is taken by one hand is returned by the other. In the Guest House passage: the dark thought, the shame, the malice, meet them at the door laughing."]},{h:"What it means",p:["It is the poem's version of 2:155\u2013156 and of the Quran's promise in Surah Nuh that forgiveness brings provision: nothing is lost that was His, and the form changes. For a family it is the sentence for a lost job, a failed exam, a plan that did not work: the thing returns in another form."]},{h:"Read more",l:["Masnavi, Book Three, on the weaning of the child; Coleman Barks, The Essential Rumi, for the free renderings.","Surah ad-Duha, on what was lost and what was given."]}],kids:["Rumi says: do not be sad when you lose something. Allah gives it back in a different shape, like a baby who stops having milk and gets bread instead."]},"Nasir Khusraw|Divan, paraphrased":{sections:[{h:"The poet",p:["Nasir Khusraw (1004\u20131088), Persian poet, philosopher and traveller, author of the Safarnama, the account of his seven-year journey to Egypt and Makkah, who spent his last decades in exile in the mountains of Badakhshan writing poetry of ethics and faith."]},{h:"The poem",p:["O son of Adam, the day you see wealth as your own, you have become its slave; what you hold, holds you. The paraphrase gathers his repeated counsel that possessions possess, and that knowledge is the only wealth that cannot be taken."]},{h:"What it means",p:["It is Qarun's story in a couplet, and Imam 'Ali's saying that you must guard wealth while knowledge guards you. Nasir, who lost everything in exile and kept his learning, had the right to say it."]},{h:"Read more",l:["The Safarnama, in Thackston's translation, for the man; Annemarie Schimmel's Make a Shield from Wisdom for the poems.","The story of Qarun, 28:76\u201382."]}],kids:["Nasir Khusraw says: the day you think your money is really yours, your money owns you. Everything is Allah's, lent to us for a while."]},"Leo Buscaglia|Modern aphorism":{sections:[{h:"The poet",p:["Leo Buscaglia (1924\u20131998), an American teacher whose lectures on love and loss made him famous; the sentence is from his writing on gratitude for the small."]},{h:"The poem",p:["A single rose can be my garden; a single friend, my world."]},{h:"What it means",p:["It is qana'ah in a modern voice: sufficiency is a judgement about the one rose, not a count of roses. The Islamic tradition's companion is the Prophet's saying that richness is richness of the soul, and the Gulistan's chapter on contentment."]},{h:"Read more",l:["Buscaglia, Living, Loving and Learning.","The word Qana'ah on the Learn tab."]}],kids:["One flower can be a whole garden, and one good friend can be your whole world, if you are thankful for them."]},"Persian proverb|Folk wisdom":{sections:[{h:"The poet",p:["A proverb of the Persian-speaking world, without an author, of the kind collected in Dehkhoda's Amsal o Hekam."]},{h:"The poem",p:["The bird that has eaten from the hand does not fear the hand. Trust is built by feeding, slowly, and the bird that was fed returns."]},{h:"What it means",p:["For a parent, the proverb is about the long work of trust: a child who has been fed, held and kept safe a thousand times does not fear the parent's hand when it corrects. Trust is a deposit made in small daily acts, and withdrawn in one harsh one."]},{h:"Read more",l:["Dehkhoda's collection of Persian proverbs.","The hadith on mercy to children: he who does not show mercy is not shown mercy."]}],kids:["A bird that has been fed from your hand is not scared of your hand. When people are kind to you again and again, you learn to trust them."]},"Attributed to Rumi|Widely quoted; attribution uncertain":{sections:[{h:"The poet",p:["The lines, I searched for God and found only myself; I searched for myself and found only God, circulate everywhere under Rumi's name but cannot be found in his works; they are a modern distillation of a Sufi theme that is in him, in Bayazid and in the saying 'whoever knows himself knows his Lord'."]},{h:"The poem",p:["I searched for God and found only myself. I searched for myself and found only God."]},{h:"What it means",p:["The two lines describe the two directions of the same search: looking outward for God one meets the self that is looking; looking honestly at the self one finds its dependence, its need and its Source. It is 41:53 in a couplet: We will show them Our signs in the horizons and in themselves."]},{h:"Read more",l:["The word 'Know thyself' on the Learn tab, with its note on the saying's chain.","Rumi's own lines on the mirror in Book One of the Masnavi."]}],kids:["When you look for Allah, you find out who you really are. When you look honestly at yourself, you find how much you need Allah."]}};var E={story:Le,book:Re,teaching:Be,verse:je,word:Qe,idea:De,dua:Oe,poem:Fe};function C(a,e){switch(a){case"story":case"book":case"word":case"idea":return String(e.t);case"teaching":return String(e.src);case"verse":return String(e.r);case"dua":return String(e.t);case"poem":return`${e.w}|${e.s}`;default:return""}}function ye(a,e){return E[a]?.[C(a,e)]}Object.assign(globalThis,{core:Z,content:pe,UNITS:W,FOODS:m,BASE_MEALS:x,normItems:c,mealCalc:N,qtyStr:P,portion:p,hands:L,handLine:Y,CYCLE:b,PLAN0:Q,PLAN1:D,HIJRI_MONTHS:B,CITIES:I,prayerTimes:j,hijriLabel:_,roundUpQ:A,ageOf:R,doneCount:O,VERSES:$,SURAHS:M,STORIES:X,TEACHINGS:ee,WORDS:ae,IDEAS:te,BOOKS:oe,DUAS:ne,POEMS:se,QPLAN:V(q,F,365),QPLAN_CURATED:F,QPLAN_V1_KEYS:we,SURAH_INDEX:q,COURSE_V2_KEYS:ge,REVIEW_GATES:ce,REVIEWS_SHIPPED:fe,FAST:ie,QUESTIONS:he,THEMES:re,KID_Q:de,MIZAN_EN:le,G:ue,UR:me,DEPTH:E,depthOf:ye,depthKey:C});})();

function day(d){ if(!S.days[d])S.days[d]={date:d,water:0,palms:0}; return S.days[d]; }
function logDate(){const v=S._ld;return (v&&v<=todayStr())?v:todayStr()}
function logBar(t){if(t===todayStr())return "";const dt=new Date(t+"T12:00:00");return `<div class="note" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${ic("clock")} Logging for <b>${dt.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</b>. Everything you enter below goes to that day.</span><button class="btn" data-a="backtoday">${tr("Back to today")}</button></div>`}

function weekNo(){const a=new Date(S.settings.startDate+"T00:00:00"),b=new Date(todayStr()+"T00:00:00");return Math.max(1,Math.floor((b-a)/864e5/7)+1)}
function phase(w){return w<=3?CYCLE[0]:w<=7?CYCLE[1]:w<=12?CYCLE[2]:CYCLE[3]}
function weighList(){return Object.values(S.weighins).filter(w=>!w.m||w.m==="tafseer").sort((a,b)=>a.date<b.date?-1:1)}
function currentWeight(){const l=weighList();return l.length?Number(l[l.length-1].weight):Number(S.settings.startWeight)}
function lostKg(){return Number(S.settings.startWeight)-currentWeight()}
function strengthOn(){return lostKg()>=(S.settings.unlockKg||5)}
function planFor(wd){return (strengthOn()?PLAN1:PLAN0)[wd]}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function hhmm(ms){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

    return["Sleep","Suhoor alarm set for Fajr − 60 min."]}}
  if(h<6.75)return["Sleep","Lights out was 10:45 PM. Water with a pinch of salt when you wake."];
  if(h<7.5)return["Wake & walk","500 ml water with a pinch of salt, then a 15–20 min walk."];
  if(h<8)return["Coffee & go","Black coffee #1. Water bottle packed. Leave at 8:00."];
  if(h<9)return["Commute","Water on the bike. Nothing else needed."];
  if(h<12)return["Deep work, fasted","Coffee or green tea at 9:30. 500 ml water and a 5-min walk at 10:30."];
  if(h<13)return["Lunch-hour walk","15 min outside while others eat, then black tea. Hunger waves pass in 20 min."];
  if(h<14)return["Last caffeine by 2 PM","After this, herbal tea and water only, for sleep."];
  if(h<17.5)return["Afternoon","Herbal tea at 3:30 and a 5-min walk. 500 ml water at 4:30."];
  if(h<18)return["Last hour at work","Sparkling or mineral water. The starter is waiting at home."];
  if(h<19)return["Commute home","Water only. Break the fast when you walk in."];
  if(h<19.5)return["Break the fast","Protein starter now: yogurt + 2 eggs, or whey. Log the fast as ended."];
  if(h<20)return["Train","Cycle or walk from 7:30. Dinner at 8:00."];
  if(h<21)return["OnePlate dinner","2 palms · 2 fists · 1 cupped hand or 1 roti · 1 thumb · 1 bowl yogurt. Protein first, 20 minutes minimum."];
  if(h<21.5)return["Post-dinner walk","10–15 minutes. Kitchen closes at 9:30."];
  if(h<22.75)return["Fast started?","Last bite was 9:30. Screens dim at 10:00, calves stretched, lights out 10:45."];

}

      ${miniChart(ws,"weight")}

      ${ws.length?`<div class="log">${ws.slice().reverse().slice(0,6).map(r=>`<div class="r"><span>${fmtDate(r.date)}</span><span>${Number(r.weight).toFixed(1)} kg</span><span class="muted">${r.waist?Number(r.waist).toFixed(1)+" cm":""}</span>${ro?"<span></span>":`<button data-a="delw" data-d="${r.m?r.m+"-"+r.date:r.date}" aria-label="delete">✕</button>`}</div>`).join("")}</div>`:""}`:""}
    ${!ad?`
      <div class="hands"><span>Plate</span><div class="small">${esc(g.plate)}</div><span>Water</span><div class="small">${esc(g.fast?g.water:"")}</div><span>Fasting</span><div class="small">${esc(g.fast)}</div></div>

}

function hijriOf(dateStr){return core.hijriOf(dateStr,Number((S.settings||{}).hijriOffset||0))}
function sunnahFast(dateStr){return core.sunnahFast(dateStr,(S.settings||{}).tradition||"sunni",Number((S.settings||{}).hijriOffset||0))}
function fastingTimes(dateStr){return core.fastingTimes(dateStr,(S.settings||{}).city||"karachi")}
function ramadanActive(){const mode=(S.settings||{}).ramadan||"auto";if(mode==="on")return true;if(mode==="off")return false;return core.isRamadan(todayStr(),Number((S.settings||{}).hijriOffset||0))}

function allMeals(){const o=S.meals||{};const list=BASE_MEALS.map(b=>{const v=o[b.id];if(v&&v.deleted)return null;return Object.assign({},b,v||{},{base:true})}).filter(Boolean);Object.values(o).forEach(v=>{if(v&&v.id&&/^c_/.test(v.id)&&!v.deleted)list.push(Object.assign({},v,{base:false}))});return list}
function tonightMeal(){const l=allMeals();if(!l.length)return null;const d=S.days[logDate()];if(d&&d.meal){const m=l.find(x=>x.id===d.meal);if(m)return m}const dt=new Date(logDate()+"T12:00:00");return l[(dt.getDate()+dt.getMonth())%l.length]}

function mealTotals(d){const t=mealCalc(d);const line=handLine(d);return `${mbar(t)}<p class="small"><b>By hand:</b> ${line?esc(line):"<span class='muted'>add foods to see the portions</span>"}</p>`}

function chart(ws){
  const st=S.settings,W=360,H=190,L=34,R=10,T=12,B=26;
  const start=new Date(st.startDate+"T00:00:00");
  const planWeeks=Math.max(8,Math.ceil((st.startWeight-st.targetWeight)/0.5)+2);
  let endMs=start.getTime()+planWeeks*7*864e5;
  if(ws.length){endMs=Math.max(endMs,new Date(ws[ws.length-1].date+"T00:00:00").getTime()+14*864e5)}
  const span=endMs-start.getTime();
  const ys=[st.startWeight,st.targetWeight].concat(ws.map(w=>Number(w.weight)));
  const ymin=Math.floor(Math.min.apply(null,ys))-1,ymax=Math.ceil(Math.max.apply(null,ys))+1;
  const X=ms=>L+(ms-start.getTime())/span*(W-L-R),Y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
  let g="";for(let v=ymin;v<=ymax;v+=(ymax-ymin>12?4:2)){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`}
  const months=[];let m=new Date(start.getFullYear(),start.getMonth()+1,1);while(m.getTime()<endMs){months.push(m);m=new Date(m.getFullYear(),m.getMonth()+1,1)}
  const xl=months.map(d=>`<text x="${X(d.getTime()).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.toLocaleDateString(undefined,{month:"short"})}</text>`).join("");
  const expEnd=start.getTime()+((st.startWeight-st.targetWeight)/0.5)*7*864e5;
  const exp=`<line class="exp" x1="${X(start.getTime()).toFixed(1)}" y1="${Y(st.startWeight).toFixed(1)}" x2="${X(Math.min(expEnd,endMs)).toFixed(1)}" y2="${Y(Math.max(st.targetWeight,st.startWeight-0.5*(Math.min(expEnd,endMs)-start.getTime())/864e5/7)).toFixed(1)}"/>`;
  const tgt=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${Y(st.targetWeight).toFixed(1)}" y2="${Y(st.targetWeight).toFixed(1)}"/>`;
  const pts=ws.map(w=>[X(new Date(w.date+"T00:00:00").getTime()),Y(Number(w.weight))]);
  let act="";if(pts.length){const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const lp=pts[pts.length-1];act=`<path fill="url(#areaGrad)" d="${path} L${lp[0].toFixed(1)} ${(H-B).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H-B).toFixed(1)} Z"/><path class="act" d="${path}"/>`+pts.slice(0,-1).map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("")+`<circle class="ptl" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="4.5"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time against the expected 0.5 kg per week line"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>${g}${xl}${tgt}${exp}${act}</svg><div class="mkey"><span><i style="background:var(--accent)"></i>your weigh-ins</span><span><i style="background:var(--muted)"></i>plan, 0.5 kg/week</span><span><i style="background:var(--green)"></i>target</span></div>`;
}

    ${qGrid(ro)}
    ${qBulk(ro)}
  </section>`;
}
/* ---------- Quran course progress: one document quran/progress {done:{key:date}, flag:{key:true}, v:3}, keyed by passage so the course can change ---------- */
function qKey(i){return (QPLAN[i]||{}).key||""}
function qState(i){const p=S.qprog||{},k=qKey(i);if((p.flag||{})[k])return "revisit";if((p.done||{})[k])return "read";return ""}
function qSet(idxs,state){S.qprog=S.qprog||{};S.qprog.done=Object.assign({},S.qprog.done||{});S.qprog.flag=Object.assign({},S.qprog.flag||{});const t=todayStr();S.qprog.v=3;idxs.forEach(i=>{const k=qKey(i);if(!k)return;delete S.qprog.flag[k];if(state==="read"){S.qprog.done[k]=S.qprog.done[k]||t}else if(state==="revisit"){S.qprog.done[k]=S.qprog.done[k]||t;S.qprog.flag[k]=true}else{delete S.qprog.done[k]}if(Number(i)===qIndex(logDate())){const d=day(t);d.quran=state==="read";persistDay(t)}});persistQprog()}
function qCount(){let n=0;for(let i=0;i<QPLAN.length;i++)if(qState(i))n++;return n}
function qGrid(ro){const cur=qIndex(logDate());return `<div class="qgrid">${QPLAN.map((e,i)=>{const st=qState(i);return `<button class="qc ${st} ${i===cur?"cur":""}" ${ro?"disabled":""} data-a="qcell" data-i="${i}" title="${esc(qRef(e))} · ${esc(e.n)}" aria-label="Reading ${i+1}, ${st||"not read"}">${i+1}</button>`}).join("")}</div>
  <div class="row" style="gap:10px;font-size:12px;color:var(--muted)"><span><i class="qk read"></i> read</span><span><i class="qk revisit"></i> revisit</span><span><i class="qk cur"></i> today</span><span><i class="qk"></i> not yet</span></div>`}
function qStateButtons(i,ro){if(ro)return "";const st=qState(i);return `<div class="seg qstate"><button class="${st==="read"?"on":""}" data-a="qmark" data-i="${i}" data-s="read">${ic("check")} ${tr("Read it")}</button><button class="${st==="revisit"?"on":""}" data-a="qmark" data-i="${i}" data-s="revisit">${ic("flame")} ${tr("Read, revisit later")}</button><button class="${st===""?"on":""}" data-a="qmark" data-i="${i}" data-s="">${tr("Not yet")}</button></div>`}
function qBulk(ro){if(ro)return "";const n=QPLAN.length;return `<details class="flat" style="box-shadow:none" data-qbulk ${S._qbulk?"open":""}><summary style="font-size:13px;padding:9px 0"><span>Bulk update</span>${ic("chev","chev")}</summary><div class="body">
  <div class="form"><label class="f" style="flex:0 1 90px">From<input type="number" id="qb_from" min="1" max="${n}" value="1"></label><label class="f" style="flex:0 1 90px">To<input type="number" id="qb_to" min="1" max="${n}" value="${qIndex(logDate())+1}"></label><button class="btn" type="button" data-a="qbulk" data-s="read">Mark as read</button><button class="btn" type="button" data-a="qbulk" data-s="revisit">Mark to revisit</button><button class="btn ghost" type="button" data-a="qbulk" data-s="">Clear range</button></div>
  <div class="row"><button class="btn" type="button" data-a="qbulkto">${ic("check")} Everything up to today as read</button><button class="btn ghost" type="button" data-a="qclear">Clear all progress</button></div>
  <p class="small muted">Use this after reading ahead or catching up. Nothing here changes the daily rotation; the course still shows today's reading by date.</p></div></details>`}

function quranIndex(){const cur=qIndex(),st=core.courseStats(QPLAN),cnt=qCount();const sur=S._qsurah||QPLAN[cur].s;const rows=QPLAN.map((e,i)=>({e,i})).filter(x=>x.e.s===sur);const su=SURAH_INDEX[sur-1];
  return `<details><summary><span>The ${QPLAN.length}-day course · the whole Quran</span>${ic("chev","chev")}</summary><div class="body"><p class="small muted">One reading a day from your start date (${esc(qStart())}, change it in Settings): ${st.verses.toLocaleString()} verses in ${st.readings} readings, in the Quran's own order, never crossing a surah. ${st.curated} passages are close readings with their own notes from al-Mizan; the rest carry the surah's summary and al-Mizan's statement of its purpose. The course repeats; the second round is where understanding deepens.</p>
  <div class="row between"><label class="f" style="flex:1">Surah<select id="qsurah">${SURAH_INDEX.map(x=>`<option value="${x.n}" ${x.n===sur?"selected":""}>${x.n}. ${esc(x.a)} · ${x.v} verses</option>`).join("")}</select></label><span class="pill soft">${rows.filter(x=>qState(x.i)).length} of ${rows.length} read</span></div>
  <p class="small">${esc(su.s)}</p>
  <div class="scroll"><table class="tbl"><tbody>${rows.map(({e,i})=>`<tr class="${i===cur?"today":""}"><td class="kcal">${qState(i)==="read"?"✓":qState(i)==="revisit"?"↻":""} ${i+1}</td><td><b>${esc(qRef(e))}</b> · ${esc(e.cur?e.n:e.portion)}${e.cur?' <span class="pill soft" style="font-size:10px;padding:1px 7px">close reading</span>':""}<br><span class="small muted">English al-Mizan vol. ${(mizanVol(e.s,e.f)||{}).vol||"?"}${(S.qnotes||{})[e.key]&&S.qnotes[e.key].page?" · p. "+esc(S.qnotes[e.key].page):""}</span></td></tr>`).join("")}</tbody></table></div></div></details>`}

function dayOfYear(d){d=d||new Date(logDate()+"T12:00:00");const s=new Date(d.getFullYear(),0,1);return Math.floor((d-s)/864e5)}
function pick(arr,off,back){const i=dayOfYear()-(back||0)+(off||0);return arr[((i%arr.length)+arr.length)%arr.length]}
function weekTheme(){return THEMES[Math.floor(dayOfYear()/7)%THEMES.length]}
function learnMember(){const ids=members().map(m=>m.id);if(!S._lm||!ids.includes(S._lm))S._lm=isOwner?"tafseer":(readOnly?"uzma":"uzma");return S._lm}
function canWriteFor(id){if(readOnly)return false;if(isOwner)return true;return id!=="tafseer"}

function wellbeingCard(d,ro){

  const MOODS=["Low","Meh","OK","Good","Great"];

    <div class="crow"><span class="lead" style="color:var(--green)">${ic("check")}</span><div class="t"><b>${tr("Three things I am grateful for")}</b>${ro?`<small>${esc(d.grat||"—")}</small>`:`<input type="text" id="gratIn" value="${esc(d.grat||"")}" placeholder="family, health, today's bread…" maxlength="200" style="margin-top:4px">`}</div></div>

/* ---------- meal editor & fast-time handlers ---------- */
function dtl(d){d=new Date(d);const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())}
function draftFrom(m){return {id:m.id||null,base:!!m.base,n:m.n||"",tag:m.tag||"chicken",note:m.note||"",items:normItems(m.items).map(it=>({f:it.f,q:it.q}))}}
function refreshTotals(){const el=document.getElementById("mtot");if(el&&S._medit)el.innerHTML=mealTotals(S._medit)}
function mealAction(a,b){
  const d=S._medit;
  if(a==="me_new"){S._medit={id:null,base:false,n:"",tag:"chicken",note:"",items:[{f:"chk_tikka",q:2},{f:"salad",q:2},{f:"roti",q:1},{f:"yogurt",q:1}]};render();const n=document.getElementById("me_n");if(n)n.focus();return true}
  if(a==="me_edit"){const m=allMeals().find(x=>x.id===b.dataset.id);if(m){S._medit=draftFrom(m);S._mopen=m.id;render()}return true}
  if(!d)return false;
  if(a==="me_cancel"){S._medit=null;render();return true}
  if(a==="me_add"){d.items.push({f:"salad",q:1});render();return true}
  if(a==="me_del"){d.items.splice(Number(b.dataset.i),1);render();return true}
  if(a==="me_save"){const n=(document.getElementById("me_n")||{}).value||d.n;d.n=n.trim();d.items=d.items.filter(it=>FOODS[it.f]&&it.q>0);if(!d.n){toast("Give the meal a name");return true}if(!d.items.length){toast("Add at least one food");return true}const id=d.id||("c_"+Date.now().toString(36));const rec={id,n:d.n,tag:d.tag,note:d.note||"",items:d.items.map(it=>({f:it.f,q:it.q}))};S.meals[id]=rec;persistMeal(id);S._medit=null;S._mopen=id;toast("Meal saved · "+mealCalc(rec).kcal+" kcal");render();return true}
  if(a==="me_reset"){removeMeal(d.id);S._medit=null;toast("Reset to default");render();return true}
  if(a==="me_delete"){if(d.base){S.meals[d.id]={id:d.id,deleted:true};persistMeal(d.id);toast("Hidden")}else{removeMeal(d.id);toast("Deleted")}S._medit=null;render();return true}
  return false;
}
document.addEventListener("change",e=>{
  const t=e.target,d=S._medit;
  if(t.id==="logDate"){const v=t.value;S._ld=(v&&v<todayStr())?v:null;render();return}
  if(t.id==="sleepH"&&isOwner&&!readOnly){const ld=logDate(),dd=day(ld);const v=parseFloat(t.value);if(v>=0&&v<=14)dd.sleep=v;else delete dd.sleep;persistDay(ld);toast("Sleep saved · "+fmtDate(ld));return}
  if(t.id==="gratIn"&&isOwner&&!readOnly){const ld=logDate(),dd=day(ld);dd.grat=t.value.trim();persistDay(ld);if(dd.grat)toast("Alhamdulillah");render();return}
  if(t.dataset&&t.dataset.qn){if(readOnly)return;const k=String(t.dataset.k);S.qnotes[k]=Object.assign({i:k},S.qnotes[k]||{});S.qnotes[k][t.dataset.qn]=t.value.trim();persistQnote(k);toast("Reference saved");return}
  if(t.id==="qsurah"){S._qsurah=Number(t.value);render();return}
  if(t.id==="rq_kind"||t.id==="rq_st"){S._rq=Object.assign({st:"draft",kind:"close"},S._rq||{});S._rq[t.id==="rq_kind"?"kind":"st"]=t.value;S._rv=null;render();return}
  if(t.dataset&&t.dataset.j){const m=t.dataset.m;if(!canWriteFor(m))return;const ld=logDate(),dd=day(ld);dd.journal=Object.assign({},dd.journal||{});dd.journal[m]=Object.assign({},dd.journal[m]||{});dd.journal[m][t.dataset.j]=t.value.trim();persistDay(ld);toast("Journal saved · "+fmtDate(ld));return}
  if(t.id==="me_tag"&&d){d.tag=t.value;return}
  if(t.dataset&&t.dataset.me&&d){const i=Number(t.dataset.i);if(!d.items[i])return;if(t.dataset.me==="food")d.items[i].f=t.value;else d.items[i].q=Math.max(0,Math.min(12,parseFloat(t.value)||0));refreshTotals()}
});
document.addEventListener("input",e=>{
  const t=e.target,d=S._medit;
  if(t.id==="me_n"&&d)d.n=t.value;
  if(t.id==="me_note"&&d)d.note=t.value;
