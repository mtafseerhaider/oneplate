 and Sulayman smiled because Allah let him understand her. A hoopoe bird brought him news of a queen."},{n:28,a:"Al-Qasas",t:"The Stories",v:88,p:"Meccan",mz:"Al-Mizan reads the surah as Allah's promise to favour the weak and make them inheritors, told through Musa's life from the basket to the burning bush, and through Qarun who was swallowed with his treasures.",s:"Musa's birth under Pharaoh's decree, the basket on the river, his mother's heart kept firm, the years in Madyan, the call at the fire and the return to Pharaoh; the truth that the Prophet could not have known these stories; and Qarun, whose treasure keys weighed down strong men and who sank into the earth.",l:"Allah wished to favour those who were oppressed and make them leaders; the weak are not forgotten.",k:"Baby Musa floated down the river in a basket and Allah brought him back to his mother. Later a rich man called Qarun showed off and lost everything."},{n:29,a:"Al-Ankabut",t:"The Spider",v:69,p:"Meccan",mz:"Al-Mizan reads the surah as the law of trial: people are not left to say 'we believe' without testing, and the nations of Nuh, Ibrahim, Lut and Shu'ayb show that every protector other than Allah is a spider's house.",s:"'Do people think they will be left alone saying 'we believe' and not tested?'; kindness to parents short of shirk; Nuh's nine hundred and fifty years, Ibrahim in the fire, Lut, Shu'ayb, Ad and Thamud; the spider's house as the frailest of homes; and prayer that restrains from wrong.",l:"Faith is tested, not declared; whoever leans on anything besides Allah leans on a spider's web.",k:"A spider's web looks like a house but it cannot keep you safe. Only trusting Allah is a real shelter. Believing means being tested sometimes."},{n:30,a:"Ar-Rum",t:"The Romans",v:60,p:"Meccan",mz:"Al-Mizan reads the surah as the promise that Allah's word comes true, the Romans' defeat and foretold victory, and the signs of His lordship in the pairs, the languages, sleep and the rain, so that people return to the natural religion.",s:"The Romans defeated and then victorious within a few years, as foretold; the signs: creation from dust, spouses with love and mercy between them, the colours of languages, sleep and seeking of bounty, lightning and rain; 'set your face to the religion, the fitra on which Allah created people'; and corruption on land and sea from what hands have earned.",l:"Allah placed love and mercy between spouses as one of His signs; the home is a place where His signs can be read.",k:"Allah made husbands and wives love each other, and that is one of His signs. He also promised the Romans would win again, and they did."},{n:31,a:"Luqman",t:"Luqman",v:34,p:"Meccan",mz:"Al-Mizan reads the surah as an invitation to tawhid and the Hereafter, with Luqman's advice to his son as a wise man's summary of the whole Book."},{n:32,a:"As-Sajdah",t:"The Prostration",v:30,p:"Meccan",mz:"Al-Mizan reads the surah as the proof of the Quran's origin, the creation and resurrection of humans, and the difference between those whose sides forsake their beds at night and those who deny.",s:"The Book without doubt from the Lord of the worlds; creation of humans from clay, then a despised fluid, then the spirit breathed in; the believers whose sides leave their beds to call on their Lord in fear and hope; what no soul knows is kept hidden for them; and the dead earth given life as the sign of the return.",l:"Those who leave their beds at night to call on their Lord have a reward no eye has seen.",k:"Some people wake up at night just to talk to Allah, and He has a surprise ready for them that nobody has seen."},{n:33,a:"Al-Ahzab",t:"The Confederates",v:73,p:"Medinan",mz:"Al-Mizan reads the surah as the Prophet's authority and household: the end of adoption as lineage, the Battle of the Trench and the believers' steadfastness, the verse of purification for the Ahl al-Bayt, and the trust that humanity undertook.",s:"Allah has not placed two hearts in one body; the Prophet is closer to the believers than their own selves; the Trench and the confederates driven back by wind and unseen forces; the wives of the Prophet and the verse of purification for the Ahl al-Bayt; the Prophet as the beautiful example and the seal of the prophets; the trust the mountains refused; and the command to send blessings on him.",l:"Allah and His angels send blessings on the Prophet; the surah asks us to join them, and to be with him as he was with us.",k:"The Prophet is the best example to copy. Allah and the angels send him salam, and we should say 'Allahumma salli ala Muhammad' too."},{n:34,a:"Saba",t:"Sheba",v:54,p:"Meccan",mz:"Al-Mizan reads the surah as the proof of the Hereafter against those who deny it, with Dawud and Sulayman's gratitude and the people of Sheba's ingratitude as the two ends of the same test.",s:"Praise to Allah to whom the heavens and earth belong; mountains and birds echoing Dawud, the wind and jinn serving Sulayman, his death unknown to the jinn until the staff was eaten; the two gardens of Sheba lost to the flood of the dam through ingratitude; and 'say: my Lord extends and restricts provision'.",l:"'Few of My servants are grateful': gratitude is the rare thing, and Sheba shows what ungrateful plenty becomes.",k:"Sulayman could talk to birds and the wind obeyed him. The people of Sheba had beautiful gardens but forgot to thank Allah, and they lost them."},{n:35,a:"Fatir",t:"The Originator",v:45,p:"Meccan",mz:"Al-Mizan reads the surah as the opening of Allah's mercy that none can withhold and the proof of His oneness from creation, so that people worship the Originator and not what cannot own a date-stone's skin.",s:"Praise to the Originator who makes the angels messengers with wings; what Allah opens of mercy none can hold back; Satan as a plain enemy; the two seas not alike; those who recite the Book and keep prayer trading in a trade that never fails; the believers' inheritors in three ranks; and no bearer of burdens bears another's.",l:"Whatever mercy Allah opens no one can shut; whatever He withholds no one can release; that settles where to ask.",k:"The angels have wings, two or three or four. Allah is the one who opens the door of kindness and nobody can close it."},{n:36,a:"Ya-Sin",t:"Ya-Sin",v:83,p:"Meccan",mz:"Al-Mizan reads the surah as the three pillars of faith in one place: the prophethood proved by the town's story, tawhid proved by the signs, and resurrection proved by the dead earth and the One who created the first time."},{n:37,a:"As-Saffat",t:"Those Ranged in Ranks",v:182,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the angels in ranks on Allah's oneness, the argument against idolatry, and the prophets, above all Ibrahim and the son laid down for sacrifice, as the servants Allah delivered.",s:"The angels sworn in ranks that your God is One; the mockers at the resurrection and the two companions in Paradise and the Fire; Nuh, Ibrahim and the ransom of his son with a great sacrifice, Musa and Harun, Ilyas, Lut and Yunus; the lie that Allah has daughters; and peace upon the messengers.",l:"Ibrahim and his son both said 'we hear and obey' before the ransom came; submission came first, the relief after.",k:"Ibrahim was ready to obey Allah in the hardest thing, and Allah sent a ram instead. The surah ends with 'peace upon the messengers'."},{n:38,a:"Sad",t:"Sad",v:88,p:"Meccan",mz:"Al-Mizan reads the surah as the warning to the proud who rejected the Reminder, with Dawud, Sulayman and Ayyub as servants who turned back to Allah, and Iblis's refusal to bow as the root of pride.",s:"The disbelievers' pride and the clash over 'one God'; Dawud's judgement between the two disputants and his repentance; Sulayman's horses and his return; Ayyub's patience and the bundle of twigs; the nearness of the Hereafter's two gardens; and Iblis refusing to bow to the one Allah made with His two hands.",l:"Dawud, Sulayman and Ayyub are each called 'awwab', one who keeps returning; the surah's praise is for coming back.",k:"Ayyub was sick for a long time and kept trusting Allah, and Allah gave him health and his family back. Great people keep coming back to Allah."},{n:39,a:"Az-Zumar",t:"The Groups",v:75,p:"Meccan",mz:"Al-Mizan reads the surah as the command of sincere religion: worship Allah making the religion purely His, since He alone creates, provides and forgives; the groups driven to the two abodes close it.",s:"The Book sent down so worship Allah with sincere religion; He created the pairs and you in three darknesses; the believer who stands by night is not like the one who does not; 'My servants who have wronged yourselves, do not despair of Allah's mercy'; the earth held in His grasp on that Day; and the groups led to the Fire and to the Garden with 'peace be upon you'.",l:"Do not despair of Allah's mercy: the verse was sent to those who had gone furthest, so it covers everyone.",k:"Allah says: My servants, even if you did wrong, never give up on My mercy. He forgives everything for the one who returns."},{n:40,a:"Ghafir",t:"The Forgiver",v:85,p:"Meccan",mz:"Al-Mizan reads the surah as the warning to the disputers against Allah's signs, carried by the believer from Pharaoh's family who hid his faith and spoke for Musa, and by the angels who carry the Throne and pray for the believers' forgiveness.",s:"Forgiver of sin and accepter of repentance; the angels who bear the Throne asking forgiveness for those who repent; the believer in Pharaoh's household who argued for Musa with the story of Yusuf; 'call on Me and I will answer you'; and the blind and seeing are not equal.",l:"'Call on Me and I will answer you': dua is the surah's command, and the hidden believer's courage is its example.",k:"A man in Pharaoh's palace secretly believed in Allah and bravely spoke up for Musa. Allah says, 'Ask Me and I will answer.'"},{n:41,a:"Fussilat",t:"Explained in Detail",v:54,p:"Meccan",mz:"Al-Mizan reads the surah as the Quran detailed for a people who know, with the creation of the earth and heavens in days, the witness of skins and ears against their owners, and the command to repel evil with what is better.",s:"A Book whose verses are explained, which the idolaters refuse to hear; the earth and heavens created and the sky told 'come willingly or unwillingly'; Ad and Thamud; the Day when hearing, sight and skin testify; 'those who say our Lord is Allah and stand firm, the angels descend on them'; repel evil with what is better and the enemy becomes a close friend; and 'We will show them Our signs in the horizons and in themselves'.",l:"Repel evil with what is better and the one between you and whom there was enmity becomes a warm friend.",k:"If someone is unkind, answer with something better and they might become your friend. Allah's signs are in the sky and inside us."},{n:42,a:"Ash-Shura",t:"The Consultation",v:53,p:"Meccan",mz:"Al-Mizan reads the surah as revelation itself: how Allah speaks to humans, by inspiration, from behind a veil or through a messenger, and the one religion enjoined on Nuh, Ibrahim, Musa and Isa; the believers' affairs by mutual consultation are its community rule.",s:"The same religion given to Nuh, Ibrahim, Musa and Isa: establish it and do not divide; 'say: I ask no reward except love of the near kin'; the believers answer their Lord, keep prayer, decide by consultation and spend; forgiveness when able; the three ways Allah speaks to a human; and the Quran as a spirit sent to a man who did not know what the Book was.",l:"Their affairs are by consultation among them: a family or a community that decides together is following this surah.",k:"Good people talk together before deciding, forgive when they can, and stand up against bullying. Allah speaks to prophets in special ways."},{n:43,a:"Az-Zukhruf",t:"The Ornaments of Gold",v:89,p:"Meccan",mz:"Al-Mizan reads the surah as the refutation of the idolaters' claim that Allah has daughters and that wealth and ornament mark His favour, with Ibrahim's word of tawhid left among his descendants and Isa as a servant, not a son.",s:"The Quran in the Mother of the Book; the idolaters assign daughters to Allah and bury their own; Ibrahim's word 'I am free of what you worship' left as a lasting word; gold roofs would be given to disbelievers if people would not then all disbelieve; Musa and Pharaoh's rivers; Isa as a servant on whom Allah bestowed favour; and friends on that Day are enemies except the God-conscious.",l:"Allah would have given the disbelievers houses with silver roofs, so little is this world worth to Him; measure success by something else.",k:"Gold and silver houses do not mean Allah is pleased with someone. Ibrahim taught his children one sentence: I worship only Allah."},{n:44,a:"Ad-Dukhan",t:"The Smoke",v:59,p:"Meccan",mz:"Al-Mizan reads the surah as the warning of the smoke and of a Day of decision, with the blessed night of the Quran's descent and the end of Pharaoh's people, over whom neither sky nor earth wept, as the proof of that Day.",s:"The clear Book sent down on a blessed night in which every wise matter is decided; the smoke that will cover the people; Musa sent to Pharaoh and the sea left parted behind the drowned, over whom neither heaven nor earth wept; the tree of zaqqum; and the God-conscious in gardens and springs, where they taste no death but the first.",l:"Neither heaven nor earth wept for Pharaoh's people: a life can end leaving nothing that mourns it, or leaving a legacy that does.",k:"The Quran came down on a special blessed night. Pharaoh's army chased Musa into the sea and Allah closed the water over them."},{n:45,a:"Al-Jathiyah",t:"The Kneeling",v:37,p:"Meccan",mz:"Al-Mizan reads the surah as the signs in the heavens, the earth and the self for people who believe, and the warning to those who take their desire as their god, until every nation kneels before its record.",s:"Signs in the heavens and earth, in your own creation and in the scattered beasts, in the alternation of night and day; the one who takes his desire as his god; the Bani Israel given the Book and then divided; 'we die and we live and nothing destroys us but time'; and every community kneeling, called to its book.",l:"The one who takes his own desire as his god has the most patient and attentive deity of all; the surah names the danger exactly.",k:"Everything around us is a sign from Allah: the day, the night, the rain, the animals. One day every person will see a book of everything they did."},{n:46,a:"Al-Ahqaf",t:"The Sand Dunes",v:35,p:"Meccan",mz:"Al-Mizan reads the surah as the warning of the Hour delivered by a messenger who is nothing new among messengers, with the kind person who at forty prays for gratitude and the people of Hud among the dunes as the two ways of receiving it.",s:"The idolaters' gods created nothing; the Prophet is no novelty among messengers and does not know what will be done with him; the person who at forty asks to be grateful and to have good descendants, with kindness to a mother who carried him in hardship; Hud warning Ad among the sand dunes and the cloud they took for rain; and the jinn who heard the Quran and went back as warners.",l:"At forty, pray the surah's prayer: Lord, let me be grateful for Your favour on me and my parents, and set right my descendants.",k:"A good person thanks Allah for their mother who carried them, and asks Allah to make their own children good. Even the jinn listened to the Quran and were amazed."},{n:47,a:"Muhammad",t:"Muhammad",v:38,p:"Medinan",mz:"Al-Mizan reads the surah as the division of people into those who disbelieve and bar from Allah's way and those who believe in what was sent down to Muhammad, with fighting ordered for the second against the first and the hypocrites exposed in between.",s:"The deeds of those who disbelieve are made to fail and the believers' state is set right; firmness in battle and the rivers of the Garden described; the hypocrites who listen and understand nothing; 'if you help Allah He will help you and make your feet firm'; do not be weak and call for peace when you have the upper hand; and 'will you not then reflect on the Quran, or are there locks on hearts?'",l:"Are there locks on hearts? The surah asks the question that every reader has to answer for themselves.",k:"If you help Allah's religion, Allah helps you and keeps you steady. The surah asks: do you think carefully about the Quran, or is your heart locked?"},{n:48,a:"Al-Fath",t:"The Victory",v:29,p:"Medinan",mz:"Al-Mizan reads the surah as the clear victory of Hudaybiyyah: the treaty that looked like a setback was the opening, the pledge under the tree earned Allah's pleasure, and the Prophet's companions are described in the Torah and the Gospel as a seed that grows strong.",s:"'We have given you a clear victory', revealed on the road back from Hudaybiyyah; tranquillity sent down on the believers; the pledge under the tree, 'Allah was pleased with the believers'; the Bedouins who stayed behind; the vision of entering the Sacred Mosque in safety fulfilled; and the companions as a crop that delights the sowers.",l:"The treaty everyone took as a loss was named the clear victory; judge Allah's openings by their outcome, not by the day they arrive.",k:"The Muslims made a peace agreement and some were sad, but Allah called it a big victory, and soon they entered Makkah safely."},{n:49,a:"Al-Hujurat",t:"The Private Chambers",v:18,p:"Medinan",mz:"Al-Mizan reads the surah as the manners of a believing community: with the Prophet, with news brought by the wicked, between two groups who fight, and between persons, where mockery, suspicion, spying and backbiting are forbidden and only piety ranks one above another.",s:"Do not raise your voices above the Prophet's; verify news from a wicked person; make peace between two fighting groups of believers; do not mock, call names or be suspicious, spy or backbite, which is eating a brother's dead flesh; peoples and tribes to know one another and the noblest is the most God-conscious; and the Bedouins who said 'we believe' when they had only submitted.",l:"Backbiting is eating your brother's dead flesh; the surah's manners begin with the tongue.",k:"Do not make fun of people or call them names, and never talk about someone behind their back. The best person is the one most careful of Allah."},{n:50,a:"Qaf",t:"Qaf",v:45,p:"Meccan",mz:"Al-Mizan reads the surah as the proof of resurrection against those who found a return after dust strange, from the first creation, the rain on dead land, and the two recording angels; Allah is nearer than the jugular vein.",s:"The disbelievers' amazement that dust will live; the sky built without flaws and the rain that gives life to a dead land; 'We are nearer to him than his jugular vein' and the two angels who record every word; the Day when the Fire asks 'is there more?'; the Garden brought near for every returning keeper; and listen on the Day of the cry.",l:"Not a word is uttered without a watcher ready; and Allah is nearer than the vein in your neck.",k:"Allah is closer to you than the vein in your neck. Two angels write down everything you say, so say good things."},{n:51,a:"Adh-Dhariyat",t:"The Scattering Winds",v:60,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the winds that the promise is true, with the God-conscious who sleep little at night and give the beggar a share, Ibrahim's guests, the destroyed nations, and the purpose of creation: 'I created jinn and humans only to worship Me'.",s:"The winds that scatter and the clouds that carry; the God-conscious sleep little at night, ask forgiveness before dawn and keep a share for the beggar and the deprived; Ibrahim's honoured guests and the roasted calf; Musa, Ad, Thamud and Nuh's people; the heaven built with power and still expanded; and 'I did not create jinn and humans except to worship Me'.",l:"'In their wealth is a known share for the one who asks and the one deprived': generosity is a fixed line, not a mood.",k:"Allah says He made us to worship Him. Good people wake before dawn to ask forgiveness and always keep something for the poor."},{n:52,a:"At-Tur",t:"The Mount",v:49,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by Mount Sinai and the written Book that the punishment is coming, the Garden where families who believed are joined with their descendants, and the answer to every objection of the deniers in a run of questions.",s:"By the Mount and the Book inscribed, the punishment will fall; the God-conscious in gardens with their descendants who followed them in faith joined to them; cups passed with no idle talk; the questions: were they created from nothing, did they create themselves, do they own the treasures; and 'be patient for your Lord's judgement, you are under Our eyes'.",l:"'We will join their descendants with them': a family's faith is counted together in the Garden.",k:"Allah will bring families together in Paradise when they believed together. The Prophet is told: be patient, you are under Our eyes."},{n:53,a:"An-Najm",t:"The Star",v:62,p:"Meccan",mz:"Al-Mizan reads the surah as the truth of the revelation seen by the Prophet at the Lote Tree of the farthest boundary, the refutation of Lat, Uzza and Manat, and the principles of the scrolls of Musa and Ibrahim: no soul bears another's burden and a person has only what he strives for.",s:"By the star when it sets, your companion has not strayed; taught by one mighty in power; he saw at the Lote Tree what he saw; Lat, Uzza and Manat are names you invented; the scrolls of Ibrahim and Musa: no burden-bearer carries another's load, a person has only what he strives for, and to your Lord is the final end; He makes laugh and weep, gives death and life; and so prostrate to Allah and worship.",l:"A person has nothing but what he strives for: effort is the currency of this surah.",k:"The Prophet saw the angel Jibril in his real form. The surah says we only get what we work for, and it ends with a sajdah."},{n:54,a:"Al-Qamar",t:"The Moon",v:55,p:"Meccan",mz:"Al-Mizan reads the surah as the splitting of the moon and the warning repeated with the nations of Nuh, Ad, Thamud, Lut and Pharaoh, each closed by 'We have made the Quran easy to remember, so is there anyone who will remember?'",s:"The moon split and they called it magic; Nuh's ark of planks and nails; Ad's furious wind that tore people out like palm trunks; Thamud and the she-camel; Lut's people struck blind; Pharaoh's people taken by a mighty grasp; 'We have made the Quran easy to remember' four times; and the God-conscious in a seat of truth with a Sovereign who is Able.",l:"'We have made the Quran easy to remember, so is there anyone who will remember?' The surah asks it four times.",k:"Allah says the Quran is made easy to remember, and asks: who will remember it? He says it four times so we really hear it."},{n:55,a:"Ar-Rahman",t:"The Most Merciful",v:78,p:"Medinan",mz:"Al-Mizan reads the surah as a count of the Merciful's favours to the two weighty beings, jinn and humans, from the teaching of the Quran and the balance to the two gardens, with 'which of your Lord's favours will you deny?' as the refrain of accountability."},{n:56,a:"Al-Waqi'ah",t:"The Inevitable Event",v:96,p:"Meccan",mz:"Al-Mizan reads the surah as the Event that divides people into three: the foremost brought near, the companions of the right and the companions of the left, with the proofs of resurrection from the seed, the crop, the water and the fire."},{n:57,a:"Al-Hadid",t:"The Iron",v:29,p:"Medinan",mz:"Al-Mizan reads the surah as the call to believe and spend in Allah's way, since He is the First and the Last and the Outward and the Inward and all wealth is His; the lending of a goodly loan and the light that runs before the believers are its images.",s:"Everything glorifies Allah; He is the First, the Last, the Outward and the Inward; believe and spend, for the one who spent before the opening is not like the one after; the goodly loan multiplied; the light of the believers running before them while the hypocrites beg for a spark; this life is play, adornment and boasting, like rain whose crop delights the farmer and then dries; iron sent down with great strength; and the monasticism they invented but did not keep.",l:"Has the time not come for the hearts of the believers to be humbled by Allah's remembrance? The surah asks; the answer is yours.",k:"Allah is the First and the Last, and He sees everything inside and outside. Giving to others is like lending to Allah, and He pays back much more."},{n:58,a:"Al-Mujadila",t:"The Pleading Woman",v:22,p:"Medinan",mz:"Al-Mizan reads the surah as Allah hearing the woman who pleaded about her husband, the abolition of zihar, the rules of private conversation and of making room in gatherings, and the party of Allah who do not love those who oppose Him.",s:"Allah heard the woman who argued about her husband and ended the custom of zihar; there is no secret counsel of three but He is the fourth; whisper not in sin and enmity; make room in gatherings and Allah raises those given knowledge by degrees; the hypocrites who swear falsely; and the party of Allah are the successful.",l:"Allah heard one woman's complaint and sent a law for her; no one's grievance is too small to be heard.",k:"A woman came to the Prophet with a problem and Allah answered her from above the seven heavens. Allah hears every quiet voice."},{n:59,a:"Al-Hashr",t:"The Gathering",v:24,p:"Medinan",mz:"Al-Mizan reads the surah as the exile of Banu Nadir, the law of fay' so that wealth does not circulate only among the rich, the praise of the helpers who prefer others over themselves, the hypocrites' broken promises, and the closing names of Allah.",s:"The expulsion of the Banu Nadir, whose fortresses did not protect them; fay' distributed so that wealth does not circulate only among the rich; the helpers who love those who migrated and prefer them over themselves even in need; the hypocrites like Satan who says 'disbelieve' and then disowns; had the Quran come down on a mountain it would have crumbled; and the beautiful names: the Knower of the unseen, the King, the Holy, the Peace.",l:"'They prefer others over themselves even when they are in need': the helpers' generosity is the surah's standard.",k:"The people of Medina shared their homes and food with the Muslims who had to leave Makkah, even when they had little. The surah ends with Allah's beautiful names."},{n:60,a:"Al-Mumtahanah",t:"The Woman to Be Examined",v:13,p:"Medinan",mz:"Al-Mizan reads the surah as the line between loyalty to Allah and loyalty to His enemies, with Ibrahim's clean break as the example, kindness and justice kept for those who do not fight the believers, and the testing of the women who migrated.",s:"Do not take My enemies and yours as allies; Ibrahim and those with him as the beautiful example: 'we are free of you until you believe in Allah alone'; Allah does not forbid kindness and justice to those who did not fight you over religion; the examination of the believing women who migrated; and the pledge of the women not to steal, commit adultery, kill their children or disobey in what is right.",l:"Allah does not forbid you to be kind and just to those who did not fight you over religion: the surah draws its line with mercy left outside it.",k:"Be fair and kind to people who are not Muslims and who do not harm you. Ibrahim is the example of being brave about what you believe."},{n:61,a:"As-Saff",t:"The Ranks",v:14,p:"Medinan",mz:"Al-Mizan reads the surah as the command to fight in Allah's way in a rank like a solid building, with the rebuke of saying what one does not do, Isa's good news of Ahmad, and the trade that saves from a painful punishment.",s:"Why say what you do not do? Allah loves those who fight in His way in a rank like a solid structure; Musa's people who hurt him and Isa who brought good news of a messenger named Ahmad; they want to put out Allah's light with their mouths; the trade that saves: faith and striving with wealth and self; and be helpers of Allah as the disciples were.",l:"Why do you say what you do not do? The surah's first question is about the gap between speech and action.",k:"Allah does not like it when we say things we do not do. Isa told his people that a prophet named Ahmad would come after him."},{n:62,a:"Al-Jumu'ah",t:"The Friday Congregation",v:11,p:"Medinan",mz:"Al-Mizan reads the surah as the Prophet sent among the unlettered to purify them and teach the Book, the donkey carrying books as the image of knowledge unlived, and the Friday prayer that must not be abandoned for trade.",s:"He sent among the unlettered a messenger from themselves to recite, purify and teach; those given the Torah who did not carry it are like a donkey carrying volumes; if you claim to be Allah's friends then wish for death; when the call is made on Friday, hasten to Allah's remembrance and leave trade; and do not leave the Prophet standing for a passing caravan.",l:"Knowledge not carried in the life is a load on a donkey; the surah measures learning by what it changes.",k:"Friday prayer is special: when the call comes, stop everything and go. Knowing things without doing them is like a donkey carrying heavy books."},{n:63,a:"Al-Munafiqun",t:"The Hypocrites",v:11,p:"Medinan",mz:"Al-Mizan reads the surah as the exposure of the hypocrites, who testify with their tongues and use their oaths as a shield, and the warning to the believers that wealth and children must not distract from Allah's remembrance before death asks for a little more time.",s:"The hypocrites say 'we bear witness that you are Allah's Messenger' and lie; their oaths are a shield; propped-up timbers, they think every cry is against them; 'the mighty will expel the weaker' and the honour belongs to Allah, His Messenger and the believers; do not let wealth and children distract you; and spend before death comes and one says 'Lord, give me a little while longer'.",l:"Spend from what We gave you before death comes and you say, 'My Lord, if only You would delay me a little': the surah's clock is the point.",k:"Some people said they believed but did not mean it. Allah says: do not let money and toys make you forget Him, and give before it is too late."},{n:64,a:"At-Taghabun",t:"Mutual Loss and Gain",v:18,p:"Medinan",mz:"Al-Mizan reads the surah as tawhid and the resurrection stated plainly, the Day of mutual loss and gain when the deceived discover it, and the believer's rule that no affliction strikes except by Allah's leave, with spouses and children named as a test to be met with forgiveness.",s:"Everything glorifies Him; He created you and some of you disbelieve; the Day of Taghabun, mutual loss and gain; no affliction strikes except by Allah's permission, and whoever believes in Allah, He guides his heart; among your spouses and children there are enemies to you, so beware, and if you pardon and forgive, Allah is Forgiving; and fear Allah as much as you are able.",l:"No calamity strikes except by Allah's leave, and whoever believes in Allah, He guides his heart: the surah's remedy for shock.",k:"When something sad happens, Allah already knew and He will guide your heart. Love your family but do not let them pull you away from Allah."},{n:65,a:"At-Talaq",t:"Divorce",v:12,p:"Medinan",mz:"Al-Mizan reads the surah as the law of divorce bounded by Allah's limits, with the promise that whoever fears Allah is given a way out and provision from where he did not expect, and the seven heavens and earths created so that you may know His knowledge encompasses all.",s:"Divorce at the proper time, counting the waiting period, keeping the women in their homes; whoever fears Allah, He makes a way out for him and provides from where he did not expect; whoever relies on Allah, He is enough for him; let the wealthy spend from his wealth and the straitened from what Allah gave him; the towns that rebelled; and seven heavens and of the earth the like of them.",l:"Whoever fears Allah, He makes a way out for him and provides from where he never expected: the surah's promise is written inside a law about endings.",k:"Even when a family goes through a hard change, Allah tells people to be fair and kind. Whoever trusts Allah, He finds a way out for them."},{n:66,a:"At-Tahrim",t:"The Prohibition",v:12,p:"Medinan",mz:"Al-Mizan reads the surah as the household of the Prophet corrected and taught: a secret disclosed, the two wives called to repentance, the command to protect oneself and one's family from the Fire, and the two pairs of examples, the wives of Nuh and Lut against Pharaoh's wife and Maryam.",s:"Why do you forbid what Allah made lawful seeking your wives' pleasure; the secret told and disclosed; 'if you both turn to Allah, your hearts have inclined'; O believers, protect yourselves and your families from a Fire whose fuel is people and stones; sincere repentance; the wives of Nuh and Lut who betrayed; and Pharaoh's wife who asked for a house near Allah, and Maryam who guarded her chastity.",l:"Guard yourselves and your families from the Fire: the surah makes the home the first place of responsibility.",k:"Allah tells parents to keep their family safe from the Fire by teaching them good things. Pharaoh's wife and Maryam are two of the best women ever."},{n:67,a:"Al-Mulk",t:"The Sovereignty",v:30,p:"Meccan",mz:"Al-Mizan reads the surah as the sovereignty of Allah shown in a creation without flaw and in life and death made to test who is best in deeds, with the hearing of the Fire's keepers 'did no warner come to you?' as its warning."},{n:68,a:"Al-Qalam",t:"The Pen",v:52,p:"Meccan",mz:"Al-Mizan reads the surah as the defence of the Prophet's sanity and character, 'you are of a tremendous character', against the slanderer and the swearer of oaths, with the owners of the garden who planned to give the poor nothing and found it black by morning as the warning.",s:"By the pen and what they write, you are not mad, and you are of a tremendous character; do not obey the swearer, the slanderer, the preventer of good; the owners of the garden who swore to harvest at dawn without leaving anything for the poor and found it burnt; the companion of the fish who called out while choked with grief; and they would almost make you slip with their eyes.",l:"The garden was burnt the night its owners decided to leave the poor nothing; generosity withheld is a crop at risk.",k:"Some men planned to pick all their fruit secretly so the poor would get none, and in the morning the garden was gone. The Prophet's character was wonderful."},{n:69,a:"Al-Haqqah",t:"The Inevitable Reality",v:52,p:"Meccan",mz:"Al-Mizan reads the surah as the Reality of the Hour proved by the destruction of Thamud, Ad and Pharaoh, the scene of the book given in the right hand or the left, and the oath that the Quran is the word of a noble messenger and not a poet or soothsayer.",s:"The Reality: Thamud by the overwhelming blast, Ad by a wind seven nights and eight days, Pharaoh and the overturned cities; the trumpet, the heaven split, eight angels bearing the Throne; 'here, read my book' from the one given it in his right hand and 'would that I had not been given my book' from the other; and had he invented sayings against Us, We would have cut his aorta.",l:"'Here, read my book!' The joy of the one who receives it in the right hand is the surah's picture of a life well kept.",k:"On the Last Day some people will shout happily, 'Look, read my book!' because they lived well. The surah tells us to be one of them."},{n:70,a:"Al-Ma'arij",t:"The Ascending Stairways",v:44,p:"Meccan",mz:"Al-Mizan reads the surah as the punishment the questioner asked for, the Day of fifty thousand years, the human being created anxious, and the exception: those who keep their prayers, give a known share to the beggar, guard their chastity and keep their trusts.",s:"A questioner asked for a punishment that none can avert; the angels ascend in a Day of fifty thousand years; the sinner would ransom himself with his children and his whole family; the human was created anxious, fretful in harm and withholding in good, except those who pray constantly, keep a known share for the beggar and the deprived, believe in the Day, guard chastity and trust, and stand by their testimony.",l:"Humans are created anxious; the surah's cure is a list: steady prayer, a fixed share for the poor, trust kept, witness kept.",k:"People worry a lot, but praying regularly and giving to the poor make the heart calm. Keep your promises and tell the truth."},{n:71,a:"Nuh",t:"Noah",v:28,p:"Meccan",mz:"Al-Mizan reads the surah as Nuh's own account of his call, by night and day, openly and secretly, with the promise that seeking forgiveness brings rain, wealth and children, and his final prayer against a people who clung to Wadd, Suwa and Nasr.",s:"Nuh sent to warn; he called night and day and they put fingers in their ears; 'ask your Lord's forgiveness: He will send rain, help you with wealth and children, and gardens and rivers'; the seven heavens in layers and the moon as a light; the idols Wadd, Suwa, Yaghuth, Ya'uq and Nasr; and his prayer for his parents, his household and every believer who enters it.",l:"Istighfar brings rain, wealth, children and gardens: Nuh ties seeking forgiveness to provision, and the surah lets him.",k:"Nuh told people for a very long time to say sorry to Allah, and that Allah would send rain and gifts. He prayed for his parents and for everyone who believes."},{n:72,a:"Al-Jinn",t:"The Jinn",v:28,p:"Meccan",mz:"Al-Mizan reads the surah as the jinn's own testimony after hearing the Quran, that Allah has no spouse or child and that they will no longer ascribe partners, with the Prophet told that he controls neither harm nor guidance for anyone and that the unseen is Allah's alone.",s:"A group of jinn listened and said 'we have heard a wonderful Quran'; some of us are righteous and some otherwise; we used to sit in the heavens to listen and now find shooting flames; 'say: I have no power to harm or guide you'; the mosques belong to Allah so call on no one with Him; and He discloses His unseen to no one except a messenger He has chosen.",l:"Even the jinn, who thought they had the heavens, said 'we have heard a wonderful Quran' and submitted; hearing honestly is the first step.",k:"Jinn are creatures we cannot see. Some of them heard the Quran, loved it, and became Muslims. Mosques are only for Allah."},{n:73,a:"Al-Muzzammil",t:"The Enshrouded One",v:20,p:"Meccan",mz:"Al-Mizan reads the surah as the Prophet's training for the weighty word: stand in prayer at night, recite slowly, remember Allah and devote yourself to Him, bear what they say with a graceful patience, and then the final verse that lightens the night prayer for the community.",s:"O you wrapped in garments, stand the night except a little, and recite the Quran slowly; We will cast on you a heavy word; the rising by night is firmer and clearer; remember your Lord's name and devote yourself to Him entirely; be patient over what they say and leave them with a graceful leaving; Pharaoh's messenger and his seizure; and the closing verse: recite what is easy, since some are ill, some travel and some fight.",l:"Recite the Quran slowly and with measure: the surah's first instruction is about pace, not quantity.",k:"Allah told the Prophet to wake up at night and read the Quran slowly and beautifully. Night prayer makes the heart strong."},{n:74,a:"Al-Muddaththir",t:"The Cloaked One",v:56,p:"Meccan",mz:"Al-Mizan reads the surah as the first command to rise and warn, the portrait of the man who thought and plotted and called the Quran magic, the nineteen over the Fire, and the companions of the right asking the criminals 'what brought you into Saqar?': not praying, not feeding the poor.",s:"O you wrapped in a cloak, rise and warn, magnify your Lord, purify your garments; the one created alone and given wealth and sons who turned away and said 'this is only magic'; over it are nineteen; 'what led you into Saqar?' 'We did not pray, nor feed the poor, and we denied the Day'; and every soul is held for what it earned except the companions of the right.",l:"'We were not of those who prayed, nor did we feed the poor': the two things the people of the Fire name first are the two to guard first.",k:"Allah told the Prophet: get up and warn people. The people who end up in the Fire say they did not pray and did not feed the hungry, so let us do both."},{n:75,a:"Al-Qiyamah",t:"The Resurrection",v:40,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the Day of Resurrection and the self-reproaching soul that Allah will reassemble even the fingertips, with the faces radiant looking at their Lord and the scene of the soul reaching the collarbone as its two ends.",s:"By the Day of Resurrection and the self-reproaching soul; does man think We will not gather his bones? We can restore his very fingertips; do not hurry your tongue with the Quran, its collection and recitation are upon Us; faces that Day radiant, looking at their Lord; when the soul reaches the collarbone and the leg is wound around the leg; was he not a drop of emitted fluid?",l:"Man would rather deny what lies ahead; the surah answers with fingertips, which Allah can restore to their lines.",k:"Allah can bring every person back to life, even the tiny lines on your fingertips. The best thing on that Day will be to look at Allah."},{n:76,a:"Al-Insan",t:"The Human",v:31,p:"Medinan",mz:"Al-Mizan reads the surah as the human guided to the way, grateful or ungrateful, and the righteous who feed the needy, the orphan and the captive for Allah's face alone, 'we want no reward or thanks from you', with the reward of the Garden described in cups of camphor and ginger.",s:"Was there a time when the human was nothing mentioned? Created from a mingled drop to be tested, shown the way, grateful or ungrateful; the righteous who fulfil vows, fear a Day of widespread harm, and feed the needy, the orphan and the captive saying 'we feed you only for Allah's face; we want no reward or thanks'; silk, cups of camphor and ginger, boys like scattered pearls; and 'remember your Lord morning and evening, and prostrate to Him part of the night'.",l:"'We feed you only for Allah's face; we want no reward or thanks from you': the standard for every act of giving.",k:"The best people give food to the poor and say: we do this only for Allah, we do not need a thank-you. Allah gives them a beautiful garden."},{n:77,a:"Al-Mursalat",t:"Those Sent Forth",v:50,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the winds and the angels that the promise will fall, with the refrain 'woe that Day to the deniers' marking each proof: the destroyed nations, creation from a despised fluid, the earth that holds the living and the dead, and the Day of decision.",s:"By those sent forth in succession, what you are promised will fall; when the stars are erased and the mountains scattered; the earlier peoples destroyed and the later sent after them; did We not create you from a despised fluid in a firm place; the earth a gathering place for living and dead; 'woe that Day to the deniers' ten times; the shade of three columns that gives no shade; and the God-conscious among shades and springs.",l:"'Woe that Day to the deniers' is repeated ten times, once for each proof the surah gives them.",k:"Allah swears by the winds that the Last Day is real. He reminds us how small we started and how much He gave us, so we should not deny Him."},{n:78,a:"An-Naba",t:"The Great News",v:40,p:"Meccan",mz:"Al-Mizan reads the surah as the great news of the resurrection they dispute, proved by the earth as a bed, the mountains as pegs, sleep as rest, the night as a cover and the rain that brings grain, and then the Day of decision when the Spirit and the angels stand in rows.",s:"What are they asking about: the great news on which they differ; the earth a bed and the mountains pegs, created in pairs, sleep as rest, night as a garment, day for livelihood, seven strong heavens and a blazing lamp, rain for grain and gardens; the Day of decision and the trumpet; Hell lying in wait, the transgressors tasting only boiling water; the God-conscious with gardens and grapes; and the Day the Spirit and the angels stand in rows and none speaks.",l:"The surah lists ten gifts, from the bed of the earth to the rain, and then asks how the Giver could be denied.",k:"Allah made the earth like a bed and the mountains like tent pegs, and He gave us sleep to rest. One day everyone will stand in rows before Him."},{n:79,a:"An-Nazi'at",t:"Those Who Pull Out",v:46,p:"Meccan",mz:"Al-Mizan reads the surah as the oath of the angels who draw out souls that the quaking and the second blast will come, with Musa and Pharaoh as the proof of what overweening ends in, and the question 'when is the Hour?' answered: it is as if, on the day they see it, they had stayed only an evening or a morning.",s:"By those who pull out violently and those who glide; the day the quake shakes and the second follows, hearts pounding; Musa called in the sacred valley, Pharaoh's 'I am your lord most high' and his seizure; are you harder to create or the heaven He built; the one who feared his Lord's standing and restrained his soul from desire has the Garden; and 'when is the Hour?' You are only a warner for the one who fears it.",l:"Whoever feared standing before his Lord and restrained himself from desire, the Garden is his home: the surah's whole path in one verse.",k:"Pharaoh said he was a god and Allah showed everyone he was not. The person who stops themselves from doing wrong because they remember Allah goes to Paradise."},{n:80,a:"Abasa",t:"He Frowned",v:42,p:"Meccan",mz:"Al-Mizan reads the surah as the rebuke over the blind man who came seeking purification while a self-sufficient man was being attended, the Quran in honoured, exalted scrolls, and the human reminded of his creation from a drop and his food from the split earth, until the Day each one flees even from his mother.",s:"He frowned and turned away because the blind man came; the one who considers himself self-sufficient is attended, and the one who comes running in fear is neglected; the Reminder in honoured, exalted scrolls carried by noble scribes; from what did He create him: a drop, measured, the way made easy, then death and the grave; let the human look at his food, water poured, earth split, grain and grapes and olives; and the Day a man flees from his brother, his mother and his father, each with a concern that suffices him.",l:"Let the human look at his food: the surah turns a plate into a proof.",k:"A blind man came to learn and was ignored for someone important, and Allah said that was wrong. Everyone matters. Look at your food and see what Allah made."},{n:81,a:"At-Takwir",t:"The Folding Up",v:29,p:"Meccan",mz:"Al-Mizan reads the surah as the signs of the Hour's arrival in twelve 'whens', the buried girl asked for what sin she was killed, and the oath that the Quran is the word of a noble messenger, Jibril, seen by the Prophet on the clear horizon, and not the word of an outcast Satan.",s:"When the sun is folded up, the stars fall, the mountains move, the pregnant camels are abandoned, the seas boil, souls are paired, and the buried girl is asked for what sin she was killed, then each soul knows what it brought; by the retreating stars, it is the word of a noble messenger, strong, honoured with the Throne's Lord; your companion is not mad; he saw him on the clear horizon; and 'where then are you going? It is only a reminder for whoever wills to go straight.'",l:"'When the buried girl is asked for what sin she was killed': the surah puts one child's question at the centre of the end of the world.",k:"One day the sun will be folded up and the stars will fall. Allah will ask about every baby girl who was hurt. The Quran was brought by Jibril, a noble angel."},{n:82,a:"Al-Infitar",t:"The Cleaving",v:19,p:"Meccan",mz:"Al-Mizan reads the surah as the sky split and the graves overturned, the human asked what deceived him about his Generous Lord who shaped him in whatever form He willed, and the noble recording angels who know what you do, until the Day no soul can do anything for another.",s:"When the sky splits, the stars scatter, the seas burst and the graves are overturned, each soul knows what it sent ahead and left behind; O human, what deceived you about your Generous Lord, who created you, proportioned you and composed you in whatever form He willed; over you are guardians, noble scribes who know what you do; the righteous in bliss and the wicked in the Fire; and a Day when no soul owns anything for another, the command that Day being Allah's.",l:"'What deceived you about your Generous Lord?' His generosity is the thing we mistake for permission.",k:"Allah made you in a beautiful shape and asks: what made you forget Me? Kind angels write down what we do, so do good things for them to write."},{n:83,a:"Al-Mutaffifin",t:"The Defrauders",v:36,p:"Meccan",mz:"Al-Mizan reads the surah as woe to those who take full measure and give short, who do not think they will be raised, with the record of the wicked in Sijjin and of the righteous in Illiyyin, the rust on hearts from what they earned, and the laughing reversed on the Day.",s:"Woe to the defrauders who demand full measure and give less; do they not think they will be raised on a tremendous Day; the record of the wicked in Sijjin; 'their hearts are rusted by what they earned'; the record of the righteous in Illiyyin, witnessed by those brought near; sealed nectar whose seal is musk, 'so let the competitors compete'; and the criminals who laughed at the believers and winked, while today the believers laugh.",l:"Their hearts are rusted by what they used to earn: the surah's diagnosis of dishonesty is a rust that builds up.",k:"Cheating in the shop, giving less than you should, is a big wrong. Doing wrong again and again makes the heart rusty like old metal."},{n:84,a:"Al-Inshiqaq",t:"The Splitting Open",v:25,p:"Meccan",mz:"Al-Mizan reads the surah as the sky and earth obeying their Lord as they must, the human toiling toward his Lord to meet Him, the book given behind the back, and the oath by the twilight and the moon that you will ride stage after stage; why then do they not believe and not prostrate when the Quran is recited?",s:"When the sky splits and listens to its Lord as it must, and the earth is stretched and empties itself; O human, you are toiling toward your Lord and will meet Him; the one given his book in his right hand has an easy reckoning and returns to his people rejoicing; the one given it behind his back calls for ruin; by the twilight, the night and the full moon, you will surely ride stage after stage; and when the Quran is recited they do not prostrate.",l:"You are toiling toward your Lord with all your toil and will meet Him: the surah tells you where the work is going.",k:"Everyone is on a journey to meet Allah, stage after stage like the moon growing. Those who did well get their book in the right hand and go home happy."},{n:85,a:"Al-Buruj",t:"The Constellations",v:22,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the heaven of constellations that the people of the trench, who burned the believers for believing in Allah the Mighty, the Praised, are cursed, with Pharaoh and Thamud as witnesses that Allah's grasp is severe and the Quran is glorious in a guarded tablet.",s:"By the heaven with constellations and the promised Day, a witness and what is witnessed; cursed are the companions of the trench, the fire fed with fuel, sitting watching what they did to the believers, who were punished only for believing in Allah the Mighty, the Praised; those who persecute and do not repent have the punishment of burning; your Lord's grasp is severe; He originates and repeats; the Forgiving, the Loving, Lord of the Throne; Pharaoh and Thamud; and a glorious Quran in a guarded tablet.",l:"They hated the believers only because they believed in Allah, the Mighty, the Praised: the surah names the one thing that was held against them.",k:"Long ago a cruel king burned people just for believing in Allah, and Allah remembers every one of them. Allah is strong and also full of love."},{n:86,a:"At-Tariq",t:"The Night-Comer",v:17,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the piercing star that every soul has a keeper over it, with creation from a gushing fluid as the proof that the Creator can return him, and the Quran as a decisive word, not a jest, while the disbelievers plot and Allah plans.",s:"By the sky and the night-comer, the piercing star: every soul has a keeper over it; let the human look at what he was created from, a fluid gushing out from between the backbone and the ribs; surely He is able to bring him back on the Day secrets are examined, when he will have no power or helper; by the sky that returns rain and the earth that splits, it is a decisive word and not a jest; they plot and I plot; so give the disbelievers respite a little.",l:"'The Day secrets are examined': the surah gives the examination date for what we keep hidden.",k:"Allah swears by a bright star that every person has an angel keeping watch. Allah, who made us from a tiny drop, can bring us back on the Last Day."},{n:87,a:"Al-A'la",t:"The Most High",v:19,p:"Meccan",mz:"Al-Mizan reads the surah as the command to glorify the Most High who creates, proportions and guides, the promise that the Prophet will not forget the recitation, and the reminder that the Hereafter is better and more lasting, as the scrolls of Ibrahim and Musa also said."},{n:88,a:"Al-Ghashiyah",t:"The Overwhelming",v:26,p:"Meccan",mz:"Al-Mizan reads the surah as the news of the overwhelming event with its two kinds of faces, downcast and toiling or joyful in a high garden, and then the call to look at the camel, the sky, the mountains and the earth, with the Prophet told he is a reminder and not a controller.",s:"Has the news of the Overwhelming reached you? Faces that Day humbled, toiling, weary, burning in a hot fire, with food of bitter thorn; faces that Day joyful, pleased with their effort, in a high garden with raised couches and cups set out; do they not look at the camel, how it was created, the sky raised, the mountains set up, the earth spread out; remind, you are only a reminder, not a controller over them; and to Us is their return and their reckoning.",l:"'You are only a reminder; you are not in control over them': the limit of every parent and teacher, written for the Prophet himself.",k:"Look at a camel and think how Allah made it. The Prophet's job was to remind people, not to force them, and that is our job too."},{n:89,a:"Al-Fajr",t:"The Dawn",v:30,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the dawn and the ten nights that Allah is ever watchful, with Ad, Thamud and Pharaoh as proof, the correction of the belief that wealth is honour and poverty humiliation, and the soul at peace called to return to its Lord, well pleased."},{n:90,a:"Al-Balad",t:"The City",v:20,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by Makkah that the human is created in toil and should not boast of wealth spent, with the steep path, freeing a neck and feeding on a day of hunger an orphan of near kin or a needy person in the dust, as what the two ways come to.",s:"By this city in which you are free, and by a father and what he begot: the human is created in toil; he says 'I have squandered abundant wealth', thinking no one sees him; did We not give him two eyes, a tongue and two lips, and show him the two highways; he has not attempted the steep path: freeing a neck, or feeding on a day of hunger an orphan of near kin or a poor person lying in the dust, and being of those who believe and counsel patience and mercy.",l:"The steep path is named: free a neck, feed an orphan of kin or a poor person in the dust on a day of hunger, and counsel patience and mercy.",k:"Allah gave us two eyes, a tongue and two lips. The hard but good road is to free someone, feed a hungry orphan, and tell each other to be patient and kind."},{n:91,a:"Ash-Shams",t:"The Sun",v:15,p:"Meccan",mz:"Al-Mizan reads the surah as eleven oaths leading to one sentence: the soul inspired with its wrong and its right prospers if purified and fails if buried, with Thamud's hamstrung she-camel as the example of burying it."},{n:92,a:"Al-Layl",t:"The Night",v:21,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the night and day that human efforts are diverse, with the one who gives, fears Allah and affirms the best eased toward ease, and the one who is stingy and self-sufficient eased toward hardship, while the most God-conscious gives his wealth seeking only his Lord's face.",s:"By the night when it covers and the day when it appears, your efforts are diverse; whoever gives, fears Allah and affirms the best, We will ease him toward ease; whoever is stingy, considers himself self-sufficient and denies the best, We will ease him toward hardship, and his wealth will not help him when he falls; guidance is upon Us; the most God-conscious will be kept from the Fire, he who gives his wealth to purify himself, owing no favour to anyone, seeking only the face of his Lord Most High, and he will be satisfied.",l:"Giving, fearing Allah and believing the best: the surah says those three ease a life, and their opposites harden it.",k:"Allah makes life easy for the person who gives, is careful of Him and believes in good things. Giving to others cleans the heart."},{n:93,a:"Ad-Duha",t:"The Morning Brightness",v:11,p:"Meccan",mz:"Al-Mizan reads the surah as Allah's reassurance to the Prophet that his Lord has not abandoned him nor is displeased, counting the orphanhood, the wandering and the need that were each met, and asking in return that the orphan not be oppressed, the beggar not be repulsed and the favour be proclaimed."},{n:94,a:"Ash-Sharh",t:"The Opening of the Breast",v:8,p:"Meccan",mz:"Al-Mizan reads the surah as the completion of ad-Duha: the breast opened, the burden removed and the name raised, with the law stated twice that with hardship comes ease, and the instruction to turn to one labour as soon as another is done."},{n:95,a:"At-Tin",t:"The Fig",v:8,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the fig, the olive, Mount Sinai and the secure city that the human was created in the best stature and then reduced to the lowest of the low, except those who believe and do right, so what then makes him deny the judgement, when Allah is the most just of judges.",s:"By the fig and the olive, Mount Sinai and this secure city: We created the human in the best of forms, then returned him to the lowest of the low, except those who believe and do righteous deeds, who have a reward unending; what then makes you deny the Judgement after this? Is not Allah the most just of judges?",l:"Created in the best stature and able to fall to the lowest of the low: the surah gives the human both the height and the warning.",k:"Allah made people in the very best shape. The ones who believe and do good keep that beauty forever. Allah is the fairest judge of all."},{n:96,a:"Al-'Alaq",t:"The Clinging Clot",v:19,p:"Meccan",mz:"Al-Mizan reads the first five verses as the beginning of revelation, reading in the name of the Lord who created and taught by the pen, and the rest as the human who transgresses because he sees himself self-sufficient and forbids a servant from praying, answered with 'prostrate and draw near'."},{n:97,a:"Al-Qadr",t:"The Night of Decree",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as the descent of the whole Quran in the Night of Decree, which is better than a thousand months, when the angels and the Spirit descend by their Lord's leave with every command, and which is peace until dawn; he holds that the night recurs every year."},{n:98,a:"Al-Bayyinah",t:"The Clear Proof",v:8,p:"Medinan",mz:"Al-Mizan reads the surah as the clear proof, a messenger reciting purified pages, after which the People of the Book divided though they were commanded only sincere worship, prayer and zakat, with the believers who do right named the best of creation, whose Lord is pleased with them and they with Him.",s:"Those who disbelieved among the People of the Book and the idolaters would not desist until the clear proof came, a messenger from Allah reciting purified pages with upright writings; they divided only after the clear proof came; they were commanded nothing but to worship Allah with sincere religion, to establish prayer and give zakat; the disbelievers are the worst of creation; and those who believe and do righteous deeds are the best of creation, with gardens of Eden, Allah pleased with them and they with Him, for whoever fears his Lord.",l:"'Allah is pleased with them and they are pleased with Him': the surah names the one reward that makes every other one small.",k:"Allah asked people for three things: worship Him alone, pray, and give to the poor. Those who do are the best of all creatures, and Allah is happy with them."},{n:99,a:"Az-Zalzalah",t:"The Earthquake",v:8,p:"Medinan",mz:"Al-Mizan reads the surah as the earth's final quaking and her reporting of her news by her Lord's inspiration, with people coming forth in groups to see their deeds, and the law that whoever does an atom's weight of good or evil will see it."},{n:100,a:"Al-'Adiyat",t:"The Chargers",v:11,p:"Meccan",mz:"Al-Mizan reads the surah as the oath by the charging horses that the human is ungrateful to his Lord and a witness to it, intense in his love of wealth, and that he does not know that when the graves are overturned and what is in the breasts is brought out, his Lord that Day is fully aware of them.",s:"By the panting chargers, striking sparks, raiding at dawn, raising dust and penetrating the enemy's centre: the human is ungrateful to his Lord, and he is a witness to that, and he is intense in his love of wealth; does he not know that when what is in the graves is scattered and what is in the breasts is obtained, their Lord that Day is fully aware of them?",l:"Intense in love of wealth and ungrateful to the Lord: the surah pairs the two and says the human is a witness against himself.",k:"Horses run bravely for their riders, but people often forget to thank Allah who gave them everything. Allah knows what is in every heart."},{n:101,a:"Al-Qari'ah",t:"The Striking Calamity",v:11,p:"Meccan",mz:"Al-Mizan reads the surah as the striking calamity when people are like scattered moths and mountains like carded wool, and the balance that decides: heavy scales for a pleasant life, light scales for a mother that is the Abyss, a hot fire.",s:"The Striking Calamity: what is the Striking Calamity? The Day people are like scattered moths and mountains like carded wool; whoever's scales are heavy is in a pleasant life; whoever's scales are light, his mother is the Abyss, and what will make you know what it is: a blazing fire.",l:"The scale is the only thing that counts that Day; the surah says nothing about how it got heavy, only that it must.",k:"On the Last Day people will be like moths flying everywhere. Everyone's good deeds are weighed. Let us make our side of the scale heavy."},{n:102,a:"At-Takathur",t:"The Rivalry in Increase",v:8,p:"Meccan",mz:"Al-Mizan reads the surah as the rivalry in increase that distracts until the graves are visited, and the threefold 'you will come to know', followed by seeing the Fire with the eye of certainty and being asked that Day about the bliss.",s:"Competing to have more distracts you until you visit the graves; no, you will come to know; then no, you will come to know; no, if only you knew with the knowledge of certainty, you would see the Blaze, then you would see it with the eye of certainty; then you will be asked that Day about the bliss.",l:"Rivalry in more distracts you until you visit the graves: the surah's first word is the diagnosis and the grave is the end of the race.",k:"Wanting more and more toys and money keeps people busy until they die. Allah will ask us what we did with all the good things He gave."},{n:103,a:"Al-'Asr",t:"The Declining Day",v:3,p:"Meccan",mz:"Al-Mizan reads the surah as the whole of the Quran's teaching in three verses: by time, every human is in loss, except those who combine faith, righteous deeds, and mutual counsel to truth and to patience."},{n:104,a:"Al-Humazah",t:"The Slanderer",v:9,p:"Meccan",mz:"Al-Mizan reads the surah as woe to every backbiter and slanderer who gathers wealth and counts it, thinking it will make him immortal, and who will be thrown into the Crusher, Allah's kindled fire that reaches the hearts and closes over them in extended columns.",s:"Woe to every backbiter and slanderer, who collects wealth and counts it, thinking his wealth will make him live forever; no, he will be thrown into the Crusher; and what will make you know what the Crusher is: Allah's kindled fire, which rises over the hearts; it closes over them in extended columns.",l:"Collecting wealth and counting it, thinking it will keep him alive: the surah pairs greed and mockery as one disease.",k:"Making fun of people and talking behind their backs is a big wrong. Counting money all day does not make anyone live forever."},{n:105,a:"Al-Fil",t:"The Elephant",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as the reminder of the army of the elephant in the year of the Prophet's birth, whose plot Allah turned to loss by flocks of birds with stones of baked clay, leaving them like eaten straw: the Kaaba's protection as a sign for Quraysh."},{n:106,a:"Quraysh",t:"Quraysh",v:4,p:"Meccan",mz:"Al-Mizan reads the surah with al-Fil: for the security of Quraysh and their winter and summer journeys, let them worship the Lord of this House, who fed them against hunger and made them safe from fear.",s:"For the accustomed security of Quraysh, their security in the journey of winter and of summer, let them worship the Lord of this House, who fed them against hunger and secured them against fear.",l:"Food against hunger and safety from fear: the surah names the two blessings that make worship the obvious reply.",k:"The people of Makkah could travel safely and had food because Allah protected the Kaaba. So Allah says: worship the Lord of this House."},{n:107,a:"Al-Ma'un",t:"Small Kindnesses",v:7,p:"Meccan",mz:"Al-Mizan reads the surah as the portrait of the one who denies the religion: he pushes away the orphan and does not urge the feeding of the poor, and the surah joins to him those who are heedless of their prayer, pray to be seen and withhold small kindnesses."},{n:108,a:"Al-Kawthar",t:"Abundance",v:3,p:"Meccan",mz:"Al-Mizan reads al-Kawthar as the abundant good given to the Prophet, which he takes to include his numerous descendants through Fatimah, with the reply to the one who called him cut off: it is the hater who is cut off."},{n:109,a:"Al-Kafirun",t:"The Disbelievers",v:6,p:"Meccan",mz:"Al-Mizan reads the surah as the complete separation of worship: the Prophet does not worship what they worship, nor will they worship what he worships, so each has their own religion, with no bargain possible."},{n:110,a:"An-Nasr",t:"The Divine Support",v:3,p:"Medinan",mz:"Al-Mizan reads the surah as the help of Allah and the conquest, after which the Prophet is told to glorify his Lord with praise and seek forgiveness, since He is ever accepting repentance; the companions understood it as announcing his approaching departure."},{n:111,a:"Al-Masad",t:"The Palm Fibre",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as the ruin of Abu Lahab's hands and of himself, whom neither wealth nor earnings availed, and of his wife, the carrier of firewood, with a rope of palm fibre around her neck: the one surah that names an enemy of the Prophet.",s:"May the hands of Abu Lahab be ruined, and ruined is he; his wealth and what he earned did not avail him; he will burn in a fire of blazing flame, and his wife, the carrier of firewood, with a rope of twisted palm fibre around her neck.",l:"Wealth and earnings did not avail him: the surah says of the Prophet's own uncle what it says of everyone who hates the truth.",k:"The Prophet's uncle Abu Lahab was very cruel to him and his wife spread thorns in his path. Allah says their money could not save them."},{n:112,a:"Al-Ikhlas",t:"Sincerity",v:4,p:"Meccan",mz:"Al-Mizan reads the surah as the pure statement of Allah's oneness: He is One, as-Samad on whom all depend, neither begetting nor begotten, with no equal, and holds that it equals a third of the Quran because tawhid is a third of its content."},{n:113,a:"Al-Falaq",t:"The Daybreak",v:5,p:"Meccan",mz:"Al-Mizan reads the surah as refuge with the Lord of the daybreak from the evil of what He created, of darkness as it settles, of those who blow on knots and of the envier when he envies: refuge from evils outside the self."},{n:114,a:"An-Nas",t:"Mankind",v:6,p:"Meccan",mz:"Al-Mizan reads the surah as refuge with the Lord, King and God of mankind from the retreating whisperer who whispers in the breasts of people, from jinn and from humans: refuge from the evil that works inside the self, completing al-Falaq."}],I=oa.map(a=>{let e=T.find(t=>t.n===a.n);return{n:a.n,a:e?.a??a.a,t:e?.t??a.t,v:a.v,p:a.p,mz:a.mz,s:a.s??e?.s??"",l:a.l??e?.l??"",k:a.k??e?.k??""}}),sa=I.reduce((a,e)=>a+e.v,0);var ue={draft:{label:"Draft",short:"draft",tone:"grey",means:"Written for this app and not yet checked by a named reader against the source. Read it as a study aid, not as a citation."},reviewed:{label:"Reviewed",short:"reviewed",tone:"blue",means:"A named reader compared the note with the source text and found it faithful. The name and date are recorded."},verified:{label:"Verified",short:"verified",tone:"green",means:"Checked against the printed edition,   try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ syncState="local"; canReview=isOwner&&!readOnly; setChip(); render(); return; }
  try{ const u=await window.claude.use("user"); if(u){ const w=await u.can("data.write"); const o=await u.isOwner(); isOwner=!!o||w===null; if(w===false){ readOnly=true; } setChip(); render(); } }catch(e){}
  let got=0; const timer=setTimeout(()=>{ if(syncState==="wait"){syncState="local";setChip()} },10000);
  const ready=()=>{ got++; if(got>=8){ clearTimeout(timer); syncState="db"; setChip(); } render(); };
  const err=e=>{ console.warn("db",e); clearTimeout(timer); syncState="local"; setChip(); render(); };
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists)S.settings=Object.assign({},S.settings,s.data()); else if(got<8&&!readOnly)dbWrite("settings/main",S.settings); saveLocal(); ready(); },err);
  db.doc("fast/current").onSnapshot(s=>{ if(s.exists)S.fast=Object.assign({},S.fast,s.data()); saveLocal(); ready(); },err);
  db.collection("days").orderBy("date","desc").limit(120).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.days=o;saveLocal()} ready(); },err);
  let qp=false,qn=false; const maybeMigrate=()=>{ if(qp&&qn)migrateCourse(true); };
  db.doc("quran/progress").onSnapshot(sn=>{ if(sn.exists)S.qprog=Object.assign({done:{},flag:{}},sn.data()); qp=true; maybeMigrate(); saveLocal(); ready(); },err);
  db.collection("qnotes").limit(400).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.qnotes=o;saveLocal()} qn=true; maybeMigrate(); ready(); },err);
  if(typeof window.oneplate==="object"){ window.oneplate.reviews().then(r=>{ S.reviews=r.reviews||{}; canReview=!!r.canReview; saveLocal(); render(); }).catch(e=>console.warn("reviews",e)); }
  else { canReview=isOwner&&!readOnly; db.doc("reviews/all").onSnapshot(sn=>{ if(sn.exists)S.reviews=sn.data()||{}; saveLocal(); render(); },e=>console.warn("reviews",e)); }
  db.collection("family").limit(20).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.family=o;saveLocal()} ready(); },err);
  db.collection("meals").limit(200).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.meals=o;saveLocal()} ready(); },err);
  db.collection("weighins").orderBy("date","asc").limit(400).onSnapshot(q=>{ if(!q.metadata.fromCache||q.size){const o={};q.docs.forEach(d=>{o[d.id]=d.data()});S.weighins=o;saveLocal()} ready(); },err);
}

function weekNo(){const a=new Date(S.settings.startDate+"T00:00:00"),b=new Date(todayStr()+"T00:00:00");return Math.max(1,Math.floor((b-a)/864e5/7)+1)}
function phase(w){return w<=3?CYCLE[0]:w<=7?CYCLE[1]:w<=12?CYCLE[2]:CYCLE[3]}
function weighList(){return Object.values(S.weighins).filter(w=>!w.m||w.m==="tafseer").sort((a,b)=>a.date<b.date?-1:1)}
function currentWeight(){const l=weighList();return l.length?Number(l[l.length-1].weight):Number(S.settings.startWeight)}

function strengthOn(){return lostKg()>=(S.settings.unlockKg||5)}

function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function hhmm(ms){const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

      ${miniChart(ws,"weight")}

function hijriOf(dateStr){return core.hijriOf(dateStr,Number((S.settings||{}).hijriOffset||0))}
function sunnahFast(dateStr){return core.sunnahFast(dateStr,(S.settings||{}).tradition||"sunni",Number((S.settings||{}).hijriOffset||0))}
function fastingTimes(dateStr){return core.fastingTimes(dateStr,(S.settings||{}).city||"karachi")}
function ramadanActive(){const mode=(S.settings||{}).ramadan||"auto";if(mode==="on")return true;if(mode==="off")return false;return core.isRamadan(todayStr(),Number((S.settings||{}).hijriOffset||0))}

function allMeals(){const o=S.meals||{};const list=BASE_MEALS.map(b=>{const v=o[b.id];if(v&&v.deleted)return null;return Object.assign({},b,v||{},{base:true})}).filter(Boolean);Object.values(o).forEach(v=>{if(v&&v.id&&/^c_/.test(v.id)&&!v.deleted)list.push(Object.assign({},v,{base:false}))});return list}
function tonightMeal(){const l=allMeals();if(!l.length)return null;const d=S.days[logDate()];if(d&&d.meal){const m=l.find(x=>x.id===d.meal);if(m)return m}const dt=new Date(logDate()+"T12:00:00");return l[(dt.getDate()+dt.getMonth())%l.length]}
function foodOptions(sel){const cats=[["protein","Protein"],["veg","Vegetables"],["carb","Carbs"],["fat","Fats"],["plus","Daal, dairy & extras"]];return cats.map(c=>`<optgroup label="${c[1]}">${Object.keys(FOODS).filter(k=>FOODS[k].cat===c[0]).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(FOODS[k].n)} · ${esc(FOODS[k].ur||"")} · per ${esc((UNITS[FOODS[k].u]||[""])[0]||"item")}</option>`).join("")}</optgroup>`).join("")}
function mealTotals(d){const t=mealCalc(d);const line=handLine(d);return `${mbar(t)}<p class="small"><b>By hand:</b> ${line?esc(line):"<span class='muted'>add foods to see the portions</span>"}</p>`}

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`}

function chart(ws){
  const st=S.settings,W=360,H=190,L=34,R=10,T=12,B=26;
  const start=new Date(st.startDate+"T00:00:00");
  const planWeeks=Math.max(8,Math.ceil((st.startWeight-st.targetWeight)/0.5)+2);
  let endMs=start.getTime()+planWeeks*7*864e5;
  if(ws.length){endMs=Math.max(endMs,new Date(ws[ws.length-1].date+"T00:00:00").getTime()+14*864e5)}
  const span=endMs-start.getTime();
  const ys=[st.startWeight,st.targetWeight].concat(ws.map(w=>Number(w.weight)));
  const ymin=Math.floor(Math.min.apply(null,ys))-1,ymax=Math.ceil(Math.max.apply(null,ys))+1;
  const X=ms=>L+(ms-start.getTime())/span*(W-L-R),Y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
  let g="";for(let v=ymin;v<=ymax;v+=(ymax-ymin>12?4:2)){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`}
  const months=[];let m=new Date(start.getFullYear(),start.getMonth()+1,1);while(m.getTime()<endMs){months.push(m);m=new Date(m.getFullYear(),m.getMonth()+1,1)}
  const xl=months.map(d=>`<text x="${X(d.getTime()).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.toLocaleDateString(undefined,{month:"short"})}</text>`).join("");
  const expEnd=start.getTime()+((st.startWeight-st.targetWeight)/0.5)*7*864e5;
  const exp=`<line class="exp" x1="${X(start.getTime()).toFixed(1)}" y1="${Y(st.startWeight).toFixed(1)}" x2="${X(Math.min(expEnd,endMs)).toFixed(1)}" y2="${Y(Math.max(st.targetWeight,st.startWeight-0.5*(Math.min(expEnd,endMs)-start.getTime())/864e5/7)).toFixed(1)}"/>`;
  const tgt=`<line class="tgt" x1="${L}" x2="${W-R}" y1="${Y(st.targetWeight).toFixed(1)}" y2="${Y(st.targetWeight).toFixed(1)}"/>`;
  const pts=ws.map(w=>[X(new Date(w.date+"T00:00:00").getTime()),Y(Number(w.weight))]);
  let act="";if(pts.length){const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const lp=pts[pts.length-1];act=`<path fill="url(#areaGrad)" d="${path} L${lp[0].toFixed(1)} ${(H-B).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H-B).toFixed(1)} Z"/><path class="act" d="${path}"/>`+pts.slice(0,-1).map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("")+`<circle class="ptl" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="4.5"/>`}
