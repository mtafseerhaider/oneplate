t tafsir."]},{h:"Source and grading",p:["'Uyun Akhbar al-Rida and al-Kafi, chains as received. Bayan label: received."]},{h:"Live it",l:["Keep the family's secrets; what is said in the house stays in the house.","Kindness to people: the shopkeeper, the guard, the driver.","Patience in hardship: the plateau week on the scale is a small hardship; keep going."]}],kids:["Imam al-Rida said a true believer learns three things: to keep secrets like Allah does, to be kind like the Prophet, and to be patient like the Imams."]},"The event: Sahih Muslim, merits of the Companions; Jami' al-Tirmidhi, tafsir of al-Ahzab. The long recited form (Hadith al-Kisa): 'Awalim al-'Ulum; appendix of later printings of Mafatih al-Jinan":{sections:[{h:"Context",p:["The event of the cloak: the Prophet gathered 'Ali, Fatimah, al-Hasan and al-Husayn under his cloak and said: O Allah, these are my household, so remove impurity from them and purify them thoroughly, the words of 33:33. The event is in Sahih Muslim from 'A'ishah and in al-Tirmidhi from Umm Salamah, and is accepted across the schools. The long narrative form recited in gatherings, Hadith al-Kisa, in which each member asks to enter and Jibril asks permission, is a later text whose attribution is contested; the Bayan study reports both."]},{h:"Meaning",p:["The verse of purification is read by the Shia as the Quran's designation of the Household and of their rank; the Sunni commentators read it as a prayer for them within a passage on the Prophet's wives. On the event itself there is no dispute: the Prophet named four people as his household and asked for their purity, and the love of them is commanded in 42:23 by the reading of many."]},{h:"Source and grading",p:["The event: Sahih Muslim 2424; Jami' al-Tirmidhi 3205 and 3787, graded hasan sahih. The long recited form: 'Awalim al-'Ulum of al-Bahrani and later appendices of Mafatih al-Jinan; received and contested. Bayan label: event graded, long form received and contested."]},{h:"Live it",l:["Teach the children the names of the five and the prayer under the cloak.","The cloak is the image of a family gathered: the family circle is a small cloak.","Keep the two forms distinct when you teach: the event, which is certain, and the recitation, which is loved."]}],kids:["One day the Prophet \uFDFA put his cloak over 'Ali, Fatimah, Hasan and Husayn and prayed: Allah, these are my family, keep them pure. We love them because he loved them."]}};var je={"2:286":{sections:[{h:"Where it comes",p:["The last verse of al-Baqarah, after the verse that says Allah will call you to account for what you reveal and what you hide. The companions found that frightening and the Prophet told them to say 'we hear and obey'; then this verse came down with the relief: Allah does not burden a soul beyond its capacity, it has what it earned and against it what it earned, and the long prayer: our Lord, do not take us to task if we forget or err; do not lay on us a burden as You laid on those before us; do not burden us with what we have no strength for; pardon us, forgive us, have mercy on us; You are our Protector, help us against the disbelieving people."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'capacity', wus', as the ordinary capacity of a person, so that the law never asks more than a person can usually do, and the verse's prayer as Allah teaching the community how to ask for the mercy the first half promises. He notes that the Prophet reported that every request in it was answered with 'yes'."]},{h:"Meaning for today",p:["Whatever is on your plate today, in both senses, was measured to your size. The verse is not a promise that life will be light; it is a promise that it will not be impossible, and that forgetting and erring are forgiven on request."]},{h:"Practice",l:["Recite the last two verses of al-Baqarah at night; the Prophet said they suffice whoever recites them.","Name the heavy thing, then do its first small piece; capacity is proven by starting.","Teach the children: a hard test is still the right size."]}],kids:["Allah promises He never gives anyone a test that is too big for them. If something is hard, it is still the right size for you."]},"94:5\u20136":{sections:[{h:"Where it comes",p:["Surah al-Inshirah was revealed in Makkah after ad-Duha, to the Prophet in years of grief and opposition. Did We not expand your breast, remove your burden, raise your renown? Then the promise, twice, and the command: when you are free, labour on, and turn to your Lord with longing."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'with' as the key word: ease is not after hardship but with it, inside the same time, and the repetition is a second promise, not an emphasis. The commentators note that 'the hardship' has the definite article in both verses and 'ease' is indefinite, so one hardship is accompanied by eases, plural. He connects the verse to the surah's end: the relief is for the one who keeps working."]},{h:"Meaning for today",p:["The hardest weeks of a fat-loss plan, a job, a marriage, contain their own eases, usually unseen until later. The verse asks for one thing while waiting: keep labouring, and turn to your Lord."]},{h:"Practice",l:["In a hard week, list the eases that are already present: health, a child's laugh, a cool morning.","When one task ends, start the next; the surah's last instruction.","Teach it to the children as a rhyme they can say when something is hard."]}],kids:["Allah says: with every hard thing comes an easy thing, and He says it twice so we really believe it."]},"13:28":{sections:[{h:"Where it comes",p:["In ar-Ra'd, after the disbelievers demand a sign and Allah answers that He guides to Himself whoever turns to Him: those who believe and whose hearts find rest in His remembrance; surely in Allah's remembrance hearts find rest."]},{h:"Al-Mizan's reading",p:["Tabataba'i explains the rest: the heart is anxious because it seeks what will not fail it, and only Allah does not fail. Remembrance, dhikr, is not only the tongue's; it is the heart's attention, and prayer is its chief form. He reads the verse as the believer's possession of the sign the disbelievers demanded: the sign is inside."]},{h:"Meaning for today",p:["Restlessness has a cure that is cheaper than everything sold for it. The verse does not say the worry disappears; it says the heart rests, which is a different thing."]},{h:"Practice",l:["When the mind races at night, a hundred times subhanallah with the breath, slowly.","The Soul check-in on Today is this verse made into a habit.","Teach the children a short dhikr for when they are scared."]}],kids:["Allah says hearts feel calm when they remember Him. If you feel worried, say Allah's name and your heart will settle."]},"2:152":{sections:[{h:"Where it comes",p:["After the verses on the change of the qibla to the Ka'bah and the sending of a Messenger from among you who recites, purifies and teaches: so remember Me and I will remember you; be grateful to Me and do not be ungrateful."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the exchange literally: Allah's remembrance of His servant is a real act of favour, guidance, protection and mention in the highest assembly, and it is promised in return for the servant's remembrance. He pairs the two commands: remembrance is the heart's gratitude and gratitude is the limbs' remembrance."]},{h:"Meaning for today",p:["The shortest contract in the Quran. You mention Him, He mentions you; the verse makes dhikr a two-way relation, not a monologue."]},{h:"Practice",l:["Say bismillah before the plate and alhamdulillah after, aloud, so the children hear both ends.","Three gratitudes on the Today tab are this verse's second half.","When you feel forgotten, remember Him; the verse says what follows."]}],kids:["Allah says: remember Me and I will remember you. When you think of Allah, He is thinking of you."]},"14:7":{sections:[{h:"Where it comes",p:["Musa reminds his people of the day Allah saved them from Pharaoh, and says: when your Lord announced, if you are grateful I will surely increase you, and if you are ungrateful, My punishment is severe."]},{h:"Al-Mizan's reading",p:["Tabataba'i notes that the increase is unconditional in object, 'I will increase you', not 'increase the blessing', so gratitude brings more of whatever is good, including the capacity to receive. Ingratitude's consequence is stated as a general law, not a threat to one people."]},{h:"Meaning for today",p:["Gratitude is the growth strategy of the Quran. Not as a mood, but as the use of a blessing in the way its Giver intended: health used for worship and work, food used for strength."]},{h:"Practice",l:["Thank Allah for the body by using it: the walk after dinner is gratitude in motion.","Keep the gratitude line on Today honest and specific.","Teach the children: say thank you and then look after the thing."]}],kids:["Allah promises: if you say thank you for what you have, I will give you more. Gratitude makes good things grow."]},"65:3":{sections:[{h:"Where it comes",p:["In at-Talaq, inside the law of divorce: whoever fears Allah, He makes a way out for him and provides from where he did not expect; whoever relies on Allah, He is sufficient for him; Allah accomplishes His purpose; He has set a measure for everything."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads sufficiency as real and complete: the one who relies on Allah lacks nothing he needs, because Allah's purpose is reached whatever stands in its way. The last clause, a measure for everything, keeps reliance from being passivity: the way out comes through causes, in their measure."]},{h:"Meaning for today",p:["Reliance is doing your part and then not carrying the outcome. Set the plan, keep the plate, log the weight; the result is His purpose, and it has its own timetable."]},{h:"Practice",l:["Hasbunallah wa ni'mal wakil when the result is out of your hands.","Tie the camel: do the work, then rest the worry.","Teach the children the two halves: try your best, then trust."]}],kids:["Allah says: whoever trusts in Allah, Allah is enough for him. Do your best and then leave the rest to Him."]},"39:53":{sections:[{h:"Where it comes",p:["In az-Zumar, addressed to those who had gone furthest against themselves. Say: O My servants who have transgressed against themselves, do not despair of Allah's mercy; Allah forgives all sins; He is the Forgiving, the Merciful. Turn to your Lord and submit before the punishment comes."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'all sins' as all, with the condition in the next verse: turn and submit. Despair is itself the sin the verse targets, since it accuses Allah's mercy of a limit. He notes that Allah still calls them 'My servants'."]},{h:"Meaning for today",p:["The most hopeful verse in the Quran was sent to the worst offenders, which means it covers everyone. For a family, it is the rule that no one is ever beyond the door."]},{h:"Practice",l:["After a bad week, read it before reading your log.","Never let a child think a mistake has ended your love; the verse models the opposite.","Turn and submit: the condition is an action, not a feeling."]}],kids:["Allah says: My servants, even if you have done many wrong things, never give up on My forgiveness. I forgive everything when you come back."]},"2:153":{sections:[{h:"Where it comes",p:["In al-Baqarah, at the beginning of the section on the trials the new community in Madinah would face: seek help through patience and prayer; Allah is with the patient. The next verses speak of those killed in Allah's way, and of the tests of fear and hunger."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads patience and prayer as the two instruments, the inner and the outer, and 'Allah is with the patient' as a special companionship beyond the general knowledge He has of all things: help, support, nearness. He notes the narrations that read 'patience' here as fasting."]},{h:"Meaning for today",p:["The instruction was given to people about to be tested in battle and hunger; it applies without change to a fast, a difficult boss or a sick child."]},{h:"Practice",l:["When the fast is hard, pray two rak'ahs; the verse joins them for a reason.","The patient have Allah with them: say that sentence to yourself in the queue, the traffic, the plateau.","Teach the children that patience is a tool, not a punishment."]}],kids:["Allah says: when things are hard, use patience and prayer, and I will be with you."]},"49:13":{sections:[{h:"Where it comes",p:["In al-Hujurat, after the verses forbidding mockery, suspicion and backbiting: O people, We created you from a male and a female and made you peoples and tribes so that you may know one another; the noblest of you in Allah's sight is the most God-conscious."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the verse as the Quran's refutation of every ranking by birth: tribes and peoples exist for recognition, li-ta'arafu, not for superiority, and the only rank is taqwa, which no one can see from outside. He connects it to the Prophet's farewell sermon."]},{h:"Meaning for today",p:["Caste, clan, language and passport are addresses, not ranks. A family that teaches this early produces children who can stand anywhere."]},{h:"Practice",l:["Notice when a judgement about someone is really about their family or accent.","The guard, the cleaner, the driver: the verse applies at the gate.","Teach the children the farewell sermon's sentence."]}],kids:["Allah says He made us different peoples so we can get to know each other, and the best person is the one who is most careful of Allah, not the richest or the fairest."]},"17:23\u201324":{sections:[{h:"Where it comes",p:["In al-Isra, the opening of a passage the commentators call the Quran's charter: worship Allah alone, and kindness to parents: if one or both reach old age with you, do not say to them 'uff', do not repulse them, speak to them a generous word, lower to them the wing of humility out of mercy, and say: my Lord, have mercy on them as they raised me when I was small."]},{h:"Al-Mizan's reading",p:["Tabataba'i notes that the right of parents is placed beside the worship of Allah, as in Luqman and al-An'am, because parents are the cause of one's existence in the chain of causes, and that 'uff', the smallest sound of annoyance, is forbidden so that everything above it is forbidden by implication. The prayer at the end repays what cannot be repaid by asking the One who can."]},{h:"Meaning for today",p:["Old age is named; the verse is about parents who have become dependent, difficult, repetitive. The wing of humility is the posture of a bird sheltering its young, turned around."]},{h:"Practice",l:["Call your parents today with the prayer at the end of the verse in mind.","The children are watching how you speak to their grandparents; they will speak to you that way.","No 'uff' at home, in either direction."]}],kids:["Allah says: be very kind to your mother and father, never say even 'uff' to them, and pray: Allah, be kind to them as they were kind to me when I was little."]},"31:17\u201319":{sections:[{h:"Where it comes",p:["Luqman's advice to his son, the last three verses: prayer, enjoining good, patience, no pride, a moderate walk, a lowered voice. The Quran keeps a wise man's counsel to a child as revelation."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the sequence as a father's curriculum: worship, duty to others, endurance, then the body's manners. 'That is of the matters requiring resolve' marks patience as the hard one. The voice of donkeys is the Quran's dislike of loudness as a claim on others' space."]},{h:"Meaning for today",p:["A child learns how to walk into a room from the parent who walks into rooms. The verses make posture and volume part of religion."]},{h:"Practice",l:["Lower the voice at home for a week and see what changes.","Read the whole passage, 31:12\u201319, with the children once a month.","Patience as a matter of resolve: decide it in the morning."]}],kids:["Luqman told his son: pray, tell people to do good, be patient, do not be proud, walk calmly and talk softly."]},"7:31":{sections:[{h:"Where it comes",p:["In al-A'raf, after the story of Adam and the warning against Satan: O children of Adam, take your adornment at every mosque, and eat and drink, but do not be excessive; He does not love the excessive. The next verse asks who forbade Allah's adornment and the good provisions."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the verse as the Quran's middle way stated as a law of the body: adornment and food are permitted and good, and only excess is forbidden, since excess harms the one who eats and robs the one who could have eaten. He notes that the verse answers the pagans who went naked at the Ka'bah and fasted from meat in ihram: both the stripping and the stuffing are excess."]},{h:"Meaning for today",p:["Eat and drink is a command; do not be excessive is its limit. OnePlate's rule of thirds and the one plate without refill are this verse in practice."]},{h:"Practice",l:["One plate, no refill: say the verse before it.","Dress well for prayer; adornment is commanded too.","Teach the children: Allah loves us to eat, and loves us to stop."]}],kids:["Allah says: eat and drink, but do not eat too much, because Allah does not love people who go over the limit."]},"16:90":{sections:[{h:"Where it comes",p:["In an-Nahl: Allah commands justice, excellence and giving to relatives, and forbids indecency, wrong and transgression; He admonishes you so that you may be reminded. Umar ibn Abd al-Aziz made it the close of the Friday sermon, and it still is."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the three commands as a ladder: justice is giving each his due, excellence, ihsan, is giving more than the due, and giving to kin is excellence directed where it is most owed. The three prohibitions mirror them: indecency harms the self, wrong harms others, transgression harms the order of society. He calls the verse the most comprehensive in the Quran on social ethics, as Ibn Mas'ud did."]},{h:"Meaning for today",p:["Six words that settle how to treat a customer, a sibling, a servant and a stranger. Hearing it every Friday is meant to keep it in the ear."]},{h:"Practice",l:["This Friday, listen for it at the end of the khutbah and say it with the imam.","Justice first, then excellence: pay what you owe, then add.","Call a relative; the third command is specific."]}],kids:["Allah tells us to be fair, to be extra kind, and to give to our family, and not to do shameful, bad or cruel things."]},"3:134":{sections:[{h:"Where it comes",p:["In Aal Imran, describing the God-conscious for whom the Garden is prepared: those who spend in ease and hardship, who restrain anger and pardon people; Allah loves those who do good. The next verse adds: and who, when they do something shameful, remember Allah and ask forgiveness."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads three ascending acts: spending in both states, so generosity is not a mood of plenty; restraining anger, which is holding the feeling; pardoning, which is letting it go; and the whole crowned with ihsan, since the one who forgives has done good to himself and the other. The narrations report the Prophet saying a man who does this will be called on the Day to choose his reward."]},{h:"Meaning for today",p:["Anger restrained and then released by pardon is the exact skill a household runs on. The verse makes it a mark of the people of the Garden."]},{h:"Practice",l:["When anger rises, leave the room; that is restraint. Return and forgive; that is pardon.","Spend in hardship: a small charity in a tight month.","Tell the children the Prophet's advice: sit down if you are standing, lie down if you are sitting."]}],kids:["Allah loves people who give even when they do not have much, who stop their anger, and who forgive."]},"103:1\u20133":{sections:[{h:"Where it comes",p:["Surah al-'Asr, three verses, Meccan. By time, the human is in loss, except those who believe, do righteous deeds, counsel one another to the truth and counsel one another to patience. The companions would not part until one recited it to the other."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the oath by time as an oath by the span of a life, which is capital being spent every moment, and the loss as the ordinary human condition unless four things are done, two personal and two social. He notes that the last two make faith a collective enterprise: no one is saved alone."]},{h:"Meaning for today",p:["A family is the first place the last two verbs happen: counselling one another to truth and to patience. The surah is a definition of what the family circle is for."]},{h:"Practice",l:["Recite it when parting from a friend, as the companions did.","At the circle, each person counsels one truth and one patience.","Time is the capital: the Today tab is its ledger."]}],kids:["Allah swears by time that everyone is losing, except people who believe, do good, and help each other to be truthful and patient."]},"2:155\u2013156":{sections:[{h:"Where it comes",p:["In al-Baqarah, after the command to seek help through patience and prayer: We will surely test you with something of fear and hunger and loss of wealth, lives and fruits; give good news to the patient, who, when a calamity strikes them, say: we belong to Allah and to Him we return. On them are blessings and mercy from their Lord, and they are the guided."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the sentence of the patient as a statement of fact that reorders feeling: if we belong to Allah, what was taken was His, and if we return to Him, nothing is lost that is not kept. The patience praised is not silence but this knowledge, and the reward is named: blessings, mercy and guidance."]},{h:"Meaning for today",p:["Hunger is in the list. A fasting person is in a small version of the test the verse describes, and the sentence of the patient is the fast's motto."]},{h:"Practice",l:["Say inna lillahi wa inna ilayhi raji'un for small losses too, as the Prophet did for a lamp going out.","Teach the children the sentence before they need it.","Read the verse on a day of bad news, before responding."]}],kids:["Allah says He will test us with fear, hunger and losing things, and the patient people say: we belong to Allah, and we are going back to Him."]},"67:2":{sections:[{h:"Where it comes",p:["The second verse of al-Mulk: He who created death and life to test which of you is best in deed; He is the Mighty, the Forgiving. The Prophet recited the surah every night."]},{h:"Al-Mizan's reading",p:["Tabataba'i notes that death is named before life, since death is the door to the reality life was for, and that the test is 'best in deed', not 'most', so a small deed done perfectly outweighs many done carelessly. 'The Forgiving' at the end tells the one who fails the test where to go."]},{h:"Meaning for today",p:["Best, not most: the verse frees you from doing everything and binds you to doing the few things well. One plate, one fast, one circle."]},{h:"Practice",l:["Pick the one deed to do best today.","Recite al-Mulk at night, as the Prophet did.","Teach the children: better, not more."]}],kids:["Allah made life and death to see who does the best deeds, not the most. Doing one thing really well matters."]},"93:5\u20138":{sections:[{h:"Where it comes",p:["Surah ad-Duha, after a pause in revelation when the Prophet's enemies said his Lord had left him: by the morning brightness and the night when it is still, your Lord has not forsaken you, nor does He hate you; the last will be better for you than the first; your Lord will give you and you will be satisfied. Then three questions and three answers, and three commands: do not oppress the orphan, do not repulse the beggar, and speak of your Lord's favour."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the surah as Allah consoling His Prophet with his own biography: the orphan sheltered, the seeker guided, the poor man enriched, and then asking him to turn each favour outward into a duty. He reads 'you will be satisfied' as the promise of the intercession, by the narrations."]},{h:"Meaning for today",p:["When you feel abandoned, the surah's method is to list how you were carried so far, and then to carry someone. Depression's cure in revelation is memory and service."]},{h:"Practice",l:["Write the three questions about yourself: where were you found, and how were you helped?","Give to a beggar without repulsing him; the surah commands it.","Speak of Allah's favour to the children: tell them the story of the family's good days."]}],kids:["Allah told the Prophet: I have not left you. Remember, you were an orphan and I gave you a home. So be kind to orphans and poor people, and talk about the good things Allah gave you."]},"20:114":{sections:[{h:"Where it comes",p:["In Ta-Ha, after the story of Musa and before the story of Adam: exalted is Allah, the true King; do not hurry with the Quran before its revelation to you is completed, and say: my Lord, increase me in knowledge."]},{h:"Al-Mizan's reading",p:["Tabataba'i notes that the only increase the Prophet was commanded to ask for was knowledge, and that it is placed next to the instruction not to hurry: knowledge comes by receiving slowly, not grasping. He takes the knowledge as knowledge of the Book first."]},{h:"Meaning for today",p:["The dua before study, before a decision, before reading the day's verse. Three words that make learning an act of worship."]},{h:"Practice",l:["Say rabbi zidni 'ilma before the Learn tab.","Teach the children to say it before school.","Do not hurry: one reading a day, understood, beats ten read fast."]}],kids:["The Prophet was taught to say: my Lord, give me more knowledge. Say it before you learn anything."]},"25:63":{sections:[{h:"Where it comes",p:["The opening of the portrait of the servants of the Merciful in al-Furqan: who walk on the earth gently, and when the ignorant address them say 'peace'; who spend the night prostrating and standing; who ask refuge from Hell; who are neither wasteful nor stingy; who do not call on another god, do not kill, do not commit adultery; who do not bear false witness; who are not deaf and blind to their Lord's signs; and who pray for spouses and children who are the comfort of their eyes."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'gently', hawnan, as a walk without arrogance and without hurry, the outward sign of an inward calm, and the answer 'peace' as a withdrawal from the ignorant without contempt. The portrait moves from the walk to the night, from the body to the prayer."]},{h:"Meaning for today",p:["The first mark of Allah's servants is how they walk and how they answer rudeness. The plate and the fast come later; the manners come first."]},{h:"Practice",l:["Walk to the car gently today.","Answer the next rude message with peace, and nothing else.","Teach the children the two marks: calm feet, kind mouth."]}],kids:["Allah's favourite servants walk calmly, and when someone is rude to them, they just say: peace."]},"59:9":{sections:[{h:"Where it comes",p:["In al-Hashr, praising the Ansar of Madinah who took in the emigrants from Makkah: they love those who migrated to them, find no need in their hearts for what the emigrants were given, and prefer them over themselves even when in need; whoever is saved from the greed of his own soul, those are the successful."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads ithar, preference of others, as the summit of generosity, and 'the greed of his own soul', shuhh, as the root vice the whole verse describes salvation from: the soul's clinging to what it has. The narrations tell of the Ansari who gave his guest the family's only food and put out the lamp so the guest would not see them not eating."]},{h:"Meaning for today",p:["The greed of the soul is the thing the plate rule trains: taking less so another has enough. The Ansar did it with houses; we do it with the second helping."]},{h:"Practice",l:["Serve others first at the table, and take the smaller piece.","Give something you would rather keep.","Tell the children the story of the lamp."]}],kids:["The people of Madinah shared their homes and food with the Muslims who came from Makkah, even when they had little. Allah says the ones who beat their own greed are the winners."]},"3:159":{sections:[{h:"Where it comes",p:["In Aal Imran, after the battle of Uhud, where the archers had disobeyed and the Muslims had been routed: it was by Allah's mercy that you were gentle with them; had you been harsh and hard-hearted they would have scattered from around you; so pardon them, ask forgiveness for them and consult them in the matter; and when you have decided, rely on Allah."]},{h:"Al-Mizan's reading",p:["Tabataba'i notes that the gentleness is called Allah's mercy, not the Prophet's temperament, and that consultation is commanded after the very people to be consulted had just failed. Decision, then reliance: shura ends in a decision by the leader and reliance on Allah, not in endless talk."]},{h:"Meaning for today",p:["A father after a family failure, a manager after a bad quarter: the verse's order is gentleness, pardon, prayer for them, consultation, decision, trust. Harshness would have scattered them."]},{h:"Practice",l:["After a child's mistake, the verse's first word is gentleness.","Consult the family on the week's plan, then decide.","Teach the children that leaders ask."]}],kids:["Allah told the Prophet: it is because you are gentle that people stay with you. So forgive, ask people what they think, decide, and trust Allah."]},"29:69":{sections:[{h:"Where it comes",p:["The last verse of al-Ankabut, a surah that opens by asking whether people think they will be left alone saying 'we believe' without being tested: those who strive in Us, We will surely guide them to Our ways; Allah is with those who do good."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'in Us' as striving in Allah's matter, whatever its form, and the promise as a law: effort is met with guidance into the many paths that lead to the one path. The plural 'ways' is the variety of roads within the straight road."]},{h:"Meaning for today",p:["You do not have to see the whole road; you have to strive on the piece you can see. Guidance comes to the one already moving."]},{h:"Practice",l:["Do the next right thing; the way after it is promised.","Strive in the plate, the fast, the reading; that is 'in Us'.","Teach the children: try, and Allah shows the way."]}],kids:["Allah promises: if you try hard for Me, I will show you the way. You do not need to see the whole road, just start walking."]},"2:201":{sections:[{h:"Where it comes",p:["In al-Baqarah, in the verses on the pilgrimage: some people say, our Lord, give us in this world, and they have no share in the Hereafter; and some say, our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire. Those have a share of what they earned."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads hasanah, good, as unspecified on purpose, so the dua asks for whatever is good in each world without naming it, and he notes that it asks for this world first, as a legitimate concern, but qualifies it with 'good'. It is the balanced dua of a balanced religion."]},{h:"Meaning for today",p:["A dua for a family that wants health, a home and a decent income, and the Hereafter too, without apology for either. The Prophet's most frequent supplication, which settles whether the wish is allowed."]},{h:"Practice",l:["Say it after every prayer, as he did.","Teach it as the first dua the children memorise after the Fatihah.","Let 'good in this world' include the body's health."]}],kids:["This is the Prophet's favourite dua: Allah, give us good in this life and good in the next life, and keep us away from the Fire."]},"41:34":{sections:[{h:"Where it comes",p:["In Fussilat, after the praise of those who call to Allah and do right: good and evil are not equal; repel with what is better, and the one between whom and you was enmity will become as a warm friend. But none attains this except the patient and the greatly fortunate."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'what is better' as the best available response, not merely a good one, and the result as a law of souls: an answer better than the offence disarms the offender, who expected a like answer. The next verse explains why it is rare: it needs patience, because the first impulse is to repay in kind."]},{h:"Meaning for today",p:["In a marriage, a family, a workplace, the verse is the only strategy that turns an enemy into a friend. It costs patience each time."]},{h:"Practice",l:["Pick one person you are at odds with and answer their next move with something better.","Teach the children the verse's promise: the enemy can become a friend.","When it fails, remember the verse says 'the patient'."]}],kids:["Allah says: if someone does something bad to you, answer with something good, and your enemy might become your friend."]},"4:36":{sections:[{h:"Where it comes",p:["The verse of rights in an-Nisa: worship Allah and associate nothing with Him, and do good to parents, relatives, orphans, the needy, the near neighbour, the distant neighbour, the companion at your side, the traveller and those in your care; Allah does not love the proud and boastful."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the list as circles of nearness: parents, kin, the weak, the two kinds of neighbour, the companion in a journey or at work, the stranger, the dependent, and takes 'the companion at your side' to include the spouse by one reading. The verse ends with pride because pride is what stops a person from serving those below him."]},{h:"Meaning for today",p:["Nine categories of people you owe good to, from the house outward. Most of a week's duties are on this list."]},{h:"Practice",l:["Pick one category a day for nine days and do one good to someone in it.","The distant neighbour: the family across the street you never greet.","Teach the children the list as a song."]}],kids:["Allah tells us to be good to our parents, our family, orphans, poor people, our neighbours near and far, our friends, travellers, and anyone who works for us."]},"17:36":{sections:[{h:"Where it comes",p:["In the charter of al-Isra: do not follow what you have no knowledge of; the hearing, the sight and the heart, each of those will be questioned."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the verse as a rule for belief, speech and action at once: do not believe, say or do what you do not know to be true. The three faculties are questioned because they are the instruments of knowing, and each will be asked what it was used for."]},{h:"Meaning for today",p:["The verse against forwarded messages, rumours and diet myths alike. Before passing it on, know it."]},{h:"Practice",l:["Check before you forward.","Judge a person only on what you know.","Teach the children: 'I do not know' is an honest sentence."]}],kids:["Allah says: do not say things you do not know are true. Your ears, your eyes and your heart will be asked what they did."]},"5:2":{sections:[{h:"Where it comes",p:["In al-Ma'idah, after the rules of pilgrimage and the command not to let hatred of a people who barred you from the Sacred Mosque lead you to aggression: cooperate in righteousness and God-consciousness, and do not cooperate in sin and aggression."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the verse as the Quran's principle of society: cooperation is the mode, and its object is the measure. Help offered to a wrong is a share in it; help offered to a good is a share in it."]},{h:"Meaning for today",p:["A family is a cooperation in birr. The plan works because the house cooks, walks and reads together; the verse names what the cooperation is for."]},{h:"Practice",l:["Ask of each shared activity: is this cooperation in good?","Refuse to help with a wrong, even a small one at work.","Teach the children that helping is judged by what it helps."]}],kids:["Allah says: help each other do good things, and do not help each other do bad things."]},"2:183":{sections:[{h:"Where it comes",p:["The verse of fasting: O you who believe, fasting is prescribed for you as it was prescribed for those before you, so that you may attain taqwa. The next verses give the counted days, the exemptions, the month of Ramadan in which the Quran was sent, and the ease intended: Allah wants ease for you, not hardship."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'as it was prescribed for those before you' as a consolation and a proof of the religion's unity, and 'so that you may attain taqwa' as the purpose that makes sense of the hunger: a person who can refuse lawful food for Allah learns to refuse the unlawful. The fast is a training of the will before it is a deprivation."]},{h:"Meaning for today",p:["The daily fast in this plan is not Ramadan, but it borrows the verse's purpose: the will trained on food is a will that can be trained on anything."]},{h:"Practice",l:["Name the fast's purpose each morning: taqwa, not weight. The weight follows.","Keep the exemptions the verse gives: illness and travel.","Teach the children that fasting is practice for saying no."]}],kids:["Allah says fasting is for us just as it was for people before us, so that we learn to be careful and strong."]},"96:1\u20135":{sections:[{h:"Where it comes",p:["The first revelation, in the cave of Hira, in Ramadan, when the Prophet was forty: Read, in the name of your Lord who created, created the human from a clinging clot. Read, and your Lord is the most Generous, who taught by the pen, taught the human what he did not know."]},{h:"Al-Mizan's reading",p:["Tabataba'i notes that the first command of the Quran is to read, and that it is tied to the name of the Lord: reading is worship when done in His name. The pen is named as the instrument of teaching, so that writing, books and learning are placed at the foundation of the religion."]},{h:"Meaning for today",p:["A family that reads together is doing the first thing the Quran asked. The Learn tab and the Bayan Library both rest on these five verses."]},{h:"Practice",l:["Read something today in Allah's name: a verse, a page, a line.","Teach the children that the first word of the Quran was 'read'.","Keep a pen near the Quran; the verse names it."]}],kids:["The very first word of the Quran was: Read! Allah taught people with the pen. So reading and writing are the first things He asked us to do."]},"16:97":{sections:[{h:"Where it comes",p:["In an-Nahl: whoever does righteousness, male or female, while a believer, We will surely give him a good life, and reward them according to the best of what they did."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads 'a good life' as a real life here, not only there: a believer who does right is given a life of contentment and light that the wealthy wrongdoer does not have, however much he owns, and 'according to the best of what they did' means the reward is measured by their best deed, not their average."]},{h:"Meaning for today",p:["The promise is explicit about women, and explicit about this world. A good life is promised to the one who does right, and the reward is graded by the best thing you did."]},{h:"Practice",l:["Do one thing today at your best; it sets the measure.","Teach the children the verse says 'male or female' so neither can doubt it.","Notice the good life you already have."]}],kids:["Allah promises a good life to anyone, boy or girl, who believes and does good, and He rewards them for their very best deeds."]},"33:21":{sections:[{h:"Where it comes",p:["In al-Ahzab, during the siege of Madinah by the confederates: in the Messenger of Allah you have a beautiful example, for whoever hopes in Allah and the Last Day and remembers Allah much."]},{h:"Al-Mizan's reading",p:["Tabataba'i places the verse in the Trench: the Prophet dug, went hungry, tied a stone to his stomach, stood firm when the hypocrites fled, and the example is that. The three conditions describe who can take the example: hope in Allah, hope in the Last Day and much remembrance, since imitation of him needs his inner state."]},{h:"Meaning for today",p:["In the hard week, ask what he did in his. Usually: worked beside the others, ate less than them, and remembered Allah."]},{h:"Practice",l:["Read one scene of the sirah a week and ask what he did.","His eating, his sleeping and his walking are examples too, not only his worship.","Teach the children to ask: what would the Prophet do?"]}],kids:["Allah says the Prophet is the best example to copy, for anyone who hopes in Allah and remembers Him a lot."]},"62:10":{sections:[{h:"Where it comes",p:["In al-Jumu'ah, after the command to hasten to the remembrance of Allah when the Friday call is made and leave trade: when the prayer has ended, disperse in the land, seek of Allah's bounty, and remember Allah much, that you may succeed."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the two commands together: stop work for prayer, then go back to work as a seeking of Allah's bounty, with remembrance carried into the work. Trade is not the opposite of worship when it is done with remembrance; the verse ends in success because both halves are kept."]},{h:"Meaning for today",p:["Work is bounty-seeking. The verse blesses the office, the shop and the road, on condition of the remembrance that goes with them."]},{h:"Practice",l:["After Friday prayer, go back to work with a bismillah.","Keep a dhikr for the commute.","Teach the children that earning is part of religion."]}],kids:["Allah says: pray on Friday, then go and work and look for Allah's gifts, and keep remembering Him while you work."]},"6:162":{sections:[{h:"Where it comes",p:["Near the end of al-An'am, in the Prophet's declaration: say, my Lord has guided me to a straight path, the religion of Ibrahim; say, my prayer, my sacrifice, my living and my dying are for Allah, Lord of the worlds; He has no partner, and of this I was commanded, and I am the first of the Muslims."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the four as the whole of a life: worship, the acts of devotion like the sacrifice, living, and dying, all directed to one Lord, which is the practical meaning of tawhid. A life so directed has no part that is outside religion."]},{h:"Meaning for today",p:["The verse that puts the plate and the training inside religion: my living is for Allah includes how I eat and how I keep my body."]},{h:"Practice",l:["Recite it before the fast; it is the intention of a whole life.","Dedicate the walk, the plate, the sleep.","Teach the children that there is no part of life that is not for Allah."]}],kids:["The Prophet was told to say: my prayer, my sacrifice, my life and my death are all for Allah. Everything we do can be for Him."]},"55:13":{sections:[{h:"Where it comes",p:["The refrain of ar-Rahman, repeated thirty-one times, after each favour named: the Quran taught, the human created, speech, the sun and moon, the sky raised, the balance set, the earth laid out with fruit and grain, the two seas, the ships, and the Garden's rivers and gardens. It is addressed to the two weighty beings, jinn and humans."]},{h:"Al-Mizan's reading",p:["Tabataba'i reads the refrain as the surah's method of gratitude: a favour is named, then the listener is asked whether he denies it, so that the whole surah is an examination in thankfulness. He notes that the favours begin with the Quran, before creation itself, since guidance is the first favour."]},{h:"Meaning for today",p:["The verse to read when the list of complaints is long. It answers each with a question."]},{h:"Practice",l:["Read ar-Rahman on Friday night and answer the refrain aloud: none of them.","List ten favours at the table; after each, say the verse.","Teach the children to answer the question."]}],kids:["In Surah ar-Rahman, Allah lists His gifts, the sun, the fruit, the sea, the Quran, and after each one asks: which of your Lord's gifts will you deny? The answer is: none!"]}};var Qe={Hikmah:{sections:[{h:"Root and forms",p:["From h-k-m, to restrain and to judge; hakama is to decide, hukm a ruling, hakim a judge and also a sage, hikmah the quality that restrains a person from folly and decides rightly. A horse's bit is a hakamah, the thing that holds. Wisdom is what holds the self and judges the matter."]},{h:"In the Quran",p:["Allah gives hikmah to whom He wills, and whoever is given it has been given much good (2:269). The Prophet teaches the Book and the hikmah (2:151). Luqman is given hikmah and his first act is gratitude (31:12). Call to your Lord's way with hikmah (16:125). Tabataba'i defines it as knowledge that is firm and true, joined to its action."]},{h:"In the tradition",p:["The Prophet prayed for Ibn 'Abbas to be taught hikmah; Imam 'Ali said the wise man's tongue is behind his heart; al-Ghazali made it one of the four cardinal virtues, the perfection of the intellect, between cunning and stupidity."]},{h:"Use it this week",l:["Before a decision, ask the three questions: what is right, when, and in what measure?","Teach the children that a wise person is one who knows when to speak and when not to."]}],kids:["Hikmah means wisdom: knowing the right thing and doing it at the right time, the right way."]},Adab:{sections:[{h:"Root and forms",p:["From '-d-b; adaba is to invite to a banquet, and ma'duba is a feast. Adab is the refinement a guest at a banquet shows, and from there the whole discipline of right conduct, and then literature, the writing that refines. Ta'dib is training in manners, and mu'addib a tutor."]},{h:"In the Quran",p:["The word itself is not in the Quran, but its content is everywhere: lower your voice (31:19), do not enter houses without greeting (24:27), speak a generous word to parents (17:23), do not raise your voices above the Prophet's (49:2). The Prophet said: my Lord gave me adab and perfected my adab."]},{h:"In the tradition",p:["The scholars wrote books of adab for every situation: the adab of the student, the teacher, the judge, the eater, the traveller. The Bayan Library's notes borrow the adab al-'alim wal-muta'allim, the manners of teacher and learner, in which the student's manners toward knowledge are half the learning."]},{h:"Use it this week",l:["The mindful dinner is an adab practice: sit, bismillah, right hand, small bites, no criticism of food.","Greet before speaking, in every room."]}],kids:["Adab means good manners: the right way to eat, to speak, to greet, and to treat people."]},Sabr:{sections:[{h:"Root and forms",p:["From s-b-r, to bind, confine, hold firm. Sabara is to be patient; sabur the Patient, a name of Allah; sabbar one of great patience; and the aloe is called sabr for its bitterness. Patience in Arabic is not waiting; it is holding."]},{h:"In the Quran",p:["More than a hundred occurrences. Seek help in patience and prayer (2:45, 2:153); Allah is with the patient (2:153); the patient are paid their reward without measure (39:10); beautiful patience, sabr jamil (12:18); and the three patiences the scholars find: in obedience, from sin, and under affliction."]},{h:"In the tradition",p:["The Prophet said patience is light. Imam 'Ali said patience is to faith as the head is to the body. Al-Ghazali's book on patience and gratitude treats them as a pair: patience is holding the self, gratitude is using the gift."]},{h:"Use it this week",l:["The fast is a daily lesson in sabr from the first kind: patience in obedience.","Name which of the three patiences a hard moment needs."]}],kids:["Sabr means patience: holding on and staying strong when something is hard, without complaining."]},Shukr:{sections:[{h:"Root and forms",p:["From sh-k-r; shakara is to thank, and of an animal, to grow fat on little fodder: a shakur beast shows its feed in its body. Gratitude in Arabic is the showing of the benefit. Shakur, the Grateful, is a name of Allah."]},{h:"In the Quran",p:["If you are grateful, I will increase you (14:7); be grateful to Me and to your parents (31:14); few of My servants are grateful (34:13); work, O family of Dawud, in gratitude (34:13), where gratitude is a verb of labour. Tabataba'i defines shukr as acknowledging the blessing from its Giver and using it as He intends."]},{h:"In the tradition",p:["The Prophet stood in prayer until his feet swelled and said: should I not be a grateful servant? Imam al-Sadiq: gratitude for a blessing is to avoid the forbidden. Gratitude has three organs in the scholars' scheme: the heart that knows, the tongue that says, the limbs that use."]},{h:"Use it this week",l:["Gratitude by the limbs: use the healthy body for the walk.","Three gratitudes on Today, said aloud at the table."]}],kids:["Shukr means being thankful, and showing it by using Allah's gifts well, not just saying the word."]},Taqwa:{sections:[{h:"Root and forms",p:["From w-q-y, to guard, protect, shield. Waqa is to protect; wiqayah a shield; ittaqa is to take protection; taqwa the state of being shielded. The old image is a man walking a thorny path, gathering his cloak so it does not catch."]},{h:"In the Quran",p:["The Book is guidance for the muttaqin (2:2); fasting is prescribed so that you may attain taqwa (2:183); the noblest of you is the most God-conscious (49:13); take provision, and the best provision is taqwa (2:197); whoever fears Allah, He makes a way out for him (65:2). Tabataba'i reads it as the guarding of the self from what Allah dislikes, which is why it covers belief, act and feeling."]},{h:"In the tradition",p:["Ubayy ibn Ka'b's answer to 'Umar: have you walked a thorny road? And what did you do? I gathered my clothes and watched my step. That is taqwa. Imam 'Ali's sermon of the muttaqin describes them in sixty traits, from truthful speech to never being satisfied with their own deeds."]},{h:"Use it this week",l:["The fast's purpose, by the verse: not weight but taqwa.","Watch your step in one place: the tongue at dinner."]}],kids:["Taqwa means being careful of Allah: watching your step, like walking on a path with thorns."]},Ihsan:{sections:[{h:"Root and forms",p:["From h-s-n, to be beautiful or good; hasan beautiful, husn beauty, ahsana to do a thing well or to do good to someone, muhsin one who does so. Ihsan is beauty made into action."]},{h:"In the Quran",p:["Allah commands justice and ihsan (16:90); Allah loves the muhsinin (2:195); is the reward of ihsan anything but ihsan (55:60); do good as Allah has done good to you (28:77). The word has two senses in the Book, doing a thing excellently and doing good to others, and the verses use both."]},{h:"In the tradition",p:["In the hadith of Jibril, ihsan is to worship Allah as if you see Him, and if you do not see Him, He sees you. The Prophet said Allah has prescribed ihsan in everything, even the slaughter of an animal. The Thuluth project reads the mindful meal as ihsan at the table."]},{h:"Use it this week",l:["Do one ordinary thing beautifully: set the plate, fold the clothes, write the message.","Pray one prayer as if you see Him."]}],kids:["Ihsan means doing things beautifully and well, as if Allah is watching, because He is."]},Tawakkul:{sections:[{h:"Root and forms",p:["From w-k-l, to entrust; wakil is an agent to whom a matter is entrusted, al-Wakil a name of Allah; tawakkala is to entrust oneself. Reliance in Arabic is a legal image: appointing Allah as your agent."]},{h:"In the Quran",p:["Whoever relies on Allah, He is sufficient for him (65:3); when you have decided, rely on Allah (3:159); Allah loves those who rely (3:159); hasbunallah wa ni'mal wakil (3:173). Tabataba'i reads it as the recognition that causes work only by Allah's leave, so the servant works through the causes and rests in the Causer."]},{h:"In the tradition",p:["The man who asked whether to tie his camel or rely on Allah was told: tie it, and rely. Imam 'Ali: trust in Allah is the strongest fortress. Al-Ghazali's book on tawakkul distinguishes it from idleness at length."]},{h:"Use it this week",l:["Tie the camel: plan the week's plates and training, then stop worrying about the number on the scale.","Say hasbunallah before something you cannot control."]}],kids:["Tawakkul means trusting Allah after you have done your part: tie your camel, then trust."]},Niyyah:{sections:[{h:"Root and forms",p:["From n-w-y, to intend, to aim; nawa also means a date-stone, the seed from which the palm comes, and the scholars have enjoyed the connection: the intention is the seed of the act."]},{h:"In the Quran",p:["The word itself is rare, but its content is in 'sincere religion' (39:2), in 'seeking the face of Allah' (76:9) and in the warning against showing off (107:6). Tabataba'i treats intention as the soul of the act: the same act is worship or waste by its aim."]},{h:"In the tradition",p:["Actions are by intentions, and each person has what he intended: the first hadith of al-Bukhari, and al-Nawawi's first of the Forty. The scholars say it is a third of knowledge. Imam al-Sadiq: the intention of the believer is better than his action."]},{h:"Use it this week",l:["Make the intention for the fast, the plate and the walk before each; the act is then worship.","Teach the children to say why they are doing a thing."]}],kids:["Niyyah means intention: deciding in your heart why you are doing something. Allah rewards the reason as well as the action."]},Barakah:{sections:[{h:"Root and forms",p:["From b-r-k, to kneel, of a camel, and so to settle and stay; birkah is a pool where water collects; barakah is goodness that settles and lasts, and increases beyond what was put in. Tabarak, blessed, is said of Allah."]},{h:"In the Quran",p:["The blessed night of the Quran (44:3); the land We blessed (21:71); had the towns believed, We would have opened blessings from the sky and the earth (7:96); blessed is He in whose hand is the kingdom (67:1). Tabataba'i defines barakah as the settling of divine goodness in a thing so that it yields more than its measure."]},{h:"In the tradition",p:["The Prophet's barakah in food: a small dish fed an army. The blessing in early mornings, in eating together, in measuring, in the basmala. Barakah is the explanation when a small income suffices and a large one does not."]},{h:"Use it this week",l:["Eat together; the Prophet said barakah is in gathering around food.","Begin with bismillah: the seed of barakah in a meal, a journey, a day."]}],kids:["Barakah means a blessing that makes a little go a long way, like one bowl of food that fills everyone when you share it with bismillah."]},Rahmah:{sections:[{h:"Root and forms",p:["From r-h-m; rahim is the womb; rahmah is the tenderness that cares for what is weak; ar-Rahman and ar-Rahim, the two names of the basmala, are both from it, the first for the mercy that covers all creation, the second for the mercy kept for the believers."]},{h:"In the Quran",p:["My mercy encompasses all things (7:156); He has prescribed mercy upon Himself (6:54); We sent you only as a mercy to the worlds (21:107); and He placed between you love and mercy (30:21). Tabataba'i reads rahmah as the giving that answers need, which is why it is the attribute of the Creator toward the created."]},{h:"In the tradition",p:["The Prophet said Allah divided mercy into a hundred parts and sent one to the earth, from which the mare lifts her hoof from her foal. He who does not show mercy is not shown mercy. The Prophet kissed his grandsons and was told by a Bedouin that he had ten sons and had never kissed one; he said: what can I do if Allah has removed mercy from your heart?"]},{h:"Use it this week",l:["Mercy in the house: a gentle word where a sharp one was ready.","The womb root: the mother's care is the model Allah chose for His own."]}],kids:["Rahmah means mercy, the gentle love a mother has for her baby. Allah's mercy is bigger than anything."]},"'Adl":{sections:[{h:"Root and forms",p:["From '-d-l, to be straight, equal, balanced; 'adala is to act justly, and also to make equal; 'adil a just person; mu'adalah an equation. Justice in Arabic is balance: two loads on a camel of the same weight."]},{h:"In the Quran",p:["Allah commands justice (16:90); be just, that is nearer to taqwa (5:8); do not let hatred of a people make you unjust (5:8); be upholders of justice even against yourselves and parents (4:135); and the balance set up with the heavens (55:7). Tabataba'i treats justice as the giving of each its due, which the whole law is designed to secure."]},{h:"In the tradition",p:["Imam 'Ali's letter to Malik makes justice the governor's first duty; his reputation for it cost him support and he kept it. The theologians count justice among Allah's attributes, 'adl, the second of the five principles in the Shia creed."]},{h:"Use it this week",l:["Justice at home: the same rule for both children, the same patience for both.","Against yourself: admit the fault that was yours in the last argument."]}],kids:["'Adl means being fair, giving everyone what is right, even when it is hard for you."]},"Haya'":{sections:[{h:"Root and forms",p:["From h-y-y, to live; hayat is life, and haya' the sense of shame that keeps the self alive to what is seen. Modesty in Arabic is a form of being alive; the shameless person is, by the root, half dead."]},{h:"In the Quran",p:["Musa's wife-to-be comes walking with haya' (28:25); Allah is not shy of the truth (33:53), where the word is used of Him in a sense fitting to Him; and the whole law of modesty in an-Nur rests on it."]},{h:"In the tradition",p:["Haya' is a branch of faith; haya' brings nothing but good; if you have no haya', do as you wish, which is a warning. The Prophet was more modest than a virgin in her chamber. Imam 'Ali: whoever clothes himself in haya', people do not see his faults."]},{h:"Use it this week",l:["Haya' before Allah: the fast no one checks, kept as if checked.","Teach the children that modesty is a kind of courage."]}],kids:["Haya' means modesty: a feeling inside that stops you doing shameful things, even when no one is looking."]},Ikhlas:{sections:[{h:"Root and forms",p:["From kh-l-s, to be pure, unmixed; khalis is pure milk, between blood and dung (16:66); akhlasa is to purify, to devote wholly; mukhlis the sincere, and mukhlas the one Allah has purified. Sincerity in Arabic is purity of motive, nothing mixed in."]},{h:"In the Quran",p:["They were commanded only to worship Allah, sincere to Him in religion (98:5); say, I worship Allah, sincere to Him (39:14); Surah al-Ikhlas is the surah of pure tawhid; and Satan's exception: except Your sincere servants among them (15:40). Tabataba'i reads ikhlas as the purification of the act from every aim but Allah."]},{h:"In the tradition",p:["Whoever is sincere to Allah for forty mornings, the springs of wisdom appear from his heart on his tongue. The scholars warn that sincerity is the hardest of works because the self enters even the wish to be sincere."]},{h:"Use it this week",l:["Do one good deed that no one will ever know about.","The fast is a school of ikhlas: it has no audience."]}],kids:["Ikhlas means doing something only for Allah, not to show off, like a secret good deed."]},Tawbah:{sections:[{h:"Root and forms",p:["From t-w-b, to return; taba is to turn back; tawbah the turning; ta'ib the one who turns; at-Tawwab the Ever-Returning, a name of Allah, since He turns to the servant before the servant turns to Him. The same verb for both: Allah turned to him, so that he would turn."]},{h:"In the Quran",p:["Allah loves those who turn in repentance (2:222); turn to Allah with sincere repentance (66:8); He is the One who accepts repentance from His servants (42:25); and Adam's words, taught, received, accepted (2:37). Tabataba'i notes the two turnings: Allah's first, which makes the servant's possible, and Allah's second, which accepts it."]},{h:"In the tradition",p:["Allah is happier at His servant's repentance than a man who finds his lost camel in the desert. The one who repents from sin is like one with no sin. Imam 'Ali: there is no intercessor more successful than repentance."]},{h:"Use it this week",l:["After a broken fast or a bad day, return the same evening; tawbah is a turn, not a ceremony.","Teach the children Adam's words: we have wronged ourselves."]}],kids:["Tawbah means turning back to Allah after a mistake and saying sorry. Allah is happier when you come back than you can imagine."]},Dhikr:{sections:[{h:"Root and forms",p:["From dh-k-r, to mention, to remember, to remind; dhikr is both the act and the thing recited; dhakara is to remember; the Quran calls itself adh-Dhikr, the Reminder (15:9); tadhkirah is a reminder."]},{h:"In the Quran",p:["Remember Me and I will remember you (2:152); in the remembrance of Allah hearts find rest (13:28); establish prayer for My remembrance (20:14); the remembrance of Allah is greater (29:45); remember Allah much (33:41). Tabataba'i reads dhikr as the heart's attention to Allah, of which the tongue's recitation is the instrument."]},{h:"In the tradition",p:["The Prophet remembered Allah at all times. Subhanallah, alhamdulillah, la ilaha illallah, Allahu akbar are the four that remain; the tasbih of Fatimah after prayer, thirty-four, thirty-three, thirty-three; the morning and evening adhkar."]},{h:"Use it this week",l:["A dhikr for the commute, the queue and the fast's last hour.","Teach the children the tasbih of Fatimah after one prayer a day."]}],kids:["Dhikr means remembering Allah by saying His name and praising Him, with your mouth and your heart."]},"'Ilm":{sections:[{h:"Root and forms",p:["From '-l-m, to know; 'alima is to know, 'alim a scholar, al-'Alim the Knowing, a name of Allah; 'alam a sign and the world, since the world is a sign of its Maker; ta'lim teaching; mu'allim teacher. Knowledge, sign and world share a root."]},{h:"In the Quran",p:["Read (96:1); taught the human what he did not know (96:5); say, my Lord, increase me in knowledge (20:114); are those who know equal to those who do not (39:9); Allah raises those given knowledge by degrees (58:11); only the knowledgeable fear Allah (35:28). Tabataba'i counts knowledge, in its many forms, as the Quran's second most repeated concept."]},{h:"In the tradition",p:["Seeking knowledge is an obligation on every Muslim. The scholars are the heirs of the prophets. Imam 'Ali: knowledge is better than wealth. The Bayan Library's whole method rests on this word."]},{h:"Use it this week",l:["Learn one thing a day and record it in the journal.","Teach one thing a day to someone in the house."]}],kids:["'Ilm means knowledge. The first word of the Quran was 'read', and Allah loves people who learn."]},Amanah:{sections:[{h:"Root and forms",p:["From '-m-n, to be safe, secure; amn is safety, iman faith, amin trustworthy, amanah a trust placed in someone's care. The Prophet was al-Amin before he was a prophet. Faith and trust share a root because faith is being safe with Allah and being safe to deal with."]},{h:"In the Quran",p:["We offered the trust to the heavens, the earth and the mountains, and they declined, and the human took it up (33:72); Allah commands you to return trusts to their owners (4:58); those who keep their trusts and promises (23:8); and the believer described as amin. Tabataba'i reads the great trust as the human capacity for Allah's guardianship, wilayah, which the mountains could not carry."]},{h:"In the tradition",p:["No faith for one who has no amanah. The signs of the hypocrite include betraying a trust. Imam 'Ali returned the trusts held by the Prophet in Makkah before he emigrated, at the Prophet's command."]},{h:"Use it this week",l:["The body is an amanah; the plate and the training are returning it in good order.","Keep the small promise to a child; that is where amanah is learned."]}],kids:["Amanah means a trust: something someone gave you to look after. Your body, your promises and other people's secrets are all amanah."]},Sidq:{sections:[{h:"Root and forms",p:["From s-d-q, to be true; sadaqa is to speak truth, sadiq a friend, siddiq one who is wholly truthful, sadaqah charity, since giving proves the truth of faith. Truth, friendship and charity share a root."]},{h:"In the Quran",p:["O you who believe, fear Allah and be with the truthful (9:119); the truthful men and women (33:35); Yusuf the siddiq (12:46); Ibrahim was a siddiq (19:41); and the Day on which the truthful benefit from their truth (5:119)."]},{h:"In the tradition",p:["Truthfulness leads to righteousness and righteousness leads to the Garden; a man keeps telling the truth until he is written with Allah as a siddiq. Abu Bakr's title. Imam al-Sadiq, the truthful, was given the name for it."]},{h:"Use it this week",l:["Log the weight and the fast truthfully; the record is only useful if it is sidq.","Teach the children that a lie breaks a trust and the truth builds one."]}],kids:["Sidq means truthfulness: always telling the truth, even when a lie would be easier."]},"Husn al-zann":{sections:[{h:"Root and forms",p:["Husn, beauty or goodness, from h-s-n, and zann, supposition, from z-n-n: a good supposition, thinking well. Its opposite, su' al-zann, bad supposition, is the one the Quran forbids."]},{h:"In the Quran",p:["Avoid much suspicion; some suspicion is sin (49:12); why, when you heard it, did the believing men and women not think well of their own people (24:12); and the believer's good opinion of Allah, which the Prophet said Allah honours: I am as My servant thinks of Me."]},{h:"In the tradition",p:["Imam 'Ali: put your brother's affair on the best interpretation until what overturns it comes to you. Seventy excuses for a brother. Good opinion of Allah is itself worship, and at the moment of death is commanded."]},{h:"Use it this week",l:["The next unanswered message: assume the good reason first.","Husn al-zann with Allah about the plateau week: He is arranging something."]}],kids:["Husn al-zann means thinking the best of people: if someone does something that looks bad, imagine the good reason first."]},"Qana'ah":{sections:[{h:"Root and forms",p:["From q-n-', to be content, satisfied with what suffices; qani' is one who is content, and in 22:36 the word is used of the needy who do not beg. Contentment in Arabic is sufficiency chosen."]},{h:"In the Quran",p:["The content and the needy are named as those who are fed from the sacrifice (22:36); do not strain your eyes toward what We have given some of them to enjoy (20:131); the good life promised to the believer who does right (16:97) is read by the Prophet, in a narration, as qana'ah."]},{h:"In the tradition",p:["Richness is not in abundance of goods; richness is the richness of the soul. Qana'ah is a treasure that does not run out. Saadi's third chapter of the Gulistan is on it. The fast is qana'ah practised on the plate."]},{h:"Use it this week",l:["The stop point at seventy to eighty percent full is qana'ah with a number.","Teach the children 'enough' as a happy word."]}],kids:["Qana'ah means being happy with enough, instead of always wanting more."]},Rizq:{sections:[{h:"Root and forms",p:["From r-z-q, to provide; razaqa is to give sustenance; ar-Razzaq the Provider, a name of Allah; rizq is whatever sustains: food, income, a friend, a child, a good night's sleep."]},{h:"In the Quran",p:["There is no creature on the earth but its provision is upon Allah (11:6); Allah is the Provider, the Possessor of strength (51:58); whoever fears Allah, He provides from where he did not expect (65:3); eat of the good things We provided you (2:172). Tabataba'i reads rizq as everything a creature is given to live by, apportioned, so that greed cannot add to it and honesty cannot subtract from it."]},{h:"In the tradition",p:["If you relied on Allah as He deserves, He would provide for you as He provides for the birds, which go out hungry and return full. Seeking the lawful is a duty; provision is apportioned, and what is yours will reach you."]},{h:"Use it this week",l:["Thank Allah for the food on the plate by name: this is rizq.","Teach the children that a friend is rizq too."]}],kids:["Rizq means everything Allah gives you to live: food, a home, a family, a friend. It all comes from Him."]},Fitrah:{sections:[{h:"Root and forms",p:["From f-t-r, to split, to originate; fatara is to create from nothing, Fatir the Originator (35:1); fitrah is the original make, the nature with which a thing is created, and iftar, breaking the fast, is from the same root: the first split of the day's fast."]},{h:"In the Quran",p:["Set your face to the religion as a true believer, the fitrah of Allah on which He created people; there is no changing Allah's creation; that is the upright religion (30:30). Tabataba'i reads the verse as the foundation of the religion's claim: Islam is not foreign to the human but the shape of the human's own nature, and the whole law is what the fitrah would choose if left free."]},{h:"In the tradition",p:["Every child is born on the fitrah, and its parents make it a Jew, a Christian or a Magian. The practices of the fitrah: the trimmed nail, the clipped moustache, the cleaned body. The Thuluth rule treats the child's appetite as fitrah to be trusted, which is why children are never restricted."]},{h:"Use it this week",l:["Trust the children's hunger and fullness; that is their fitrah.","Find the fitrah in yourself: the pull toward what is clean, true and kind, under the habits."]}],kids:["Fitrah means the way Allah made you from the start: with a heart that already knows what is good and true."]},Tadabbur:{sections:[{h:"Root and forms",p:["From d-b-r, the back or the end of a thing; dubur the rear, adbara to turn away, tadabbara to look at the back of a thing, its end and consequence, and so to reflect deeply. Mudabbir, the one who manages, from the same root: he who sees the ends."]},{h:"In the Quran",p:["Do they not reflect on the Quran? Had it been from other than Allah they would have found much contradiction (4:82); do they not reflect on the Quran, or are there locks on hearts (47:24); a blessed Book, so that they may reflect on its verses (38:29). Tabataba'i's method of the Quran explaining the Quran is tadabbur made into a commentary."]},{h:"In the tradition",p:["No good in a recitation without reflection. Imam 'Ali described the people of the Quran as those who read it slowly, stop at a verse of hope and hope, at a verse of fear and fear. The daily reading in OnePlate asks one tadabbur question for this reason."]},{h:"Use it this week",l:["Answer today's tadabbur question in the journal, in one line.","Read one verse slowly, and ask what it would mean to live it."]}],kids:["Tadabbur means thinking deeply about something, like looking behind a thing to see what it really means."]},Istiqamah:{sections:[{h:"Root and forms",p:["From q-w-m, to stand, to be straight; qama is to stand up, mustaqim straight, as in the straight path of al-Fatihah; istaqama is to go straight and stay straight; istiqamah is steadfastness along a line."]},{h:"In the Quran",p:["Those who say 'our Lord is Allah' and then stand firm, the angels descend on them (41:30); stand firm as you were commanded (11:112); be steadfast toward Him (41:6); and the daily prayer for the straight path. Tabataba'i reads istiqamah as the whole of the religion after its first sentence: remaining on what was said."]},{h:"In the tradition",p:["Say 'I believe in Allah' and then be steadfast: the Prophet's whole counsel to a man who asked for a saying he would need no other after. Hud's verse 'stand firm as you were commanded' is the one the Prophet said made his hair grey."]},{h:"Use it this week",l:["Istiqamah is the streak: the plate kept for the tenth day is worth more than the first.","The 365-day reading is a course in it."]}],kids:["Istiqamah means keeping going straight: doing the right thing again tomorrow, and the day after, and not stopping."]},Rida:{sections:[{h:"Root and forms",p:["From r-d-y, to be pleased; radiya is to be content, rida contentment, mardiyyah the one who is pleasing; Allah is pleased with them and they with Him (98:8), the double rida; Imam al-Rida took his name from it."]},{h:"In the Quran",p:["O soul at peace, return to your Lord, pleased and pleasing (89:27\u201328); Allah is pleased with them and they with Him (5:119, 9:100, 98:8); the pleasure of Allah is greater than the Garden (9:72). Tabataba'i reads rida as the state of the soul that has accepted Allah's management without reserve, which is why it is named at the moment of death."]},{h:"In the tradition",p:["He has tasted faith who is content with Allah as Lord, Islam as religion and Muhammad as messenger. Rida with the decree is the highest station, above patience: the patient endures, the content welcomes. Imam al-Husayn at Karbala: O Allah, I am content with Your contentment."]},{h:"Use it this week",l:["After doing your part, meet the result with rida: the number on the scale is a decree for today.","Teach the children to say alhamdulillah for what happened, not only for what they wanted."]}],kids:["Rida means being content with what Allah decides, without being bitter. The patient person bears it; the content person says: this is good."]},"Silat ar-rahim":{sections:[{h:"Root and forms",p:["Silah, from w-s-l, to join, connect; rahim, the womb, from r-h-m, the root of mercy. Joining the womb: keeping connected to those who came from the same womb, the whole web of relatives."]},{h:"In the Quran",p:["Fear Allah through whom you ask of one another, and the wombs (4:1); give the relative his due (17:26); those who join what Allah has commanded to be joined (13:21); and those who cut it are cursed (47:22\u201323). Tabataba'i notes that the verse of an-Nisa places the wombs beside Allah as what is to be feared, so that kinship is a sacred bond, not a social one."]},{h:"In the tradition",p:["Whoever wishes his provision widened and his life lengthened, let him keep the ties of kin. The one who joins ties is not the one who repays visits, but the one who joins when cut off. Imam al-Sadiq: keeping the ties of kin eases the reckoning."]},{h:"Use it this week",l:["Call the relative who has not called you.","Take the children to visit an elder; they are learning the word by watching."]}],kids:["Silat ar-rahim means keeping close to your relatives: visiting, calling and helping your uncles, aunts, cousins and grandparents."]},"'Afw":{sections:[{h:"Root and forms",p:["From '-f-w, to efface, to wipe out, and also to be abundant; 'afa is to pardon, al-'Afuww the Pardoner, a name of Allah; 'afw is the pardon that wipes the trace, and also the surplus, as in 2:219: they ask you what to spend; say, the surplus."]},{h:"In the Quran",p:["Take to pardon, enjoin good (7:199); who restrain anger and pardon people (3:134); let them pardon and overlook; do you not love that Allah forgive you (24:22), revealed to Abu Bakr about a relative who had slandered his daughter; and pardon us, forgive us, have mercy on us (2:286)."]},{h:"In the tradition",p:["Allahumma innaka 'afuwwun tuhibbul 'afwa fa'fu 'anni: O Allah, You are Pardoning, You love pardon, so pardon me, the dua of Laylat al-Qadr. The Prophet at the conquest of Makkah: go, you are free. Imam 'Ali: pardon when you are able is the zakat of power."]},{h:"Use it this week",l:["Pardon the person you have the power to punish.","Spend the surplus: 'afw is also what is left after need, which is the charity line."]}],kids:["'Afw means forgiving someone and wiping the mistake away, like it never happened. Allah loves to forgive."]},Hilm:{sections:[{h:"Root and forms",p:["From h-l-m; halim is forbearing, one who is not moved to anger; al-Halim a name of Allah; hilm is the calm of a strong person who could strike and does not. The same root gives hulm, a dream, and the age of maturity, ihtilam, since forbearance is the mark of a grown mind."]},{h:"In the Quran",p:["Ibrahim was forbearing, tender, penitent (11:75); Isma'il is the forbearing boy (37:101); Allah is Forgiving, Forbearing (2:235). Tabataba'i reads hilm in Ibrahim as the quality that let him argue for Lut's people even after the angels' verdict."]},{h:"In the tradition",p:["Knowledge and hilm were the two qualities the Prophet praised in Ashajj of Abd al-Qays. The strong man is not the wrestler but the one who controls himself in anger. Imam 'Ali: the first reward of the forbearing is that people side with him against the ignorant."]},{h:"Use it this week",l:["When provoked, delay; hilm is in the gap.","Teach the children that the strong one is the one who stays calm."]}],kids:["Hilm means staying calm when someone makes you angry. The strongest person is the one who controls his temper."]},Yaqin:{sections:[{h:"Root and forms",p:["From y-q-n, to be certain; yaqin is certainty, knowledge settled beyond doubt; ayqana to be sure; and in 15:99 death is called al-yaqin, the certain thing: worship your Lord until the certainty comes to you."]},{h:"In the Quran",p:["Those who are certain of the Hereafter (2:4); worship your Lord until certainty comes (15:99); the knowledge of certainty, the eye of certainty, the truth of certainty (102:5\u20137, 56:95); and Ibrahim shown the kingdom so that he might be of those certain (6:75). Tabataba'i reads the three levels of certainty as knowing, seeing and being."]},{h:"In the tradition",p:["Yaqin is the whole of faith. Imam 'Ali: sleep with certainty is better than prayer with doubt. The people of certainty, in the Nahj, are those who see the Hereafter as if it were before them."]},{h:"Use it this week",l:["Act on what you are certain of: the plate works, the walk works; do not wait to feel it.","The three levels: know the plan, see its results, become the person it describes."]}],kids:["Yaqin means being certain, so sure of something that there is no doubt left. We are certain that Allah is real and that He sees us."]},Thuluth:{sections:[{h:"Root and forms",p:["From th-l-th, three; thalatha is three, thuluth a third, thulatha' Tuesday, the third day; muthallath a triangle; and Thuluth is also the name of a calligraphic script, one-third the width of the pen of an older one."]},{h:"In the Quran",p:["The word for a third is in the law of inheritance (4:11\u201312) and in the night prayer: you stand nearly two-thirds of the night, or half, or a third (73:20). The rule of thirds for food is not a verse but a hadith, and 7:31, do not be excessive, is its root."]},{h:"In the tradition",p:["The son of Adam fills no vessel worse than his stomach; a few bites to keep his back straight suffice him; if he must, then a third for food, a third for drink and a third for breath, from al-Tirmidhi, graded hasan sahih. The Qanun al-Thuluth project built a whole table manner on it, and OnePlate's plate rule is its daily form."]},{h:"Use it this week",l:["Divide the plate in thought before eating: a third, a third, a third.","Teach the children the hadith as a rhyme."]}],kids:["Thuluth means one third. The Prophet said: one third of your tummy for food, one third for water, and one third left empty for breathing."]}};var De={"Consistency beats intensity":{sections:[{h:"The argument",p:["'A'ishah was asked which deed the Prophet loved most and said: the one done regularly, even if small; and she said his own deeds were steady, that he would keep a practice once begun. The claim is about the mechanism of change: a deed repeated becomes a habit, a habit becomes a character, and a character becomes a life; a deed done once with great effort becomes a memory. Intensity feels like progress because it is memorable; consistency is progress because it compounds."]},{h:"Where it comes from",p:["Sahih al-Bukhari 6464 and Sahih Muslim 783, from 'A'ishah. The Bayan daily practice is built on it: short, daily, kept. Modern habit research agrees: the frequency of a behaviour predicts its automaticity more than its size."]},{
