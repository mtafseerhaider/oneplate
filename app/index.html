The gentleman is made, not born: by learning, by ritual and by practising benevolence until it is natural. Is it not a pleasure to learn and then to practise what you have learned?","Ren, humaneness: the virtue of treating others as persons; do not impose on others what you do not wish for yourself.","Li, ritual: the forms of respect, in greeting, mourning, eating and speaking, that train the heart from the outside in.","Filial piety: the root of benevolence is learned at home, in how a child treats parents and elders; the family is the school of the state.","Government by example: a ruler who is correct need not command; the people follow like grass bending in the wind.","Rectification of names: let a father be a father, a son a son; disorder begins when words and roles stop matching."]},{h:"Why it still matters",p:["No book has shaped more people's manners. Its claims that character is cultivated, that ritual shapes feeling, that the family is the first school and that leaders teach by example are confirmed daily. Readers from the Islamic world find in Confucius a companion to adab."]},{h:"For our family",l:["Li is adab: the manners of eating, greeting and speaking are not decoration but training. The mindful dinner is a ritual in Confucius's sense.","Filial piety is the Quran's kindness to parents stated as a civilisation's foundation.","Teach by being: the parent who reads is the lesson on reading."]},{h:"Read next",l:["Edward Slingerland's translation with traditional commentary, or D. C. Lau's; read Books I, II, IV and XII first.","Then the Mencius, the other great Confucian text, for the argument that human nature is good."]}],kids:["Confucius was a teacher in China about two and a half thousand years ago. His students wrote down the wise things he said, and the book is called the Analects.","He said a good person is made by learning and practising, like a musician, not born that way. He said good manners are not silly; they train your heart to respect people.","His most famous rule is: do not do to others what you would not want done to you. And he said a family that treats its parents and elders with love is the beginning of a good country."]},Meditations:{sections:[{h:"What it is",p:["The private notebooks of Marcus Aurelius, Roman emperor from 161 to 180, written in Greek during the campaigns on the Danube, never meant for publication. Twelve books of short reflections addressed to himself: reminders of Stoic doctrine, rebukes, gratitude to his teachers in the first book, and repeated attempts to meet the day's duty with a calm mind. The title is a later editor's; his own heading was something like 'to himself'."]},{h:"The main ideas",l:["Distinguish what is in your power, your judgements and choices, from what is not, and spend yourself on the first.","The present is all you have: the past is gone and the future not yet; a life is a succession of present moments met well or badly.","Do your duty as a part of the whole: you were made for cooperation, like hands and feet; what harms the hive harms the bee.","Expect difficult people, and meet them with patience, since they act from ignorance of the good, and you share a nature with them.","Remember death and the smallness of fame: those who praised you will die too; what remains is whether you acted justly.","Take the view from above: see the city, the empire, the earth from a height, and the troubles of the day shrink to their size."]},{h:"Why it still matters",p:["A ruler of the known world writing at night about how to be patient with a rude official, how to get out of bed, and how to accept what he could not change is a rare document of a person working on himself. It has been read for that honesty for eighteen centuries. Its practice, the morning rehearsal of difficulties and the evening review, is the Islamic muhasabah in Roman dress."]},{h:"For our family",l:["Marcus's morning sentence, today I will meet people who are meddling, ungrateful and rude, is a parent's preparation for a long day.","The view from above is a cure for the family argument: how big is this from the roof?","Control what you can: the plate, the walk, the bedtime. Outcomes belong to Allah; in Marcus's language, to nature."]},{h:"Read next",l:["Gregory Hays's translation (Modern Library) reads best; read Books II, IV and V, and the first book for his gratitude to his teachers.","Epictetus, the Enchiridion, the handbook Marcus himself studied."]}],kids:["Marcus Aurelius was the emperor of Rome, the most powerful man in the world. At night, in his army tent, he wrote notes to himself about how to be a good person.","He wrote things like: when I wake up, I will meet people who are rude today, and I will stay calm because getting angry does not help. And: I cannot control what happens, only what I do.","He never meant anyone to read it, but the notebook survived, and people still read it to learn how to stay calm and do their job well."]},Confessions:{sections:[{h:"What it is",p:["Augustine, bishop of Hippo in North Africa, wrote the Confessions around 400 as a prayer addressed to God in thirteen books: nine of autobiography, from infancy through his schooling at Carthage, his years as a Manichee, his teaching of rhetoric in Rome and Milan, his mother Monica's persistence, the conversion in the garden, and her death; a tenth on memory and the self; and three on time, creation and the opening of Genesis. It is the first great autobiography in any language, and its question is the one in its first page: our heart is restless until it rests in You."]},{h:"The main ideas",l:["The restless heart: desire is unbounded, and every finite object fails it; the restlessness is a sign of what the heart was made for.","The stolen pears: he steals fruit he does not want, with friends, for the pleasure of the theft, and discovers that evil is often done for no reason but the company and the thrill.","Habit as a chain: he describes his inability to leave his old life as links of a chain forged by repeated choice, and his will as divided against itself.","Memory as a vast palace in which the self and God are sought; the tenth book is the first philosophy of memory.","Time: what is time? If no one asks me, I know; if I try to explain, I do not. Time is a distension of the mind between memory, attention and expectation.","A mother's prayer: Monica's decades of patient prayer for her son are the book's steady background."]},{h:"Why it still matters",p:["The Confessions invented the inner life as a subject. Its analysis of divided will and chained habit anticipates everything written on addiction; its treatment of memory and time started philosophy on both. A Muslim reader finds in it a neighbour's account of tawbah, the turning, with the same honesty al-Ghazali would show six centuries later."]},{h:"For our family",l:["The pears: children's wrongdoing is often for the company, not the thing. Ask who was there.","The chain of habit is forged by small repeated choices and broken the same way.","Monica is the mother who did not stop praying. Her son was forty-two when he changed."]},{h:"Read next",l:["Henry Chadwick's or Sarah Ruden's translation; read Books I, II, VIII and X.","Al-Ghazali's Deliverance from Error, the Islamic parallel, is a short companion."]}],kids:["Augustine lived in North Africa about sixteen hundred years ago. When he was young he did many wrong things, even stealing pears he did not want, just because his friends were doing it.","His mother Monica prayed for him for years and years. Finally, when he was grown up, he changed, and he wrote a whole book to God about his life, saying sorry and thank you.","He said something people still repeat: our hearts are restless until they rest in God. That is why nothing we buy makes us happy for long."]},"Don Quixote":{sections:[{h:"What it is",p:["Miguel de Cervantes published the first part in 1605 and the second in 1615, a year before his death, after a life as a soldier wounded at Lepanto, a captive in Algiers for five years, and a tax collector twice imprisoned. A poor gentleman of La Mancha reads so many romances of chivalry that he decides to become a knight errant: he names himself Don Quixote, his horse Rocinante, a farm girl his lady Dulcinea, and takes a neighbour, Sancho Panza, as his squire. He charges windmills as giants, frees prisoners who stone him, and is beaten by the world at every turn, while Sancho, who came for an island to govern, slowly begins to see as his master sees.","The second part is stranger: the characters have read the first part, and the world now plays along with Don Quixote to mock him, which is crueller than the windmills. He regains his senses at the end, and dies, and Sancho begs him to stay mad."]},{h:"The main ideas",l:["Books make people: Don Quixote is a man made entirely of reading. The novel is a warning and a celebration at once.","Two ways of seeing: the knight sees what things should be, the squire sees what they are, and the book never fully decides between them.","Dignity in failure: he is beaten in every chapter and never stops being a gentleman; the humour is tender, not contemptuous.","The friendship of opposites: Sancho's proverbs and Don Quixote's speeches educate each other until each has some of the other's eyes.","Reality answers back: the second part, with the duke and duchess staging adventures for him, shows that the world's mockery is its own madness."]},{h:"Why it still matters",p:["It is the first modern novel and, in many surveys, the greatest. It taught fiction to hold two truths at once and to love a fool without lying about him. The phrase 'tilting at windmills' is the smallest part of what it gave the language."]},{h:"For our family",l:["Sancho's question to his master, what did you expect, is a good one to ask any plan: the plate, the fast, the training week. Dreams need a squire.","Don Quixote's courtesy to everyone who beats him is a lesson in losing well.","Read it aloud with the children for the windmills and the inn; read it alone for the ending."]},{h:"Read next",l:["Edith Grossman's translation (2003). Read Part One's first twenty chapters with the children; finish Part Two yourself.","Cervantes's Exemplary Novels, shorter, for more of his voice."]}],kids:["Don Quixote was a man in Spain who read so many books about knights that he decided to become one. He put on old armour, got on his skinny horse, and rode out to have adventures.","He saw windmills and thought they were giants, and charged at them with his spear. He got knocked off his horse. His friend Sancho, a farmer on a donkey, kept saying: sir, those are windmills.","People laughed at him, but he never stopped being kind and brave, even when he lost. The book is funny and also a little sad, and it is one of the most famous stories ever written."]},"The Divan of Hafez":{sections:[{h:"What it is",p:["Shams al-Din Muhammad Hafez of Shiraz (c. 1315\u20131390) wrote some five hundred ghazals, lyric poems of seven to fifteen couplets each sharing one rhyme, collected after his death into his Divan. He took the name Hafez because he had memorised the Quran, and taught it. The poems speak of love, wine, the beloved's face and hair, the rose and the nightingale, the tavern and the hypocrite preacher, in a language that is at once the vocabulary of worldly love and the code of the mystics, and the poems refuse to settle on one meaning. The Divan is opened at random in Iran to take an omen, and his tomb in Shiraz is visited like a shrine."]},{h:"The main ideas",l:["The beloved and the Beloved: every line about the beloved's face can be read of a person or of God, and Hafez keeps both alive on purpose.","Wine as ecstasy: the tavern is the place where the self is lost; the wine is love, the cupbearer the guide. The images are from the Quran's own promise of a drink in the Garden.","Against hypocrisy: his constant target is the preacher who forbids in public what he does in private; the rend, the honest rogue, is nearer God than the pious fraud.","Fate and joy: accept what the heavens send, seize the present hour, and keep faith with love; the ghazals move between resignation and delight.","The craft: each couplet is complete, each ghazal a necklace of them; the music of the Persian is why they are sung."]},{h:"Why it still matters",p:["Hafez is the most loved poet in the Persian language, and Goethe wrote his West-\xF6stlicher Divan in his honour. He is read for consolation, for beauty, and for the permission he gives to doubt the pious and love God anyway. His lines are quoted in Urdu as freely as in Persian."]},{h:"For our family",l:["His war on hypocrisy is a mirror for parents: children see the gap between what we preach and what we do before they see anything else.","Read him for the beauty of Persian, which Urdu grew from; the sound teaches before the sense.","Open the Divan for a line of the day, as the Poem of the day does, and let the family argue about what it means."]},{h:"Read next",l:["Dick Davis, Faces of Love: Hafez and the Poets of Shiraz (Penguin), the best English Hafez, with Jahan Malek Khatun and Obayd-e Zakani.","Peter Avery's complete translation for the whole Divan."]}],kids:["Hafez was a poet from the city of Shiraz, about seven hundred years ago. He knew the whole Quran by heart, which is why he is called Hafez, the one who memorised it.","He wrote short poems that sound like songs, about love and roses and nightingales. The grown-ups argue about whether he is writing about a person or about Allah, and he liked it that way.","He did not like people who pretend to be good but are not. He said it is better to be honest about your mistakes than to show off. People in Iran open his book to find a line for the day."]},"The Shahnameh":{sections:[{h:"What it is",p:["Abu al-Qasim Ferdowsi of Tus spent about thirty years on the Shahnameh, the Book of Kings, finishing it around 1010: some fifty thousand couplets telling the history of Iran from the creation of the world to the Arab conquest, in three movements, mythical, heroic and historical. The tyrant Zahhak with snakes on his shoulders and the blacksmith Kaveh who raised his apron as a banner; Rostam, the great champion, and his seven labours; Rostam's unknowing fight with his own son Sohrab; Siyavash the innocent prince; the long wars with Turan; and the Sasanian kings down to Yazdegerd. Ferdowsi wrote it to preserve the Persian language and memory, and he largely succeeded: modern Persian is readable back to his lines."]},{h:"The main ideas",l:["Fathers and sons: the tragedy of Rostam and Sohrab, who meet in battle without knowing each other, is the book's heart, and its lesson about pride, secrecy and the cost of not asking a name.","Justice and tyranny: Zahhak's reign of snakes fed on the brains of the young is the image of a state that devours its own; Kaveh's uprising is the image of the just rebellion.","The hero's limits: Rostam is strong, loyal and mortal, and his greatest wounds are self-inflicted.","Wisdom over strength: the book's refrain is that knowledge is the crown and reason the better sword; kings fall when they stop listening.","Memory as a duty: a people that forgets its stories becomes someone else's."]},{h:"Why it still matters",p:["The Shahnameh is to Persian what Homer is to Greek and more, since it is still read and recited by ordinary people. Its stories are the common property of Iran, Afghanistan, Tajikistan and the Persian-reading parts of the subcontinent, and its lesson about fathers and sons is told to every boy who thinks he is stronger than his father."]},{h:"For our family",l:["Rostam and Sohrab is the story to tell when a father and a son are not talking. Ask the name.","Kaveh the blacksmith is the ordinary man who said no to the tyrant: a lesson about courage without rank.","Ferdowsi worked thirty years on one book for his people. Long work for others is itself a story."]},{h:"Read next",l:["Dick Davis, Shahnameh: The Persian Book of Kings (Penguin), a prose and verse abridgement that keeps the great stories.","Davis's standalone Rostam: Tales of Love and War for the hero's cycle."]}],kids:["Ferdowsi was a poet who spent thirty years writing the story of all the kings and heroes of Persia, from the beginning of the world. It is one of the longest poems ever written.","The bravest hero is Rostam, who fights monsters and dragons. But the saddest story is about Rostam fighting a young champion without knowing it is his own son, Sohrab.","There is also a wicked king called Zahhak with snakes growing from his shoulders, and a brave blacksmith called Kaveh who stood up to him with his leather apron on a stick as a flag."]},"Kulliyat-e-Iqbal":{sections:[{h:"What it is",p:["The collected poetry of Muhammad Iqbal (1877\u20131938), in Urdu and Persian: Bang-e-Dara (1924), with the early nature poems, the Shikwa and Jawab-e-Shikwa; Bal-e-Jibril (1935), his finest Urdu; Zarb-e-Kalim (1936); Armaghan-e-Hijaz; and in Persian, Asrar-e-Khudi (1915) and Rumuz-e-Bekhudi, the Payam-e-Mashriq written in answer to Goethe, the Zabur-e-Ajam, and the Javid Nama, his journey through the heavens in the company of Rumi. Iqbal trained in philosophy at Cambridge and Munich, practised law in Lahore, and gave the 1930 Allahabad address that imagined a Muslim state in the north-west of India."]},{h:"The main ideas",l:["Khudi, selfhood: the self is not an illusion to be dissolved but a reality to be strengthened, by love, by desire for the great, by courage and by faith, until Allah Himself asks the servant what he wishes.","Against passivity: Iqbal's quarrel with the decadent Sufism and the resigned religion of his time; the believer is an eagle, not a vulture, and the shaheen does not build a nest.","The Shikwa and its answer: the complaint to God that Muslims have been abandoned, and God's answer that they abandoned their own faith's energy.","Love over intellect: 'ishq, the burning devotion of Rumi, completes the reason of the philosophers.","The Muslim community as a nation of faith, not of land or race; and the Quran as a living book, to be read as if it were being revealed to you."]},{h:"Why it still matters",p:["Iqbal is the national poet of Pakistan and the most quoted Urdu poet of the twentieth century; his lines are on classroom walls and in political speeches. His doctrine of khudi is a philosophy of self-respect and effort addressed to a people he thought had gone to sleep, and it still reads as a wake-up call."]},{h:"For our family",l:["Khudi ko kar buland itna: raise yourself so high that before every decree God asks what you want. The verse to teach the children before any other.","Iqbal's eagle, who does not build a nest, is the fast and the training: do not settle into comfort.","Read the Quran as if it were revealed to you, he said; the daily reading is that practice."]},{h:"Read next",l:["Bal-e-Jibril, the whole collection, in Urdu with a translation beside it; Khushwant Singh's Shikwa and Jawab-e-Shikwa; Mustansir Mir's Tulip in the Desert for selected poems with commentary.","The Reconstruction of Religious Thought in Islam, his lectures, for the philosophy behind the verse."]}],kids:["Allama Iqbal was a poet from Sialkot who dreamed of Pakistan before it existed. He wrote in Urdu and Persian, and his poems are sung at school.","His big idea is called khudi: believe in yourself, work hard, and have courage, and Allah will help you. He said a believer should be like an eagle that flies high and does not sit in a lazy nest.","His most famous line says: make yourself so great that before Allah writes your fate, He asks you: tell Me, what do you want?"]},"Al-Sahifa al-Sajjadiyya":{sections:[{h:"What it is",p:["A collection of fifty-four supplications attributed to Imam 'Ali ibn al-Husayn, Zayn al-'Abidin, al-Sajjad (d. 713), the great-grandson of the Prophet who survived Karbala as a young man and spent the rest of his life in worship and teaching in Madinah. The duas are addressed to Allah on every occasion of a life: praise, blessings on the Prophet and his household, for parents, for children, for neighbours and friends, for the people of the frontiers, in illness, when wronged, on the morning and evening, on hearing thunder, in Ramadan and on its ending, at the end of a day, for noble character, the Makarim al-Akhlaq. The Bayan study records the attribution as received through its chains and the text as transmitted from the ninth century; the standard printed edition is the one the Shia tradition has used for centuries."]},{h:"The main ideas",l:["Prayer as moral education: the dua for noble character is a complete programme of virtue phrased as requests, so that asking for a trait is the first step to having it.","Gratitude as the root: supplication after supplication begins by counting blessings before asking.","Rights of others: the duas for parents, children and neighbours are practical lists of what each is owed, in the form of asking for the strength to pay.","Honesty about weakness: the Imam confesses fear, laziness and the pull of the self with a frankness that makes the book usable by anyone.","Beauty of language: the Sahifa is also one of the monuments of Arabic prose, which is why it has been called the Psalms of the House of the Prophet."]},{h:"Why it still matters",p:["Where other books tell you what to be, the Sahifa gives you the words to ask for it. Its dua for parents and its dua for children are read at the table in homes across the Muslim world, and its dua for noble character is the single best short description of the person OnePlate is trying to help you become."]},{h:"For our family",l:["Read the dua for parents (Supplication 24) with the children on Friday; read the dua for children (25) yourself.","The Makarim al-Akhlaq (20) is the family's character curriculum in one prayer; take one line a week.","The morning and evening dua (6) is the day's frame: a prayer at each end of the fast."]},{h:"Read next",l:["William Chittick's translation, The Psalms of Islam (Muhammadi Trust), with Arabic facing.","Then the Treatise on Rights, attributed to the same Imam, the prose companion."]}],kids:["Imam Zayn al-'Abidin was the great-grandson of the Prophet \uFDFA. He prayed so much that he was called the ornament of the worshippers.","This book is a collection of his duas, beautiful ways of talking to Allah: when you wake up, when you are sick, for your mother and father, for your friends, for your neighbours, and to have a good character.","One of the duas asks Allah: help me to be kind to my parents and to speak softly to them. We can read a line of it together before dinner."]},"Nahj al-Balagha":{sections:[{h:"What it is",p:["Al-Sharif al-Radi (d. 1015), a scholar and poet of Baghdad, compiled from earlier sources what he judged the most eloquent sermons, letters and sayings of Imam 'Ali ibn Abi Talib (d. 661), the Prophet's cousin and son-in-law and the fourth caliph. The Way of Eloquence has three parts: some two hundred and forty sermons, including the sermon on creation, the Shiqshiqiyya on the caliphate, and the sermon of the God-fearing describing the muttaqin; seventy-nine letters, including the long letter of instruction to Malik al-Ashtar as governor of Egypt, and the letter of advice to his son al-Hasan; and about four hundred and eighty short sayings. Al-Radi chose for eloquence, so the chains of transmission are not given in the book itself; later scholars have traced most pieces to earlier works, and the Bayan study labels each as graded or received."]},{h:"The main ideas",l:["Piety described in action: the sermon of the muttaqin lists them as people whose speech is truthful, whose dress is modest, whose walk is humble, and who are never satisfied with their own good deeds.","Justice as the measure of rule: the letter to Malik orders the governor to see the people as either brothers in faith or equals in creation, to prefer the common people to the elite, and to make mercy his garment.","The world as a passage: sermon after sermon describes the world as a bridge and a market where provisions are gathered for the journey, and warns against attachment without despising work.","Knowledge and intellect: knowledge guards you while you guard wealth; the tongue of the wise is behind his heart.","Self-reckoning: take account of yourselves before you are taken to account; weigh yourselves before you are weighed."]},{h:"Why it still matters",p:["Nahj al-Balagha is the second book of Arabic after the Quran in the Shia tradition and admired across the Sunni world for its prose. The letter to Malik al-Ashtar is read as a charter of just government in Muslim and non-Muslim universities, and its sayings supply a proverb for every situation of a working life."]},{h:"For our family",l:["The letter to al-Hasan (Letter 31) is a father's advice to a son and the Learn tab's Teaching cards draw on it; read it yourself in one sitting.","The sayings are built for the dinner table: one a night, and ask the children what it means.","The letter to Malik is the manual for anyone with authority over others, including a father over a household: mercy as the garment."]},{h:"Read next",l:["The translation by Sayed Ali Reza (Peak of Eloquence) is widely available; Tahera Qutbuddin's recent edition and translation of the sayings is the scholarly standard.","Read first: Sermon 193 (the God-fearing), Letter 31, Letter 53, and the sayings from 1 to 50."]}],kids:["Imam 'Ali was the Prophet's cousin, raised in his house, and later the leader of all the Muslims. He was famous for speaking so well that people wrote down what he said.","This book has his speeches, his letters, and hundreds of short wise sayings, like: knowledge is better than money, because knowledge looks after you, but you have to look after money.","In a letter to a governor he said: every person you meet is either your brother in religion or your equal as a human, so be kind to all of them."]},"The Prophet of Islam":{sections:[{h:"What it is",p:["The sirah, the biography of the Prophet Muhammad \uFDFA, as it was first written down: Ibn Ishaq of Madinah (d. c. 767) gathered the reports of the Prophet's life into a book that survives mainly in the edition of Ibn Hisham (d. 833), who abridged and annotated it. Later works, al-Waqidi's Maghazi on the campaigns, Ibn Sa'd's Tabaqat on the Companions, and the sirah sections of al-Tabari, drew on the same material. The arc is fixed: Makkah, the orphan, the trader, the marriage to Khadijah, the cave of Hira and the first revelation, the persecution, the emigration to Abyssinia, the year of sorrow, the Isra, the pledges of 'Aqabah; Madinah, the constitution, Badr, Uhud, the Trench, Hudaybiyyah, the letters to kings, the conquest of Makkah, Hunayn, Tabuk, the farewell pilgrimage, the death.","The Bayan Library's note applies: the sirah is a narrative source, graded report by report; the events are certain in outline and debated in detail."]},{h:"The main ideas",l:["Character before mission: forty years as al-Amin, the trustworthy, before a word of revelation. The Makkans believed his honesty even when they rejected his message.","Patience in Makkah: thirteen years of calling with no state, no army and no permission to fight, in which the community was formed by prayer, recitation and endurance.","The constitution of Madinah: a written agreement between the Muslims, the tribes of Madinah and the Jewish clans, the first charter of a plural city.","Mercy in victory: the conquest of Makkah without reprisals, and the words to the people who had persecuted him for twenty years: go, you are free.","The household: a man who mended his own sandals, milked his own goats, served his family, played with his grandchildren, and said the best of you is the best to his family.","The farewell sermon: no Arab has superiority over a non-Arab except by piety; your blood and property are sacred to one another; I have left among you what will keep you from going astray."]},{h:"Why it still matters",p:["The sirah is the context of the Quran and the model the Quran names: in the Messenger of Allah you have a beautiful example. Every virtue OnePlate asks for, moderation in eating, kindness at home, consultation, gentleness, patience, is first a scene from his life."]},{h:"For our family",l:["Read the Makkan years to the children first: the orphan, the shepherd, the cave, the persecution. The example of patience comes before the example of power.","His eating: one-third rule, sitting to eat, never criticising food, eating with his family. The Thuluth rule is his table.","His home: a father who stood for his daughter Fatimah when she entered, and seated her in his place."]},{h:"Read next",l:["Martin Lings, Muhammad: His Life Based on the Earliest Sources, the most readable sirah in English, drawn from Ibn Ishaq and Ibn Sa'd.","Alfred Guillaume's translation of Ibn Ishaq for the source itself; Tariq Ramadan's In the Footsteps of the Prophet for the lessons."]}],kids:["The Prophet Muhammad \uFDFA was born in Makkah in the Year of the Elephant. His father died before he was born and his mother when he was six, so his grandfather and then his uncle looked after him.","Everyone in Makkah called him al-Amin, the honest one, because he never lied. When he was forty, the angel Jibril came to him in a cave and said: Read! That was the start of the Quran.","For years people were cruel to him, but he was patient and kind. When he finally returned to Makkah as the leader, he forgave everyone. At home he helped with the housework and played with his grandchildren."]},Elements:{sections:[{h:"What it is",p:["Euclid of Alexandria, around 300 BCE, arranged the geometry and number theory of the Greeks into thirteen books built from definitions, five postulates and five common notions, from which every proposition is proved in order: the construction of an equilateral triangle in the first proposition; the theorem of Pythagoras at the end of Book I; the theory of proportion in Book V; similar figures; number theory, including the infinitude of primes and the Euclidean algorithm, in Books VII to IX; incommensurables in Book X; and the five regular solids in Book XIII. It was translated into Arabic under al-Ma'mun by al-Hajjaj and again by Ishaq ibn Hunayn, commented on by Thabit ibn Qurra, Ibn al-Haytham and Nasir al-Din al-Tusi, and reached Europe through those Arabic versions. It was the textbook of geometry for twenty-two centuries."]},{h:"The main ideas",l:["Proof: a claim is accepted because it follows by steps from what was already accepted, down to a few starting points everyone grants. Nothing is taken on authority.","Axioms: five postulates about lines and circles, and five common notions such as 'things equal to the same thing are equal to each other', carry the whole structure.","Order: each proposition uses only what came before, so the book is a single argument, and a student who understands Book I has learned how to think, not just how to measure.","The parallel postulate: the fifth, which looked less obvious than the others, was questioned by Thabit, Ibn al-Haytham, Omar Khayyam and al-Tusi, and that questioning led, two thousand years later, to the non-Euclidean geometries of Einstein's universe.","Beauty: the proof that there are infinitely many primes, in Book IX, is still taught as the model of an elegant argument."]},{h:"Why it still matters",p:["The Elements taught the world what a proof is. Lincoln studied it to learn to argue; Newton wrote the Principia in its form; the Islamic mathematicians who questioned its fifth postulate opened the door to modern geometry. Learning geometry from Euclid is still the best way to learn that truth can be built."]},{h:"For our family",l:["Do Proposition 1 with a compass and a ruler at the table: the equilateral triangle. A child who draws it has done a proof.","The habit of asking 'what does this follow from' is Euclid's gift to arguments at home.","The Pythagorean theorem is the fence post, the ladder and the diagonal of the room: show it in the house."]},{h:"Read next",l:["Book I in Thomas Heath's translation, or the beautiful Oliver Byrne colour edition (1847) reprinted by Taschen, which proves with diagrams.","Then Book IX, Proposition 20: the primes are infinite."]}],kids:["Euclid was a mathematics teacher in Egypt more than two thousand years ago. He wrote a book of geometry that people used in school for over two thousand years.","He started with a few simple facts everyone agrees on, like: you can draw a straight line between any two points. Then he proved everything else step by step from those.","You can do his very first proof with a ruler and a compass: draw a triangle with three equal sides. When you do it, you are doing exactly what students did two thousand years ago."]},"The Compendious Book on Calculation":{sections:[{h:"What it is",p:["Muhammad ibn Musa al-Khwarizmi wrote al-Kitab al-Mukhtasar fi Hisab al-Jabr wa al-Muqabala in Baghdad around 820, at the House of Wisdom under the caliph al-Ma'mun. The title gave us the word algebra, al-jabr, the restoring of a subtracted term to the other side of an equation, and his name gave us algorithm, through the Latin of his other book on calculation with Hindu numerals. The book shows how to reduce any linear or quadratic problem to one of six standard forms, solve each by a rule, and prove the rule by a geometric figure; then it applies the method to trade, surveying and the division of inheritances under Islamic law, which take up more than half the book."]},{h:"The main ideas",l:["Reduction: every problem, however it is stated, can be moved into a standard form by two operations, al-jabr, restoring, and al-muqabala, balancing. The method is the discovery.","Rules with proofs: each rule for solving a quadratic is justified by completing a square, drawn as an actual square.","Mathematics for use: the examples are prices, measures and inheritance shares; the book exists because people needed to divide estates correctly.","No symbols: everything is in words and numbers; the letter x came centuries later. The ideas came first.","Hindu numerals: his other treatise introduced the decimal digits and zero to the Islamic world and thence to Europe, where they were called Arabic numerals."]},{h:"Why it still matters",p:["Every equation solved in every school is al-Khwarizmi's method. His insistence on stating a general procedure that works on any instance is what the word algorithm now means, and the computers that run on algorithms carry his name in a Latin spelling."]},{h:"For our family",l:["The inheritance problems are the Quran's shares turned into arithmetic; the book is a reminder that the law asked for mathematics.","Teach a child balancing with coins on two sides of a scale: what you do to one side you do to the other. That is al-muqabala.","The word algorithm on every device comes from a man in Baghdad who wanted to divide estates fairly."]},{h:"Read next",l:["Frederic Rosen's 1831 translation is free online; Roshdi Rashed's edition is the scholarly text.","Jim Al-Khalili, The House of Wisdom, for the Baghdad in which it was written."]}],kids:["Al-Khwarizmi was a mathematician in Baghdad twelve hundred years ago. He wrote a book about how to solve puzzles with unknown numbers, like: a number plus ten equals twenty-two, what is the number?","The name of his book, al-jabr, became the word algebra. And his own name became the word algorithm, which is what computers follow step by step.","He also taught people the numbers we use today, 1 2 3 4 5 6 7 8 9 and 0, which came from India. Before that, people used letters, and sums were very hard."]},"On the Origin of Species":{sections:[{h:"What it is",p:["Charles Darwin published the Origin in 1859, twenty years after the voyage of the Beagle, when a letter from Alfred Russel Wallace showed that another naturalist had reached the same idea. It is one long argument, as he called it: variation exists in every population; more are born than can survive; those whose variations fit their conditions leave more offspring; over long time this natural selection shapes populations into new forms, and the diversity of life descends from common ancestors. He draws on pigeon breeding, the geographical distribution of species, the fossil record, embryology, and the oddities of island life, and he faces the difficulties, the gaps in the record and the eye, in chapters of their own."]},{h:"The main ideas",l:["Variation and inheritance: individuals differ, and differences are passed on; he did not know how, since Mendel's work was unknown to him.","The struggle for existence: Malthus applied to all life; far more seeds, eggs and young than can live.","Natural selection: the differences that help survive and breed accumulate; the breeder's choice done by circumstances over ages.","Common descent: the tree of life, in which similar forms are relatives, not separate designs.","Deep time: the earth is old enough for small changes to add up to the differences we see.","Humility of method: he states the objections to his own theory more clearly than his opponents did."]},{h:"Why it still matters",p:["It is the founding book of modern biology and the reason medicine understands antibiotic resistance, vaccines and genetics. Its account of how small advantages compound over time is also the clearest statement of why small daily habits matter. Muslim scholars have read it variously; Tabataba'i discusses the origins of species in al-Mizan and holds that the Quran teaches the special creation of the human being while leaving the mechanisms of natural history to inquiry."]},{h:"For our family",l:["Small differences, repeated, become large: the Origin's logic is the logic of a thumb of oil a day.","Read Darwin's chapter on the difficulties of the theory with older children: here is how an honest person argues against himself.","The Quran's call to look at the camel and the bee is a call to natural history; the book is one answer to that call."]},{h:"Read next",l:["The first edition (1859), which is the clearest; read the Introduction, Chapters III and IV, and the last chapter.","Then Darwin's Voyage of the Beagle, the travel book that started it."]}],kids:["Charles Darwin sailed around the world on a ship called the Beagle for five years, collecting birds, beetles, fossils and plants, and writing down everything.","He noticed that animals of one kind are all a little different, and that the ones whose differences help them survive have more babies. Over a very long time, these small differences add up and animals change.","His book explains how the many kinds of living things are related to each other, like a giant family tree. Scientists still use his ideas every day, for example to understand how germs change."]},"The Brothers Karamazov":{sections:[{h:"What it is",p:["Dostoevsky's last novel, finished in 1880, a few months before his death. Fyodor Karamazov, a buffoon and sensualist, has three sons: Dmitri, a soldier ruled by passion, who competes with his father for the same woman and the same money; Ivan, an intellectual who cannot accept a world in which children suffer; and Alyosha, a novice in the monastery under the elder Zosima. There is also Smerdyakov, the servant who may be a fourth son. The father is murdered; Dmitri is tried and convicted; the truth is otherwise. Inside the story Ivan tells Alyosha his poem of the Grand Inquisitor, in which Christ returns to Seville and is arrested by the Church, and Zosima's life and teachings are given in full."]},{h:"The main ideas",l:["If God does not exist, everything is permitted: Ivan's thesis, which the novel tests to destruction in Smerdyakov's act.","The problem of suffering: Ivan's catalogue of tortured children and his returning of the ticket is the strongest case against faith ever put by a believer.","The Grand Inquisitor: people will trade freedom for bread, miracle and authority; the question is whether freedom is a gift or a burden.","Active love: Zosima's teaching that love in action is a harsh and dreadful thing compared with love in dreams, and that each is responsible for all.","Guilt and brotherhood: all three brothers wanted the father dead in some way; the novel refuses to let any of them be innocent or any be only guilty.","The children: the subplot of Ilyusha and the boys, and Alyosha's speech at the stone, is the novel's answer: memory of one good moment can save a life."]},{h:"Why it still matters",p:["Many readers consider it the greatest novel written. It takes faith and doubt with equal seriousness and lets each speak at full strength, which almost no book does. Its teaching on active love and on the responsibility of each for all reads, to a Muslim, like a commentary on 5:32."]},{h:"For our family",l:["Zosima's line, love in action is harsh and dreadful compared with love in dreams, is the cure for sentimental parenting.","Alyosha's speech at the stone: give a child one memory of being loved and brave, and it will be a lantern for life. That is the family circle's purpose.","Read it when you are ready for it; it is long and it changes people."]},{h:"Read next",l:["Richard Pevear and Larissa Volokhonsky's translation; begin with Book V (Pro and Contra) if you want the argument first, or Book I if you want the family.","Crime and Punishment, shorter, before it."]}],kids:["This is a long Russian story about a father and his three sons, who are all very different: one is hot-tempered, one is clever and full of questions, and one, Alyosha, is gentle and wants to be a monk.","Something terrible happens in the family, and the story asks hard questions: why do bad things happen, what is freedom, and how should we love each other?","At the very end, Alyosha tells a group of boys: remember this one day when we were all good and kind together, and that memory will keep you safe your whole life."]},"The Thousand and One Nights":{sections:[{h:"What it is",p:["A frame tale and the stories told inside it. King Shahriyar, betrayed by his wife, marries a new bride each night and has her killed in the morning, until Shahrazad, the vizier's daughter, marries him and tells a story every night that she leaves unfinished at dawn, for a thousand and one nights, until he is cured. The stories come from Persian, Indian, Arabic, Egyptian and Syrian sources over six centuries, the earliest layer a Persian collection called the Thousand Tales translated into Arabic in Baghdad by the ninth century. The merchant and the jinni, the fisherman and the jinni, the porter and the three ladies, the hunchback, Sindbad's seven voyages. Aladdin and Ali Baba were added by the French translator Antoine Galland in the eighteenth century from a Syrian storyteller, and are not in the older Arabic manuscripts."]},{h:"The main ideas",l:["Stories save lives: Shahrazad's art turns a murderer back into a king. The book is the defence of storytelling.","Nesting: tales inside tales inside tales, each one earning the next, a structure that taught the world's novelists.","The city: Baghdad, Cairo and Basra of merchants, caliphs in disguise, barbers who talk too much, and women who are cleverer than the men.","Fortune's wheel: the porter becomes rich, the rich man is ruined, and the moral is seldom simple; patience and wit are rewarded more than virtue.","Harun al-Rashid walking the night streets is the book's image of a ruler who wants to know his people."]},{h:"Why it still matters",p:["The Nights gave the world Sindbad and the jinni in the bottle, shaped Boccaccio, Chaucer and Borges, and remains the most widely read work of Arabic literature. Its frame is also the truest account of why a family reads together: a story a night, unfinished, so there is a reason to come back."]},{h:"For our family",l:["Shahrazad's rule: stop the story before the end, and say 'tomorrow'. The Learn tab's daily set works the same way.","Sindbad's seven voyages, one a week, are the children's introduction to the sea, trade and risk.","The clever women of the Nights are good company for a daughter."]},{h:"Read next",l:["Husain Haddawy's translation of the fourteenth-century Syrian manuscript (Norton) for the core; Malcolm Lyons's three-volume Penguin for everything.","For children: the Sindbad cycle and the Fisherman and the Jinni, in any good retelling."]}],kids:["A long time ago there was a king who was so angry that he decided to marry a new wife each day and have her killed the next morning. A clever girl called Shahrazad married him and every night told him a story so exciting that she stopped in the middle at dawn.","The king had to let her live to hear the end. She did this for a thousand and one nights, and by then the king had changed and did not want to hurt anyone.","Her stories are famous all over the world: Sindbad the sailor and his seven voyages, the fisherman who found a jinni in a bottle, and Ali Baba and the forty thieves."]},"Tao Te Ching":{sections:[{h:"What it is",p:["Eighty-one short chapters in verse, attributed to Laozi, the Old Master, said to have been a keeper of archives who wrote the book at the request of a gatekeeper when he left China for the west; the text as we have it was composed around the fourth century BCE. The Tao, the Way, is the source and pattern of all things, which cannot be named; the te is the power or virtue of living in accord with it. The book is addressed, often, to a ruler, and its advice is to do less: to govern a large state like cooking a small fish, without stirring."]},{h:"The main ideas",l:["Wu wei, non-forcing: act in accordance with the grain of things, as water does, and the hard is worn away by the soft.","The valley and the low place: the sage takes the low ground, as water does, and so all things flow to him.","Emptiness is use: the hub's hole makes the wheel useful; the empty room is the room; what is not there does the work.","The Way of nature is to reduce excess and supply what is lacking; the way of people is the reverse.","Knowing when to stop: fill a cup to the brim and it spills; sharpen a blade too much and it dulls; retire when the work is done.","The three treasures: compassion, frugality and not daring to be first in the world."]},{h:"Why it still matters",p:["The Tao Te Ching is the most translated book after the Bible, and its counsel of restraint, patience and softness reaches readers in every tradition. Its three treasures, compassion, frugality and humility, could be a summary of the Quran's servants of the Merciful."]},{h:"For our family",l:["Knowing when to stop is the whole of the plate: the cup filled to the brim spills.","The soft overcomes the hard: the parent who waits often wins what the parent who shouts loses.","Emptiness is use: an evening with nothing planned is where the family circle happens."]},{h:"Read next",l:["D. C. Lau's translation (Penguin) for accuracy; Stephen Mitchell's for beauty; read chapters 8, 11, 33, 44, 67 first.","Then the Zhuangzi, funnier and wilder."]}],kids:["A very old Chinese book, written by a wise man called Laozi, about the Way, which means the way things naturally are.","It says: be like water. Water is soft, but it wears down the hardest rock. It goes to the low places, and that is why rivers and seas are so big.","It also says: if you fill a cup right to the top, it spills. Know when to stop. That is good advice for eating, for talking, and for playing games."]},Essays:{sections:[{h:"What it is",p:["Michel de Montaigne retired to his tower in 1571, at thirty-eight, and began writing what he called essais, attempts, trials of his own judgement on whatever subject came to hand: on idleness, on liars, on fear, on the education of children, on friendship, written for his dead friend \xC9tienne de La Bo\xE9tie, on cannibals, on the custom of wearing clothes, on books, on cruelty, on presumption, on repentance, and finally on experience. Three books, revised to his death in 1592, with the motto he had struck on a medal: Que sais-je? What do I know? He invented the essay and made himself its subject, on the principle that each man carries the whole form of the human condition."]},{h:"The main ideas",l:["Self-study as a method: look honestly at your own inconsistency and you learn more about people than from any system.","Scepticism without despair: we know less than we think, so hold opinions loosely and cruelty is never justified by certainty.","Custom is a tyrant: what seems natural is mostly habit; the cannibals, he argues, are less barbarous than the Europeans who burn heretics.","Education by conversation: teach a child to judge, not to memorise; travel, talk, and let him digest what he reads.","Friendship: the rarest thing, in which two wills merge; because it was he, because it was I.","The body is not the enemy: eat, sleep, be ill and get well with attention and without self-hatred; the last essay, on experience, is the wisest thing written on living in a body."]},{h:"Why it still matters",p:["Montaigne is the most companionable writer in any language. He taught the world to think in the first person without vanity, and his essay on experience, written in pain from kidney stones, is a manual for living kindly with one's own flesh that OnePlate would be happy to have as an epigraph."]},{h:"For our family",l:["On the education of children: judgement before memory, conversation before lecture. The Learn tab's questions are Montaigne's method.","On experience: notice what your body actually tells you, after meals, after sleep, and trust the record more than the rule.","What do I know? A good sentence for a parent to say aloud, now and then, in front of the children."]},{h:"Read next",l:["M. A. Screech's or Donald Frame's complete translation; read 'On the education of children', 'On friendship', 'On cannibals' and 'On experience'.","Sarah Bakewell, How to Live: A Life of Montaigne, for the man."]}],kids:["Montaigne was a French writer who lived in a tower full of books about four hundred and fifty years ago. He invented a new kind of writing: short pieces where he just thought out loud about anything, called essays.","He wrote about friendship, about fear, about children, about his cat, about what he ate. His favourite question was: what do I really know? He was honest about not being sure.","He said children should be taught to think for themselves and to talk about ideas, not just to memorise. That is why we ask questions at the dinner table."]}};var Be={"Jami' al-Tirmidhi 3895":{sections:[{h:"Context",p:["Reported by 'A'ishah, who lived the sentence from the inside. Al-Tirmidhi places it in the chapters on the virtues of the Prophet's wives, and the same meaning is reported from Ibn 'Abbas in Ibn Majah with the wording 'the best of you is the best to his wives'. It was said to a community that judged men by their conduct in public, in war and trade, and it moved the measure indoors."]},{h:"Meaning",p:["The claim is a test and a boast at once. A test, because the family sees the man without the audience; a boast, because the Prophet offers his own home as the proof. The narrations of his home show what he meant: he mended his sandals, patched his clothes, milked the sheep, helped with the housework, and was never seen striking a servant or a woman. 'Best to his family' includes the spouse first, then parents, children and those in the house."]},{h:"Source and grading",p:["Jami' al-Tirmidhi, hadith 3895; al-Tirmidhi called it hasan gharib sahih, and al-Albani graded it sahih. The Ibn Majah wording, 1977, is graded sahih as well. The Bayan label is graded sahih."]},{h:"Live it",l:["Measure the week by the home: what did Uzma and the children see of your patience, not what did colleagues see.","Do one piece of housework the family does not expect from you, and do it without announcing it.","The Prophet's test is also a child's: the best of children are the best to their parents and siblings."]}],kids:["The Prophet said: the best people are the ones who are kindest at home. Being nice to strangers is easy; being kind to your brother and sister every day is the real test."]},"Sunan Ibn Majah 224; also al-Kafi, Kitab Fadl al-'Ilm":{sections:[{h:"Context",p:["Reported from Anas ibn Malik in Ibn Majah, and in the Shia collections from the Imams with the same words; the Bayan study notes that the teaching is held in common by every school, which is rarer than it should be. Al-Kafi opens with the Book of the Intellect and follows it with the Book of the Excellence of Knowledge, which is where this saying sits."]},{h:"Meaning",p:["Obligation, faridah, is the word used for prayer and fasting. The saying places seeking knowledge among the duties, not the ornaments, and 'every Muslim' is read by the scholars as including women, since the word in Arabic covers both. What knowledge? First the knowledge each person needs to worship and to deal justly; then whatever one's work and station require; then the sciences that keep a community alive, which some must learn on behalf of all."]},{h:"Source and grading",p:["Sunan Ibn Majah 224; the chain is weak on its own, but the hadith has so many routes that al-Suyuti and others graded it hasan or sahih by the sum of them, and al-Albani graded it sahih. In al-Kafi it is reported from Imam al-Sadiq and Imam al-Baqir. Bayan label: graded."]},{h:"Live it",l:["The Learn tab is this duty made into a habit: one word, one verse, one idea, one page a day.","Ask the children what they learned today before asking what they did.","Learn the one thing your work needs that you have been putting off."]}],kids:["The Prophet said learning is a duty for every Muslim, just like praying. That means reading and asking questions is part of being a good Muslim."]},"Sahih Muslim 2664":{sections:[{h:"Context",p:["Reported by Abu Hurayrah, in Muslim's Book of Destiny. The full text continues: if something befalls you, do not say 'if only I had done otherwise', but say 'Allah decreed, and what He willed He did', for 'if only' opens the door to Satan's work."]},{h:"Meaning",p:["Strength here is read by the commentators as strength of resolve and faith first, and of the body as its instrument; the Prophet praised wrestlers, archers and riders, and the point is a believer who can act. The three commands are a method: strive for what benefits, ask Allah's help, do not give up; and the fourth is the attitude after a loss: no 'if only'. The hadith is the whole of OnePlate's training plan in one sentence."]},{h:"Source and grading",p:["Sahih Muslim 2664; sahih by the standard of the two Sahihs. Bayan label: graded sahih."]},{h:"Live it",l:["Cycle, walk and lift as an act of faith, since a strong body is more beloved to Allah.","After a missed day, no 'if only'. Say what the hadith says and start again tomorrow.","Teach the children the three verbs: try, ask, do not give up."]}],kids:["The Prophet said Allah loves a strong believer more than a weak one, and told us: work hard for good things, ask Allah to help, and never give up."]},"Sahih al-Bukhari 13; Sahih Muslim 45":{sections:[{h:"Context",p:["Reported by Anas ibn Malik, among the earliest hadiths in al-Bukhari's Book of Faith. Al-Nawawi placed it fourteenth in his Forty, and the scholars count it among the few sayings on which the whole religion turns."]},{h:"Meaning",p:["The condition is placed on faith itself: not 'a good Muslim', but 'truly believes'. 'Brother' is read as the brother in faith by most and, in a narration in Muslim's wording, 'for his neighbour', which widens it. Loving for another what you love for yourself means wanting his good without subtracting from your own, and the commentators note that it does not require wanting less for yourself, only not wanting more than him. It rules out envy, which is wanting a blessing removed from another."]},{h:"Source and grading",p:["Sahih al-Bukhari 13 and Sahih Muslim 45. Bayan label: graded sahih."]},{h:"Live it",l:["When a relative or colleague succeeds, say the good you feel out loud. Envy dies in daylight.","Share the plate rule: what you want for your own health, want for the family, and cook for it.","Ask the children: what do you want for your sister that you want for yourself?"]}],kids:["The Prophet said you do not really believe until you want for your brother and sister the same good things you want for yourself."]},"Jami' al-Tirmidhi 1956":{sections:[{h:"Context",p:["Reported by Abu Dharr: your smile in your brother's face is charity; enjoining good and forbidding wrong is charity; guiding a man in a land where he is lost is charity; removing a stone, a thorn or a bone from the road is charity; pouring from your bucket into your brother's bucket is charity. The smile heads the list."]},{h:"Meaning",p:["Sadaqah is widened from money to every act that benefits another, and the smallest is named first so that no one can say they have nothing to give. The commentators note the word 'face': the smile is given to a person, not to the air. In a hadith in Muslim the Prophet adds that every joint of the body owes a charity each day, and that a kind word discharges it."]},{h:"Source and grading",p:["Jami' al-Tirmidhi 1956; al-Tirmidhi: hasan gharib; al-Albani: sahih. Bayan label: graded (hasan)."]},{h:"Live it",l:["The first face you see in the morning gets the first charity of the day. In this house that is Uzma or a child.","Remove one thing from someone's path today: a chore, an obstacle, a worry.","Teach the children that charity is not only coins."]}],kids:["The Prophet said that smiling at someone is charity, a good deed you give for free. So you can give charity a hundred times a day."]},"Nahj al-Balagha, Letter 53, to Malik al-Ashtar":{sections:[{h:"Context",p:["The longest letter in Nahj al-Balagha, written when Imam 'Ali appointed Malik al-Ashtar governor of Egypt in 658. It is a complete charter of government: the governor's own soul, the classes of the people, the army, the judges, the tax collectors, the secretaries, the merchants and craftsmen, the poor, and the duty of peace. The sentence comes early, in the instruction to make mercy, love and kindness toward the subjects the governor's garment, because they are of two kinds."]},{h:"Meaning",p:["The sentence settles the question of whom a ruler owes care to: everyone, since the only two categories are brother in faith and equal in creation, and both are owed justice and mercy. The letter goes on: they slip and err as you do, so pardon them as you would want Allah to pardon you. It refuses a third category, the one to whom nothing is owed."]},{h:"Source and grading",p:["Nahj al-Balagha, Letter 53, as compiled by al-Sharif al-Radi. The letter is also recorded, in a somewhat different form, in Tuhaf al-'Uqul of Ibn Shu'ba al-Harrani, an earlier source, which strengthens its attribution. Bayan label: received."]},{h:"Live it",l:["At work, apply the two categories to the next difficult person: brother or equal; there is no third.","The father is a governor of a small province. Read the letter for what it says about anger and about listening.","Teach the children the sentence as the rule for strangers."]}],kids:["Imam 'Ali told a governor: every person is either your brother in religion or your equal as a human being. So treat everyone with respect."]},"Nahj al-Balagha, Saying 147, to Kumayl ibn Ziyad":{sections:[{h:"Context",p:["Kumayl reports that the Imam took him by the hand out to the desert, sighed, and said: O Kumayl, hearts are vessels, and the best are those that hold the most, so remember what I say. People are three: a divine scholar, a learner on the path of salvation, and the rabble who follow every caller. Then the comparison of knowledge and wealth, and a long complaint that the bearers of knowledge are few, ending with the assurance that the earth is never without one who stands for Allah's proof."]},{h:"Meaning",p:["Four contrasts: knowledge guards you, you guard wealth; knowledge grows by being spent, wealth shrinks; knowledge is a judge, wealth is judged; the beneficiary of wealth dies with it, the beneficiary of knowledge is remembered. The saying is the Islamic tradition's standard argument that learning is the better investment, and it is addressed to a man, Kumayl, who was asked to carry it to others."]},{h:"Source and grading",p:["Nahj al-Balagha, Saying 147; the dialogue is also in al-Khisal of Shaykh al-Saduq and in Sunni works such as Hilyat al-Awliya of Abu Nu'aym, which the Bayan study notes as independent routes. Bayan label: received, multiply transmitted."]},{h:"Live it",l:["Spend knowledge: teach one thing you learned this week to someone in the house. It will grow.","The children's inheritance is what they know, more than what they will be left.","Memorise the four contrasts; they settle most arguments about priorities."]}],kids:["Imam 'Ali said knowledge is better than money, because knowledge looks after you, but you have to look after money, and when you share knowledge you get more of it."]},"Nahj al-Balagha, Saying 81":{sections:[{h:"Context",p:["Al-Radi adds a note to this saying: this is a sentence whose value cannot be weighed, with which no wisdom can be compared, and no saying can stand beside it. It is four words in Arabic: qimatu kulli mri'in ma yuhsinuh."]},{h:"Meaning",p:["Yuhsinuh means both what a person does well and what he does beautifully, from ihsan. The worth of a person is therefore the thing he has mastered and the manner in which he does it, not his lineage, wealth or title. Read one way it is a call to competence: become good at something. Read the other way it is a call to excellence: do what you do beautifully."]},{h:"Source and grading",p:["Nahj al-Balagha, Saying 81; widely transmitted in works of adab and in Ghurar al-Hikam. Bayan label: received."]},{h:"Live it",l:["Name the thing you do well and do it better this month, in work and at home.","Ask each child what they are good at, and give it time and tools.","Cooking the plate well is a worth; so is the way it is set on the table."]}],kids:["Imam 'Ali said a person's worth is what he does well. So find something you can do beautifully and keep getting better at it."]},"Nahj al-Balagha, Saying 40":{sections:[{h:"Context",p:["Al-Radi comments: this is a wondrous and noble meaning; the wise man does not release his tongue until he has consulted his heart, while the fool's words come before his reflection. In another saying the Imam adds: when the intellect is complete, speech becomes little."]},{h:"Meaning",p:["The image is spatial: the heart is in front and the tongue behind it, waiting for the heart to decide, or the tongue in front and the heart dragged after it to justify what was already said. Most quarrels in a house are the second order. The remedy is a gap, a breath between the feeling and the word."]},{h:"Source and grading",p:["Nahj al-Balagha, Saying 40; also in Ghurar al-Hikam and in Sunni adab collections. Bayan label: received."]},{h:"Live it",l:["A three-second rule before answering anyone who has annoyed you.","At the mindful dinner, say less; listen for what the heart says before the tongue.","Teach the children the picture: put your heart in front of your mouth."]}],kids:["Imam 'Ali said a wise person thinks first and speaks after, but a foolish person speaks first and thinks afterwards. Put your heart in front of your mouth."]},"Nahj al-Balagha, Saying 10":{sections:[{h:"Context",p:["A saying about how to live among people, placed near the beginning of the sayings. The Arabic weighs each half: weep for you if you die, long for you if you live."]},{h:"Meaning",p:["It is a test of conduct by its effects: deal with people in a way that leaves them better for having known you, so that your absence is a loss and your presence a gift. The commentators note it rules out two failures: harshness, which makes people relieved when you go, and flattery, which makes them indifferent. The standard is kindness with substance."]},{h:"Source and grading",p:["Nahj al-Balagha, Saying 10; also in Ghurar al-Hikam. Bayan label: received."]},{h:"Live it",l:["Imagine the family and friends on the day you are gone. What would they miss? Do more of that.","Keep the ties the Quran commands: call the relative you have not called.","A child longs for the parent who plays with him; be longed for."]}],kids:["Imam 'Ali said: live with people so kindly that when you are away they miss you, and when you are there they are happy to see you."]},"Nahj al-Balagha, Letter 31, to Imam al-Hasan":{sections:[{h:"Context",p:["Written to his son al-Hasan on the way back from Siffin, the long letter of a father who says he is at the age when a man sees his end and wants to give his son what he has learned. It covers fear of Allah, the Quran, the heart, companions, travel, generosity, patience, the rights of relatives, the treatment of women, and the self. The sentence about slavery comes in the counsel on dignity and contentment."]},{h:"Meaning",p:["The slavery meant is the voluntary kind: a man makes himself a slave of another through greed, fear or debt, and sells a freedom Allah gave him. The letter joins it to contentment: he who is content is free. It is also read as a warning against making oneself the slave of one's own desires, since those too are 'another'."]},{h:"Source and grading",p:["Nahj al-Balagha, Letter 31; recorded earlier in Tuhaf al-'Uqul and in Kitab al-Rasa'il of al-Kulayni, and quoted by Ibn 'Abd Rabbih in al-'Iqd al-Farid, which the Bayan study takes as a strong network of sources. Bayan label: received, multiply transmitted."]},{h:"Live it",l:["Name what owns you: a debt, a habit, a person's approval. Freedom is Allah's gift; take it back.","The fast is a daily reminder that appetite is a master only if obeyed.","Read the letter to the children when they are old enough; it was written for a son."]}],kids:["Imam 'Ali wrote to his son: do not let anyone or anything own you, because Allah made you free. Being free means not being a slave to your wants."]},"The sermon of Fadak, as recorded in al-Ihtijaj of al-Tabrisi and Bihar al-Anwar":{sections:[{h:"Context",p:["After the Prophet's death, Fatimah came to the mosque in Madinah to claim the estate of Fadak and addressed the assembly from behind a screen. The sermon as transmitted opens with praise of Allah and an account of the Prophet's mission, and then gives a list of the purposes of the law: faith as purification from shirk, prayer for humility, zakat for growth of wealth, fasting for sincerity, hajj for the strengthening of religion, justice for the harmony of hearts, obedience to the Household for order, patience as an aid, enjoining good for the common welfare, kindness to parents as protection from anger, keeping ties of kin as length of life, and so on."]},{h:"Meaning",p:["The passage is the earliest list of the wisdoms of the law, the maqasid, in the tradition: each commandment is given a reason in human terms. Faith is a cleaning, prayer a lowering of the head that lowers pride, zakat an investment, fasting a test of sincerity since no one sees it. The sermon's argument is that a people who abandon these purposes have abandoned the Prophet, whatever they say."]},{h:"Source and grading",p:["Al-Ihtijaj of al-Tabrisi (twelfth century) and Bihar al-Anwar, and earlier in Balaghat al-Nisa' of Ibn Tayfur (ninth century), which is a Sunni source and gives it independent attestation. The wording varies between versions. Bayan label: received."]},{h:"Live it",l:["Fasting as a proof of sincerity: the fast is the one worship no one can check. Keep it as if it were seen.","Kindness to parents as protection from anger: call them.","Read the list to the children as the 'why' behind each pillar."]}],kids:["Fatimah, the Prophet's daughter, explained why we do each good thing: praying keeps us humble, giving charity makes money grow, and fasting shows we are honest, because only Allah can see it."]},"Bihar al-Anwar, as received":{sections:[{h:"Context",p:["A short saying attributed to Imam al-Hasan, the Prophet's grandson, in the collections of wisdom; it belongs with his reported counsel on knowledge and on generosity."]},{h:"Meaning",p:["Two duties in one sentence: teaching what you know, and the humility to learn what others know. The order is deliberate, since the one who teaches is the one most tempted to stop learning. It is also a definition of a healthy community: knowledge moving in both directions between generations and between families."]},{h:"Source and grading",p:["Bihar al-Anwar, in the chapters on the Imam's wisdom, with the chain as received; the Bayan study did not find an earlier independent source and labels it received."]},{h:"Live it",l:["Teach the children what you know of the trade, the kitchen, the road; and let them teach you the phone.","At the family circle, each person teaches one thing.","Learn from Uzma what she knows that you do not; say so."]}],kids:["Imam al-Hasan said: teach other people what you know, and learn from them what they know. Everyone is a teacher and everyone is a student."]},"Dua 'Arafa, closing section, in Iqbal al-A'mal of Ibn Tawus":{sections:[{h:"Context",p:["Dua 'Arafa is the long supplication attributed to Imam al-Husayn on the afternoon of 'Arafa during his last hajj; the version in Iqbal al-A'mal carries a closing section of intense, philosophical address to Allah that is not in the earlier Misbah al-Za'ir and that scholars have debated, since its language resembles the Sufi writings of a later period. Al-Majlisi recorded the doubt. The Bayan dua program reports the question rather than settling it."]},{h:"Meaning",p:["Two questions that answer themselves. The one who lost Allah found nothing that could replace Him, however much he gained; the one who found Allah lost nothing that mattered, however much he lost. The sentence is a complete theology of sufficiency, and the second half is the comfort in every loss."]},{h:"Source and grading",p:["Iqbal al-A'mal of Sayyid Ibn Tawus, closing section; attribution received and contested, as the Bayan study notes. The sentiment is sound by the Quran's own standard: whoever relies on Allah, He is sufficient for him."]},{h:"Live it",l:["Say it after a loss, a sale that fell through, a bad weigh-in: what did I lose, if I found Him?","Teach it to the children as a sentence for when a toy breaks.","Read the whole dua on the Day of 'Arafa."]}],kids:["Imam al-Husayn asked Allah: what does a person have if he lost You, and what is a person missing if he found You? The answer is: nothing, and nothing."]},"Risalat al-Huquq (Treatise of Rights), the right of the stomach; in Tuhaf al-'Uqul and al-Khisal":{sections:[{h:"Context",p:["The Treatise of Rights, attributed to Imam al-Sajjad, lists some fifty rights that others have over you: Allah's right, the rights of your limbs, the rights of your acts, of those above you, below you, and of relatives. The right of the stomach comes among the rights of the limbs, after the tongue and the hearing and the sight. The full text continues: that you do not exceed in it the limit that strengthens you to the limit that weakens you, that you keep it from gluttony, and that you remember that fullness leads to laziness and keeps a person from good."]},{h:"Meaning",p:["The stomach has a right over you, which is the reverse of how most people think: the stomach is usually the thing with demands. Its right is to be fed only what is lawful, in the measure that strengthens, not the measure that weakens. The Treatise thereby turns moderation in eating from a health rule into a duty owed, and OnePlate's rule of thirds is its application."]},{h:"Source and grading",p:["Tuhaf al-'Uqul of Ibn Shu'ba al-Harrani and al-Khisal of Shaykh al-Saduq, both tenth century, with a chain in al-Saduq; attribution is well regarded in the Shia tradition. Bayan label: received, with an early chain."]},{h:"Live it",l:["Before the plate, name the stomach's right: the measure that strengthens.","Fullness leads to laziness: the after-dinner walk is the answer the Treatise implies.","Lawful, little or much: the source of the food is part of its measure."]}],kids:["Imam al-Sajjad said your stomach has rights: only good, halal food goes in, and only as much as makes you strong, not so much that it makes you lazy."]},"Al-Sahifa al-Sajjadiyya, Supplication 20 (Makarim al-Akhlaq), paraphrased":{sections:[{h:"Context",p:["The twentieth supplication of the Sahifa, the dua for noble character, is a long prayer in which every virtue is asked for: faith that is perfect, certainty, right intention, action that is accepted, and then a hundred particulars: do not let me be envied for what I have, keep me from praising myself, let me not be exalted before people without being lowered in myself. The line here is a paraphrase of that request."]},{h:"Meaning",p:["The danger named is success: every rise in people's eyes is a chance for the self to rise too, and the Imam asks for a matching descent inside, so that the two cancel. It is the Islamic cure for the ego: not the refusal of rank but the refusal to believe it. The dua goes on to ask for 'honour that is not followed by pride'."]},{h:"Source and grading",p:["Al-Sahifa al-Sajjadiyya, Supplication 20; the Sahifa's text is transmitted from the ninth century with chains in the Shia tradition; the line is paraphrased. Bayan label: received."]},{h:"Live it",l:["After praise, say the dua, or say alhamdulillah and name a fault to yourself.","Read Supplication 20 one paragraph a week; it is the character curriculum of this app.","Teach the children to answer praise with thanks to Allah."]}],kids:["Imam al-Sajjad prayed: Allah, every time people think I am great, make me remember inside that I am small and You are great."]},"Al-Kafi, Kitab al-Du'a, as received":{sections:[{h:"Context",p:["Reported from Imam al-Baqir in al-Kafi's Book of Supplication, in the chapter on urging people to ask. The Quran's own words stand behind it: call on Me and I will answer you (40:60), and the Prophet's saying that dua is worship itself."]},{h:"Meaning",p:["The sentence corrects the fear that asking Allah is a bother. The opposite is true: He loves to be asked, and the one who refuses to ask has misjudged Him as a tired benefactor. It makes dua a form of good opinion of Allah, husn al-zann, and in the same chapter the Imam says that Allah dislikes persistence from people and loves it from His servants."]},{h:"Source and grading",p:["Al-Kafi, Kitab al-Du'a, with the chain as received. Bayan label: received."]},{h:"Live it",l:["Ask for small things. The size of the request is not the point; the asking is.","Teach the children to ask Allah for things in their own words, out loud, at the circle.","Ask persistently: the same dua, every day, until it is answered or replaced."]}],kids:["Imam al-Baqir said there is nothing Allah likes more than when you ask Him for something. So ask Him, for big things and small things, every day."]},"Al-Kafi, Kitab al-Iman wa al-Kufr, chapter on gratitude":{sections:[{h:"Context",p:["In al-Kafi's chapter on gratitude, Imam al-Sadiq is reported to have said that the gratitude for a blessing is to avoid what is forbidden, and that complete gratitude is to say alhamdulillah rabb al-'alamin. The chapter sits in the Book of Faith and Unbelief, since gratitude is counted as half of faith."]},{h:"Meaning",p:["Gratitude is defined by its use: the eye is thanked by what it is kept from looking at, the hand by what it is kept from taking, the stomach by what it is kept from. The definition turns thanks from a feeling into a discipline, and it makes the fast a day-long act of gratitude for food."]},{h:"Source and grading",p:["Al-Kafi, Kitab al-Iman wa al-Kufr, chapter on gratitude, chain as received. Bayan label: received."]},{h:"Live it",l:["Thank Allah for the body by not feeding it what harms it; that is the hadith applied to the plate.","Thank Him for the eyes by lowering them; for the tongue by keeping it from backbiting.","Teach the children: saying thank you is good; using the gift well is better."]}],kids:["Imam al-Sadiq said that being grateful for a gift means using it the right way: thank Allah for your eyes by looking at good things, and for your food by eating well."]},"Al-Kafi, as received":{sections:[{h:"Context",p:["Reported from Imam al-Sadiq in al-Kafi, in the chapters on the conduct of the Shia: be an adornment for us, not a disgrace to us; and in the longer versions: fear Allah, be truthful, return what is entrusted, be good neighbours, be kind, so that people say 'this is how Ja'far teaches his people'."]},{h:"Meaning",p:["A follower's conduct is the teacher's reputation. The Imam asks to be judged by his students' honesty, trust and neighbourliness, and the sentence applies to every teacher, every parent and every community: the Prophet's community is his adornment or his disgrace in the eyes of the world."]},{h:"Source and grading",p:["Al-Kafi, chain as received. Bayan label: received."]},{h:"Live it",l:["At work, in the street, in the shop: be the reason someone thinks well of Muslims.","Children are their parents' adornment or disgrace in public, and parents are their children's; both directions.","Pay what you owe on time; the Imam named trust first."]}],kids:["Imam al-Sadiq told his students: behave so well that people say, look how good his students are. Be a credit to your family and your teachers."]},"Al-Kafi, Kitab al-'Aql wa al-Jahl, as received":{sections:[{h:"Context",p:["From the long counsel of Imam al-Kazim to Hisham ibn al-Hakam, which opens al-Kafi's Book of the Intellect and Ignorance and is the fullest statement of the place of reason in the tradition: Allah has two proofs over people, the outward and the inward; the outward is the messengers, prophets and Imams, the inward is the intellects. The counsel continues with the Quran's praise of those who reason, and a warning that worship without understanding is of little worth."]},{h:"Meaning",p:["Revelation and reason are both Allah's proofs, and each is incomplete without the other: reason without revelation does not know the whole way, and revelation without reason is not understood. The sentence is the tradition's answer to those who think faith is the enemy of thinking: the intellect is a messenger inside."]},{h:"Source and grading",p:["Al-Kafi, Kitab al-'Aql wa al-Jahl, hadith 12, chain as received; the counsel is also in Tuhaf al-'Uqul. Bayan label: received."]},{h:"Live it",l:["Teach the children why, not only what; the inward proof is theirs too.","When a religious claim offends reason, read more; the two proofs do not contradict.","Use the intellect on the plate: the plan is reasoned, and revelation agrees."]}],kids:["Imam al-Kazim said Allah gave us two guides: the prophets on the outside, and our thinking mind on the inside. Use both."]},"'Uyun Akhbar al-Rida; al-Kafi, as received":{sections:[{h:"Context",p:["Reported from Imam al-Rida in 'Uyun Akhbar al-Rida of Shaykh al-Saduq and in al-Kafi: a believer is not a believer until he has three qualities, a sunnah from his Lord, a sunnah from his Prophet and a sunnah from his Imam. From his Lord, keeping secrets, since Allah is the Knower of the unseen who does not disclose it except to a messenger He is pleased with; from his Prophet, kindness to people, since Allah commanded him to take to pardon and enjoin good; from his Imam, patience in hardship, since the patient are promised their reward without measure."]},{h:"Meaning",p:["Three models, three virtues: discretion from Allah's own concealment of the unseen; gentleness from the Prophet's commanded manner; endurance from the Imams' lives. Each is tied to a Quranic verse in the narration itself, so the hadith is a shor
