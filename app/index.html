/* ---------- Quran course progress: one document quran/progress {done:{key:date}, flag:{key:true}, v:3}, keyed by passage so the course can change ---------- */
function qKey(i){return (QPLAN[i]||{}).key||""}
function qState(i){const p=S.qprog||{},k=qKey(i);if((p.flag||{})[k])return "revisit";if((p.done||{})[k])return "read";return ""}
function qSet(idxs,state){S.qprog=S.qprog||{};S.qprog.done=Object.assign({},S.qprog.done||{});S.qprog.flag=Object.assign({},S.qprog.flag||{});const t=todayStr();S.qprog.v=3;idxs.forEach(i=>{const k=qKey(i);if(!k)return;delete S.qprog.flag[k];if(state==="read"){S.qprog.done[k]=S.qprog.done[k]||t}else if(state==="revisit"){S.qprog.done[k]=S.qprog.done[k]||t;S.qprog.flag[k]=true}else{delete S.qprog.done[k]}if(Number(i)===qIndex(logDate())){const d=day(t);d.quran=state==="read";persistDay(t)}});persistQprog()}
function qCount(){let n=0;for(let i=0;i<QPLAN.length;i++)if(qState(i))n++;return n}
function qGrid(ro){const cur=qIndex(logDate());return `<div class="qgrid">${QPLAN.map((e,i)=>{const st=qState(i);return `<button class="qc ${st} ${i===cur?"cur":""}" ${ro?"disabled":""} data-a="qcell" data-i="${i}" title="${esc(qRef(e))} · ${esc(e.n)}" aria-label="Reading ${i+1}, ${st||"not read"}">${i+1}</button>`}).join("")}</div>
  <div class="row" style="gap:10px;font-size:12px;color:var(--muted)"><span><i class="qk read"></i> read</span><span><i class="qk revisit"></i> revisit</span><span><i class="qk cur"></i> today</span><span><i class="qk"></i> not yet</span></div>`}
function qStateButtons(i,ro){if(ro)return "";const st=qState(i);return `<div class="seg qstate"><button class="${st==="read"?"on":""}" data-a="qmark" data-i="${i}" data-s="read">${ic("check")} ${tr("Read it")}</button><button class="${st==="revisit"?"on":""}" data-a="qmark" data-i="${i}" data-s="revisit">${ic("flame")} ${tr("Read, revisit later")}</button><button class="${st===""?"on":""}" data-a="qmark" data-i="${i}" data-s="">${tr("Not yet")}</button></div>`}
function qBulk(ro){if(ro)return "";const n=QPLAN.length;return `<details class="flat" style="box-shadow:none" data-qbulk ${S._qbulk?"open":""}><summary style="font-size:13px;padding:9px 0"><span>Bulk update</span>${ic("chev","chev")}</summary><div class="body">
  <div class="form"><label class="f" style="flex:0 1 90px">From<input type="number" id="qb_from" min="1" max="${n}" value="1"></label><label class="f" style="flex:0 1 90px">To<input type="number" id="qb_to" min="1" max="${n}" value="${qIndex(logDate())+1}"></label><button class="btn" type="button" data-a="qbulk" data-s="read">Mark as read</button><button class="btn" type="button" data-a="qbulk" data-s="revisit">Mark to revisit</button><button class="btn ghost" type="button" data-a="qbulk" data-s="">Clear range</button></div>
  <div class="row"><button class="btn" type="button" data-a="qbulkto">${ic("check")} Everything up to today as read</button><button class="btn ghost" type="button" data-a="qclear">Clear all progress</button></div>
  <p class="small muted">Use this after reading ahead or catching up. Nothing here changes the daily rotation; the course still shows today's reading by date.</p></div></details>`}

function quranIndex(){const cur=qIndex(),st=core.courseStats(QPLAN),cnt=qCount();const sur=S._qsurah||QPLAN[cur].s;const rows=QPLAN.map((e,i)=>({e,i})).filter(x=>x.e.s===sur);const su=SURAH_INDEX[sur-1];
  return `<details><summary><span>The ${QPLAN.length}-day course · the whole Quran</span>${ic("chev","chev")}</summary><div class="body"><p class="small muted">One reading a day from your start date (${esc(qStart())}, change it in Settings): ${st.verses.toLocaleString()} verses in ${st.readings} readings, in the Quran's own order, never crossing a surah. ${st.curated} passages are close readings with their own notes from al-Mizan; the rest carry the surah's summary and al-Mizan's statement of its purpose. The course repeats; the second round is where understanding deepens.</p>

function dayOfYear(d){d=d||new Date(logDate()+"T12:00:00");const s=new Date(d.getFullYear(),0,1);return Math.floor((d-s)/864e5)}
function pick(arr,off,back){const i=dayOfYear()-(back||0)+(off||0);return arr[((i%arr.length)+arr.length)%arr.length]}

function dtl(d){d=new Date(d);const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())}
function draftFrom(m){return {id:m.id||null,base:!!m.base,n:m.n||"",tag:m.tag||"chicken",note:m.note||"",items:normItems(m.items).map(it=>({f:it.f,q:it.q}))}}
function refreshTotals(){const el=document.getElementById("mtot");if(el&&S._medit)el.innerHTML=mealTotals(S._medit)}
function mealAction(a,b){
  const d=S._medit;
  if(a==="me_new"){S._medit={id:null,base:false,n:"",tag:"chicken",note:"",items:[{f:"chk_tikka",q:2},{f:"salad",q:2},{f:"roti",q:1},{f:"yogurt",q:1}]};render();const n=document.getElementById("me_n");if(n)n.focus();return true}
  if(a==="me_edit"){const m=allMeals().find(x=>x.id===b.dataset.id);if(m){S._medit=draftFrom(m);S._mopen=m.id;render()}return true}
  if(!d)return false;
  if(a==="me_cancel"){S._medit=null;render();return true}
  if(a==="me_add"){d.items.push({f:"salad",q:1});render();return true}
  if(a==="me_del"){d.items.splice(Number(b.dataset.i),1);render();return true}
  if(a==="me_save"){const n=(document.getElementById("me_n")||{}).value||d.n;d.n=n.trim();d.items=d.items.filter(it=>FOODS[it.f]&&it.q>0);if(!d.n){toast("Give the meal a name");return true}if(!d.items.length){toast("Add at least one food");return true}const id=d.id||("c_"+Date.now().toString(36));const rec={id,n:d.n,tag:d.tag,note:d.note||"",items:d.items.map(it=>({f:it.f,q:it.q}))};S.meals[id]=rec;persistMeal(id);S._medit=null;S._mopen=id;toast("Meal saved · "+mealCalc(rec).kcal+" kcal");render();return true}
  if(a==="me_reset"){removeMeal(d.id);S._medit=null;toast("Reset to default");render();return true}
  if(a==="me_delete"){if(d.base){S.meals[d.id]={id:d.id,deleted:true};persistMeal(d.id);toast("Hidden")}else{removeMeal(d.id);toast("Deleted")}S._medit=null;render();return true}
  return false;
}
document.addEventListener("change",e=>{

  </div>
  <div class="row"><button class="btn primary" type="button" data-a="rvsave" data-k="${key}">${ic("check")} Save review</button><button class="btn ghost" type="button" data-a="rvopen" data-k="${key}">${tr("Cancel")}</button></div>
  <p class="small muted">Gates follow the Bayan Library: draft → reviewed (a named reader checked it against the source) → verified (checked against the printed edition, with volume and page). Disputed keeps the note visible with your objection. ${typeof window.oneplate==="object"?"Saved to the shared review table; every household sees it.":"Saved with this household's data."}</p></div>`}
function allContentKeys(){const k=QPLAN.map(e=>e.key);SURAH_INDEX.forEach(s=>k.push("surah-"+s.n));TEACHINGS.forEach(t=>k.push(contentKey("teaching",t)));STORIES.forEach(t=>k.push(contentKey("story",t)));return k}
function reviewSummary(){const keys=allContentKeys(),c=core.reviewCounts(keys,REVIEWS_SHIPPED,S.reviews),n=keys.length;const recent=Object.keys(S.reviews).map(k=>Object.assign({k},S.reviews[k])).sort((a,b)=>(b.date||"")<(a.date||"")?-1:1).slice(0,8);
  return `<details ${(S._rq||S._rvx)?"open":""}><summary><span>Scholar review · ${c.verified+c.reviewed} of ${n} checked ${I("review")}</span>${ic("chev","chev")}</summary><div class="body">
  <div class="row" style="gap:6px;flex-wrap:wrap">${Object.keys(REVIEW_GATES).map(k=>`<span class="pill ${REVIEW_GATES[k].tone}">${REVIEW_GATES[k].label} ${c[k]}</span>`).join("")}</div>
  <div class="goalbar"><div class="bar"><i style="width:${((c.verified+c.reviewed)/n*100).toFixed(1)}%"></i></div><div class="lbls"><span>${c.verified} verified · ${c.reviewed} reviewed</span><span>${c.draft} drafts</span></div></div>
  <p class="small">${Object.keys(REVIEW_GATES).map(k=>`<b>${REVIEW_GATES[k].label}.</b> ${esc(REVIEW_GATES[k].means)}`).join(" ")}</p>
  <p class="small muted">Counted: ${QPLAN.length} course readings, ${SURAH_INDEX.length} surah notes, ${TEACHINGS.length} teachings and ${STORIES.length} stories. ${canReview?"You can review: open any item's Review button on this tab.":typeof window.oneplate==="object"?"Reviewing is for the accounts named in ADMIN_EMAILS.":"The owner records reviews here."}</p>
  ${reviewQueue()}
  ${recent.length?`<p class="eyebrow">Latest reviews</p><div class="hands">${recent.map(r=>`<span class="${REVIEW_GATES[r.status]?REVIEW_GATES[r.status].tone:""}">${esc(r.status)}</span><div class="small"><b>${esc(r.k)}</b> · ${esc(r.by||"")}${r.date?" · "+esc(r.date):""}${r.source?"<br><span class='muted'>"+esc(r.source)+"</span>":""}${r.note?"<br>"+esc(r.note):""}</div>`).join("")}</div>`:""}
  </div></details>`}
/* The reviewer's queue: every item of one kind in one status, in course order, with the volume reference and the panel inline, so a reviewer can work through the drafts without hunting for the day each one appears. */
function reviewItems(kind){
  if(kind==="close")return QPLAN.map((e,i)=>e.cur?{key:e.key,title:e.n,sub:`Reading ${i+1} · ${qRef(e)} · English al-Mizan vol. ${(mizanVol(e.s,e.f)||{}).vol||"?"}`}:null).filter(Boolean);
  if(kind==="reading")return QPLAN.map((e,i)=>e.cur?null:{key:e.key,title:e.n,sub:`Reading ${i+1} · ${qRef(e)} · English al-Mizan vol. ${(mizanVol(e.s,e.f)||{}).vol||"?"}`}).filter(Boolean);
  if(kind==="surah")return SURAH_INDEX.map(x=>({key:"surah-"+x.n,title:`${x.n}. ${x.a} · ${x.t}`,sub:`${x.v} verses · ${x.p} · English al-Mizan vol. ${(mizanVol(x.n,1)||{}).vol||"?"}`}));
  if(kind==="teaching")return TEACHINGS.map(t=>({key:contentKey("teaching",t),title:t.q,sub:`${t.w} · ${t.src} · ${t.v}`}));
  return STORIES.map(t=>({key:contentKey("story",t),title:t.t,sub:`Quran ${t.r}`}));
}
const RQ_KINDS={close:"Close readings",reading:"Other readings",surah:"Surah notes",teaching:"Teachings",story:"Stories"};
function reviewQueue(){if(!canReview)return "";const q=S._rq||{st:"draft",kind:"close"};const all=reviewItems(q.kind),items=all.filter(x=>reviewOf(x.key).status===q.st),show=items.slice(0,40);
  return `<p class="eyebrow">Review queue</p><div class="form"><label class="f" style="flex:1">Kind<select id="rq_kind">${Object.keys(RQ_KINDS).map(k=>`<option value="${k}" ${q.kind===k?"selected":""}>${RQ_KINDS[k]}</option>`).join("")}</select></label><label class="f" style="flex:1">Status<select id="rq_st">${Object.keys(REVIEW_GATES).map(k=>`<option value="${k}" ${q.st===k?"selected":""}>${REVIEW_GATES[k].label}</option>`).join("")}</select></label></div>
  <p class="small muted">${items.length} of ${all.length} ${RQ_KINDS[q.kind].toLowerCase()} are ${q.st}${items.length>40?"; the first 40 are listed":""}.</p>
  <div class="rq">${show.map(x=>`<div class="rqrow"><div class="t"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div><button class="btn ghost sm" type="button" data-a="rvopen" data-k="${x.key}">${S._rv===x.key?tr("Close"):tr("Review")}</button>${S._rv===x.key?reviewPanel(x.key,x.title):""}</div>`).join("")}</div>
  <div class="row"><button class="btn ghost sm" type="button" data-a="rvexport">${S._rvx?"Hide":"Export / import reviews"}</button></div>
  ${S._rvx?`<p class="small muted">Reviews as JSON. Copy this into the other build's import box to carry reviews between the artifact and the local app; importing merges by key.</p><textarea id="rv_json" rows="6" style="width:100%;font:12px var(--mono)">${esc(JSON.stringify(S.reviews,null,1))}</textarea><div class="row"><button class="btn primary sm" type="button" data-a="rvimport">${ic("check")} Import what is in the box</button></div>`:""}`}
function importReviews(text){let j;try{j=JSON.parse(text)}catch(e){throw new Error("Not valid JSON")}if(!j||typeof j!=="object"||Array.isArray(j))throw new Error("Expected an object keyed by content key");
  const entries=Object.entries(j).filter(([k,v])=>/^[a-z]+-[a-z0-9-]{1,60}$/.test(k)&&v&&core.isReviewStatus(v.status)&&(v.status==="draft"||v.by));if(!entries.length)throw new Error("Nothing importable in the box");
  return entries.reduce((pr,[k,v])=>pr.then(()=>persistReview(k,{status:v.status,by:v.by,source:v.source,note:v.note,date:v.date||todayStr()})),Promise.resolve()).then(()=>entries.length)}

applyTheme();if(window.matchMedia)try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme())}catch(e){}
</script>
